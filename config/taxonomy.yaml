    keywords: ["theory", "theoretical", "formal", "proof", "convergence", "bound", "analysis", "dynamics"]
  - id: method
    keywords: ["method", "algorithm", "approach", "technique", "framework", "novel", "propose", "learning rule", "training"]
  - id: application
    keywords: ["application", "applied", "deploy", "real-world", "experiment", "demonstration", "case study", "recognition", "detection"]
  - id: development
    keywords: ["implementation", "system", "platform", "toolkit", "library", "open-source", "software", "SDK", "API", "framework", "compiler"]
  - id: systems
    keywords: ["hardware", "chip", "processor", "architecture", "device", "silicon", "integrated", "Loihi", "SpiNNaker", "memristor", "ReRAM"]
  - id: evaluation
    keywords: ["benchmark", "evaluation", "comparison", "baseline", "state-of-the-art", "metric", "ablation", "accuracy", "latency", "energy"]
  - id: review
    keywords: ["survey", "review", "literature", "systematic review", "meta-analysis", "overview", "taxonomy", "benchmark"]

# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
github_queries:
  - query: "topic:neuromorphic+stars:>50"
    category: neuromorphic-hardware
  - query: "spiking+neural+network+stars:>100"
    category: spiking-neural-networks
  - query: "neuromorphic+simulator+stars:>50"
    category: neuromorphic-algorithms
    subcategory_hint: development
  - query: "memristor+crossbar+stars:>20"
    category: memristive
  - query: "event+camera+neuromorphic+stars:>50"
    category: neuromorphic-sensors
  - query: "SNN+framework+stars:>100"
    category: spiking-neural-networks
    subcategory_hint: development
  - query: "awesome+neuromorphic+stars:>20"
    category: survey
    subcategory_hint: review

# ── GitLab repository discovery (fetch_gitlab_repos.py) ──────────────────────
gitlab_queries:
