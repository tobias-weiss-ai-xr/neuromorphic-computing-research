    category: neuromorphic-hardware
  - query: "spiking neural network"
    category: spiking-neural-networks
  - query: "memristor"
    category: memristive

# ── Codeberg repository discovery (fetch_codeberg_repos.py) ──────────────────
codeberg_queries:
