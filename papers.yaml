  venue: Bulletin of Materials Science
- title: Synergistic role of ion transport and barrier modulation in a two-terminal
    ITO/PVDF-HFP/Ag vertical memristor
  date: 2026-03
  url: https://doi.org/10.1063/5.0319008
  category: memristive
  subcategory: theory
  authors:
  - Pranjal Sharma
  - Nilesh Kumar Prasad
  - Nituparna Das
  abstract: Polymer-based memristive devices are gaining attention as scalable, flexible,
    and energy efficient alternatives for next generation non-volatile memories and
    neuromorphic computing applications. In this paper, we report a vertical ITO/PVDF-HFP/Ag
    device that leverages the ferroelectric and ionic properties of PVDF-HFP to achieve
    reliable resistive switching. Structural analyses confirm the dominance of the
    electroactive β-phase (∼65.4%) alongside α, γ, and amorphous fractions, enabling
    a favorable balance between ferroelectric polarization and ionic transport. Morphological
    studies further indicate the formation of dense and uniform films with nanoscale
    surface roughness, ensuring stable electrode–polymer interfaces. Electrical characterization
    reveals sharp impedance transitions, non-monotonic capacitance behavior, and clear
    bipolar switching with SET/RESET voltages of ∼+2.61/−1.8 V. The conduction mechanism
    follows a hybrid pathway involving ohmic transport, space charge limited conduction,
    and filamentary dynamics modulated by ferroelectric polarization. The device exhibits
    excellent endurance (&amp;gt;1000 cycles), stable data retention, and a high ON/OFF
    ratio of ∼102–103, confirming robust non-volatile memory performance. Furthermore,
    spike amplitude dependent plasticity and spike duration dependent plasticity measurements
    demonstrate depression-type synaptic plasticity in the device. These findings
    establish PVDF-HFP as a promising ferroelectric polymer for vertical memristors,
    offering the dual benefits of scalability and polarization assisted switching,
    and emphasize its potential as a low power, high density candidate for future
    ReRAM and neuromorphic computing platforms.
  venue: APL Electronic Devices
- title: 'PdNeuRAM: forming-free, multi-bit Pd/HfO2 ReRAM for energy-efficient neuromorphic
    computing'
  date: 2026-03
  url: https://doi.org/10.1038/s44172-026-00650-3
  category: memristive
  subcategory: development
  authors:
  - Erbing Hua
  - Theofilos Spyrou
  - Majid Ahmadi
  abstract: Memristor technology offers a promising route toward energy-efficient
    computing but faces challenges including resistance drift, variability, and the
    need for electroforming. Filamentary resistive random-access memory, one of the
    most studied memristive platforms, typically requires a high-voltage electroforming
    step to initiate conductive filaments, leading to increased power overhead and
    reduced endurance. Here we report HfO<sub>2</sub>-based forming-free memristive
    devices (PdNeuRAM) that operate at low voltages, support multi-bit functionality,
    and exhibit reduced variability. Through combined electrical and materials characterization,
    we identify a Pd-O-Hf interfacial configuration that lowers oxygen-vacancy formation
    and migration barriers, creating a dense network of shallow defect states. Together
    with a Ti top electrode acting as an oxygen reservoir and an ultrathin (5 nm)
    HfO<sub>2</sub> layer, this interfacial engineering enables charge redistribution
    at room temperature and eliminates the need for electroforming. The fabricated
    devices provide tunable resistance states and reduce programming and read energy
    by 43% and 38%, respectively, in spiking neural network inference tasks. These
    results provide mechanistic insight into forming-free resistive switching and
    demonstrate the potential of Pd/HfO<sub>2</sub> devices for energy-efficient neuromorphic
    computing.
  venue: Communications Engineering
- title: Biomimetic halide perovskite synapses for neuromorphic computing
  date: 2026-02
  url: https://doi.org/10.1016/j.esci.2026.100558
  category: survey
  subcategory: method
  authors:
  - Zhongwen Sun
  - Xuan Zhao
  - Haonan Si
  abstract: Driven by the exponential surge in computational demands, there is a pressing
    imperative to pioneer novel information processing paradigms that overcome the
    inherent von Neumann bottleneck in conventional computing architectures. Neuromorphic
    computing based on biomimetic synapses aims to emulate the structure and working
    principles of the brain, offering a transformative alternative approach. Halide
    perovskites are a promising choice for biomimetic synapses due to their unique
    intrinsic ability to concurrently manipulate both ions and electronic charges.
    Their tunable properties across various timescales unlock unprecedented opportunities
    for advancing neuromorphic computing applications. In this review, we survey recent
    advances in biomimetic synapses based on halide perovskites in terms of design
    principles, material properties, device architectures, and mechanisms. An overview
    of potential applications in neuromorphic computing is provided, and the most
    critical challenges in hardware implementation are discussed. We also propose
    a roadmap to guide future innovations in scaling biomimetic synaptic hardware
    to practical systems. • Fundamental operating mechanisms of halide perovskite
    synapses are summarized, highlighting the ion-photo/electron carrier synergistic
    regulation characteristics. • Advances in halide perovskite synapses for near-sensor
    and in-sensor neuromorphic computing applications is presented. • Key challenges
    in halide perovskite-based hardware neuromorphic systems are discussed, accompanied
    by forward-looking perspectives on future development.
  venue: eScience
- title: 'Manufacture of synaptic transistor-based neuromorphic systems: from emerging
    device fabrication to advanced circuit integration'
  date: 2026-03
  url: https://doi.org/10.1088/2631-7990/ae5005
  category: survey
  subcategory: theory
  authors:
  - Yuxuan Shen
  - Yanan Zhong
  - Yujun Ye
  abstract: 'Abstract Neuromorphic computing systems, inspired by biological neural
    networks in the brain, offer transformative potential for energy-efficient artificial
    intelligence by breaking through the limitations of conventional von Neumann architectures.
    Synaptic transistors, serving as core hardware elements that dynamically regulate
    their conductance states to emulate neurobiological functions, represent a pivotal
    approach in this direction. This comprehensive review systematically surveys manufacturing
    pathways for synaptic transistor-based neuromorphic systems, spanning from emerging
    device fabrication to advanced circuit integration. We first elucidate the motivation
    for neuromorphic computing and the fundamental role of synaptic transistors as
    artificial synapses. Core discussions focus on four representative device architectures:
    electrolyte-gated, ferroelectric, charge-trapping, and optically controlled synaptic
    transistors, followed by in-depth analysis of advanced manufacturing techniques,
    including functional layer processing, scalable patterning strategies, and integration
    schemes. Subsequently, we outline the applications of synaptic transistor-based
    neuromorphic systems in the field of artificial intelligence and finally discuss
    the critical challenges, alongside the future prospects in terms of materials,
    devices, integration, architectures, and codesigned algorithms. This work provides
    a timely and extensive reference for advancing hardware implementation realization
    of neuromorphic computing.'
  venue: International Journal of Extreme Manufacturing
- title: 'Triboelectric-memristive coupling for self-powered neuromorphic computing:
    mechanisms, devices, and systems'
  date: 2026-04
  url: https://doi.org/10.20517/energymater.2025.185
  category: survey
  subcategory: theory
  authors:
  - Haiyang Qin
  - Qinrao Li
  - Dongzhu Lu
  abstract: Coupling triboelectric nanogenerators (TENGs) with memristors offers a
    direct route to integrating energy harvesting and adaptive learning within a single
    physical substrate, thereby enabling self-powered neuromorphic systems driven
    by ubiquitous mechanical stimuli. Unlike conventional electronics that rely on
    external power rails, triboelectric-memristive hybrids transduce mechanical excitations
    into programmable resistive states, supporting synaptic functions such as short-term
    plasticity, long-term plasticity, and spike-timing-dependent plasticity. This
    review synthesizes the physical mechanisms of triboelectric-memristive coupling
    and clarifies how charge transfer, interfacial electron-ion interactions, and
    device-level state dynamics collectively enable energy-to-information transduction
    for signal processing and learning. In contrast to previous surveys that focus
    on TENGs or memristors in isolation, we establish a unified transduction framework
    that links mechanical stimulus statistics to TENG waveform characteristics and
    further to memristive state-variable evolution, which serves as the organizing
    principle throughout the paper. We then present (ⅰ) a mechanism-guided taxonomy
    of representative device architectures and their achievable plasticity modes;
    and (ⅱ) a system-level perspective on the integration of self - powered sensing,
    in-memory learning, and multimodal data fusion. Finally, we summarize key challenges
    - including charge stability, humidity tolerance, device variability, and scalable
    integration - and discuss emerging directions such as large-area triboelectric
    materials for improved array uniformity, multiphysics co-learning for enhanced
    in-sensor intelligence, and physics-informed compact models to support device-circuit-algorithm
    co-design under stochastic energy inputs.
  venue: Energy Materials
- title: 'Event-Based Vision at the Edge: A Review'
  date: 2026-04
  url: https://doi.org/10.3390/brainsci16040422
  category: survey
  subcategory: theory
  authors:
  - Michael Middleton
  - Teymoor Ali
  - Epifanios Baikas
  abstract: 'Spiking Neural Networks (SNNs) executed on neuromorphic hardware promise
    energyefficient, low-latency inference well-suited to edge deployment in size,
    weight, and powerconstrained environments such as autonomous vehicles, wearable
    devices, and unmanned aerial platforms. However, a coherent research pathway to
    deployment of neuromorphic devices remains elusive. This paper presents a structured
    review and position on the state of SNN-based vision across four interconnected
    dimensions: network architectures, training methodologies, event-based datasets
    and simulation techniques, and neuromorphic computing hardware. We survey the
    evolution from shallow convolutional SNNs to spiking Transformers and hybrid designs
    which leverage the advantages of SNNs and conventional artificial neural networks.
    We also examine surrogate gradient training and ANN-to-SNN conversion approaches,
    catalogue real-world and simulated event-based datasets, and assess the landscape
    of neuromorphic platforms ranging from rigid mixed-signal architectures to fully-configurable
    digital systems. Our analysis reveals that while each area has matured considerably
    in isolation, critical integration challenges persist. In particular, event-based
    datasets remain scarce and lack standardisation, training methodologies introduce
    systematic gaps relative to deployment hardware, and access to neuromorphic platforms
    is restricted by proprietary toolchains and limited development kit availability.
    We conclude that bridging these integration gaps, rather than advancing individual
    components alone, represents the most important and least addressed work required
    to realise the potential of SNN-based vision at the edge.'
