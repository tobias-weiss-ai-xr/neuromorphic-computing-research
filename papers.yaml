- title: Sleep-Mediated Replay Prevents Catastrophic Forgetting in Spiking Neural
    Networks Trained on Sequential Tasks
  date: 2026-02
  url: https://doi.org/10.36227/techrxiv.177220005.52986713/v1
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Yeteesh Sabbineni
  - Ethan Qiu
  abstract: Catastrophic forgetting is a fundamental challenge in sequential learning
    for artificial neural networks, particularly spiking neural networks (SNNs), which
    aim to emulate biologically plausible neuronal dynamics. In this study, we investigate
    the role of sleep-mediated replay in mitigating catastrophic forgetting during
    sequential task learning. We trained a multilayer SNN on two sequentially presented
    image classification tasks (Task A and Task B) using spike-timing-dependent plasticity
    (STDP) learning rules. During offline periods, we implemented spontaneous replay
    of Task A patterns to emulate biological sleep consolidation. Our results demonstrate
    that sleep-mediated replay keeps Task A performance (0.589 before Task B, 0.206
    after sleep) while allowing effective acquisition of Task B (0.672 before sleep).
    In contrast, networks trained sequentially without sleep exhibit severe forgetting
    (Task A drops to 0.011 after Task B). These findings suggest that sleep-like replay
    mechanisms can enable continual learning in SNNs, providing a computationally
    and biologically grounded approach to memory consolidation. We further analyze
    synaptic weight distributions and firing rate dynamics, revealing that sleep stabilizes
    task-specific synaptic patterns without impeding new learning. This work bridges
    computational neuroscience and artificial intelligence, suggesting that sleep-like
    replay could be an effective approach for continual learning in SNNs.
  venue: ''
- title: A fully-CMOS spiking LIF neuron implementation for optimized STDP learning
    on memristor
  date: 2026-05
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13454359/
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Mehrzad Karamimanesh
  - S. M. Rasoul Moosavi
  - Ebrahim Abiri
  abstract: Abstract The growing demand for fast and energy-efficient computing has
    motivated the development of neuromorphic hardware inspired by biological neural
    systems. Spiking neural networks (SNNs), as the third generation of neural networks,
    offer an event-driven and highly parallel computing paradigm that is well suited
    for such applications. A key challenge in hardware SNNs is the efficient implementation
    of synaptic learning mechanisms, particularly spike-timing-dependent plasticity
    (STDP), with minimal circuit complexity and energy overhead. In this work, we
    propose a fully CMOS leaky integrate-and-fire (LIF) neuron designed to enable
    local, on-chip STDP-like learning when interfaced with analog memristive synapses.
    The proposed neuron generates a bipolar output spike composed of both positive
    and negative voltage pulses, allowing direct modulation of memristor conductance
    without the need for complex peripheral circuits or explicit timing storage elements.
    The neuron operates in two distinct modes of training mode, which produces bipolar
    spikes to support synaptic updates, and inference mode, which generates a single
    unipolar spike while deactivating non-essential circuitry to reduce power consumption.
    To validate the proposed design, a proof-of-concept 15 $$\times$$ 4 spiking neural
    network incorporating a winner-takes-all (WTA) mechanism is implemented in 65-nm
    CMOS technology and evaluated using circuit-level simulations. The results demonstrate
    correct local synaptic adaptation, stable neuron operation under process variations,
    and successful pattern association during training and inference. The network
    processes each training pattern within 0.6 ms and performs inference within 0.32
    ms.
  venue: PubMed Central
- title: 'FireFly-T: High-Throughput Sparsity Exploitation for Spiking Transformer
    Acceleration With Dual-Engine Overlay Architecture'
  date: 2026-03
  url: https://doi.org/10.1109/tc.2026.3672901
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Tenglong Li
  - Jindong Li
  - Ge Shen
  abstract: Spiking transformers are emerging as a promising architecture that combines
    the energy efficiency of Spiking Neural Networks (SNNs) with the powerful attention
    mechanisms of transformers. However, existing hardware accelerators lack support
    for spiking attention, exhibit limited throughput when exploiting fine-grained
    sparsity, and struggle with scalable parallelism in sparse computation. To address
    these challenges, we propose FireFly-T, a dual-engine overlay architecture that
    integrates a sparse engine for activation sparsity and a binary engine for spiking
    attention. In the sparse engine, we present a high-throughput sparse decoder that
    exploits fine-grained sparsity by concurrently extracting multiple non-zero spikes.
    To complement this, we introduce a scalable load balancing mechanism with weight
    dispatch and out-of-order execution, eliminating bank conflicts to support scalable
    multidimensional parallelism. In the binary engine, we leverage the byte-level
    write capability of SRAMs to efficiently manipulate the 3D dataflows required
    for spiking attention with minimal resource overhead. We also optimize the core
    AND-PopCount operation in spiking attention through a LUT6-based implementation,
    improving timing closure and reducing LUT utilization on Xilinx FPGAs. As an overlay
    architecture, FireFly-T further incorporates an orchestrator that dynamically
    manipulates input dataflows with flexible adaptation to diverse network topologies,
    while ensuring efficient resource utilization and maintaining high throughput.
    Experimental results demonstrate that our accelerator achieves 1.39× and 2.40×
    higher energy efficiency, as well as 4.21× and 7.10× greater DSP efficiency, compared
    to FireFly v2 and the transformer-enabled SpikeTA, respectively. These results
    highlight its potential as an efficient hardware platform for spiking transformers.
  venue: IEEE Transactions on Computers
