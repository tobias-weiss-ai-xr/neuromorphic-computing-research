- title: 'CTP-Hybrid: A Causal Topological Pulsing Hybrid Architecture for Native
    Spiking Large Language Models on Consumer GPUs'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20077295
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Shutong Hou
  abstract: 'Spiking Neural Networks (SNNs) promise extreme efficiency for large language
    models (LLMs) through event-driven sparse computation, yet current SNN-LLM hybrids
    inherit three fundamental flaws: surrogate gradients erode event-driven sparsity,
    dense self-attention introduces quadratic complexity, and floating-point word
    embeddings contradict spike-based representations. We propose CTP-Hybrid, a causal
    topological pulsing hybrid architecture that addresses these flaws with three
    native spiking components: (1) IST (Inter-Spike Topology Encoding) replaces embeddings
    with inter-spike interval ratios; (2) TCP (Temporal Causal Precedence) replaces
    the standard causal mask with a partial order derived from first-spike timings,
    enforcing physical causality in information flow; (3) TD-SCA (Temporal Dynamic
    Sparse Columnar Array) replaces feed-forward layers with biologically plausible
    cortical microcolumns. To our knowledge, we present the first successful 7B-parameter
    spiking LLM fine-tuning under 8~GB consumer GPU constraints (NVIDIA RTX~5060 Laptop)
    and its reproduction on a cloud RTX~4090. With only 2,000 training samples and
    QLoRA, the TD-SCA microcolumn variant achieves a WikiText-2 perplexity of 16.58
    locally; on the cloud, training loss reaches 2.18 but test perplexity rises to
    624.73, indicating overfitting on the extremely limited data. All models generate
    coherent Chinese text, proving trainability under extreme hardware constraints.
    The complete IST+TCP+TD-SCA forward pass is verified with correct logits and 7.7~GB
    memory, confirming architectural self-consistency. Full tri-module joint training
    is currently blocked by quantization kernel gaps and gradient flow limitations
    in current toolchains, not by any architectural defect. All code and experiment
    logs are archived and ready for immediate resumption. This work establishes the
    first reproducible blueprint for consumer-grade spiking LLMs and introduces a
    novel causal-topological computing paradigm.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Memory-Decoupled Event-Driven SNN Deployment on Edge Microcontrollers
  date: 2026-04
  url: https://doi.org/10.1109/icsp69961.2026.11540798
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - 杨灿阳
  - J X Li
  abstract: Deploying Spiking Neural Networks (SNNs) on edge microcontrollers (MCUs)
    offers a highly promising pathway for ultra-low-power artificial intelligence.
    However, mapping highly biomimetic SNNs onto standard von Neumann architectures
    introduces severe memory walls and computing mismatches. Specifically, the conventional
    spatial unrolling of time steps induces an unsustainable expansion of dynamic
    activation buffers, frequently triggering Out-of-Memory (OOM) failures on resource-constrained
    devices. To bridge this gap, we propose a hardware-software co-optimization architecture
    tailored for ARM Cortex-M7 processors. First, we introduce a double-depth rolling
    array mechanism that deeply decouples sequence length from memory footprint, reducing
    the spatial complexity of dynamic hidden states from O(N×T) to a constant O(N).
    Second, an event-driven sparse execution restructuring based on the Coordinate
    List (COO) format is implemented to bypass resting neurons, transforming power-intensive
    dense Multiply-Accumulate (MAC) operations into single-cycle conditional additions.
    Supported by an asymmetric mixed-precision mapping strategy, our architecture
    strictly preserves complex neural dynamics. Crucially, rigorous white-box testing
    confirms a bounded state error of 2.38×10-6with zero spike-timing deviation, guaranteeing
    a mathematically lossless accuracy migration. Physical benchmarks on the STM32H7
    MCU across both static MNIST and continuous Speech wake-word tasks demonstrate
    that the proposed framework slashes peak dynamic SRAM overhead by nearly 74%,
    completely eliminating OOM vulnerabilities. Evaluated on the MNIST task using
    a recurrent SNN (784-256-10) with partial readout, the system achieves an inference
    latency of 197.69 ms and an energy consumption of 76.98 mJ, significantly outperforming
    iso-parametric recurrent neural networks in both temporal and spatial dimensions.
