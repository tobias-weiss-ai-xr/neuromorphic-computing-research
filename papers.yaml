- title: 'Bullet Trains: Parallelizing Training of Temporally Precise Spiking Neural
    Networks'
  date: 2026-02
  url: https://arxiv.org/abs/2603.13283
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Todd Morrill
  - Christian Pehle
  - Anthony Zador
  abstract: 'Continuous-time, event-native spiking neural networks (SNNs) operate
    strictly on spike events, treating spike timing and ordering as the representation
    rather than an artifact of time discretization. This viewpoint aligns with biological
    computation and with the native resolution of event sensors and neuromorphic processors,
    while enabling compute and memory that scale with the number of events. However,
    two challenges hinder practical, end-to-end trainable event-based SNN systems:
    1) exact charge--fire--reset dynamics impose inherently sequential processing
    of input spikes, and 2) precise spike times must be solved without time bins.
    We address both. First, we use parallel associative scans to consume multiple
    input spikes at once, yielding up to 44x speedups over sequential simulation while
    retaining exact hard-reset dynamics. Second, we implement differentiable spike
    time solvers that compute spike times to machine-precision without discrete-time
    approximations or restrictive analytic assumptions. We demonstrate the viability
    of training SNNs using our solutions on four event-based datasets on GPUs.'
  venue: arXiv (Cornell University)
- title: Latency Coding for Efficient and Low-Latency Deep Spiking Neural Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.23206
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yi Lu
  - Jianhao Ding
  - Zhaofei Yu
  abstract: 'Spiking neural networks (SNNs) offer a biologically inspired computing
    paradigm with significant potential for energy-efficient neural processing. Among
    neural coding schemes of SNNs, Time-To-First-Spike (TTFS) coding, which encodes
    information through the precise timing of a neuron''s first spike, provides exceptional
    activity sparsity and energy efficiency. However, existing TTFS models lack efficient
    training methods, suffering from high inference latency and limited performance,
    limiting their practicality on neuromorphic hardware. In this work, we propose
    latency coding, an extension of TTFS coding, and present a compatible framework
    that enables the efficient training of deep latency-coded SNNs by leveraging backpropagation
    through time (BPTT) algorithm. The framework includes: (1) a latency encoding
    (LE) module with feature extraction and straight-through estimators to address
    severe information loss in direct intensity-to-latency mapping; (2) relaxation
    of the strict single-spike constraint in intermediate layers to improve information
    propagation and gradient flow; and (3) a temporal adaptive decision (TAD) loss
    function that dynamically weights supervision signals based on the model''s confidence,
    balancing the trade-off between speed and accuracy. Experimental results demonstrate
    that our method achieves competitive or superior accuracy compared with existing
    TTFS-coded SNNs with ultra-low inference latency and high energy efficiency. Latency-coded
    SNNs also demonstrate improved robustness against input perturbations. These findings
    highlight latency coding as a practical and hardware-friendly approach for fast
    and energy-efficient neuromorphic processing.'
