- title: 'Timing Matters: Delay Fault Characterization and Testing in SNN Accelerators'
  date: 2026-06
  url: https://doi.org/10.1145/3787109.3815284
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Osita Ukwuaba
  - Cory Merkel
  abstract: 'Spiking neural network (SNN) accelerators are vulnerable to non-idealities
    arising from aging, process variation, radiation, and extreme operating conditions.
    While delay faults are well studied in conventional VLSI testing, their impact
    and detection in neuromorphic accelerators remain challenging because the event-driven
    dynamics of SNNs, complex temporal fault propagation, and in-memory computation
    obscure fault effects and complicate test generation and observability. This paper
    characterizes the effects of four timing-related faults in SNNs: dendritic propagation
    delay, axonal propagation delay, refractory delay, and spike-response delay. We
    further address a key challenge in resource-constrained neuromorphic testing:
    efficient test-pattern generation and fault evaluation. We propose a delay-fault
    testing methodology based on highly sparse test stimuli and introduce Mean Absolute
    Membrane Potential Deviation (MAMPD) as a fault evaluation metric, motivated by
    the hypothesis that hardware faults induce measurable distribution shifts in neuronal
    activity. Experimental results show that single delay faults exhibit pronounced
    tail risk, where a small fraction of faults causes severe accuracy degradation,
    whereas multiple simultaneous faults pose an even greater overall threat. Across
    the evaluated functionally meaningful delay-fault settings, the proposed method
    achieves 100% fault coverage of functionally impactful delays using sparse test
    matrices with up to 99% sparsity, demonstrating that high fault detectability
    can be obtained with very low test overhead.'
