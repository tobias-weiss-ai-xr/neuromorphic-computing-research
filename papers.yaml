- title: 'A Review of Embedded Artificial Intelligence Research (2023–2026): Technological
    Advancements, Representative Advances, and Future Prospects'
  date: 2026-05
  url: https://doi.org/10.3390/mi17050586
  category: survey
  subcategory: method
  authors:
  - Zhaoyun Zhang
  abstract: Since the publication of the "Review of Embedded Artificial Intelligence
    Research" in 2023, driven by innovations in hardware architectures, advances in
    lightweight algorithms, and the maturation of edge-cloud collaboration technologies,
    embedded artificial intelligence (embedded AI) has progressed from "technically
    feasible" to "large-scale deployment". As a continuation of that review, this
    article systematically surveys the core advances in embedded AI from 2023 to 2026.
    At the hardware level, it examines engineering progress in non-von Neumann architectures
    such as compute-in-memory and neuromorphic chips, as well as heterogeneous integration
    technologies. At the algorithmic level, it covers dynamic adaptive lightweighting,
    specialized edge-side optimization of large models (including on-device large
    language model fine-tuning and edge diffusion models), and lightweight multimodal
    approaches. In terms of deployment paradigms, it discusses edge-side full training,
    federated edge learning, edge-cloud collaborative intelligence, and emerging paradigms.
    At the application level, it illustrates the "perception-decision-execution" pipeline
    in industrial IoT, wearable healthcare, autonomous driving, embodied intelligence,
    and smart agriculture. The article also analyzes core challenges including ultra-low-power
    design for extreme scenarios, cross-platform standardization, edge-side data security
    and privacy, and model robustness in complex environments. Based on these findings,
    four research directions are proposed to guide future work.
  venue: Micromachines
- title: Introduction to neuromorphic computing
  date: 2026-06
  url: https://doi.org/10.1201/9781003685890-1
  category: survey
  subcategory: method
  authors:
  - Sayed Abdulhayan
  - Lahari Lakshmi Prasad
  - Sayed Abulhasan Quadri
  abstract: Neuromorphic computing is the latest paradigm that mimics the structure
    of the brain and its functionality to replicate energy efficiency, adaptability,
    and intelligence in computing. This chapter describes the basic principles of
    neuromorphic architecture, more specifically spiking neural networks, memristor
    designs, and event-driven sensors, and explains why they are of interest in AI,
    Edge computing, and brain-machine interfaces, as well as being relevant to continual
    learning. It goes into the interaction of materials science and AI-hardware platforms
    like Loihi and takes a survey of energy-conserving learning algorithms, which
    are vital in implementing these systems at scale. Other important challenges briefly
    reviewed in the chapter are device variability, limitations of algorithms, and
    challenges of integration. In addition, it has been deemed that hybrid methods
    such as quantum-neuromorphic systems, and 3D integration methods are potential
    trends. Through benchmarking and increasing emphasis on privacy and security,
    neuromorphic computing will revolutionize computational intelligence to make machines
    more brain-equal in terms of the ability to learn and adapt.
  venue: ''
- title: 'Neuromorphic computing for radar and radio systems: a survey'
  date: 2026-04
  url: https://doi.org/10.1088/2634-4386/ae6369
  category: survey
  subcategory: method
  authors:
  - Hanna Hamrell
  - Thomas K. Sjögren
  - Hannes Ovrén
  abstract: Abstract Taking inspiration from the brain on how to create energy efficient
    and low latency neuromorphic systems has the potential to create new opportunities
    with AI across many domains. Firstly, it creates a possibility to mitigate problems
    with too large digital signal processing costs in various technologies. Secondly,
    it also enables the use of AI and machine learning algorithms where it is currently
    impossible due to energy constraints. Recently, neuromorphic technology has been
    introduced to radio communication and radar applications. In this work, we highlight
    advantages of applying energy efficient, low latency and often lightweight neuromorphic
    computing for radar and radio signal processing. We perform a comprehensive review
    of the main current works on neuromorphic technology for radar applications, focusing
    on frequency-modulated continuous-wave and synthetic aperture radar. Additionally,
    we cover radio frequency signal classification for both radar and radio signals.
    Our ambition is to facilitate research on neuromorphic computing for radar and
    radio systems, as well as help bringing researchers from these fields together.
