- title: Generalized Threshold Optimization with Harmony Multi-Threshold Neurons for
    Accurate ANN-to-SNN Conversion
  date: 2026-03
  url: https://doi.org/10.1609/aaai.v40i3.37206
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Wenhan Zhang
  - Zihan Huang
  - Tong Bu
  abstract: Spiking Neural Networks(SNNs) are a promising paradigm designed to emulate
    the brain's energy efficient by incorporating the timing of spikes. Conversion
    is an efficient way to obtain high-performance SNNs from Artificial Neural Networks(ANNs).
    Existing conversion methods often face a trade-off between accuracy and time steps,
    which is largely caused by the incomplete release of residual membrane potentials.
    To minimize the conversion error, this paper proposed a harmonious mathematical
    property-based neuron, called Harmony Multi-Threshold Neurons (H-MT Neuron), which
    utilizes multiple spikes to minimize residual membrane potentials. The proposed
    neuron is further enhanced with an optional effective communication mechanism
    to achieve more accurate conversion. In addition, we propose a threshold optimization
    method applicable to a broader range cases of spiking neurons to to find the optimal
    neuron thresholds. Experiment results demonstrate that our method achieve superior
    accuracy on ImageNet benchmark datasets while significantly reducing the required
    time steps and energy consumption.
