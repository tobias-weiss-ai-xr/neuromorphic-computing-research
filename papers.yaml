- title: Predicting Price Movements in High-Frequency Financial Data with Spiking
    Neural Networks
  date: 2026-03
  url: https://arxiv.org/abs/2512.05868
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Brian Ezinwoke
  - Oliver Rhodes
  abstract: 'Modern high-frequency trading (HFT) environments are characterized by
    sudden price spikes that present both risk and opportunity, but conventional financial
    models often fail to capture the required fine temporal structure. Spiking Neural
    Networks (SNNs) offer a biologically inspired framework well-suited to these challenges
    due to their natural ability to process discrete events and preserve millisecond-scale
    timing. This work investigates the application of SNNs to high-frequency price-spike
    forecasting, enhancing performance via robust hyperparameter tuning with Bayesian
    Optimization (BO). This work converts high-frequency stock data into spike trains
    and evaluates three architectures: an established unsupervised STDP-trained SNN,
    a novel SNN with explicit inhibitory competition, and a supervised backpropagation
    network. BO was driven by a novel objective, Penalized Spike Accuracy (PSA), designed
    to ensure a network''s predicted price spike rate aligns with the empirical rate
    of price events. Simulated trading demonstrated that models optimized with PSA
    consistently outperformed their Spike Accuracy (SA)-tuned counterparts and baselines.
    Specifically, the extended SNN model with PSA achieved the highest cumulative
    return (76.8%) in simple backtesting, significantly surpassing the supervised
    alternative (42.54% return). These results validate the potential of spiking networks,
    when robustly tuned with task-specific objectives, for effective price spike forecasting
    in HFT.'
  venue: ''
- title: Equilibrium Propagation with Predictive Learning in Leaky Integrate-and-Fire
    Spiking Neural Networks
  date: 2026-05
  url: https://doi.org/10.64898/2026.05.19.726261
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Yoshimasa Kubo
  abstract: Abstract Equilibrium propagation (EP) is a biologically plausible alternative
    to backpropagation that has demonstrated competitive performance across a range
    of machine learning tasks. Recent work has extended EP to spiking neural networks
    (SNNs), leveraging leaky integrate-and-fire (LIF) neurons and spike-based plasticity
    rules to improve biological realism while maintaining strong performance. In this
    work, we propose an EP-based SNN framework that combines LIF neural dynamics with
    a predictive learning rule, replacing conventional spike-timing-dependent plasticity
    (STDP) with a learning rule more directly aligned with predictive coding principles.
    We evaluate the proposed model on multiple image classification benchmarks, including
    MNIST, KMNIST, and Fashion-MNIST, and compare its performance with a BP-trained
    LIF SNN baseline. Our results show that the proposed EP-based LIF model (EP+LIF)
    achieves competitive accuracy across datasets, with performance approaching that
    of the BP-trained counterpart (BP+LIF) while relying on a biologically motivated
    local learning rule. In addition, analysis of hidden-layer spiking activity reveals
    that EP+LIF produces more persistent hidden-state activity, whereas BP+LIF yields
    sparser spiking representations. These results demonstrate that predictive learning
    can support effective EP-based training in LIF spiking networks, while also highlighting
    differences in activity patterns that motivate future work on activity regulation
    and sparse spiking dynamics.
  venue: bioRxiv (Cold Spring Harbor Laboratory)
- title: 'NeuroCoreX: An Open-Source FPGA-Based Spiking Neural Network Emulator with
    On-Chip Learning'
  date: 2026-03
  url: https://arxiv.org/abs/2506.14138
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Ashish Gautam
  - Prasanna Date
  - Shruti Kulkarni
  abstract: Spiking Neural Networks (SNNs) are computational models inspired by the
    structure and dynamics of biological neuronal networks. Their event-driven nature
    enables them to achieve high energy efficiency, particularly when deployed on
    neuromorphic hardware platforms. Unlike conventional Artificial Neural Networks
    (ANNs), which primarily rely on layered architectures, SNNs naturally support
    a wide range of connectivity patterns, from traditional layered structures to
    small-world graphs characterized by locally dense and globally sparse connections.
    In this work, we introduce NeuroCoreX, an FPGA-based emulator designed for the
    flexible co-design and testing of SNNs. NeuroCoreX supports all-to-all connectivity,
    providing the capability to implement diverse network topologies without architectural
    restrictions. It features a biologically motivated local learning mechanism based
    on Spike-Timing-Dependent Plasticity (STDP). The neuron model implemented within
    NeuroCoreX is the Leaky Integrate-and-Fire (LIF) model, with current-based synapses
    facilitating spike integration and transmission . A Universal Asynchronous Receiver-Transmitter
    (UART) interface is provided for programming and configuring the network parameters,
    including neuron, synapse, and learning rule settings. Users interact with the
    emulator through a simple Python-based interface, streamlining SNN deployment
    from model design to hardware execution. NeuroCoreX is released as an open-source
    framework, aiming to accelerate research and development in energy-efficient,
    biologically inspired computing.
  venue: ''
- title: A Time-Multiplexed Spiking Neural Network Accelerator with Pipelined Readout
    for FPGA Inference
  date: 2026-08
  url: https://arxiv.org/abs/2608.00595
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Reza Ansari
  - Maciej Wielgosz
  abstract: Spiking Neural Networks (SNNs) provide a power-efficient neuromorphic
    alternative to traditional artificial neural networks by processing information
    through discrete temporal events. This paper presents the design and Field-Programmable
    Gate Array (FPGA) implementation of an inference-only SNN accelerator optimized
    for MNIST digit classification. To address the physical routing constraints and
    timing bottlenecks inherent in low-cost devices, we propose an optimized hardware
    microarchitecture featuring a time-multiplexed 1-bit spike-feeding mechanism governed
    by a finite state machine (FSM), localized distributed memory for weight storage,
    and an integer-based Leaky Integrate-and-Fire (LIF) neuron model with register
    widths selected to prevent overflow. In addition, a multi-cycle pipelined argmax
    and tie-breaker readout module eliminates the dominant combinational critical
    path. Implemented on an entry-level AMD Artix-7 FPGA (XC7A200T) using a 784-64-10
    network topology, the proposed pipelined architecture increases the maximum operating
    frequency (Fmax) from 13.3 MHz to 167 MHz. Hardware evaluation demonstrates a
    sequential processing latency of 82 μs per image, enabling a 1,000-sample VHDL
    simulation batch to be completed in 0.082 s. Vivado post-implementation vector-based
    power analysis estimates the total on-chip power consumption at 0.336 W and the
    energy efficiency at approximately 36,300 samples per joule. These results demonstrate
    that the proposed microarchitecture provides a resource-efficient solution for
    real-time neuromorphic edge inference, provided that the network size remains
    within the practical limits of time-multiplexed execution.
  venue: arXiv (Cornell University)
- title: 'Delta-STDP: Enabling Hardware-Friendly Supervised Learning in Spiking Neural
    Networks'
  date: 2026-06
  url: https://doi.org/10.1145/3787109.3815312
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - D H Zhang
  - Yue Zhou
  - Jiawei Fu
  abstract: The deployment of supervised learning in Spiking Neural Networks (SNNs)
    on energy-efficient hardware is hindered by the computational complexity of gradient-based
    algorithms like SpikeProp, involving intricate temporal derivative calculations
    and non-parallelizable operations. This paper introduces Delta-STDP, a novel learning
    rule through hardware-algorithm co-design. We simplify the postsynaptic potential
    (PSP) waveform from a complex alpha function to a ReLU shape, transforming its
    temporal derivative into a binary causal mask. Concurrently, we binarize the error
    signal to its sign, resulting in a weight update rule that factorizes into a global
    1-bit error direction and a local spike-timing-dependent amplitude. Information-theoretic
    analysis shows ReLU optimally shifts information from error to PSP, minimizing
    loss from error sign binarization, while MNIST results confirm that under sign-based
    updates, ReLU outperforms alpha and exponential-rise PSPs, reversing their order
    with full-precision updates. Furthermore, we outline a direct mapping to hardware,
    where forward propagation simplifies to integrate-and-fire with square-pulse inputs,
    backpropagation becomes a causally gated memristor crossbar operation, and weight
    update translates to sign-modulated spike-timing-dependent plasticity (STDP).
    This work bridges the gap between algorithmic effectiveness and hardware efficiency,
    providing a pathway towards scalable neuromorphic learning accelerators.
  venue: ''
- title: 'Spiking neural network-based decision framework for real-time-ball-on-plate
    balancing: Sim-to-real'
  date: 2026-07
  url: https://doi.org/10.1177/00375497261448920
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Yijing Fan
  - Chun Zhao
  - Li Zhang
  abstract: Spiking neural networks (SNNs), with temporal dynamics and biologically
    inspired spiking behavior, offer improved interpretability and performance in
    real-time control. This paper integrates reinforcement learning (RL) with reward-modulated,
    bio-inspired SNNs that employ reward-modulated spike-timing-dependent plasticity
    (R-STDP) to address real-time control tasks. The proposed model enables bio-inspired
    learning by combining conventional spike-timing-dependent plasticity (STDP) with
    time-dependent, reward-modulated weight updates. Furthermore, it reconstructs
    the task-oriented state space and reward mechanism to realize a cross-task control
    framework. Experimental results from control tasks, along with comparisons to
    traditional RL methods, demonstrate the effectiveness of SNNs in both simulation
    and real-world applications. This study aims to bridge the gap between SNNs and
    traditional feedback mechanisms in control systems, highlighting how bio-inspired
    approaches can enhance adaptive control.
  venue: SIMULATION
- title: Spike Timing Dependent Plasticity Versus Intrinsic Plasticity as Feature
    Extraction Technique
  date: 2026-03
  url: https://doi.org/10.2478/cait-2026-0010
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Petia Koprinkova-Hristova
  abstract: Abstract This work investigates the effect of Spike Timing-Dependent Plasticity
    (STDP) of the synapses in the randomly connected Spiking Neural Networks (SNN)
    on the distribution of the firing rates of the individual neurons. It was observed
    that STDP, as a homeostatic plasticity rule, forces SNN activity to reflect the
    input structure. This effect is similar but not identical to the Intrinsic Plasticity
    (IP) tuning of Reservoir Computing (RC) recurrent neural networks. Both IP and
    STDP rules allow for capturing of the input data structure into the network state.
    This explains why STDP-trained SNNs are good for feature extraction from multidimensional
    data for classification purposes.
  venue: Cybernetics and Information Technologies
- title: Single-spike spatial learning and spatio-temporal reconstruction optimisation
    in spiking autoencoders
  date: 2026-04
  url: https://doi.org/10.1016/j.neucom.2026.133759
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Ben Walters
  - Yeshwanth Bethi
  - Hamid Rahimian Kalatehbali
  abstract: Spiking Neural Networks (SNNs) offer a low-power alternative to conventional
    deep neural networks by leveraging their sparse, event-driven processing for both
    static and event-based data. While previous spiking autoencoders were energy-intensive
    and limited to static inputs, this work presents a novel spiking autoencoder capable
    of efficiently reconstructing both static and spatiotemporal data with high fidelity.
    To benchmark spatial pattern reconstruction, we evaluate performance on the MNIST
    and Fashion-MNIST datasets. Our autoencoder encodes each static input using just
    a single spike, reducing total energy consumption to an estimated 2.54 mJ across
    the entire training and testing phases. We also propose a novel decoder neuron
    model that enables fine-grained control over output spike timing, achieving over
    a 1000 × improvement in reconstruction quality compared to prior unsupervised
    Spike Timing Dependent Plasticity (STDP)-based methods. Additionally, we show
    that our model’s reconstruction performance is close to state-of-the-art autoencoders
    that rely on computationally intensive supervised, gradient-based convolutional
    networks. To validate performance on spatiotemporal data, we use the Spiking Heidelberg
    Digits (SHD) dataset and examine the trade-off between energy efficiency and reconstruction
    accuracy. Our results show that the reconstructions preserve most of the original
    information, while capping total energy use at 127 mJ for the full training and
    testing cycle. These findings lay a foundation for designing more efficient and
    scalable SNNs for real-world applications.
  venue: Neurocomputing
- title: Construction and Application of a Hybrid Spike Neural Network Image Recognition
    Algorithm Model Based on Transformer Architecture
  date: 2026-05
  url: https://doi.org/10.1177/30504554261441546
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Na Ma
  - Baolin Qu
  - Weidong Wang
  abstract: With the rapid development of deep learning technology, spiking neural
    networks (SNNs) and transformer models have made significant progress in computer
    vision. This article proposes an image recognition algorithm model that combines
    SNN and transformer networks and validates it using the Modified National Institute
    of Standards and Technology (MNIST), Fashion-MNIST, and CIFAR-10 datasets. During
    preprocessing, Poisson encoding transforms pixel intensities into spike sequences.
    In the hybrid network architecture constructed, the SNN is embedded into the transformer
    encoder, and its output features are transformed before being passed to the transformer
    decoder. The spike neural network is constructed with LIF (leaky integrate-and-fire)
    neurons to build the network layer, and feature learning and extraction are carried
    out using the spike-timing-dependent plasticity (STDP) learning rule. The decoder
    recognizes the features extracted by the encoder, and the cross-entropy loss function
    is used to compute the difference between the output results and the true labels.
    During the training phase, the encoder and decoder parameters are updated simultaneously
    through backpropagation. The model is evaluated using independent test sets and
    validation sets. The experimental results show that after 100 iterations, the
    hybrid model using only the LIF neuron network achieves validation accuracies
    of 0.9803, 0.9262, and 0.7217 on the MNIST, Fashion-MNIST, and CIFAR-10 datasets,
    respectively. Further research reveals that incorporating the STDP learning rule
    improves the model’s validation accuracy to 0.9977, 0.9315, and 0.7461, demonstrating
    that this approach can enhance recognition accuracy to some extent, offering new
    insights for further research in image recognition.
  venue: The European Journal on Artificial Intelligence
- title: Spiking Neural Network Models for Real-Time Sensory-Motor Integration in
    Bio-Inspisred Robotic Systems
  date: 2026-03
  url: https://doi.org/10.1109/icetems66917.2026.11469473
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Senthil Kumar S
  - Barath G
  - Maduvanthi S
  abstract: The design of bio-inspired robots has more and more relied on neuromorphic
    computation to imitate the efficiency and plasticity of biological creatures.
    Spiking Neural Networks (SNNs) being the third generation of artificial neural
    networks that are characterized by their event-driven nature and temporal processing
    efficiency have attracted potential for online sensorymotor integration. This
    paper provides a generic framework using SNN models to achieve dynamic response
    of low-latency interactions between sensory inputs and motor outputs for robotic
    systems. The architecture includes biologically motivated spikebased neural coding
    strategies and spike-timing dependent plasticity (STDP) so as to enable it to
    learn from environmental stimuli and perform complex motor behaviours with low
    energy use. Experiments on a bio-inspired robot arm show improved reactivity and
    reaction latency and motion adaptability with respect to classical ANN controllers.
    The results highlight the great promise of SNNs to shape a future where real-time
    control systems for autonomous robotics can integrate energy-efficient and bio-inspired
    approaches for individuals and large population of robotic systems performing
    tasks with lifelike sensory-motor coordination.
  venue: ''
- title: Visual Place Recognition Using Rate-Encoded Spiking Neural Networks with
    Discrete STDP Learning
  date: 2026-07
  url: https://arxiv.org/abs/2607.13584
  category: spiking-neural-networks
  subcategory: application
  authors:
  - Altzi Tsanko
  - Oikonomou Katerina Maria
  - Antonios Gasteratos
  abstract: Spiking Neural Networks (SNNs) trained through unsupervised Spike-Timing-Dependent
    Plasticity (STDP) have been explored as solutions to visual loop closure problems,
    driven by the prospect of efficient on-device inference on neuromorphic devices.
    State-of-the-art STDP-based models deliver high classification accuracy but fail
    to reach the high Recall at 100% Precision (R@100P) needed for reliable autonomous
    navigation. We present a discrete, tensor-native implementation of the STDP-based
    SNN-VPR pipeline using PyTorch with snnTorch and evaluate it on a 100-place Nordland
    dataset using 15 independently-trained networks. The contribution of three decisions
    in the implementation is investigated. First, we show how to perform neuron assignment
    with a closed-form, deterministic tensor pipeline and show that it provides significantly
    higher R@100P than a standard argmax procedure. However, some of this gain comes
    from implementation differences compared to prior continuous-time models, which
    we measure independently. Second, ablation in isolation shows that state reset
    after each query helps improve R@100P regardless of the way neurons are assigned.
    Third, velocity-compensated sliding window aggregation over k consecutive frames
    reaches R@100P = 100.00% at k = 5 for constant-velocity traversal and an additional
    0.20 ms latency. Taken together, these findings show the impact of inference stage
    design decisions in STDP-based SNN-VPR on recall precision, although the separate
    contribution of each mechanism and implementation differences is only partially
    disentangled and needs further examination.
  venue: arXiv (Cornell University)
- title: 'EMBER: Autonomous Cognitive Behaviour from Learned Spiking Neural Network
    Dynamics in a Hybrid LLM Architecture'
  date: 2026-04
  url: https://arxiv.org/abs/2604.12167
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - William Savage
  abstract: 'We present (Experience-Modulated Biologically-inspired Emergent Reasoning),
    a hybrid cognitive architecture that reorganises the relationship between large
    language models (LLMs) and memory: rather than augmenting an LLM with retrieval
    tools, we place the LLM as a replaceable reasoning engine within a persistent,
    biologically-grounded associative substrate. The architecture centres on a 220,000-neuron
    spiking neural network (SNN) with spike-timing-dependent plasticity (STDP), four-layer
    hierarchical organisation (sensory/concept/category/meta-pattern), inhibitory
    E/I balance, and reward-modulated learning. Text embeddings are encoded into the
    SNN via a novel z-score standardised top-k population code that is dimension-independent
    by construction, achieving 82.2\% discrimination retention across embedding dimensionalities.
    We show that STDP lateral propagation during idle operation can trigger and shape
    LLM actions without external prompting or scripted triggers: the SNN determines
    when to act and what associations to surface, while the LLM selects the action
    type and generates content. In one instance, the system autonomously initiated
    contact with a user after learned person-topic associations fired laterally during
    an 8-hour idle period. From a clean start with zero learned weights, the first
    SNN-triggered action occurred after only 7 conversational exchanges (14 messages).'
  venue: arXiv (Cornell University)
- title: 'On-Device Spiking Neural Network Locomotion Learning on a €100 Quadruped:
    Sim-to-Real with Brain Persistence'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19481146
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Marc Hesse
  abstract: 'This paper presents a complete Sim-to-Real pipeline for quadruped locomotion
    using biologically grounded spiking neural networks (SNNs) on a €100 Freenove
    Robot Dog Kit (FNK0050) with a Raspberry Pi 4. The system employs 232 Izhikevich
    neurons with reward-modulated spike-timing-dependent plasticity (R-STDP), a central
    pattern generator (CPG) for innate gait rhythm, and a cerebellar forward model
    for balance correction. Training occurs in MuJoCo simulation using a custom MJCF
    model of the Freenove hardware, achieving 8.2 m forward distance with zero falls
    in 50,000 steps. The trained brain transfers to real hardware via a Bridge architecture
    that maps SNNmotor outputs to servo commands with real-time IMU feedback from
    an MPU6050 sensor. On-device learning enables the robot to reach actor competence
    1.0 within 2,000 steps (40 seconds at 50 Hz). Brain persistence across sessions
    is demonstrated: a loaded brain achieves competence 1.0 from step 1, while a fresh
    brain requires 2,000 steps. Spectral analysis confirms the SNN produces independent
    motor patterns distinct from the CPG signal. The same architecture runs on the
    Unitree Go2 in simulation (45.15 ± 0.67 m, 10 seeds), demonstrating cross-embodiment
    transfer. All code is open source under Apache 2.0. This work extends the MH-FLOCKE
    framework described in Hesse (2026).'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Spiking neural networks for real-time mapping of EBV-infected B cells in
    neuroinflammatory lesions
  date: 2026-05
  url: https://doi.org/10.1097/ms9.0000000000005088
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Sadaf Abdullah
  - Fareeha Anwar
  - Mahnoor Fatima
  abstract: 'To the Editor, The Epstein-Barr virus (EBV) has been identified as the
    primary infectious agent that causes multiple sclerosis (MS), which stands as
    the most common neuroinflammatory disorder throughout the world. The study, which
    examined more than 10 million US military personnel samples, found that individuals
    testing positive for EBV antibodies faced a 32 times greater chance of developing
    MS because 801 out of 801 tested cases showed antibody development before they
    started experiencing symptoms, which proved the virus caused B-cell-related neuroinflammation.
    B cells infected with EBV enter MS lesions where they induce T cell dysfunction
    and glial cell activation that results in increased demyelination and neurodegeneration[1].
    Researchers who study postmortem MS brains through high-dimensional imaging have
    discovered that EBV markers EBNA1 and LMP1 exist in higher concentrations within
    neuroinflammatory lesions of progressive MS subtypes. The markers identify B cells
    while showing distribution to both neurons and glial cells. EBNA1-positive cells
    maintain close connections to astrocytes with a significant result (P = 0.03)
    while also interacting with microglia, which leads to continuous immune system
    activation and damage to the blood-brain barrier. Secondary progressive MS lesions
    show that EBV-positive B cells establish greater connections with M2-like macrophages,
    which leads to increased chronic inflammation (log2 odds ratio: 0.36, P = 0.02).
    Spiking neural networks (SNNs) function as bio-inspired models that replicate
    neuronal spike timing to achieve energy-efficient real-time biomedical image segmentation,
    which helps detect EBV-infected B cells in heterogeneous lesions. The three-stage
    SNN training scheme, which consists of Artificial Neural Network (ANN) pre-training,
    SNN conversion, and spike-based fine-tuning, produced better Dice coefficients
    for brain MRI segmentation tasks that included hippocampal delineation because
    it reached convergence within fewer time steps compared to traditional ANNs. This
    system solves the problem that artificial neural networks face in low-power edge
    devices, which process intraoperative pathology data[2]. Recent SNN advancements
    with spike-based attention mechanisms improve medical image segmentation accuracy
    by 4.2% in Dice score while maintaining <50 ms inference latency on GPUs, which
    proves optimal for real-time histopathology of neuroinflammatory lesions. The
    models embedded into DenseNet backbones assist in detecting sparse EBV markers
    within B cells through their ability to monitor time-based biological changes
    while exceeding baseline performance during low-contrast testing. The technology
    allows for identification of EBV-related medical conditions during surgical procedures,
    which then supports precise antiviral treatment recommendations[1]. The development
    of neural networks, which enable real-time segmentation of EBV-infected B cells,
    will revolutionize the detection of neuroinflammatory lesions found in MS brain
    tissue, thus delivering significant economic advantages to the field of neurology.
    The research of Lanz et al[3] discovered that EBV-infected B cells drive MS neuroinflammation
    through their presentation of EBNA1 antigens, which enables U-Net-based convolutional
    neural networks to detect B cells automatically during live imaging and surgical
    biopsy procedures. The system switches from expensive manual histopathology work,
    which costs between $500 and $1000 for each sample, to Artificial Intelligence
    (AI)-powered analysis that costs under $50 while it completes diagnoses within
    seconds instead of days, which decreases neurologist tasks by 70%. The deployment
    of scalable cloud services allows people in areas with limited resources to access
    treatment, which helps prevent MS progression that costs $85 000 each year per
    patient through early treatment that eventually generates billions in worldwide
    healthcare savings[3]. Neural networks can potentially perform real-time segmentation
    tasks for EBV-infected B cells in neuroinflammatory lesions, yet researchers question
    their ability to adapt to the changing patterns of central nervous system tissues,
    which MS studies have shown. Läderach et al[4] demonstrate that EBV infection
    drives T-bet+ CXCR3+ B cells to infiltrate the CNS, forming perivascular aggregates
    that trigger T-cell-mediated neuroinflammation, yet their histological analyses
    relied on static immunohistochemistry rather than live imaging. The use of neural
    networks for real-time operations requires comprehensive instruction using multiple
    datasets that track lesion changes throughout acute flare periods, but this specific
    data does not exist in current neurostudies, which results in overfitting problems
    because researchers use fixed samples and postmortem data. The clinical utility
    of this gap suffers because MS patients experience false positives and missed
    detections when their lesion microenvironments fluctuate due to blood-brain barrier
    breaches. Future models must integrate multimodal, real-time CNS imaging to bridge
    this translational divide[4,5]. We propose that SNN–based diagnostic tools be
    incorporated into multicenter studies supported by dedicated funding for the development
    of neuromorphic hardware. Collaborative efforts between neuroimmunologists and
    AI specialists should prioritize the creation of high-quality EBV-infected B-cell
    segmentation datasets, such as those curated by the National Library of Medicine.
    Given the rising global burden of MS, regulatory and policy-level support is essential
    to advance SNN-based pathological assessment methods, which may ultimately contribute
    to improved disease monitoring and control of disease progression.'
