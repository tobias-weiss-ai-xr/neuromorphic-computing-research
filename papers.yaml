  venue: Frontiers in Psychology
- title: 'Geometry-Aware Plasticity: Thermodynamic Weight Updates in Non-Euclidean
    Hardware'
  date: 2026-02
  url: https://doi.org/10.5281/zenodo.18761138
  category: neuromorphic-algorithms
  subcategory: theory
  authors:
  - Matthew A. Pender
  abstract: 'Abstract Current neuromorphic architectures rely on standard, local learning
    rules (e.g., Spike-Timing-Dependent Plasticity) that operate blindly within static,
    Euclidean geometries.While energy-efficient for local exploration, these rules
    fail to overcome topological local minima without relying on the massive thermodynamic
    bloat of standard backpropagation. Building upon the Metabolic Phase Transition
    (MPT)[10] and the Curvature Adaptation Hypothesis (CAH)[8], we introduce Geometry-Aware
    Plasticity (GAP): a biologically plausible learning algorithm designed for dynamically
    gated analog hardware. GAP utilizes the instantaneous Riemannian curvature (κ)
    of the network, governed by the apical-somatic conductance ratio (γ), to modulate
    synaptic plasticity. When the system detects a local minimum, it triggers a macroscopic
    “Hyperbolic Plunge,” exponentially amplifying connection growth along geodesic
    pathways. To translate this continuous thermodynamic theory into viable Very Large-Scale
    Integration (VLSI), we introduce three strict hardware constraints: 1. A Schmitt-trigger
    hysteretic shield to immunize the learning phase against thermal noise, 2. An
    asymmetric gain function to protect the Euclidean baseline from catastrophic forgetting,
    and 3. A physical saturation governor to prevent memristive oxide burnout. Using
    a PyTorch digital twin of the Manifold Chip architecture[9], we empirically demonstrate
    that GAP successfully forces a structural phase transition, permanently altering
    the topology of the system to route around local minima while strictly obeying
    physical hardware limits. Summary This paper introduces Geometry-Aware Plasticity
    (GAP), a biologically plausible learning algorithm designed to drive Dynamically
    Gated Analog hardware (such as the Manifold Chip). GAP resolves the fundamental
    tension in neuromorphic engineering: the need for the thermodynamic efficiency
    of local unsupervised learning (e.g., STDP) and the global topological awareness
    of standard backpropagation. Building upon the Metabolic Phase Transition (MPT)
    and the Curvature Adaptation Hypothesis (CAH), this algorithmic framework dynamically
    links synaptic weight updates to the instantaneous Riemannian curvature (κ) of
    the network. By utilizing top-down disinhibition (modeled on VIP/SST cortical
    microcircuits), GAP allows the network to operate in a low-energy, flat Euclidean
    state for local exploration, and trigger high-energy, targeted "Hyperbolic Plunges"
    to burn geodesic pathways out of topological local minima. To ensure mathematical
    continuous-time theories can survive the physical realities of Very Large-Scale
    Integration (VLSI), this paper formally introduces three strict hardware constraints
    to the learning rule: The Hysteretic Shield: A Schmitt-trigger mechanism to immunize
    the learning phase against thermal noise and synaptic jitter. Asymmetric Gain:
    A structural dampener to protect the Euclidean baseline from catastrophic forgetting
    during hyperbolic expansion. The Physical Governor: An asymptotic boundary enforcing
    physical memristive oxide saturation limits to prevent hardware burnout. Empirical
    validation is provided via a PyTorch digital twin utilizing Riemannian Stochastic
    Gradient Descent, demonstrating a successful structural phase transition that
    cleanly routes around local minima while strictly obeying thermodynamic and physical
    material limits. Related Works Pender, M. A. (2026). The Manifold Chip: Silicon
    Architecture for Dynamic Curvature Adaptation via Dual-Gated Analog Shunting.
    10.5281/zenodo.18717807 https://doi.org/10.5281/zenodo.18717807 Pender, M. A.
    (2026). The Metabolic Phase Transition: Qualia as a Topological Solution to the
    Landauer Limit in High-Dimensional Manifolds. 10.5281/zenodo.18655523. https://doi.org/10.5281/zenodo.18655523
    Pender, M. A. (2026). Dynamic Curvature Adaptation: A Unified Geometric Theory
    of Cortical State and Pathological Collapse. DOI: 10.5281/zenodo.18615180. https://doi.org/10.5281/zenodo.18615180
    Data and Code Availability The Python scripts used to validate this work is located
    here: GitHub: https://github.com/MPender08/Geometry-Aware-Plasticity'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: WS <sub>2</sub> Optoelectronic Memristive Reservoir Enabling Ultra‐Low‐Power,
    Multi‐Task, and Environmentally Stable Neuromorphic Computing
  date: 2026-04
  url: https://doi.org/10.1002/advs.75318
  category: edge-computing
  subcategory: theory
  authors:
  - Dayanand Kumar
  - Hanrui Li
  - Divyanshu Divyanshu
  abstract: 'ABSTRACT Energy‐efficient visual and speech processing is essential for
    edge intelligence, yet conventional silicon‐based chips suffer from high power
    consumption. Here, we report a WS 2 /Zinc–Tin–Oxide (ZTO)‐based optoelectronic
    reservoir computing (RC) system that uniquely integrates sensing, memory, and
    computation within a single compact device to emulate diverse biological functions.
    The WS 2 /ZTO memristive RC achieves strong performance, with ∼94% accuracy on
    N‐MNIST, ∼93% in motion perception, and ∼89% in speech recognition within only
    30 training epochs, while consuming ultra‐low energy of ∼25.5 fJ/spike. Raw inputs
    are converted into spike trains to preserve temporal dynamics: motion data from
    inter‐frame differences, FSDD waveforms reshaped into spike‐like signals, and
    N‐MNIST reconstructed directly from the address‐event representation format. The
    system maintains reliable operation under 95% relative humidity, highlighting
    excellent environmental stability. Distinctively, the WS 2 /ZTO memristor serves
    simultaneously as sensor and hardware reservoir, exploiting volatile and nonlinear
    dynamics for direct temporal input decoding. Validation on N‐MNIST further shows
    95% accuracy with minimal training energy. In addition, the device demonstrates
    endurance over 1.5 million cycles and supports synaptic features including excitatory
    postsynaptic current, short‐term and long‐term plasticity, and photonic paired‐pulse
    facilitation. This work establishes a humidity‐resilient, ultra‐low‐power WS 2
    /ZTO in‐sensor RC platform, advancing neuromorphic processing for next‐generation
    edge technologies.'
  venue: Advanced Science
- title: Neuromorphic Edge Computing Architecture for Energy Efficient Intelligent
    Systems
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20432032
  category: edge-computing
  subcategory: method
  authors:
  - IJMSRT
  abstract: Abstract Neuromorphic computing and edge intellige- -nce have emerged
    as transformative technologies for developing energy-efficient intelligent systems
    capable of supporting nextgeneration digital infrastructures. Traditional cloud-centric
    architectures often experience high latency, excessive energy consumption, and
    limited real-time processing capability in large-scale intelligent environments.
    This research proposes a Neuromorphic Edge Com- -puting Architecture designed
    to optimize computational efficiency, adaptive intelligence and energy-aware processing
    for modern distributed systems. The proposed framework integrates neuromorphic
    processors, edge computing mechanisms, and intelligent resource management techniques
    to achieve low-power real-time computation and adaptive decision-making. Unlike
    conventionalcompu computing architectures, the proposed model mimics biological
    neural systems to improve processing efficiency and reduce computational overhead.
    The architecture supports intelligent applications including smart healthcare,
    autonomous systems, industrial automation, and Internet of Things environments.
    Experimental evaluation demonstrates improved energy efficiency, reduced latency,
    scalable edge intelligence, and enhanced computational performance compared to
    traditional cloud-based systems. The proposed research contributes to the advancement
    of sustainable intelligent computing frameworks capable of supporting future digital
    ecosystems, adaptive automation, and high-performance distributed computational
    environments.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Record High Polarization at 2 V and Imprint‐Free Operation in Superlattice
    HfO <sub>2</sub> ‐ZrO <sub>2</sub> by Proper Tuning of Ferro and Antiferroelectricity
  date: 2026-03
  url: https://doi.org/10.1002/admt.202502027
  category: edge-computing
  subcategory: method
  authors:
  - Xinye Li
  - Padma Srivari
  - Mari Honkanen
  abstract: ABSTRACT Neuromorphic computing, inspired by biological intelligence,
    offers a pathway to revolutionize artificial intelligence (AI) by unifying memory
    and processing in an energy‐efficient, sustainable framework for data‐intensive
    tasks. Ferroelectric (FE) materials have emerged as promising candidates for implementing
    artificial synapses, yet achieving low‐voltage operation in CMOS back‐end compatible
    devices remains a major challenge. In this work, we demonstrate that proper tuning
    of ferro and antiferroelectric phase in HfO 2 ‐ZrO 2 (HZO) superlattice based
    capacitors can lead to imprint‐free switching with record switchable polarization
    (2 P r ) of 76 µC/cm 2 under an external field of only 2 MV/cm. The sizable remanent
    polarization of the superlattice HZO further enables linear potentiation and depression
    with an on/off ratio of 20 within a 3 MV/cm bias window. Under pulsed operation,
    the devices show robust endurance, either maintaining polarization with less than
    10% degradation up to 10 8 cycles or surviving beyond 10 9 cycles with recoverable
    fatigue. By elucidating two distinct fatigue mechanisms, this work highlights
    strategies for optimizing FE devices to meet the stringent demands of neuromorphic
    training applications while non‐volatile data retention at room temperature also
    demonstrates their potential for low‐power inference applications at the edge.
  venue: Advanced Materials Technologies
- title: Design of Low-Power Systems Based on Neuromorphic Computing
  date: 2026-03
  url: https://doi.org/10.54254/2755-2721/2026.bj32434
  category: edge-computing
  subcategory: method
  authors:
  - Ziqi Chen
  abstract: With the rapid advancement of the Internet of Things and edge intelligent
    computing, the demand for low-power, high-energy-efficient computing systems has
    become increasingly urgent. The traditional von Neumann architecture suffers from
    poor energy efficiency in data-intensive tasks due to the 'memory wall' problem.
    Neuromorphic computing, as an emerging paradigm that mimics the biological brain's
    information-processing methods, offers highly promising solutions to overcome
    energy-efficiency bottlenecks through event-driven operations, integrated sensing,
    storage, and computation, and novel devices such as memristors. This paper systematically
    analyses and summarises the latest research achievements in neuromorphic computing
    across hardware devices, system architectures, and optimisation strategies. It
    first presents fundamental hardware implementation options for simulating neurons
    and synapses, highlighting memristors' benefits in low-power synaptic plasticity.
    Then the system-level low-power architectures are discussed-including the event-driven
    paradigm and compute-in-memory concept integration. Finally, taking IoT edge nodes
    as an example application scenario of energy-efficient neuromorphic systems, it
    also outlines current major issues confronting technologies along with future
    development directions.
  venue: Applied and Computational Engineering
- title: Quantum Neuromorphic and Photonic AI Architectures for Energy-Efficient Cognitive
    Computing
  date: 2026-05
  url: https://doi.org/10.62311/nesx/rb4m-978-81-687299-6-4
  category: edge-computing
  subcategory: method
  authors:
  - Murali Krishna Pasupuleti
  abstract: Abstract This academic manuscript develops a doctoral-level framework
    for quantum neuromorphic and photonic AI architectures as a pathway toward energy-efficient
    cognitive computing. It examines how quantum-inspired representation and optimisation,
    neuromorphic event-based processing, photonic interconnection and trustworthy
    machine learning can be integrated into reproducible research systems and governable
    deployment infrastructures. The book advances a coherent sequence from conceptual
    foundations and uncertainty-aware research design to statistical modelling, causal
    inference, trustworthy prediction, scalable MLOps and sectoral governance. It
    avoids unsupported empirical claims and instead provides research-oriented models,
    evaluation metrics, workflow protocols, risk frameworks and policy artifacts that
    can guide future scholarly and industrial programmes. The manuscript emphasises
    global relevance across South Asia, Europe, Africa and the Americas, where energy
    constraints, digital inclusion, public accountability, industrial competitiveness
    and sustainable AI infrastructure differ significantly. By linking device-level
    reasoning with social and institutional evaluation, the book positions energy-efficient
    cognitive computing as both a technical challenge and a governance problem. Its
    intended contribution is a structured reference architecture for researchers,
    engineers, policymakers and interdisciplinary research teams developing next-generation
    cognitive systems. Keywords Quantum AI, neuromorphic computing, photonic AI, cognitive
    computing, energy-efficient intelligence, spiking neural networks, optical interconnects,
    edge intelligence, quantum-inspired optimization, trustworthy machine learning,
    causal inference, uncertainty quantification, MLOps, digital twins, low-power
    hardware, algorithmic governance, reproducibility, smart cities, healthcare AI,
    industrial automation, data sovereignty, cyber resilience, public policy, sustainable
    computing
  venue: ''
- title: Neuromorphic Spiking Intelligence for Ultra-Low-Power Edge AI and Cognitive
    Robotics
  date: 2026-05
  url: https://doi.org/10.62311/nesx/rb3m-978-81-686966-7-9
  category: edge-computing
  subcategory: theory
  authors:
  - Murali Krishna Pasupuleti
  abstract: 'Abstract: Neuromorphic spiking intelligence offers a rigorous pathway
    for building ultra-low-power edge AI and cognitive robotics systems that perceive,
    infer and act through sparse event-driven computation. This manuscript develops
    a publication-grade academic framework for understanding spiking neural computation,
    statistical explanation, causal inference, trustworthy machine learning, reproducible
    MLOps, sectoral deployment and governance. It argues that cognitive robotics cannot
    be evaluated only through task accuracy; it must also be assessed through energy
    efficiency, latency, uncertainty calibration, causal reliability, safety, transparency
    and lifecycle accountability. The book progresses from foundational theory and
    research design to statistical models, spiking learning architectures, scalable
    engineering workflows and applied governance across healthcare, manufacturing,
    agriculture, infrastructure and education. It emphasizes global relevance across
    South Asia, Europe, Africa and the Americas, where constrained energy budgets,
    infrastructure diversity and public-interest requirements make edge-native intelligence
    strategically important. The manuscript produces conceptual models, mathematical
    formulations, algorithmic pseudocode, structured tables, original schematic figures,
    evaluation metrics, operational protocols, risk frameworks and policy-oriented
    governance artifacts. It is designed for researchers, practitioners and policymakers
    seeking a coherent foundation for responsible neuromorphic AI and embodied robotic
    autonomy. Keywords neuromorphic computing, spiking neural networks, edge AI, cognitive
    robotics, ultra-low-power intelligence, event-based sensing, synaptic plasticity,
    embodied autonomy, uncertainty modelling, causal inference, surrogate gradients,
    trustworthy AI, MLOps, robotic governance, energy-efficient inference, event cameras,
    tactile intelligence, cyber-physical systems, safety assurance, public-interest
    robotics, distributed intelligence, hardware-aware machine learning'
  venue: ''
- title: 'Compute-in-Entropy: Energy Efficient Stochastic Computing Hardware for Trustworthy
    Edge Intelligence'
  date: 2026-07
  url: https://doi.org/10.7274/32869649.v1
  category: edge-computing
  subcategory: application
  authors:
  - Boyang Cheng
  abstract: 'As artificial intelligence (AI) moves from cloud data centers to medical
    devices, wearables, and IoT sensors, edge hardware must operate within stringent
    energy budgets, tolerate noisy and drifting signals, and deliver interpretable,
    leakage-resistant decisions in safety-critical settings. This dissertation treats
    randomness as a computational resource rather than a nuisance to be suppressed,
    introducing a compute-in-entropy paradigm that co-designs sensing, representation,
    and decision hardware around intrinsic device variation (static entropy) and runtime
    stochastic circuit behavior (dynamic entropy). Embedding entropy generation directly
    into analog/mixed-signal and digital datapaths enables privacy-preserving sensing,
    physically-unclonable feature encoding, and uncertainty-aware inference at ultra-low
    power. The paradigm is demonstrated through four designs: a stochastic mixed-signal
    in-sensor privacy architecture, a federated-learning-enabled neuromorphic hyperdimensional
    encoder, a Bayesian neural network engine for arrhythmia detection with uncertainty
    quantification, and a probabilistic decision-tree engine for interpretable hypoglycemia
    forecasting. Together, these contributions chart a unified pathway toward energy-efficient,
    noise-resilient, and trustworthy edge-AI hardware.'
  venue: University of Notre Dame
- title: Edge-computing-based tactile neuromorphic sentry system for intelligent parking
    surveillance
  date: 2026-07
  url: https://doi.org/10.1088/2634-4386/ae9216
  category: edge-computing
  subcategory: method
  authors:
  - Shuxin Lin
  - Jianle Lin
  - Haojie Zhong
  abstract: Abstract This paper presents a novel neuromorphic tactile sensing system
    inspired by human skin–neuron–cortex pathways, developed to address the energy
    and privacy challenges in modern vehicular surveillance. The proposed system integrates
    a heterojunction piezoelectric transistor as a tactile sensory node based on stacked
    up structure of ZnO/NiO/ZnO semiconductors with a neuromorphic matrix computing
    chip designed for on-chip classification of tactile events. The sensor exhibits
    an enhanced signal-to-noise ratio and high sensitivity via internal current and
    voltage amplification, while the neuromorphic circuit implements core neural network
    functions with parallel low-power processing. By extracting frequency-domain features
    to classify physical events such as impact, scraping, rainfall, and hail in parking
    scenarios, our system demonstrates real-time recognition with 93.1% accuracy on
    hardware and 99.2% in software, all while significantly reducing power consumption
    compared to conventional vision-based surveillance systems and avoiding visual
    privacy concerns. This work offers a promising solution for energy-efficient,
    event-driven smart surveillance in edge environments.
  venue: Neuromorphic Computing and Engineering
- title: Low Power Reconfigurable Neuromorphic Architecture by Sparsely Connected
    Spiking Neural Networks for Edge Applications
  date: 2026-08
  url: https://doi.org/10.3390/jlpea16030028
  category: edge-computing
  subcategory: method
  authors:
  - Alishba Masood
  - Muhammad Khurram
  abstract: Recent advances in biologically inspired neural computation have sparked
    increasing interest in developing hardware-efficient architectures capable of
    emulating brain-like cognitive abilities like low power consumption and less inference
    latency. However, significant hardware overhead and spike-processing complexity
    remain major challenges in FPGA implementations of spiking neural networks. In
    this work, we propose a sparse spike-aware and weight pruning FPGA architecture
    based on LIF neurons that minimizes spike activity and synaptic operations through
    pruning-aware event-driven computation. The proposed sparse spike-aware SNN architecture
    was evaluated using the Iris dataset. The dataset was divided into 80% training
    and 20% testing samples. Pre-trained weights obtained from software-level training
    were deployed onto the FPGA-based LIF classifier. Classification accuracy was
    computed by comparing predicted output spikes against ground-truth class labels.
    Experimental results demonstrated that the proposed architecture achieved an overall
    classification accuracy of 93.3% while maintaining low hardware resource utilization
    and reduced power consumption. Moreover, the implementation achieves superior
    energy efficiency, consuming only 3.5 W total on-chip power and utilizing 587
    logic cells, confirming its suitability for compact, real-time edge computing
    neuromorphic applications.
  venue: Journal of Low Power Electronics and Applications
- title: 2D Materials Powering Neuromorphic Intelligence
  date: 2026-06
  url: https://doi.org/10.1007/s40820-026-02253-1
  category: edge-computing
  subcategory: application
  authors:
  - Jamal Kazmi
  - Waqas Ahmad
  - Muhammad Naqi
  abstract: The exponential demand for energy-efficient and adaptive computing architectures
    drives the evolution of artificial intelligence (AI) and machine learning (ML).
    Neuromorphic computing, inspired by biological neural networks, overcomes the
    limitations of traditional von Neumann architectures, including high energy consumption
    and limited scalability. The introduction of two-dimensional (2D) materials, such
    as transition metal dichalcogenides, hexagonal boron nitride, black phosphorus,
    and tellurene, enables neuromorphic devices with unprecedented control over electronic
    and optoelectronic properties. These materials exhibit atomic-scale thickness,
    high carrier mobility, and tunable bandgaps, facilitating synaptic behaviours
    such as spike-timing-dependent plasticity and paired-pulse facilitation. This
    review describes the integration of 2D materials into neuromorphic systems, highlighting
    applications in wearable electronics, brain-machine interfaces, and quantum neuromorphic
    platforms. In wearable and edge computing, 2D-based devices enable localized,
    ultra-low-power data processing. In brain-machine interfaces, they enhance signal
    transduction and neural interfacing. Quantum effects in 2D materials further enable
    hybrid quantum-classical neuromorphic architectures for high-dimensional computational
    tasks. Despite significant advances, challenges in reproducibility, scalability,
    and stability remain. Addressing these limitations through innovations in synthesis
    and defect passivation is essential for practical application. This review underscores
    the transformative potential of 2D-material-based neuromorphic computing for energy-efficient
    AI. Integration of 2D materials into neuromorphic computing architectures offers
    a promising pathway toward energy-efficient and adaptive systems that bridge biological
    learning mechanisms with machine intelligence.
  venue: Nano-Micro Letters
- title: Energy-efficient water quality modeling using memristor-based neuromorphic
    computing
  date: 2026-05
  url: https://doi.org/10.1038/s41545-026-00586-3
  category: edge-computing
  subcategory: theory
  authors:
  - Minhyuk Jeung
  - Gyeongil Son
  - Minjae Kim
  abstract: Supported by multisource big data and cloud computing, artificial intelligence
    (AI) is transforming environmental monitoring and modeling. However, many high-performance
    AI models rely on high-performance computing, which consumes considerable electrical
    energy and may limit their suitability for long-term edge-based water-quality
    forecasting, motivating potentially low-power on-device computing approaches.
    This study proposes a memristor-informed synaptic neural network (SyNN) framework
    as a device-aware pre-hardware evaluation platform. In the proposed framework,
    synaptic weight updates are guided by experimentally measured pulse-driven long-term
    potentiation and long-term depression behaviors of an N-doped TaOx memristor.
    The device exhibits robust, repeatable nonvolatile switching with stable resistance
    states during repeated cycling. Hydrological and meteorological observations were
    used to predict water-quality variables, including dissolved oxygen, total nitrogen,
    total organic carbon, total phosphorus, and chlorophyll-a. Prediction results
    obtained by the SyNN model showed target-dependent forecasting performance, with
    relatively reliable predictions for dissolved oxygen and total phosphorus, whereas
    chlorophyll-a remained more challenging. Additional sensitivity analyses were
    conducted to examine the effect of representative memristor-related non-idealities
    on model performance. SHapley Additive exPlanations (SHAP) analysis suggests that
    temperature-related inputs provide consistent baseline control, whereas flow and
    rainfall become important primarily during hydrological events. The proposed framework
    is expected to contribute to future on-device water-quality forecasting by reducing
    computational burden and providing a device-aware basis for low-power adaptive
    monitoring under changing river conditions.
  venue: npj Clean Water
- title: ( <i>Invited</i> ) Ion–Electron Interactions In Ionically Gated 2D Transistors
    for Neuromorphic and Energy-Efficient Computing
  date: 2026-07
  url: https://doi.org/10.1149/ma2026-01341564mtgabs
  category: edge-computing
  subcategory: theory
  authors:
  - Ke Xu
  abstract: Two-dimensional (2D) materials offer a compelling platform for next-generation
    electronic and iontronic devices due to their nanoscale thickness, high carrier
    mobility, and strong coupling to electrochemical environments. When interfaced
    with solid ion conductors, these crystals can exhibit both electrostatic electric
    double layer (EDL) gating and electrochemical ion intercalation, providing complementary
    modes of modulation that are useful for low-power and neuromorphic device operation
    [1]. Yet, despite significant progress, the boundary between purely electrostatic
    operation and Faradaic ion insertion remains difficult to control, and understanding
    this interplay is essential for achieving stable, low-power, and high-performance
    devices [2]. In this talk, I will first discuss the unique opportunities and challenges
    of using 2D materials as channels in electrochemical RAM (ECRAM) devices, where
    their nanoscale thickness and strong coupling to solid ion conductors create both
    advantages and constraints for stable analog operation. I will then share recent
    efforts in our group to improve the stability and reversibility of ion intercalation
    in 2D channels through materials engineering. Because 2D-based ECRAM offers analog
    programmability suitable for on-chip training of artificial neural networks [3],
    we also examine how key device parameters such as on/off ratio, accessible conductance
    states, and weight-update linearity jointly determine neural-network performance.
    Through combined device measurements and simulation, we quantify trade-offs between
    the number of programmable states and weight-update linearity. Using a predictive
    ionic-weight-update model informed by measured device behavior [4], we demonstrate
    that linear and symmetric conductance modulation can be achieved while preserving
    multilevel operation, which in turn improves ANN accuracy and accelerates the
    training process. Finally, I will outline emerging directions in ionically controlled
    2D devices for real-time and edge computing, where understanding and tailoring
    ion transport at electrolyte–2D crystal interfaces remain a central scientific
    challenge. By integrating insights from both the electronic device and electrochemical
    communities, this work aims to help establish design principles for stable, energy-efficient,
    and programmable iontronic systems based on 2D materials. [1] Xu, K.; Fullerton-Shirey,
    S. K. J. Phys. Mater. 2020 , 3 (3), 032001. [2] Xu, K.; Fullerton-Shirey, S. K.
    2D Mater. 2025 , 12 (2), 023003. [3] Han, H.; Inman, J.; Maczynski, S.; Indovina,
    M.; Ganguly, A.; Das, T.; Xu, K. Proc. IEEE Microelectron. Des. Test Symp. (MDTS)
    2025 , 1–6. [4] Manimaran, N. H.; Sutton, C. L. M.; Streamer, J. W.; Merkel, C.;
    Xu, K. J. Phys. Mater. 2024 , 8 (1), 015008.
