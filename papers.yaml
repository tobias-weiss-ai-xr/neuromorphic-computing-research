- title: 'FiTS: Interpretable Spiking Neurons via Frequency Selectivity and Temporal
    Shaping'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13071
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Jongmin Choi
  - Joon Son Chung
  abstract: Spiking Neural Networks (SNNs) are a promising framework for event-driven
    temporal processing. Prior work has improved temporal modeling through richer
    neuron dynamics and network-level mechanisms such as recurrence and delays, but
    it remains unclear how individual spiking neurons should specialize within a network.
    In this work, we introduce FiTS, a spiking neuron that factorizes temporal computation
    within each neuron into Frequency Selectivity (FS) and Temporal Shaping (TS).
    The FS module parameterizes each neuron's target frequency as the maximizer of
    its subthreshold magnitude response, while the TS module reshapes when frequency
    components contribute to membrane voltage accumulation through group-delay modulation.
    On auditory benchmarks where frequency selectivity and timing are central to the
    input structure, FiTS consistently improves over a plain Leaky Integrate-and-Fire
    (LIF) baseline in simple feedforward SNNs without recurrence or network-level
    delays, while remaining competitive with strong temporal SNN baselines. Beyond
    accuracy, the learned target frequencies and group-delay shifts provide interpretable
    neuron-level summaries of the frequency and timing organization learned within
    the network.
  venue: arXiv (Cornell University)
- title: 'ITP-STDP: An Intrinsic-Timing Power-of-Two Learning Engine for On-Chip SNN
    Training'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06159
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Haihang Xia
  - Xinyu Zhao
  - Xuecheng Wang
  abstract: Spiking neural networks (SNNs) have the potential to emerge as the third
    generation of neural networks and have attracted increasing attention across a
    wide range of applications. However, the large number of synaptic connections
    in SNNs leads to intensive weight-update computation by on-chip learning algorithms
    during training, resulting in substantial hardware resource utilization and energy
    consumption. Among existing SNN learning algorithms, spike-timing-dependent plasticity
    (STDP) is one of the most extensively studied and widely adopted, serving as a
    fundamental learning component in SNNs. To address the hardware and energy overheads
    associated with SNN training, this paper presents intrinsic-timing power-of-two
    STDP (ITP-STDP) and its corresponding prototype learning engine hardware architecture.
    The proposed design is evaluated through a dedicated mean-field synaptic drift
    model for dynamical analysis and further validated across SNN networks of different
    scales and datasets. It is further implemented on both ASIC and FPGA platforms
    and compared with state-of-the-art approaches, including the original STDP and
    more complex STDP variants. The results demonstrate superior energy efficiency,
    higher operating speed, and substantially lower hardware resource utilization,
    as the proposed design eliminates most of the computational overhead of STDP through
    both algorithmic and hardware-level optimizations. On the FPGA platform, the proposed
    design improves energy efficiency by 4.5$\times$ to 219.8$\times$ over the compared
    designs. On the ASIC platform, the proposed design achieves a 4.8$\times$ to 22.01$\times$
    speedup while consuming only 1.2% to 3.3% of the area required by prior works.
  venue: arXiv (Cornell University)
- title: 'Neuromorphic Filtering: Memristive Anisotropic Diffusion Coupled with STDP-Driven
    Spiking Networks for Biomedical Edge Computing'
  date: 2026-03
  url: https://doi.org/10.1109/iccsic69301.2026.11521264
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Marwa Chaabéne
  - Fakhreddine Zayer
  - Anouar Ben Khalifa
  abstract: This paper presents a novel neuromorphic filtering framework that integrates
    memristive gradient diffusion with spike-timing-dependent plasticity (STDP)-driven
    spiking neural networks (SNNs) for efficient biomedical edge computing. The proposed
    approach leverages memristive anisotropic diffusion to perform in-memory, local
    pixel computations across multilevel memristor grids, enabling pseudo-parallel
    processing and efficient multiply-accumulate operations. Brightness changes are
    computed directly within the memristive crossbar, with flux propagation determined
    solely by local neighboring nodes, allowing a single memristor to serve as both
    a computing and storage element. The diffusion-filtered outputs are then encoded
    into spikes and fed into a memristive STDP-based SNN, where synaptic weights adapt
    to temporal correlations, facilitating robust feature extraction and signal enhancement.
    Experimental evaluation on noisy biomedical CT images demonstrates consistent
    improvements of 2.1–3.4 dB in PSNR and 4–7% in SSIM over digital Perona–Malik
    and recent neuromorphic filtering baselines. Hardware-level benchmarking further
    shows 38–52% reduction in energy consumption and 30–45% lower inference latency
    compared to state-of-the-art memristive and hybrid edge architectures. These results
    establish MAD as a learning-aware, hardware-native filtering layer that significantly
    improves the accuracy–energy–latency trade-off for real-time biomedical signal
    processing at the edge.
