- title: Full Feature Spiking Neural Network Simulation on Micro-Controllers for Neuromorphic
    Applications at the Edge
  date: 2026-04
  url: https://arxiv.org/abs/2604.16474
  category: edge-computing
  subcategory: application
  authors:
  - L. Niedermeier
  - J. L. Krichmar
  abstract: Microcontroller units (MCU), which have an order of magnitude lower Size,
    Weight and Power (SWaP) than standard computers, makes them suitable for applications
    at the edge. Neuromorphic computing, which can realize low SWaP, relies on Spiking
    Neural Networks (SNNs). Until now, software based simulations of SNNs required
    GPU-based workstations, application classified core processors such as the ARM
    Cortex-A53, or specialized hardware like Intel's Loihi. In the present work, we
    demonstrate that the SNN simulator CARLsim can run its full feature set on a MCU
    RP2350 with 8 MB memory. We accomplished this by utilizing IEEE 16-bit float point
    numbers, which reduced memory requirements without loss of function. We were able
    to run the Synfire4 benchmark which comprises 1200 neurons. The accuracy was 97.5%
    compared to the standard single precision numbers. Furthermore, we show that CARLsim
    runs a Synfire4 benchmark scaled-down to 186 neurons on a MCU in real-time at
    only 20 mW. Compared to the smallest application class ARM processor used by Raspberry
    in their Pi Zero 2 W, our MCU implementation is five times more energy efficient
    for the SNN itself, and an order of magnitude better when compared to the complete
    SoC (MCU/CPU + Board).
  venue: arXiv (Cornell University)
- title: '( <i>Invited</i> ) Mimicking Biology with Physics: Neuromorphic Sensing
    and Computing In Multifunctional Memory Devices'
  date: 2026-07
  url: https://doi.org/10.1149/ma2026-01341588mtgabs
  category: edge-computing
  subcategory: theory
  authors:
  - Nazek El‐Atab
  abstract: 'Biological intelligence achieves exceptional perception, learning, and
    decision-making under strict energy and resource constraints by tightly integrating
    sensing, memory, and computation within the same physical substrate. In contrast,
    conventional artificial intelligence systems rely on architectures that separate
    these functions, resulting in excessive data movement, high power consumption,
    and limited adaptability—particularly at the edge [1]. Mimicking biology therefore
    requires not only new algorithms, but also new physics-driven hardware paradigms
    that embed intelligence directly into materials and devices. Neuromorphic electronics
    provides such a pathway by exploiting intrinsic device dynamics to enable low-power,
    adaptive, and context-aware computing [2]. In this invited talk, I will present
    our recent advances in neuromorphic sensing and computing using multifunctional
    memory devices, focusing on memristive systems and MOS capacitor (MOSCAP) charge-trapping
    memories that intrinsically merge sensing, memory, and computation. Our approach
    leverages direct interactions between physical stimuli and memory states, enabling
    in-memory and in-sensor intelligence inspired by biological perception and learning,
    without continuous data transfer to external processors. I will first discuss
    memristive neuromorphic devices that exhibit volatile and nonvolatile switching,
    threshold behavior, and history-dependent conductance modulation. By engineering
    materials and interfaces, these devices become directly responsive to electrical
    signals, gases, humidity, and temperature, while simultaneously performing computational
    and memory functions. Such characteristics naturally map onto key biological primitives,
    including temporal integration, plasticity, and threshold-based activation. I
    will demonstrate how these properties can be exploited for neuromorphic gas sensing
    and respiratory health applications. This enables compact and energy-efficient
    platforms for breath analysis and respiratory disease screening, with decision-making
    occurring directly within the memory device [3-4]. The talk will then highlight
    our work on MOSCAP charge-trapping memory-based neuromorphic systems, which offer
    a highly CMOS-compatible route toward scalable neuromorphic hardware. By exploiting
    charge trapping and detrapping dynamics in engineered dielectric stacks, these
    devices exhibit memcapacitive and memristive behavior that can be modulated by
    electrical and optical stimuli, as well as environmental factors such as temperature
    and humidity. I will show how photo-induced charge modulation and electric-field-driven
    memory effects can be combined to realize in-memory optical sensing and neuromorphic
    vision functionalities, including adaptive visual processing and image recognition
    with reduced energy consumption. These capabilities are particularly relevant
    for edge platforms such as autonomous systems and unmanned aerial vehicles, where
    power and latency constraints are critical [5-6]. Across both memristive and MOSCAP-based
    platforms, a central theme of this work is the deliberate use of material and
    device physics as a computational resource. Rather than suppressing nonlinearity,
    variability, and environmental sensitivity, we harness these features to implement
    neuromorphic functions such as short- and long-term plasticity, fading memory,
    and stimulus-dependent adaptation. This enables reconfigurable neuromorphic systems
    capable of responding to diverse inputs—including electrical, optical, humidity,
    gas, and temperature stimuli—within a unified hardware framework. The talk will
    conclude with an outlook on how physics-inspired multifunctional memory devices
    can enable scalable, energy-efficient neuromorphic hardware for applications spanning
    vision, healthcare, and intelligent sensing at the edge, and how device–algorithm
    co-design can accelerate translation toward real-world impact. [1] B. Alqahtani,
    D. Kumbhar, A. M. Syed, MD H. Raza Ansari, H. Li, K. Dominguez, P. Pal, M. Albagami,
    D. Kumar, A. Alvarado, N. El-Atab, “Smart multifunctional memory devices capable
    of sensing: The role of responsive materials in advancing nonvolatile memories”,
    Materials Today 2025. [2] D. Kumar, H. Li, D. Kumbhar, M. Rajbhar, A. Syed, U.
    Das, G. Milente, N. El-Atab “Highly Efficient Back-end-of-Line Compatible Flexible
    Si-Based Optical Memristive Crossbar Array for Edge Neuromorphic Physiological
    Signal Processing and Bionic Machine vision” Nano-Micro Letters, 16 (1), 238,
    2024. [3] M. K. Rajbhar, D. Kumar, H. Li, D. D Kumbhar, A. Singh, A. M. Syed,
    Md H. R. Ansari, S. Tytov, B. Alqahtani, H. Lee, N. El-Atab, “Fully photonic controlled
    flexible synapse for bionic machine vision and reconfigurable logic applications”
    Materials Science and Engineering: R: Reports 167, 101088, 2025. [4] A. M. Syed,
    D. D. Kumbhar, H. Li, M. K. Rajbhar, D. Kumar, P. Pal, N. Wehbe, M. B. Hassine,
    N. El-Atab, “A Multimodal Humidity Adaptive Optical Neuron Based on a MoWS2/VOx
    Heterojunction for Vision and Respiratory Functions” Advanced Materials 2417793,
    2025. [5] B. Alqahtani, H. Li, A. Syed, and N. El-Atab “From Light Sensing to
    Adaptive Learning: Hafnium Diselenide Reconfigurable Memcapacitive Devices in
    Neuromorphic Computing” Nature – Light Science and Applications 14 (1), 30, 2025
    [6] D. Kumar, L. Joharji, H. Li, A. Rizk, A. Nayfeh, N. El-Atab, “Artificial Visual
    Perception Nervous System Using Solution-Processable MoS2-Based in-Memory Light
    Sensor” Nature Light Science and Application, 12 (1), 109, 2023'
