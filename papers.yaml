- title: An Effective SNN Macro with Real-Time STDP and Dynamic LIF Model Based on
    Thermally Interplayed Spin-Orbit Torque MTJ
  date: 2026-04
  url: https://doi.org/10.23919/date69613.2026.11539519
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Changyu Li
  - Linjun Jiang
  - Liangchen Li
  abstract: Spiking neural networks (SNNs) have emerged as a promising paradigm for
    effective event-driven computation. However, CMOS-based SNN designs are limited
    by power consumption and complexity, while nonvolatile memory (NVM)-based SNN
    designs often lack biological characteristics and require active capacitive circuits
    to emulate neuronal dynamics. In this paper, we propose a thermally interplayed
    spin-orbit torque magnetic tunnel junction (TI-MTJ) macro that integrates core
    SNN functionalities. Our neuron array autonomously achieves leaky integrate-and-fire
    (LIF) model within the TI-MTJ device, thus improving power efficiency and simplifying
    circuit structure. Additionally, the proposed synaptic array provides adaptive
    in-situ responses based on a simplified spike-timing-dependent plasticity (STDP)
    rule. To enhance biological plausibility, our macro incorporates real-time spike
    monitoring and inhibition mechanisms. A comprehensive device-circuit-algorithm
    co-optimization framework validates the high performance of the TI-MTJ macro,
    achieving a synaptic energy consumption of 6.07fJ per spike, an inference accuracy
    of 97.76% on the MNIST dataset, and an energy efficiency of 22.8TOPS/W.
  venue: ''
- title: BU230 | STDP, SNN Learning, and Algorithm-Hardware CoSettlement under B_U
    BU230|B_U 体系下 STDP、SNN 学习与算法-硬件共同结算
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.21066153
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Dedong Zhan
  abstract: 'Abstract BU230, STDP, SNN Learning, and Algorithm–Hardware Co-Settlement
    under B_U, examines spike-timing-dependent plasticity (STDP) and spiking neural
    network (SNN) learning as a joint algorithm–hardware settlement problem rather
    than a purely biological metaphor or isolated learning rule. Building on BU228’s
    energy-standing analysis of neuromorphic computing and BU229’s reliability audit
    of memristor-based neuromorphic hardware, this file moves to the learning interface
    where algorithmic dynamics and physical device behavior must co-stabilize. Under
    the B_U framework, STDP gains standing only when its local update rule, hardware
    implementation, energy profile, timing precision, weight stability, calibration
    burden, and deployment residuals can jointly settle on a real computational carrier.
    The file defines STDP as a timing-based synaptic learning mechanism in which weight
    updates depend on the temporal order and interval between pre-synaptic and post-synaptic
    spikes. When the pre-synaptic spike precedes the post-synaptic spike within an
    admissible window, the synaptic weight is strengthened; when the order reverses,
    the weight is weakened. In formal terms, STDP can be represented through paired
    exponential update rules: positive update for causal timing alignment and negative
    update for anti-causal timing alignment. This gives SNN learning a structurally
    attractive property: learning is local, event-driven, sparse, and temporally grounded.
    It can in principle reduce global backpropagation overhead, lower data movement,
    and support adaptive computation in edge, sensory, robotic, and real-time environments.
    BU230 emphasizes, however, that STDP’s elegance at the algorithmic level does
    not automatically produce positive system standing. When STDP is implemented on
    neuromorphic hardware—especially memristor-based synaptic arrays—it inherits physical
    constraints that classical symbolic descriptions usually hide. Timing noise, pulse
    mismatch, conductance drift, device variability, finite precision, endurance degradation,
    nonlinear update behavior, saturation, retention instability, and peripheral-circuit
    overhead all affect the actual learning trajectory. A rule that appears clean
    in mathematical notation may become unstable when expressed through imperfect
    physical pulses and stochastic conductance states. Therefore, STDP must be audited
    through algorithm–hardware co-settlement. The file develops this co-settlement
    logic by linking three layers. The first is the algorithmic layer: spike timing,
    update window, learning rate, plasticity curve, locality, stability, and task
    fit. The second is the hardware layer: memristor conductance states, pulse programming,
    timing resolution, write-verify loops, calibration procedures, endurance, drift
    compensation, and array-level nonidealities. The third is the B_U standing layer:
    C_fric, Xi_res, weak persistence, and final admissibility. C_fric includes programming
    cost, calibration cost, hardware-control cost, retraining cost, and integration
    cost. Xi_res includes timing residuals, weight-drift residuals, device-variability
    residuals, capability-control residuals, benchmark-transfer residuals, and safety-stability
    residuals. BU230 argues that the strongest path for STDP-based SNN learning is
    not naive biological imitation, but residual-aware co-design. The learning rule
    must be shaped with the hardware carrier in view, while the hardware stack must
    expose enough controllability for the learning dynamics to remain stable. Effective
    mitigation includes bounded plasticity windows, adaptive pulse programming, periodic
    recalibration, variability-aware training, hybrid digital–analog supervision,
    redundant synaptic encoding, runtime drift monitoring, and workload-specific validation.
    These mechanisms do not eliminate residuals; they turn hidden instability into
    accountable engineering structure. The file concludes that STDP and SNN learning
    are standing-positive only under co-settlement. Their value lies in sparse temporal
    adaptation and low-energy local learning, but their legitimacy depends on whether
    the algorithmic update law and the physical substrate can jointly preserve stability,
    controllability, energy advantage, and weak persistence. Under B_U, STDP is not
    merely a learning rule; it is a settlement interface between temporal computation
    and physical hardware.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Neural Encoding Strategies for Neuromorphic Computing
  date: 2026-03
  url: https://doi.org/10.3390/electronics15061221
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - M Liu
  - Honghao Zheng
  - Yang Yi
  abstract: Neuromorphic computing seeks to mimic structure and function of biological
    neural systems to enable energy-efficient, adaptive information processing. A
    critical component of this paradigm is neural encoding—the translation of analog
    or digital input data into spike-based representations suitable for spiking neural
    networks (SNNs). This paper provides a comprehensive overview of major neural
    encoding schemes used in neuromorphic systems, including rate and temporal encoding,
    as well as latency, interspike interval, phase, and multiplexed encoding. The
    purpose of this paper is to explore the use of encoding techniques for deep learning
    applications. We discussed the underlying principles of spike encoding approaches,
    their biological inspiration, computational efficiency, power consumption, integrated
    circuit design and implementation, and suitability for various neuromorphic applications.
    We also presented our research on a hardware-and-software co-design platform for
    different encoding schemes and demonstrated their performance. By comparing their
    strengths, limitations, and implementation challenges, we aim to provide insights
    that will guide the development of more efficient and application-specific neuromorphic
    systems. We also performed an encoder performance analysis via Python 3.12 simulations
    to compare classification accuracies across these spike encoders on three popular
    image and video datasets. The performance of neural encoders working with both
    deep neural networks (DNNs) and SNNs is analyzed. Our performance data is largely
    consistent with the benchmark data on image classification from other papers,
    while limited performance data on the University of Central Florida’s 101 (UCF-101)
    video dataset were found in comparable studies on spike encoders. Based on our
    encoder performance data, the Interspike Interval (ISI) encoder performs well
    across all three datasets, preserving continuous, detailed spike timing and richer
    temporal information for standard classification tasks. Further, for image classification,
    multiplexing encoders outperform other spike encoders as they simplify timing
    patterns by enforcing phase locking and improve stability and robustness to noise.
    Within the SNN testbenches, the ISI-Phase encoder achieved the highest accuracy
    on the Modified National Institute of Standards and Technology (MNIST) dataset,
    surpassing the Time-To-First Spike (TTFS) encoder by 1.9%. On the Canadian Institute
    For Advanced Research (CIFAR-10) dataset, the ISI encoder achieved the highest
    accuracy. This ISI encoder had 22.7% higher accuracy than the TTFS encoder on
    the CIFAR-10 dataset. The ISI encoder performed best on the UCF-101 dataset, achieving
    12.7% better performance than the TTFS encoder.
  venue: Electronics
- title: 'Unified Complex-valued Neural Network: A Magnitude-Phase Computational Model
    for Event-Driven Neuromorphic Learning'
  date: 2026-06
  url: https://arxiv.org/abs/2606.29099
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Reza Ahmadvand
  - Safura Sharifi
  - Yaser Mike Banad
  abstract: Artificial neural networks (ANN) provide accurate continuous-valued representation,
    whereas spiking neural networks (SNN) offer event-driven temporal processing,
    yet both paradigms face limitations when value encoding and timing dynamics must
    be learned within a single computational structure. This paper introduces a network
    based on Unified Complex-valued Neuron (UCN), a new neural computational model
    that integrates continuous activation and phase-driven event generation through
    an asymmetric complex-valued state. In the UCN, magnitude encodes signal strength
    while phase governs intrinsic temporal evolution and valued spike emission. A
    foundational training framework combining backpropagation (BP) and backpropagation
    through time (BPTT) is first developed to optimize magnitude and phase pathways
    in a unified way. To reduce computational complexity, an event-driven adaptive
    phase learning (EAPL) rule is then introduced as a more efficient alternative.
    The proposed model is evaluated through object tracking and Lorenz attractor learning.
    Results demonstrate that UCN-based Network (UCNN) provides accurate, stable, and
    interpretable spatiotemporal learning while preserving sparse event-driven computation
    for neuromorphic and edge-AI applications.
