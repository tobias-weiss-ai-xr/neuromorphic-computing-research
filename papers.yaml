- title: 'Spiking Neural Networks: A Tutorial on Models, Coding, and Training'
  date: 2026-05
  url: https://doi.org/10.20944/preprints202605.0827.v1
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - I. Can Dikmen
  abstract: Spiking neural networks (SNNs) are often called the third generation of
    neural models. They communicate with brief asynchronous pulses rather than continuous
    values, which suits event-driven sensors and low-power neuromorphic hardware.
    The mathematics behind them is split across neuroscience textbooks, machine learning
    papers, and stochastic process literature, and a researcher entering the area
    runs into a notation problem before anything else. The same neuron model is written
    one way in a textbook, another way in a machine learning paper, and a third way
    in the stochastic process literature. This tutorial collects what a graduate student
    or research engineer needs in order to start working with SNNs, in one place and
    with one notation. We start with the leaky integrate-and-fire (LIF) neuron, derived
    from a conductance-based picture of the membrane. Reset semantics, the spike response
    model, and the broader family that includes Hodgkin-Huxley and adaptive exponential
    models are discussed. Network equations are written out for feedforward and recurrent
    architectures. We cover the main neural coding schemes (rate, time-to-first-spike,
    rank-order, phase, burst, population) and discuss when each is appropriate. The
    neuromorphic datasets a beginner is likely to encounter, including N-MNIST, DVS-Gesture,
    CIFAR10-DVS, SHD, and SSC, are described together with the tensor formats event-based
    data takes. For learning, we derive pair-based spike-timing-dependent plasticity
    from exponential traces and develop the surrogate gradient framework, which has
    become the dominant tool for training deep SNNs by backpropagation through time.
    Reset semantics, the choice of surrogate function, and common pitfalls in BPTT
    are addressed in a way that maps onto code. Alternative training paradigms (e-prop,
    EventProp, SLAYER, three-factor rules, ANN-to-SNN conversion) are introduced briefly
    so the reader knows what else is available. A practical section walks through
    a first SNN training loop with framework-agnostic pseudocode and points to the
    main software libraries (snnTorch, SpikingJelly, Norse). Throughout the article,
    equations carry derivational status labels (exact, reduction, approximation, heuristic)
    so that the reader sees at a glance which steps are mathematical identities and
    which involve approximations. We do not cover hardware implementation, detailed
    point process theory, expressivity proofs, or open problems in SNN complexity;
    these belong in a more advanced treatment. The article is meant to be read linearly,
    and a suggested reading path closes it.
  venue: Preprints.org
- title: 'Online Data Reduction with Spiking Neural Networks: A Temporal-Coincidence
    Encoder and Distributed SNN for the ePIC dRICH Detector'
  date: 2026-07
  url: https://arxiv.org/abs/2607.03492
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Pierpaolo Perticaroli
  - Roberto Ammendola
  - Andrea Biagioni
  abstract: 'The dual-radiator Ring Imaging Cherenkov (dRICH) detector of the ePIC
    experiment at the Electron-Ion Collider (EIC) will read out $\sim$320,000 silicon
    photomultiplier (SiPM) channels at a bunch-crossing rate of 100 MHz. The dark
    count rate (DCR) of the SiPMs is expected to rise up to 300 kHz per channel over
    the experiment lifetime, saturating the output bandwidth and requiring an online
    data reduction factor of at least five. Most crossings contain only uncorrelated
    DCR hits, while genuine Cherenkov hits cluster within $\sim$2 ns of the 10 ns
    crossing window: an intrinsically temporal discrimination problem. We present
    a two-stage online data reduction pipeline based on spiking neural networks (SNNs).
    The first stage is a per-photodetection-unit leaky-integrate-and-fire (LIF) temporal
    coincidence encoder that converts raw SiPM hits into a sparse spike stream, achieving
    over 90% data sparsification before any learned classifier is applied. The second
    stage is a distributed SNN (30 sub-sector networks plus an aggregation network)
    deployed on FELIX-155 DAM boards and a dedicated Trigger Processor board, classifying
    each crossing as Noise-Only or Signal+Noise. On simulated ePIC events the system
    reaches a true positive rate above 94% at a true negative rate of at least 80%
    across the full DCR range; an optional early-exit strategy reduces the average
    classification latency to $\sim$2 algorithmic timesteps at the cost of a few percentage
    points on both metrics. A hardware proof-of-concept on an AMD Versal Premium FPGA,
    integrating the LIF encoder with the AIGOR multi-core neuromorphic architecture,
    validates a single sub-sector pipeline at $\sim$1.7 MHz throughput; ongoing work
    targets 100 MHz through an identified set of optimizations of the inference fabric.
    The methodology may be relevant to other timing-driven detector applications at
    high rate.'
  venue: arXiv (Cornell University)
- title: A Low-Power Analog Spiking Neural Network with On-Chip Learning
  date: 2026-04
  url: https://doi.org/10.1109/isqed69900.2026.11534703
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Kiruthikan Sithamparanathan
  - Jeff Dix
  abstract: Spiking neural networks (SNNs) are a promising class of artificial intelligence
    architectures that emulate the temporal and event-driven behavior of biological
    neurons. Their sparse and asynchronous computation achieves superior energy efficiency
    compared to the conventional artificial neural networks. This paper presents an
    energy-efficient analog hardware implementation of SNNs with on-chip learning
    capability, designed to operate efficiently in power constrained environments
    such as edge devices. The proposed neuron is based on the leaky integrate-and-fire
    model, which enables biologically realistic temporal dynamics. Synaptic weight
    update is governed by spike timing-dependent plasticity, which provides local,
    unsupervised learning directly within the analog domain. The proposed design employs
    a fully event-driven, low-power analog architecture implemented in a commercially
    available 12 nm FinFET process, ensuring compatibility with modern fabrication
    technologies. Through novel circuits and optimization, the neuron achieves an
    energy efficiency of 78 fJ per spike, demonstrating capability to operate in power-constrained
    environments.
