- title: Low‐Latency Visuotactile Neuron Using Self‐Oscillating Memristor
  date: 2026-05
  url: https://doi.org/10.1002/smll.73955
  category: spiking-neural-networks
  subcategory: application
  authors:
  - Pengzhan Li
  - Anping Huang
  - Jiangshun Huang
  abstract: ABSTRACT Low latency perception of visual and tactile information is a
    prerequisite for embodied intelligence, and combined with bio‐inspired spiking
    neural network (SNN), it enables efficient interaction with the physical environment.
    However, achieving low‐latency perception and spike conversion of external stimuli
    at the hardware level remains challenging, while biological systems utilize the
    time‐to‐first‐spike (TTFS) and firing rate of neurons to perceive surrounding
    signals in real time. Herein, a self‐oscillating neuron based on NbO x memristors
    is demonstrated, leveraging intrinsic parasitic capacitance as the sole integration
    element to enable simultaneous TTFS and rate encoding of visual and pressure stimuli
    with an ultra‐low first spike latency of 260 ns. By eliminating redundant capacitance
    and exploiting the adaptive timing characteristics of TTFS encoding, an intrinsically
    low‐latency signal transmission pathway is established. Evaluation on the CIFAR‐10
    dataset demonstrates that the fusion of TTFS and rate coding achieves higher accuracy,
    improved noise robustness, and reduced temporal latency compared to rate coding
    schemes. Furthermore, multisensory integration is validated through Braille datasets
    recognition, demonstrating improved accuracy under visually constrained conditions.
    These results highlight the potential of multisensory neuromorphic perception
    systems for real time human‐machine interaction and embodied intelligence applications.
  venue: Small
- title: 'MH-FLOCKE: Biologically Grounded Embodied Cognition Through a 15-Step Closed-Loop
    Architecture for Quadruped Locomotion Learning'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20616889
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Marc Hesse
  abstract: 'I present MH-FLOCKE, an embodied AI platform in which simulated quadruped
    creatures learn locomotion through a biologically grounded cognitive architecture.
    Unlike end-to-end reinforcement learning (RL) approaches that treat the body as
    an optimization target, MH-FLOCKE implements a 15-step closed-loop processing
    cycle that integrates proprioception, embodied emotions, episodic memory, motivational
    drives, a Global Workspace for attentional competition, metacognitiveself-assessment,
    and reward-modulated spike-timing-dependent plasticity (R-STDP) in a spiking neural
    network (SNN). In this revision, I address reviewer feedback by providing: (1)
    mathematical formulations of all core learning rules (Izhikevich dynamics, R-STDP,
    cerebellar forward model, competence gate), (2) a PPO baseline comparison showing
    MH-FLOCKE''s neural learning coreachieves 3.5× the walking distance at equal 50k-step
    budget (45.15 ± 0.67 m vs. 12.83 ± 7.78 m; fixed-budget sample efficiency), (3)
    multi-seed statistical validation across 10 seeds and 80 runs, and (4) cross-embodiment
    transfer to the Unitree Go2 without architectural changes. Systematic ablation
    across 60+ runs isolates component contributions: vestibular reflexes eliminate
    all falls, motor babbling increases flat-terrain distance by 763%, the cerebellar
    forward model produces measurable prediction errors, and an olfactory sensory
    environment enables stimulus-driven behavior switching.The SNN+Cerebellum core
    (B1) achieves sigma = 0.67 m across 10 seeds — the lowest variance of any condition.
    I also report an interaction effect where the full cognitive architecture reduces
    locomotion distance compared to the neural core alone. Changelog: v2.0: Mathematical
    formulations expanded (reward function, SNN connectivity, dream mode), Section
    2.5 added (comparison with prior SNN+CPG systems), cognitive efficiency metric,
    PCI clarification, language revision, Unicode rendering fixed.'
