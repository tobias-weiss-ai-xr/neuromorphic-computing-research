- title: 'Multi-Scale Fractal Spike Network: Research on Spiking Neural Networks with
    Temporally Self-Similar Propagation'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309829
  category: brain-inspired
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: Spiking Neural Networks (SNNs), recognized as the third generation of
    artificial neural networks, have attracted substantial attention due to their
    high biological plausibility and low-power characteristics. However, when processing
    complex temporal information, conventional SNNs often suffer from difficulties
    in multi-scale feature fusion, limited capacity to capture long-range temporal
    dependencies, and degradation of spiking dynamics. To address these critical limitations,
    this paper proposes a novel spiking neural network architecture termed the Multi-Scale
    Fractal Spike Network (MSFN). By innovatively integrating fractal geometry theory
    into the temporal dimension design of SNNs, the proposed network constructs a
    temporally self-similar spiking fractal topology, which enables highly efficient
    propagation and integration of spike signals across multiple time scales. We articulate
    the mathematical foundation of the fractal spike neuron model, elaborate on the
    recursive construction algorithm of the temporally self-similar network, and derive
    its underlying spike transmission dynamics. Theoretical stability analysis demonstrates
    that MSFN maintains strict dynamic boundaries without suffering from spike explosion
    or vanishing issues. Furthermore, we mathematically prove that the network's impulse
    response exhibits a power-law decay rather than the conventional exponential decay,
    which theoretically guarantees its superior capability in capturing long-range
    temporal dependencies. The proposed fractal temporal coding and multi-scale fusion
    mechanisms allow the network to perform natural multi-resolution temporal analysis
    with zero extra parameter overhead. This research establishes a elegant theoretical
    framework combining geometric self-similarity with brain-inspired computing, offering
    promising prospects for highly efficient, next-generation neuromorphic temporal
    processing.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Neuro-Computational Synergy: Bridging Artificial Intelligence and Neuroscience
    for Next-Generation Cognitive Decision Systems'
  date: 2026-04
  url: https://doi.org/10.47363/jbrr/2026(3)119
  category: brain-inspired
  subcategory: theory
  authors:
  - Shankar S. Iyer
  abstract: The convergence of Artificial Intelligence (AI), neuroscience, and cognitive
    science has catalyzed a paradigm shift in understanding and engineering decision-making
    systems. This comprehensive review examines the bidirectional relationship between
    brain-inspired computational models and neuroscientific insights, focusing on
    how reinforcement learning, prefrontal cortex mechanisms, and basal ganglia circuits
    inform the development of advanced cognitive architectures. We synthesize findings
    from 218 peer-reviewed studies spanning computational neuroscience, cognitive
    modeling, and AI applications, revealing that brain-inspired approaches not only
    enhance AI performance in complex decision tasks but also provide testable hypotheses
    about neural computation. Key themes include dopamine-modulated learning, meta-reinforcement
    learning in prefrontal networks, hierarchical cognitive control, and the integration
    of model-based and model-free decision strategies. We identify critical gaps in
    current understanding, including the challenge of scaling biologically plausible
    models to real-world applications and the need for unified frameworks that bridge
    multiple levels of analysis. This review demonstrates that neuro-computational
    synergy offers transformative potential for developing adaptive, context-sensitive
    AI systems while simultaneously advancing our understanding of human cognition.
    We conclude by outlining future research directions that emphasize cross-disciplinary
    collaboration, neuromorphic computing, and the ethical implications of brain-inspired
    AI systems.
