- title: An Energy-Efficient Spiking Neural Network Architecture for Predictive Insulin
    Delivery
  date: 2026-03
  url: https://arxiv.org/abs/2603.27589
  category: edge-computing
  subcategory: theory
  authors:
  - Sahil Shrivastava
  abstract: 'Diabetes mellitus affects over 537 million adults worldwide. Insulin-dependent
    patients require continuous glucose monitoring and precise dose calculation while
    operating under strict power budgets on wearable devices. This paper presents
    PDDS - an in-silico, software-complete research prototype of an event-driven computational
    pipeline for predictive insulin dose calculation. Motivated by neuromorphic computing
    principles for ultra-low-power wearable edge devices, the core contribution is
    a three-layer Leaky Integrate-and-Fire (LIF) Spiking Neural Network trained on
    128,025 windows from OhioT1DM (66.5% real patients) and the FDA-accepted UVa/Padova
    physiological simulator (33.5%), achieving 85.90% validation accuracy. We present
    three rigorously honest evaluations: (1) a standard test-set comparison against
    ADA threshold rules, bidirectional LSTM (99.06% accuracy), and MLP (99.00%), where
    the SNN achieves 85.24% - we demonstrate this gap reflects the stochastic encoding
    trade-off, not architectural failure; (2) a temporal benchmark on 426 non-obvious
    clinician-annotated hypoglycemia windows where neither the SNN (9.2% recall) nor
    the ADA rule (16.7% recall) performs adequately, identifying the system''s key
    limitation and the primary direction for future work; (3) a power-efficiency analysis
    showing the SNN requires 79,267x less energy per inference than the LSTM (1,551
    Femtojoules vs. 122.9 nanojoules), justifying the SNN architecture for continuous
    wearable deployment. The system is not yet connected to physical hardware; it
    constitutes the computational middle layer of a five phase roadmap toward clinical
    validation. Keywords: spiking neural network, glucose severity classification,
    edge computing, hypoglycemia detection, event-driven architecture, LIF neuron,
    Poisson encoding, OhioT1DM, in-silico, neuromorphic, power efficiency.'
  venue: arXiv (Cornell University)
- title: CMOS implementation of field programmable spiking neural network for hardware
    reservoir computing
  date: 2026-04
  url: https://arxiv.org/abs/2509.17355
  category: edge-computing
  subcategory: method
  authors:
  - Ckristian Duran
  - N. Kimura
  - Zolboo Byambadorj
  abstract: Abstract The increasing complexity and energy demands of large-scale neural
    networks, such as deep neural networks and large language models, challenge their
    practical deployment in edge applications due to high power consumption, area
    requirements, and privacy concerns. Spiking neural networks, particularly in analog
    implementations, offer a promising low-power alternative but suffer from noise
    sensitivity and connectivity limitations. This work presents a novel CMOS-fabricated
    field-programmable neural network architecture for hardware reservoir computing
    (RC). We propose a leaky integrate-and-fire neuron circuit featuring integrated
    voltage-controlled oscillators and synaptic weights programmed via an on-chip
    field-programmable gate array framework. This framework enables direct connectivity
    between neurons, supporting the implementation of arbitrary reservoir configurations.
    The performance of the system is validated through simulation and chip measurements,
    demonstrating effective FORCE algorithm learning alongside competitive results
    in linear/non-linear memory capacity and NARMA10 benchmarks. The neuron design
    achieves compact area utilization (around 540 NAND2-equivalent units) and low
    energy consumption (21.7 pJ/pulse) without requiring ADCs for information readout,
    making it ideal for system-on-chip integration of RC. This architecture paves
    the way for scalable, energy-efficient neuromorphic systems capable of performing
    real-time learning and inference with high configurability and digital interfacing.
  venue: Neuromorphic Computing and Engineering
- title: Cerebellum-Inspired Memtransistors Enable Emergent Differentiation for Hardware-Efficient
    Novelty Detection
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20672359
  category: edge-computing
  subcategory: method
  authors:
  - Mark C. Hersam
  - Vinod K. Sangwan
  - Amit Ranjan Trivedi
  abstract: Artificial intelligence (AI) algorithms are currently executed using silicon-based
    hardware, resulting in excessively high energy demand for data centers. Edge computing
    AI for healthcare, robotics, and autonomous vehicles presents even stricter constraints
    on power and latency, which are currently unmet by incumbent computing architectures.
    Efficient computation can be derived from the key properties of biological neurons,
    including memory-logic colocation, asynchronous parallelism, and spike-triggered
    computation. Here, we draw inspiration from the biological cerebellum to demonstrate
    an asymmetric-contact-gated MoS2 memtransistor that exhibits bias-polarity-dependent
    excitatory/inhibitory short-term plasticity. A memtransistor-based neural network
    realizes a changing interplay of excitatory/inhibitory responses, emulating the
    emergent synaptic differentiation of the cerebellum, enabling rapid identification
    of novel events. When applied to electrocardiogram data, arrhythmias are detected
    on the time scale of a single heartbeat with 10,000-fold fewer operations than
    existing silicon-based approaches. In this manner, cerebellum-inspired neuromorphic
    hardware provides a pathway to low-computation, high-speed novelty detection for
    edge intelligence.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'EcoAIoT: A Survey on Ecological and Sustainable AIoT Systems With Energy
    Harvesting'
  date: 2026-02
  url: https://doi.org/10.1109/jiot.2026.3668885
  category: edge-computing
  subcategory: method
  authors:
  - Zhimin Jing
  - Yasan Ding
  - Bin Guo
  abstract: The proliferation of Internet of Things (IoT) devices is enabling transformative
    applications across domains such as smart cities, healthcare, and environmental
    monitoring. However, the large-scale deployment of these devices also raises sustainability
    concerns. The integration of intelligence at the edge through the emergence of
    the Artificial Intelligence of Things (AIoT) amplifies computational requirements
    and energy consumption. This increase is especially pronounced in resource-constrained
    settings, consequently exacerbating their ecological impacts. To address these
    energy and environmental challenges, recent research has increasingly focused
    on energy harvesting (EH) techniques, energy-efficient sensing methods, and ultra-low-power
    computing architectures. This survey provides a comprehensive review of the current
    state of ecological and sustainable AIoT systems powered by energy harvesting.
    It systematically categorizes existing approaches based on energy sources, hardware-software
    co-optimization strategies, and communication protocols. In addition, it critically
    analyzes key challenges, particularly energy intermittency, system scalability,
    and the balance between performance and energy efficiency. This survey also highlights
    promising research directions, such as bio-inspired energy harvesting, neuromorphic
    computing, and integrated sensing-communication frameworks. By summarizing current
    advances and highlighting open research challenges, this survey aims to provide
    a structured roadmap for the development of next-generation sustainable AIoT systems.
  venue: IEEE Internet of Things Journal
- title: 'Vanguard CQNP™: A Paradigm Shift in Ultra-Efficient, Coherence-Enhanced
    Computation'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21413982
  category: edge-computing
  subcategory: method
  authors:
  - Howard James Maguire
  abstract: 'Title: Vanguard CQNP™: A Paradigm Shift in Ultra-Efficient, Coherence-Enhanced
    Computation Description: The Vanguard Carbon Quantum Neuromorphic Processor (CQNP)
    introduces a revolutionary architecture designed to bridge the gap between biological
    efficiency and advanced quantum processing. By uniquely integrating carbon nanotube
    (CNT) lattices, quantum dot superposition nodes, memristive synapses, and photonic
    interconnects, the CQNP establishes a new frontier in compute efficiency. Key
    Technological Advancements: Unprecedented Energy Efficiency: Designed to deliver
    100x to 1000x lower energy consumption for target workloads compared to traditional
    high-end CPUs and GPUs. Thermodynamic Innovation: Unlike traditional CMOS architectures
    that generate dense thermal hotspots (90–120 °C), the CQNP utilizes coherence-aware
    throttling, co-located memory/compute, and near-field optical interconnects to
    achieve an exceptionally low power density with projected hotspots under 40 °C.
    Hybrid Operating Regimes: The system is capable of operating in both a Classical
    Neuromorphic Mode (utilizing memristive synapses for integration and firing) and
    a Quantum-Enhanced Mode (leveraging superposition and entanglement), managed by
    a sophisticated coherence-aware control loop. Robust, Carbon-Based Foundation:
    The architecture relies on abundant and robust carbon-based materials, utilizing
    diamond encapsulation for vital isolation and coherence shielding. This biologically-inspired
    architecture is designed to accelerate complex applications, including AI inference
    at the ultra-low energy edge, optimization, drug discovery, molecular simulation,
    and real-time learning. Ultimately, the CQNP framework lays the groundwork for
    portable, exascale-class computing in the future. Intellectual Property & Disclosure
    Notice: This overview represents a high-level public disclosure of novel concepts
    and architectures to establish prior art. The detailed proprietary mechanisms—including
    the precise materials stack, quantum node detailing, and hierarchical scaling
    models—remain the intellectual property of the Vanguard System Architect. All
    rights are reserved, and no portion of this disclosure or its underlying technologies
    may be utilized for commercial exploitation without explicit written permission
    from the author.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Dual‐Mode Nanoporous SiO <sub>2</sub> Memristors with Coexisting Volatile
    and Nonvolatile Dynamics for Reservoir Computing
  date: 2026-06
  url: https://doi.org/10.1002/advs.76163
  category: edge-computing
  subcategory: theory
  authors:
  - Bohao Ding
  - Tongjun Zhang
  - Li Shao
  abstract: ABSTRACT Energy‐efficient and adaptive neuromorphic hardware requires
    material platforms that can intrinsically integrate transient neural dynamics
    with stable long‐term memory within a single device architecture. Here, a cross‐point
    nanoporous SiO 2 memristor that unifies volatile and nonvolatile switching behaviors
    within a single material platform is reported. The engineered nanoporous framework
    provides well‐defined ion migration pathways, enabling controlled modulation of
    conductive filaments and reversible transitions between short‐term plasticity
    (STP) and long‐term plasticity (LTP) through simple compliance‐current tuning.
    Leveraging this dual‐mode functionality, the volatile dynamics of the nanoporous
    SiO 2 memristors are employed directly as a physical reservoir, while the nonvolatile
    conductance states serve as synaptic weights in the readout layer. Using a conductance‐aware
    training scheme, reservoir computing (RC) is demonstrated on the same device platform,
    achieving 93.7% accuracy in MNIST handwritten‐digit recognition. Beyond standard
    benchmark datasets, the system further enables ECG temporal biosignal classification,
    reaching over 88% accuracy in distinguishing normal and abnormal heartbeat patterns.
    These results establish a single‐material, CMOS‐compatible neuromorphic platform
    capable of integrating dynamic processing with persistent memory, offering a scalable
    and low‐power pathway toward compact intelligent edge computing hardware.
  venue: Advanced Science
- title: 'Quantum-Enhanced Field-Effect Transistors: A Synergistic Approach for Next-Generation
    Computing'
  date: 2026-05
  url: https://doi.org/10.2174/9798898815790126010007
  category: edge-computing
  subcategory: theory
  authors:
  - Mohit Kumar Srivastava
  - Man Mohan Shukla
  - Preeti Agarwal Mittal
  abstract: The dynamic nature of computing technologies has put classical field-effect
    transistors (FETs) at the physical and performance frontier. As the semiconductor
    industry is unable to solve the problems of scaling, power consumption, and heat
    dissipation, quantum computing has the potential to reinvent the future of computation.
    This chapter relates to the concept of quantum computing and FETs and how these
    concepts can be synergistically integrated to propose a new type of device that
    is known as Quantum-Enhanced Field-Effect Transistors (QFETs). These are machines
    that exploit quantum-mechanical phenomena such as superposition, entanglement,
    and tunneling to overcome the drawbacks of classical FETs, delivering previously
    unknown performance, energy efficiency, and scalability. Quantum computing quinconal
    tenets and FETs are re-established, and special focus is given to quantum effects
    that can be exploited in nanoscale devices. Quantum tunneling, coherence, and
    spin-based phenomena have been placed under the most important mechanisms, which
    can be utilized to enhance the operation of the FETs. The chapter introduces novel
    QFET designs with the use of quantum dots, superconducting material, and topological
    insulators so as to be able to manipulate quantum states in the transistor platform.
    These designs are supported by mature simulation models, including quantum transport
    models and density functional theory (DFT) calculations, which provide details
    on the behavior of QFETs under various operating conditions. The performance of
    QFETs is evaluated through a full set of simulations to compare their performance
    with that of classical FETs. The results indicate that switching speed, on-to-off
    current ratio, and sub-threshold swing decrease significantly with QFETs, achieving
    maximum power gains of up to 50 percent. Quantum coherence increases charge-carrier
    mobility, and quantum tunneling enables effective current flow even at incredibly
    low voltages. These results are presented using new figures, tables, and graphs,
    which demonstrate the benefits of using QFETs in energy efficiency and scalability.
    Other fabrication issues related to QFETs, such as the need for high-accuracy
    control of quantum states and the incorporation of exotic materials like graphene
    and transition-metal dichalcogenides (TMDs), are also discussed in the chapter.
    Hightechnology lithography and cryogenic cooling are suggested as possible solutions
    to these problems, enabling the implementation of QFETs. Moreover, the scalability
    of QFETs is discussed, and simulations indicate that such devices can be effectively
    operated at sub-5 nm nodes, enabling their use in future generations of integrated
    circuits. Besides performance metrics, the chapter also discusses the possible
    uses of QFETs in quantum computing, neuromorphic computing, and low-power electronics.
    Quantum states manipulated by QFETs result in QFETs being the most promising qubit
    devices in quantum processors, and their power efficiency is comparable to edge
    computing and Internet of Things (IoT) devices. It also includes integrating QFETs
    into current CMOS technology, enabling more hybrid quantum-classical computers.
    Although the results are promising, there are still several challenges to address.
    Future research on quantum coherence at room temperature, the reduction of decoherence
    effects, and reliable fabrication processes are vital areas of study. This chapter
    also ends with a roadmap of the development of QFETs, in which interdisciplinary
    teamwork between quantum physicists, material scientists, and semiconductor engineers
    is important. This chapter adds to the mass of literature on quantum-enhanced
    devices as it presents an in-depth discussion of QFETs that are backed by new
    simulations and experimental evidence, and highlights theoretical understandings.
    The results highlight the potential of QFETs to revolutionize FET technologies
    and introduce a new generation of computing technologies by leveraging the drawbacks
    of classical technologies. This study will lay the foundation for a new era of
    electronics innovation by bridging the gap between quantum computing and semiconductor
    devices. The combination of quantum computing theory and FETs represents a huge
    leap towards the goal of more efficient, scalable, and powerful computing equipment,
    and this paper should encourage further research and innovation in this promising
    area.
