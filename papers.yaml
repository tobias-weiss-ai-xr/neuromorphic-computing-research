- title: Memristive nano-neuromorphic spiking neural network with self-adaptive continual
    and predictive learning for edge gesture recognition
  date: 2026-06
  url: https://doi.org/10.1038/s41598-026-52643-z
  category: edge-computing
  subcategory: theory
  authors:
  - Raju Vidap
  - Ranjith Kumar Nadialli
  - VINOD KUMAR TERIVEEDHI
  abstract: Gesture recognition refers to a surface electromyography based method
    of gesture recognition becoming an essential element of edge computing systems
    to aid human-machine interface, wearable interfaces, and assistive technology
    systems. The latest advancements in deep learning have shown encouraging accuracy
    and are still constrained by frame-based processing, offline learning, excessive
    energy usage, and the incapacity to adjust to the constantly changing patterns
    of gestures. These limitations limit the use in edge devices with limited resources.
    To address them, SCaP-SNN (Self-adaptive Continuous and Predictive Spiking Neural
    Network) is presented as a memristive nano-neuromorphic model of adaptive and
    power efficient gesture recognition in the edge. Self-adaptive learning is described
    as dynamically modulating synaptic updates according to the variance of the signal,
    continual learning is used to retain previous knowledge about gestures while receiving
    incremental updates, and predictive learning can predict future gestures for a
    short period of time based on temporal spike dependence. The main innovation of
    this study is the design of a unified memristive spiking neural network incorporating
    self-adaptive learning, continual learning, and predictive intelligence for efficient
    gesture recognition at the edge of the network. The presented approach combines
    the spiking neural networks with memristive synapses modeling in order to support
    event-based computation, self-adaptive plasticity, lifelong learning without disastrous
    forgetting, and predictive inference. The online synaptic adaptation and consolidation
    processes allow to stabilize learning of new gestures without loss of the earlier
    learnt information The experimental results show a classification accuracy of
    96.8%, F1-score of 0.965, low forgetting rate of 2.1% and a prediction accuracy
    of 91.4%. Power consumption analysis shows that the mean power consumption is
    28 microjoules per inference, which is suitable in being used in low-power edges.
  venue: Scientific Reports
- title: Ferroelectric Gate-All-AroundTransistors for 3D-IntegratedElectronics and
    Neuromorphic Vision
  date: 2026-06
  url: https://figshare.com/articles/journal_contribution/Ferroelectric_Gate-All-Around_Transistors_for_3D-Integrated_Electronics_and_Neuromorphic_Vision/32625470
  category: edge-computing
  subcategory: theory
  authors:
  - Wenjie Chen (130753)
  - Dan Tang (474844)
  - Chengming Luo
  abstract: Edge computing demands electronics that simultaneously deliver high performance,
    ultralow power consumption, and dense integration, yet still remains challenging
    in growing development of artificial intelligence and Internet of Things. Here,
    we propose an all-two-dimensional low-power and compact transistor with a ferroelectric
    gate-all-around (Fe-GAA) architecture for energy-efficient 3D-integrated electronics
    and neuromorphic edge computing. The Fe-GAA field-effect transistors break the
    Boltzmann limit of traditional CMOS devices, achieving sub-60 mV dec<sup>–1</sup>
    switching (down to 25.3 mV dec<sup>–1</sup>), a high on/off ratio (10<sup>8</sup>),
    and field-effect mobility (310 cm<sup>2</sup> V<sup>–1</sup> s<sup>–1</sup>).
    Capitalizing on ferroelectric polarization dynamics in the surrounding CuInP<sub>2</sub>S<sub>6</sub>
    gate, we further demonstrate its application prospects as compact edge computing
    devices for binary logic operations and spiking neurons on a unified hardware
    platform. Monolithic 3D-integrated logic circuits (inverter and NOR gate) reduce
    footprint by 50% versus planar CMOS, and the artificial neuron emulates leaky
    integrate-and-fire (LIF) behavior without additional capacitors and external reset
    circuitry in a conventional neuron, significantly reducing the energy consumption
    and hardware footprint. Implemented in a spiking neural network (SNN) for gesture
    recognition, this system attains 92.71% accuracy on the DVS128Gesture data set.
    This work establishes a paradigm for multifunctional edge intelligence processors
    that transcend traditional power-area trade-offs.
  venue: Figshare
- title: In-Sensor Vision Convolution Based on Self-Powered Optoelectronic Memristors
    for Energy-Efficient Binarized Spiking Neural Networks
  date: 2026-03
  url: https://doi.org/10.1021/acsmaterialslett.5c01557
  category: edge-computing
  subcategory: method
  authors:
  - Jiahao Gu
  - Bangzhi Shen
  - Jiandong Yan
  abstract: Neuromorphic vision systems seek compact, energy-efficient hardware that
    integrates sensing, preprocessing, and inference for robust perception in dynamic
    environments. Inspired by the biological retina, we present self-powered optoelectronic
    memristors based on an Ag/Sb 2 Se 3 /FTO architecture that integrates optical
    detection, analog preprocessing, and synaptic weight storage in a single device.
    The memristor exhibits stable bipolar switching, long retention, endurance over
    500 cycles, and self-powered state-programmable photoresponse, enabling in-sensor
    convolution without electrical multiply accumulate (MAC) energy. We further incorporate
    experimental in-sensor convolution into a binarized spiking neural network (BSNN),
    thereby achieving 98.09% accuracy, compared to 98.42% for the software-based BSNN,
    while reducing the total network energy to 1.4 μJ, which corresponds to a 97.10%
    reduction versus a full-precision convolutional neural network (CNN). This work
    presents a self-powered, physics-aware framework integrating material-level signal
    transduction with low-power neuromorphic computing, enabling scalable, noise-resilient
    edge AI vision.
  venue: ACS Materials Letters
- title: Ultra-Low-Power ECG Classification Using 2D CNN-based SNN on Neuromorphic
    Hardware for Wearable Devices
  date: 2026-05
  url: https://doi.org/10.1109/icc59461.2026.11587327
  category: edge-computing
  subcategory: theory
  authors:
  - Fatma Hassan
  - Omar Emadeldeen A.
  - Youssef Amr
  abstract: Real-time Electrocardiogram (ECG) classification on wearable devices is
    critical for cardiac monitoring but limited by power and bandwidth constraints.
    We present the first deployable ECG arrhythmia classification on commercially
    available neuromorphic Akida AKD1000 hardware, converting a 2D convolutional neural
    network (CNN) into a 4-bit spiking neural network (SNN). This enables the transmission
    of only 3-bit semantic alerts over the air, with a decoding rate exceeding 99%
    in a simulated Rayleigh fading channel. Evaluated on the MITBIH Arrhythmia, our
    quantization-aware-trained model attains 99.02% accuracy across five heartbeat
    classes while consuming 2.04 μJ per inference and 1.66 ms latency at 100 MHz.
    Compared to streaming raw ECG, the proposed system reduces wireless payload by
    >99%. These results underline the feasibility of battery-powered, always-on cardiac
    monitoring for 5G/6G telehealth and the potential of neuromorphic computing to
    enable energy-efficient, accurate, real-time ECG analysis directly on edge devices,
    paving the way for advanced wearable health monitoring systems and applications
    in remote healthcare leveraging semantic communication principles.
