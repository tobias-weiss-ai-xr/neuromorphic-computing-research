- title: Scalable algorithms for neuromorphic in-memory computing with N-ary spintronic
    crossbar arrays
  date: 2026-05
  url: https://doi.org/10.1117/12.3107468
  category: edge-computing
  subcategory: method
  authors:
  - Anatole Moureaux
  - Anthony Lopes
  - Lindiomar Borges de Avila
  abstract: We introduce a scalable computational framework that enables efficient
    neuromorphic in-memory processing using n-ary spintronic crossbar arrays. By developing
    novel algorithms tailored to multi-level spintronic memory cells, we achieve accurate
    Multiply-and-Accumulate (MAC) operations directly within the memory plane, eliminating
    the data-movement bottlenecks that limit conventional architectures. Our approach
    provides a unified method for simulating crossbars of arbitrary size while capturing
    critical non-idealities, including cell-to-cell variability and electrical noise.
    The proposed n-ary computing scheme significantly enhances computational density,
    energy efficiency, and numerical precision compared to binary crossbars. We demonstrate
    its capability to support machine-learning workloads such as matrix-vector multiplications
    for vision and language models, with notable performance gains relevant for low-power
    edge AI. The resulting in-memory processing paradigm offers reduced latency and
    energy consumption, making it highly suitable for neuromorphic systems targeting
    autonomous, embedded, and IoT environments. This talk will present the algorithmic
    developments, large-scale simulation benchmarks, and perspectives for integrating
    n-ary spintronic crossbars into next-generation neuromorphic hardware.
