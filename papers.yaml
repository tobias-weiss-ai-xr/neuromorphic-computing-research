- title: A Hardware Exploration of Time-to-First-Spike Encoding for Spiking Neural
    Networks
  date: 2026-04
  url: https://doi.org/10.1109/dcas69364.2026.11544567
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Victor Abaleke
  - Garrett S. Rose
  abstract: Spiking Neural Networks (SNNs) offer an energy-efficient, event-driven
    computing paradigm inspired by biological neural systems, where system performance
    is strongly influenced by the neural encoding scheme. While rate encoding relies
    on high spike counts, Time-to-First-Spike (TTFS) encoding exploits precise spike
    timing to achieve sparse, low-latency computation, with stronger inputs producing
    earlier spikes. This work presents a compact mixed-signal TTFS encoder and its
    integration with leaky integrate-and-fire (LIF) neurons and sparse synaptic circuits,
    implemented in$65-\text{nm}$CMOS technology. The proposed encoder converts input
    current into spike latency using a membrane capacitor, an NMOS source follower,
    and a Schmitt trigger for robust threshold detection, followed by inverter-based
    spike generation and clock-controlled reset. Simulation results confirm a monotonic
    inverse relationship between input current and spike latency, validating correct
    TTFS operation. The proposed architecture provides a low-power and low-latency
    hardware front-end suitable for scalable neuromorphic and reservoir computing
    systems.
  venue: ''
- title: Research on Self-Reflective Spiking Neural Networks via Internal Spike Replay
    Mechanisms
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309789
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: Spiking Neural Networks (SNNs) have emerged as a promising paradigm for
    energy-efficient neuromorphic computing due to their sparse, asynchronous, and
    event-driven nature. However, conventional feedforward SNNs operate as open-loop
    systems during inference, making them highly vulnerable to input noise, adversarial
    perturbations, and out-of-distribution data. Once an early spike timing error
    occurs, it propagates downstream and leads to irreversible misclassifications.
    Inspired by the metacognitive and memory replay functions of the human brain,
    this paper proposes a novel network architecture termed the Self-Reflective Spiking
    Neural Network (SR-SNN). The core idea of SR-SNN is to introduce a closed-loop
    "self-examination and correction" phase immediately following the initial feedforward
    inference. During the inference process, local spike trajectories across all layers
    are temporarily stored in a dedicated spike buffer. If the self-reflective evaluation
    module detects that the output distribution exhibits high information entropy
    (indicating a low-confidence decision), it autonomously triggers the generation
    of "internal spike replay" sequences. These generated spikes are projected backward
    into intermediate layers via reverse synaptic weights, functioning as internal
    feedback cues. By deriving a modified Leaky Integrate-and-Fire (LIF) dynamic equation
    that couples the historical spike buffer with the reverse feedback current, we
    show that the network can nonlinearly suppress erroneous cascade firing and amplify
    dormant target signals through resonance. This process achieves unsupervised error
    self-correction purely at the level of membrane potential dynamics without requiring
    external label calibration or online synaptic weight updates. Analytical evaluations
    demonstrate that the SR-SNN provides an elastic, demand-driven computational paradigm
    that substantially improves network robustness and adaptability in resource-constrained
    edge-computing environments.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Neuromorphic Computing: Spiking Neural Networks For Edge AI'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18977648
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Mini T. V
  abstract: Neuromorphic computing represents a paradigm shift in artificial intelligence
    by mimicking biological neural networks through spiking neural networks (SNNs).
    This paper explores neuromorphic computing architectures for energy-efficient
    AI inference at the edge. We analyze key neuromorphic hardware platforms including
    Intel Loihi 2, IBM TrueNorth, and BrainScaleS, examining their architectural innovations,
    spike-timing-dependent plasticity (STDP) learning mechanisms, and event-driven
    computation models. Performance evaluations demonstrate that SNNs achieve 100-1000×
    energy efficiency improvements compared to conventional deep neural networks for
    edge inference tasks. We present implementation strategies for deploying SNNs
    on resource-constrained edge devices, addressing challenges in spike encoding,
    temporal dynamics, and neuromorphic algorithm design. Our analysis reveals that
    neuromorphic computing offers a compelling solution for ultra-low-power AI applications
    in IoT, robotics, and embedded systems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Spiking Neural Networks: A Computational Paradigm for Neuromorphic Computing'
  date: 2026-07
  url: https://doi.org/10.1142/s0218488526500273
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Mesala Sravani
  - Kokkuaruna Kumari
  - S. S. Mohan Reddy
  abstract: The third generation of neural networks is called Spiking Neural Networks
    (SNNs) and presents an energy-efficient and physiologically realistic alternative
    to the traditional Artificial Neural Networks (ANNs). This review discusses the
    latest advances in SNN models, learning algorithms, and their implementation on
    neuromorphic hardware. Besides reinforcement learning techniques such as REINFORCE,
    supervised techniques, such as SpikeProp and unsupervised Spike-Timing-Dependent
    Plasticity (STDP), are considered in the context of reward-based learning. The
    performance of the neurological systems technologies, including the IBM TrueNorth,
    the FPGA-based, and the Intel Loihi, is checked. Despite significant improvement
    in parallel processing and energy usage in these systems, there are still problems
    with accuracy of the synapses, training complexity, and scalability. FPGA-based
    systems are promising in real-time processing, though they have programmability
    issues that limit their deployment. The article outlines the key limitation of
    SNN models, namely their inability to handle large datasets and difficult learning
    tasks. To advance the performance of neuromorphic systems, research is underway
    on hybrid SNN-ANN models and memristor-based synaptic storage. This review is
    aimed at proving that SNNs have potential in such areas as computer vision, robotics,
    and speech recognition, and their role in overcoming the barrier between artificial
    and biological neural systems.
  venue: International Journal of Uncertainty Fuzziness and Knowledge-Based Systems
- title: 'DelRec: learning delays in recurrent spiking neural networks'
  date: 2026-04
  url: https://arxiv.org/abs/2509.24852
  category: spiking-neural-networks
