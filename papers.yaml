- title: Wide‐Bandgap Semiconductor‐Based Neuromorphic Computing
  date: 2026-05
  url: https://doi.org/10.1002/ifm2.70020
  category: survey
  subcategory: application
  authors:
  - Hongyu Tang
  - Pengsheng Min
  - Yang Zhang
  abstract: ABSTRACT Neuromorphic computing has emerged as a promising paradigm to
    overcome the energy inefficiency and data‐transfer bottlenecks of conventional
    von Neumann architectures by emulating the parallel and adaptive information processing
    of biological neural systems. To date, most neuromorphic hardware has relied on
    silicon‐compatible or narrow‐bandgap materials, which often face intrinsic trade‐offs
    among operating voltage, thermal stability, endurance, and multifunctionality.
    Wide‐bandgap semiconductors (WBGSs)—including Group III nitrides, gallium oxide,
    silicon carbide, and diamond—provide an alternative material platform enabled
    by their large bandgaps, strong polarization effects, diverse defect states, and
    compatibility with electronic and optoelectronic device architectures. This review
    surveys recent progress in WBGS‐based neuromorphic computing, with an emphasis
    on material‐enabled device physics rather than isolated demonstrations. Typical
    device concepts, including memristors, synaptic transistors, and neuronal devices,
    are systematically discussed together with their underlying resistive switching,
    charge trapping, polarization modulation, and optoelectronic mechanisms. Strategies
    for device integration and performance benchmarking are also addressed. Finally,
    remaining challenges and future research directions toward scalable and energy‐efficient
    neuromorphic systems based on WBGSs are outlined.
  venue: Information & Functional Materials
- title: 'The profound influence of temperature on phase change memory: Challenges
    and research breakthroughs'
  date: 2026-04
  url: https://doi.org/10.1016/j.nxener.2026.100614
  category: survey
  subcategory: theory
  authors:
  - Vikas Bhatnagar
  - Adesh Kumar
  abstract: Phase-change memory (PCM) is a promising nonvolatile memory technology
    that stores information through reversible, thermally driven phase transitions
    in chalcogenide materials, particularly Ge 2 Sb 2 Te 5 (GST225). The significant
    resistance contrast between the crystalline and amorphous states enables data
    storage, while SET (crystallization) and RESET (amorphization) operations rely
    on localized Joule heating. As a result, temperature critically influences data
    retention, switching speed, programming energy, and long-term device reliability.
    This review analyses the multifaceted impact of temperature on PCM across material,
    device, and array scales. It highlights key thermal challenges, including high
    RESET power, thermal crosstalk, resistance drift, and endurance degradation thatintensify
    as device dimensions continue to scale down. PCM behavior is shown to depend strongly
    on phase-change kinetics, device geometry, thermal boundary resistance, and the
    thermal history of programming cycles. Recent innovations in material engineering,
    such as dopant-stabilized chalcogenide alloys and superlattice-like structures,
    are discussed for their potential to improve thermal stability and reduce switching
    energy. Additionally, architectural strategies, including confined-cell design
    and interface engineering, are evaluated for their ability to enhance thermal
    confinement. Algorithmic and circuit-level compensation techniques addressing
    temperature-induced variability are also surveyed. The novelty of this review
    lies in its integrated perspective , c ombining materials, device physics, circuit
    strategies, and emerging computing paradigms to present a unified understanding
    of temperature-driven behavior in PCM. The work further examines temperature-related
    implications for advanced applications, including in-memory and neuromorphic computing.
    Overall, it outlines key pathways toward thermally robust, energy-efficient PCM
    technologies.
  venue: Next Energy
- title: 'Beyond biomimicry: a review of next-generation flexible tactile sensing
    from viscoelastic material design to neuromorphic computing'
  date: 2026-06
  url: https://doi.org/10.1088/1361-665x/ae8226
  category: survey
  subcategory: theory
  authors:
  - Jun Li
  - yongcheng ji
  - Lipan Xin
  abstract: Abstract Flexible tactile sensors have emerged as vital transduction interfaces
    for human–machine symbiosis and soft robotics. Despite significant advances, two
    persistent bottlenecks have hindered their practical viability. At the material
    level, the intrinsic viscoelasticity of polymeric matrices enforces stringent
    trade-offs among pressure sensitivity, output linearity, and loading–unloading
    hysteresis. At the system level, the conventional spatial separation of sensory
    acquisition from signal processing incurs considerable bandwidth and energy overheads
    when handling high-dimensional, unstructured analog data. To address these limitations,
    this review proposes a vertically integrated co-design framework that systematically
    couples material engineering, device architecture, and neuromorphic algorithm
    design. At the material-device level, we survey structural strategies, including
    dynamic network construction, rigid-phase anchoring, and topological interlocking,
    aimed at suppressing microscale viscoelastic relaxation and preventing interfacial
    delamination at mechanically heterogeneous junctions. Complementarily, alternating
    current excitation protocols have been evaluated to mitigate the electrochemical
    degradation intrinsic to iontronic architectures. We argue that the concurrent
    resolution of these mechanical and electrochemical instabilities provides the
    drift-free analog baseline essential for downstream neuromorphic computation,
    a cross-domain connection that has received limited systematic attention in the
    existing literature. Building on this stabilized platform, we further elucidate
    how intrinsic material dynamics, notably ferroelectric polarization switching
    and ion migration, can serve as native computational primitives, effectively linking
    material engineering and algorithm-design layers within the proposed framework.
    The coupling of these material-embedded dynamics with spiking neural networks
    enables in situ temporal encoding, whereby continuous mechanical stimuli are transduced
    into sparse event-driven spike trains, circumventing the von Neumann bottleneck.
    This co-design perspective offers a pathway for flexible tactile systems to evolve
    beyond passive structural biomimicry toward autonomous cognitive interfaces with
    real-time edge-localized adaptability.
  venue: Smart Materials and Structures
- title: Battery‐Inspired Electrochemical Synapses for Neuromorphic Applications
  date: 2026-08
  url: https://doi.org/10.1002/advs.77065
  category: survey
  subcategory: theory
  authors:
  - Won‐Woo Lee
  - SeongCheol Jang
  - Wangmyung Choi
  abstract: Artificial synapses capable of analog memory and adaptive learning are
    key components for neuromorphic computing systems. To emulate biological synaptic
    functions effectively, artificial devices must exhibit gradual conductance modulation,
    linear responses to pulse stimuli, diverse forms of synaptic plasticity, and low-power
    operation. Ion-mediated electrochemical devices have recently emerged as promising
    candidates for such functionalities because ionic redistribution can continuously
    modify the internal electrochemical state of materials and naturally produce history-dependent
    conductance changes. This review discusses recent advances in battery-ion-inspired
    synaptic devices that exploit electrochemical processes to implement artificial
    synaptic behavior. We first outline the fundamental electrochemical mechanisms
    underlying ion-mediated state modulation, including ion insertion/accumulation,
    intercalation, migration, and diffusion. We then survey the materials landscape
    for battery-inspired synaptic devices, covering electrolytes and active channel
    materials such as transition metal oxides, two-dimensional materials, and organic
    mixed ionic-electronic conductors. Emerging applications in neuromorphic computing
    and neuromorphic biosensing are revisited, where ionic dynamics enable the integration
    of sensing, memory, and computation. Key challenges related to device reliability,
    scalability, and environmental stability are discussed, together with future perspectives
    for advancing battery-ion-based neuromorphic technologies.
  venue: Advanced Science
- title: 'Neuromorphic Object Detection: An In-Depth Study and Future Directions'
  date: 2026-07
  url: https://arxiv.org/abs/2607.23576
  category: survey
  subcategory: method
  authors:
  - Jianing Li
  - Dianze Li
  - Arren Glover
  abstract: Conventional frame-based cameras face significant challenges in detecting
    objects under high-speed motion blur or in low-light environments. Neuromorphic
    cameras provide asynchronous visual streams with high temporal resolution and
    a wide dynamic range, offering a promising solution for object detection under
    challenging conditions. Despite the development of numerous models and the emergence
    of various applications in neuromorphic object detection, there is still a lack
    of deep understanding and standardized benchmarks to assess progress and address
    key challenges. In this paper, we provide a comprehensive survey and benchmark
    of existing neuromorphic object detection algorithms. Specifically, we first present
    a problem description, review the available datasets, and revisit the evaluation
    metrics. We then explore existing neuromorphic object detection approaches from
    various perspectives, including event representation, temporal modeling, multimodal
    fusion, asynchronous processing, low-latency processing, and energy-efficient
    computing. Furthermore, we evaluate a wide range of representative neuromorphic
    object detection models and offer detailed analyses of the comparative results.
    Finally, we discuss unresolved issues in neuromorphic object detection and propose
    potential future research directions. We hope this survey and benchmark will be
    a valuable resource for researchers and provide guidance for future advancements
    in neuromorphic object detection.
  venue: arXiv (Cornell University)
- title: Chemically produced two-dimensional conducting interfaces for memory and
    neuromorphic applications
  date: 2026-05
  url: https://doi.org/10.1063/5.0297839
  category: survey
  subcategory: theory
  authors:
  - Seungju Yoon
  - Hyun Jae Lee
  - Taehwan Moon
  abstract: Two-dimensional electron gases (2DEGs) at epitaxial oxide interfaces,
    such as LaAlO3/SrTiO3 heterostructures, have long served as model platforms for
    exploring emergent interfacial phenomena, including superconductivity, magnetism,
    and tunable metal–insulator transitions. While such systems were initially investigated
    primarily within the context of condensed matter physics, their relevance is being
    redefined by recent advances in non-epitaxial oxide 2DEGs, which offer new opportunities
    for practical applications. In contrast to polarity-driven epitaxial interfaces,
    non-epitaxial oxide 2DEGs are often governed by chemically driven carrier generation
    mechanisms, most notably oxygen vacancy (VO) formation induced by interfacial
    redox reactions. These mechanisms enable systematic tuning of interfacial electronic
    properties using amorphous or polycrystalline oxides and industry-compatible processes.
    This review provides a unified perspective linking the fundamental formation mechanisms
    of oxide 2DEG to their emerging applications. We first survey the principal physical
    origins of oxide 2DEGs, followed by an in-depth discussion of VO generation pathways
    in non-epitaxial oxide systems, including ionic bombardment, metal-induced redox
    reactions, and surface chemical effects. Building on this mechanistic foundation,
    we connect interfacial chemistry to application-level performance metrics, with
    particular emphasis on memory and neuromorphic technologies motivated by rapidly
    expanding computational demands in the AI era. In memory architectures, oxide
    2DEGs are evaluated as enablers of both selector devices and storage elements,
    while in neuromorphic hardware, sensor platforms exploiting 2DEG transport are
    highlighted for their capability to emulate biological sensory functions and dynamics.
    Key challenges for practical deployment of oxide 2DEGs, including compatibility
    with three-dimensional integration, thermal stability during processing, and limitations
    in material selection, are critically examined. Potential strategies for overcoming
    these constraints, such as interfacial chemistry control, defect engineering,
    and process–structure–property correlations, are discussed. By bridging the fundamental
    physics and chemistry of oxide 2DEGs with emerging device-level applications,
    this review underscores their potential as a cornerstone material platform for
    next-generation, energy-efficient computing architectures.
  venue: Chemical Physics Reviews
- title: 'Conductance Modulation Mechanisms in Gallium Oxide‐Based Neuromorphic Devices:
    From Device Physics to Intelligent Applications'
  date: 2026-07
  url: https://doi.org/10.1002/admt.71146
  category: survey
  subcategory: application
  authors:
  - Huichen Fan
  - Haonan Wang
  - Yuehua Chen
  abstract: ABSTRACT This review systematically surveys the recent progress in gallium
    oxide (Ga 2 O 3 )‐based neuromorphic devices. As an ultrawide‐bandgap semiconductor,
    Ga 2 O 3 offers controllable doping, an exceptionally high breakdown electric
    field, multiple polymorphs, and excellent thermal stability. These intrinsic properties
    make Ga 2 O 3 particularly suitable for neuromorphic devices operating under high‐temperature,
    strong‐radiation, and solar‐blind deep‐ultraviolet (DUV) conditions. Beyond environmental
    stability, Ga 2 O 3 can also support diverse conductance‐modulation mechanisms,
    including defect‐mediated carrier trapping, interface‐barrier engineering, conductive‐filament
    evolution, multimodal coupling, and gate‐controlled channel modulation, thereby
    providing a versatile material platform for programmable synaptic devices driven
    by optical, electrical, or coupled external stimuli. Starting from the conductance‐modulation
    mechanisms underlying synaptic functions, we classify Ga 2 O 3 neuromorphic devices
    and systematically summarize their physical mechanisms, structural designs, and
    conductance‐tuning schemes, highlighting the potential of Ga 2 O 3 for neuromorphic
    computing, low‐power operation, and spectrally selective sensing, as well as its
    broad prospects in fundamental computing and information security, bio‐adaptive
    reflex mechanisms, and computer vision. Finally, we summarize the progress and
    remaining challenges of Ga 2 O 3 neuromorphic devices, and outline future research
    directions including materials doping, heterostructure integration, multimodal
    fusion, high‐density arrays, and energy‐efficiency optimization to fully exploit
    Ga 2 O 3 for brain‐inspired computing and intelligent perception.
  venue: Advanced Materials Technologies
- title: 'Intelligent Predictive Architectures for Autonomous Self-Healing in Cloud
    Computing: A Comprehensive Survey'
  date: 2026-05
  url: https://www.ijert.org/intelligent-predictive-architectures-for-autonomous-self-healing-in-cloud-computing-a-comprehensive-survey
  category: survey
  subcategory: method
  authors:
  - Mr.  Nitesh Gupta
  - Dr.  Nandita Bangera
  abstract: Neural network-enabled self-healing is becoming a very exciting approach
    to making cloud computing infrastructures more reliable, available, and efficient.
    This survey paper gives a detailed review of neural network-based predictive models
    and how they are combined with autonomous recovery mechanisms for self-healing
    cloud systems. It first delineates the main neural architectures used for cloud
    reliability, such as Artificial Neural Networks (ANNs), Convolutional Neural Networks
    (CNNs), Recurrent Neural Networks (RNNs), Long Short-Term Memory (LSTM) networks,
    and hybrid or ensemble models, explaining their roles in failure prediction, resource
    management forecasting, and SLA/QoS violation prediction. The paper examines the
    coupling of these predictive models with self-healing action and decision layers
    like rule-based policies, policy engines, and reinforcement learning-driven controllers
    to proactively trigger recovery actions, reduce Mean Time To Recovery (MTTR),
    and control false alarms and resource overhead. Evaluation practices highlight
    datasets (Google Cluster Traces, Alibaba traces, and synthetic simulation data),
    performance metrics (prediction accuracy, MTTR, false positive/negative rates,
    scalability, and energy cost), and differences between simulated vs. real production
    cloud environments. Moreover, the survey discusses privacy and security issues
    of predictive and action models, presenting techniques such as federated learning,
    differential privacy, homomorphic encryption, and secure multi-party computation
    for privacy-preserving cross-tenant collaboration. Lastly, this paper draws attention
    to open issues including trade-offs between accuracy and false alarms, latency
    constraints, explainability, and scalability, proposing future work including
    explainable predictive pipelines, federated self-healing frameworks, multi-agent
    and DRL-based autonomy, and integration with emerging technologies such as quantum-inspired
    neural networks, edge-cloud continuum architectures, digital twins, service meshes,
    and neuromorphic hardware to enable more trustworthy, efficient, and autonomous
    self-healing cloud management.
  venue: Open MIND
- title: Machines and Exascale computing
  date: 2026-06
  url: https://doi.org/10.22323/1.518.0017
  category: survey
  subcategory: method
  authors:
  - Stefan Krieg
  - Eric B. Gregory
  - Giovanni Pederiva
  abstract: 'We review the current landscape of high-performance computing hardware
    relevant to lattice QCD simulations, placing it in the context of more than four
    decades of co-development between the LQCD community and the HPC industry. After
    a brief historical survey from the quenched era through the algorithmic revolution
    that enabled dynamical simulations, we describe the pre-exascale and exascale
    systems now available to the community, with particular attention to LQCD performance
    results on representative machines. We then discuss JUPITER, the first exascale
    system in Europe, currently being deployed at the Jülich Supercomputing Centre.
    Looking to the future, we analyse the key hardware trends shaping the next generation
    of HPC: the dominance of AI workloads and its impact on vendor roadmaps, the push
    towards mixed- and low-precision arithmetic, the rapidly increasing energy cost
    of advanced semiconductor fabrication nodes, and the challenges this poses for
    scientific HPC users. We close with an overview of exotic and emerging hardware
    technologies, including RISC-V, stencil accelerators, neuromorphic computing,
    analog photonic computing, FPGAs, and quantum computing devices.'
  venue: ''
- title: 'Recent Trends and Developments in Cloud Computing: A Comprehensive Survey
    on Edge-Cloud Continuum, Serverless Paradigms, and AI-Integrated Architectures'
  date: 2026-04
  url: https://doi.org/10.71097/ijsat.v17.i2.10889
  category: survey
  subcategory: method
  authors:
  - DIPAK BHAVSAGAR
  abstract: 'Cloud computing has undergone profound transformation since its inception,
    evolving from centralized data center paradigms to a distributed computing continuum
    spanning edge, fog, and core cloud resources. This survey presents a systematic
    review of the most salient developments in cloud computing from 2018 to 2024,
    encompassing 162 peer-reviewed publications across five principal research frontiers:
    the edge-cloud continuum, serverless and Function-as-a-Service (FaaS) architectures,
    container orchestration via Kubernetes, AI/ML-integrated cloud paradigms, and
    multi-cloud hybrid deployment strategies. We propose a novel five-dimensional
    taxonomy termed the Adaptive Edge-Cloud Orchestration Framework (AECOF), classifying
    contemporary cloud deployments across the axes of resource locality, workload
    elasticity, data sovereignty, latency sensitivity, and AI-readiness. Quantitative
    findings reveal that AI-driven orchestration reduces resource provisioning overhead
    by 34–47% compared to rule-based schedulers, while hybrid serverless-container
    deployments demonstrate 28% superior cost efficiency for bursty workloads. A comparative
    evaluation of twelve leading serverless platforms, six container orchestration
    systems, and five multi-cloud management frameworks is presented. We further identify
    twelve open research challenges including cold-start latency mitigation, quantum-resilient
    cloud orchestration, neuromorphic edge computing, autonomous self-healing microservices,
    and carbon-aware workload placement. The proposed AECOF taxonomy provides researchers
    and industry practitioners with a unified evaluative lens for designing and deploying
    next-generation cloud solutions.'
  venue: International Journal on Science and Technology
- title: 'A Technical Perspective on the MemristorEmulators: A Literature Survey'
  date: 2026-05
  url: https://doi.org/10.47992/ijmts.v11i1.26.31
  category: survey
  subcategory: theory
  authors:
  - G N Poornima
  - J R Naveen Kumar
  abstract: 'Aim: The aim of this paper is to provide a technical survey of memristor
    emulators, including theoretical background, modeling, circuit implementations,
    high frequency, and future applications in neuromorphic systems, chaos, secure
    communication, in-memory computing, as well as edge AI. Method: The research adheres
    to a systematic approach to literature review; it identifies the publications
    by the following categories: (i) memristor theory, (ii) SPICE and physics-based
    models, (iii) CMOS and OTA-based emulator circuits, (iv) high-frequency and low-power
    designs, and (v) application-oriented architectures. Findings: Memristor emulator
    studies have developed into nonlinear drift SPICE models, window-function improvements,
    threshold models, and generalized memristive systems. Implementations on circuits
    have been made with grounded and floating MOS-based designs, flux-controlled realizations,
    MOS-only compact designs, high-frequency CMOS designs as well as scalable arrays.
    It has been used in chaotic circuits, neuromorphic learning, biomedical systems,
    Internet of Things, and in-memory computing. ImplicationsNovel Contribution: The
    survey offers a technical view of the unified perspective between the device level
    modeling, the circuit level emulation and the system level applications. It establishes
    research gaps in strength, variability, PVT resilience and big-scale integration.'
