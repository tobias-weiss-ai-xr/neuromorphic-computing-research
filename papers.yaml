- title: 'E-ReCON: An Energy- and Resource-Efficient Precision-Configurable Sparse
    nvCIM Macro for Conventional and Spiking Neural Edge Inference'
  date: 2026-05
  url: https://arxiv.org/abs/2605.20717
  category: edge-computing
  subcategory: method
  authors:
  - Ankit Kumar Tenwar
  - Mukul Lokhande
  - Santosh Kumar Vishvakarma
  abstract: This work presents E-ReCON, a 16 Kb energy and resource-efficient digital
    compute-in-memory (DCIM) macro based on a compact 3T1R ReRAM bitcell for edge-AI
    inference. The proposed bitcell occupies only 0.85 um^2 and supports reliable
    AND-based in-memory multiplication for both conventional convolutional neural
    network (CNN) and spiking neural network (SNN) workloads. To reduce accumulation
    overhead, a novel interleaved 10T/28T adder tree is introduced, reducing transistor
    count and power consumption by 37% and 28%, respectively, compared to a conventional
    28T RCA-based design. Implemented in 65 nm CMOS at 1.2 V, the proposed macro achieves
    a minimum latency of 0.48 ns, throughput of 2.31-3.1 TOPS, and energy efficiency
    of up to 419 TOPS/W. When evaluated on LeNet-5, AlexNet, and CNN-8 models, the
    macro achieves 97.81%, 93.23%, and 96.51% accuracy on MNIST/A-Z, CIFAR10, and
    SVHN datasets, respectively. In addition, 40% pruning preserves nearly 99.8% of
    the original accuracy while reducing MAC operations and computation cycles. For
    SNN-oriented workloads, the proposed AND-type bitcell efficiently supports spike-weight
    multiplication with low switching activity, where the 2A2W configuration achieves
    accuracy close to the FP32 baseline across VGG-8, VGG-16, and ResNet-18 networks
    on CIFAR-10, CIFAR-100, and ImageNet-1K datasets. Compared to prior ADC-based
    ReRAM-CIM designs, the proposed architecture improves latency and energy efficiency
    by nearly 30-40% while maintaining robust operation under full PVT and ReRAM variability.
    Overall, E-ReCON provides a scalable, low-latency, and energy-efficient nvCIM
    platform for next-generation edge-AI, IoT, biomedical sensing, and neuromorphic
    applications.
  venue: arXiv (Cornell University)
- title: Optoelectronic Synaptic Devices Based on Low-Dimensional Materials and Their
    Applications in Neuromorphic Visual Systems
  date: 2026-06
  url: https://doi.org/10.17638/03199031
  category: edge-computing
  subcategory: theory
  authors:
  - Zishen Zhao
  abstract: 'With the rapid advancement of artificial intelligence technology, the
    traditional von Neumann computing architecture faces fundamental bottlenecks—such
    as high energy consumption, significant latency, and poor parallelism—when processing
    massive amounts of unstructured visual information. Inspired by biological visual
    systems, neuromorphic computing offers a novel approach to achieving efficient,
    low-power intelligent perception by emulating the human brain’s parallel processing
    and event-driven mechanisms. Among these, optoelectronic synaptic devices, as
    the core units for realizing “sensing-storage-computing integration” in near-sensor
    computing, demonstrate immense application potential in fields such as intelligent
    robotics, autonomous driving, and augmented reality. However, current optoelectronic
    synaptic devices still face a series of critical scientific challenges: First,
    constructing stable low-dimensional heterostructures and elucidating interfacial
    charge transfer mechanisms is the physical foundation for achieving high-performance
    optoelectronic responses; second, integrating multiple synaptic plasticity functions
    into a single device to meet the demands of complex perception tasks; third, how
    to achieve ultra-sensitive, adaptive sensing capabilities that surpass those of
    biological visual systems in photon-deficient environments, and ultimately perform
    hardware-level intelligent computation. To address these issues, this thesis begins
    with the fundamental optoelectronic physics of one-dimensional van der Waals heterojunctions,
    gradually expands to the multifunctional integration of two-dimensional anisotropic
    materials, and ultimately achieves ultra-sensitive sensing and near-sensor computing.
    The specific research results are as follows: In Chapter 2, to address the unclear
    interface charge transfer mechanisms and the lack of understanding regarding fundamental
    optoelectronic response laws in one-dimensional heterojunctions, this study constructed
    a one-dimensional van der Waals heterojunction (CPI@SWCNT) consisting of halide
    perovskite (CsPbI₃) filled within single-walled carbon nanotubes (SWCNTs) and
    systematically investigated its optoelectronic properties. Long-range continuous
    filling of CPI within SWCNTs was achieved via chemical vapor transport, and the
    integrity of the heterostructure was confirmed using transmission electron microscopy
    and energy dispersive spectroscopy. Combining Kelvin probe force microscopy and
    density functional theory (DFT) calculations, we revealed that the electron transfer
    from CPI to SWCNT amounts to 0.73 e/cell, resulting in significant n-type doping
    of the SWCNT. In single-device experiments, negative photoelectric responses were
    observed under both visible and ultraviolet light irradiation; theoretical simulations
    indicate that this response originates from the transfer of photo-generated electrons
    from CPI to SWCNT. This work systematically elucidates, for the first time, the
    interfacial charge transfer mechanism and fundamental optoelectronic response
    laws of one-dimensional perovskite/carbon nanotube heterojunctions, laying the
    theoretical and physical foundation for the design of future multifunctional devices.
    However, single-nanowire devices are difficult to integrate on a large scale and
    have limited functionality; there is an urgent need to extend this approach to
    two-dimensional material systems to achieve richer synaptic functions. In Chapter
    3, addressing the challenge of achieving multifunctional synaptic integration
    with single-material systems, this study shifts focus to Nb₂GeTe₄, a two-dimensional
    layered material with intrinsic anisotropy, to construct directionally programmable
    multifunctional optoelectronic synaptic devices. High-quality Nb₂GeTe₄ nanosheets
    were prepared via mechanical exfoliation, and their monoclinic crystal structure
    and intrinsic anisotropy were confirmed by angle-resolved polarized Raman spectroscopy
    and scanning transmission electron microscopy. Electrical transport measurements
    revealed that the device exhibits significant mobility anisotropy, with hole mobilities
    along the a-axis and b-axis of 137.97 cm² V⁻¹ s⁻¹ and 78.29 cm² V⁻¹ s⁻¹, respectively.
    Leveraging this intrinsic property, distinctly different synaptic plasticity rules
    were realized on different crystal orientations within the same device. Furthermore,
    the device exhibits wavelength-dependent synaptic responses spanning the ultraviolet
    to visible spectrum (460–660 nm), successfully simulating the color perception
    function of cone cells in biological visual systems. Verified via a convolutional
    neural network (CNN), image recognition based on anisotropic weights achieved
    direction-dependent classification performance on the Animals-10 dataset. This
    work is the first to combine material-intrinsic anisotropy with directional selectivity
    in synaptic plasticity, achieving multifunctional integration within a single
    device, and provides new insights for constructing high-density, low-power neuromorphic
    computing hardware. However, the device’s perception capabilities in low-light
    environments still need improvement, and there is an urgent need to introduce
    biomimetic designs to achieve ultra-sensitive adaptive perception. In Chapter
    4, addressing the issue of insufficient perception capabilities of existing optoelectronic
    synaptic devices in photon-deficient environments, this paper, inspired by the
    owl’s visual system, proposes a bio-inspired heterogeneous integration strategy
    with optoelectronic decoupling and constructs a dual-mode adaptive synaptic device
    with ultra-sensitive light adaptation capabilities. The device adopts a three-terminal
    transistor structure, utilizing a PVCn: PbS NCs blend film as the light-absorbing
    layer and a high-mobility C₈-BTBT organic single-crystal film as the channel layer,
    thereby achieving functional separation between the generation of photo-generated
    carriers and signal amplification. Through trap state passivation in the light-absorbing
    layer and interface band engineering, the device can still generate a significant
    non-volatile photocurrent response under an ultra-low light intensity of 0.146
    nW cm⁻², with an active adaptation index (AAI) as high as 331, successfully mimicking
    the dark adaptation process of the owl’s retina. Under electrical pulse modulation,
    the device achieved stable cycling (&gt;30 cycles) of long-term potentiation/depression
    (LTP/LTD) with extremely low energy consumption (9.2 fJ/event). Building on this,
    a large-area device array (19×17) was fabricated, verifying its uniformity and
    engineering feasibility. Furthermore, by leveraging the device’s photo regulation
    properties to perform adaptive contrast enhancement on ultra-low-light images,
    an air-to-ground target recognition system based on a UAV platform was constructed.
    Within an illuminance range of 0.146–11.7 nW cm⁻², the system achieved &gt;95%
    target recognition accuracy, successfully validating the feasibility of bionic
    heterogeneous integration for ultra-sensitive sensing and edge computing. This
    work extends the perception limits of optoelectronic synaptic devices to the level
    of dark vision, providing a hardware foundation for applications such as nighttime
    machine vision and deep-space exploration.'
  venue: University of Liverpool
- title: 'SNAP-V: A RISC-V SoC with Configurable Neuromorphic Acceleration for Small-Scale
    Spiking Neural Networks'
  date: 2026-03
  url: https://arxiv.org/abs/2603.11939
  category: edge-computing
  subcategory: method
  authors:
  - K. Gunawardana
  - Sanka Peeris
  - Kavishka Rambukwella
  abstract: 'Spiking Neural Networks (SNNs) have gained significant attention in edge
    computing due to their low power consumption and computational efficiency. However,
    existing implementations either use conventional System on Chip (SoC) architectures
    that suffer from memory-processor bottlenecks, or large-scale neuromorphic hardware
    that is inefficient and wasteful for small-scale SNN applications. This work presents
    SNAP-V, a RISC-V-based neuromorphic SoC with two accelerator variants: Cerebra-S
    (bus-based) and Cerebra-H (Network-on-Chip (NoC)-based) which are optimized for
    small-scale SNN inference, integrating a RISC-V core for management tasks, with
    both accelerators featuring parallel processing nodes and distributed memory.
    Experimental results show close agreement between software and hardware inference,
    with an average accuracy deviation of 2.62% across multiple network configurations,
    and an average synaptic energy of 1.05 pJ per synaptic operation (SOP) in 45 nm
    CMOS technology. These results show that the proposed solution enables accurate,
    energy-efficient SNN inference suitable for real-time edge applications.'
  venue: arXiv (Cornell University)
- title: 'Bio-Inspired Edge Intelligence: Pathways to Ultra-Low Energy Perovskite
    Synaptic Devices'
  date: 2026-07
  url: https://doi.org/10.1021/acsenergylett.6c01514
  category: edge-computing
  subcategory: theory
  authors:
  - C. F. Nieh
  - Ting‐Yu Wang
  - Qun‐Gao Chen
  abstract: 'Abstract Metal halide perovskites, with their unique mixed ionic-electronic
    conductivity, offer a viable solution for neuromorphic hardware to break through
    the “energy consumption barrier” and overcome the von Neumann bottleneck. This
    perspective highlights strategic approaches for achieving ultralow power consumption
    in perovskite-based artificial synapses, summarizing relevant advancements around
    three key technological pillars: composition and dimension engineering, the construction
    of single-crystal structures, and the combined application of nanocrystal dynamics
    and surface passivation techniques. Furthermore, it explores the emerging trend
    toward Sn-based and Pb−Sn hybrid systems, as well as the ongoing optimization
    of three-terminal synaptic transistors, identifying these as key development directions
    for next-generation hardware. Overall, these strategies lay the foundation for
    building autonomous, energy-efficient in-sensor computing architectures, bringing
    edge computing progressively closer to biological-level energy efficiency.'
  venue: ACS Energy Letters
- title: A 319.3 TOPS W <sup>−1</sup> high-efficient computing-in-memory engine with
    55 nm high-density multi-level NOR-flash array and event-driven neuromorphic architecture
  date: 2026-03
  url: https://doi.org/10.35848/1347-4065/ae4be6
  category: edge-computing
  subcategory: method
  authors:
  - Yue Cheng
  - YaoLei Guo
  - Hanfeng Wang
  abstract: Abstract This paper presents a high-efficiency spiking neural network
    (SNN) accelerator based on a 1.5 T NOR flash device. By leveraging the non-volatile
    and tunable conductance characteristics of NOR flash, the proposed design enables
    precise synaptic weight storage and low-power updates in a computing-in-memory
    architecture. The accelerator adopts a 512 × 1024 array structure, supporting
    large-scale SNN parallel inference and event-driven computation. With optimized
    spike accumulation and neuron firing circuits, the system achieves high computational
    density with reduced power consumption. Experimental results demonstrate an energy
    efficiency of 319.3 TOPS W −1 , highlighting its superiority over SRAM- or RRAM-based
    implementations and its potential for edge artificial intelligence applications
    such as low-power sensing and on-device inference.
