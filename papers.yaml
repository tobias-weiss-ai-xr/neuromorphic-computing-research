- title: 'ENERGY-EFFICIENT AND GREEN AI MODELS FOR SUSTAINABLE WASTE SEGREGATION SYSTEMS:
    A COMPREHENSIVE REVIEW'
  date: 2026-06
  url: https://doi.org/10.58532/nbennuravbi1
  category: edge-computing
  subcategory: method
  authors:
  - Indumathy M
  - Sherin Rappai
  - Sherin Rappai
  abstract: The rapid increase in global waste generation, driven by urbanization
    and consumer-centric lifestyles, has heightened the need for sustainable, intelligent
    waste management systems. Conventional AI-based waste segregation approaches rely
    heavily on computationally intensive deep learning models, resulting in high energy
    consumption and a larger carbon footprint. In recent years, the concept of Green
    AI has emerged, emphasizing energy-efficient, environmentally sustainable, and
    resource-aware artificial intelligence systems. This chapter presents a comprehensive
    review of energy-efficient and Green AI models for sustainable waste segregation
    systems. The study systematically examines lightweight deep learning architectures,
    model compression techniques, edge AI deployment strategies, and hybrid intelligent
    frameworks designed to reduce computational overhead while maintaining high classification
    accuracy. Furthermore, the integration of Green AI with Internet of Things (IoT),
    smart city infrastructure, and circular economy principles is critically analyzed.
    The chapter also discusses performance metrics, including energy consumption,
    inference latency, and carbon emissions, alongside classification accuracy. Key
    challenges such as accuracy-efficiency trade-offs, dataset limitations, and deployment
    constraints are identified. Finally, future research directions focusing on ultra-low-power
    AI, neuromorphic computing, and explainable Green AI systems are presented. This
    work provides a comprehensive foundation for researchers and practitioners aiming
    to develop sustainable, scalable, and energy-aware waste segregation systems.
  venue: ''
- title: 'From Wireless SNNs to SN P Systems: A Low-Energy Rule-Based Conversion'
  date: 2026-07
  url: https://arxiv.org/abs/2607.11428
  category: edge-computing
  subcategory: method
  authors:
  - Pietro Savazzi
  - Mauro Marchese
  - Anna Vizziello
  abstract: 'Distributed wireless spiking neural networks (DWSNNs) are a promising
    paradigm for energy-efficient edge inference in resource-constrained environments
    such as wireless sensor networks (WSNs). Yet, two limitations persist: their internal
    decision process is opaque, and their residual energy footprint remains a limiting
    factor for ultra-low-power deployments. This paper proposes a systematic methodology
    to convert a trained DWSNN into an equivalent Spiking Neural P (SN P) system,
    a biologically-inspired, rule-based computational model drawn from membrane computing,
    by extracting symbolic firing rules from the hidden-layer spike activity. The
    resulting SN P system provides direct, human-readable decision explanations while
    consuming three orders of magnitude less energy than its parent SNN. Experiments
    on the Neuromorphic MNIST (N-MNIST) dataset with a two-layer fully connected SNN
    using phase encoding and Leaky Integrate-and-Fire (LIF) neurons show that the
    SN P system retains approximately 84% of the original classification accuracy
    (73.77% vs. 87.68%) while the output layer connectivity decreases from 1000 to
    120 class-specific connections. This complexity reduction is governed by a parameter
    related to the number of relevant hidden neurons per class that can be chosen
    according to a trade-off between computational complexity reduction and output
    accuracy. These results position SN P systems as lightweight, interpretable surrogates
    for trained distributed wireless SNNs in neuromorphic edge deployments.'
  venue: arXiv (Cornell University)
- title: 'Towards Green Wearable Computing: A Physics-Aware Spiking Neural Network
    for Energy-Efficient IMU-based Human Activity Recognition'
  date: 2026-04
  url: https://arxiv.org/abs/2604.10458
  category: edge-computing
  subcategory: method
  authors:
  - Naichuan Zheng
  - Hailun Xia
  - Zepeng Sun
  abstract: Wearable IMU-based Human Activity Recognition (HAR) relies heavily on
    Deep Neural Networks (DNNs), which are burdened by immense computational and buffering
    demands. Their power-hungry floating-point operations and rigid requirement to
    process complete temporal windows severely cripple battery-constrained edge devices.
    While Spiking Neural Networks (SNNs) offer extreme event-driven energy efficiency,
    standard architectures struggle with complex biomechanical topologies and temporal
    gradient degradation. To bridge this gap, we propose the Physics-Aware Spiking
    Neural Network (PAS-Net), a fully multiplier-free architecture explicitly tailored
    for Green HAR. Spatially, an adaptive symmetric topology mixer enforces human-joint
    physical constraints. Temporally, an $O(1)$-memory causal neuromodulator yields
    context-aware dynamic threshold neurons, adapting actively to non-stationary movement
    rhythms. Furthermore, we leverage a temporal spike error objective to unlock a
    flexible early-exit mechanism for continuous IMU streams. Evaluated across seven
    diverse datasets, PAS-Net achieves state-of-the-art accuracy while replacing dense
    operations with sparse 0.1 pJ integer accumulations. Crucially, its confidence-driven
    early-exit capability drastically reduces dynamic energy consumption by up to
    98\%. PAS-Net establishes a robust, ultra-low-power neuromorphic standard for
    always-on wearable sensing. The source code and pre-trained models are publicly
    available at https://github.com/zhengnaichuan2022/PAS-Net.git.
  venue: arXiv (Cornell University)
- title: 'Advancements in VLSI design for edge AI: a review of hardware architectures
    and optimization techniques'
  date: 2026-03
  url: https://doi.org/10.1109/epdmc67535.2026.11496560
  category: edge-computing
  subcategory: method
  authors:
  - Pradeep Chhawcharia
  - Himani Katariya
  - Prince Sahu
  abstract: Due to the recent developments in Edge Artificial Intelligence (Edge AI),
    there is swift intelligent processing of data near the sensors (thus reducing
    latency, costs, and dependency on the cloud). In the area of Very-Large-Scale
    Integration (VLSI) design, the recent advances in the VLSI design have led to
    the creation of custom hardware accelerators created for edge inference. This
    paper presents a comprehensive review of contemporary VLSI architectures and optimization
    techniques for Edge AI applications. Key architectural paradigms, including systolic
    arrays, domain-specific accelerators, neuromorphic processors, and memory-centric
    designs, are examined with respect to their performance and energy efficiency.
    Discussion works on design and hardware of energy efficient circuits, algorithm-hardware
    co-design, and in-memory computing to solve the memory wall. Emerging opportunities
    are low-power design, sustainable and secure Edge AI revealed in comparative performance
    analyses and benchmarking insights. By consolidating recent research trends, comparative
    performance insights, this work aims to provide guidance for the design of scalable,
    low power, and trustworthy Edge AI hardware platforms.
