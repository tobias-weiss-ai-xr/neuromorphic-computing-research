- title: Explore Neuromorphic Systems with Memristive Synapses and Spiking Neural
    Networks for Low-Power Very Large-Scale Integration (VLSI)
  date: 2026-03
  url: https://doi.org/10.1109/icdsaai69492.2026.11505185
  category: edge-computing
  subcategory: method
  authors:
  - A. Rajalingam
  - Hayel Khafajeh
  - Mahesh Chandrashekar
  abstract: In light of the rapid proliferation of artificial intelligence applications,
    a computational architecture that is both more energy-efficient and scalable is
    required. Parallel and event-driven processes are inefficient in traditional von
    Neumann computing systems due to power and memory constraints. Inspired by the
    brain, neuromorphic computing uses distributed processing, event-driven communication,
    and adaptive learning to improve computational efficiency. We study low-power
    VLSI neural systems with spiking neural networks (SNNs) and memristive synapses.
    Memristive devices are useful for hardware simulating synaptic plasticity due
    to their synapse-like activity, non-volatile memory, and analogue weight. Spiking
    neural networks process data using discrete temporal spikes rather than continuous
    inputs, saving energy without sacrificing computational capacity. This study uses
    spiking neural networks (SNNs) to investigate memristor-based synapses in neuromorphic
    VLSI systems, including their operating principles, architectural design, and
    functional benefits. The essay addresses issues and solutions related to device
    variability, scalability, learning rule implementation, and circuit integration.
    Neuromorphic systems with spiking neural networks and memristive synapses may
    beat digital designs in energy economy and parallelism. Neuromorphic VLSI systems
    can be employed for next-generation low-power computing platforms for adaptive
    autonomous systems, sensory processing, and edge intelligence, according to this
    study.
