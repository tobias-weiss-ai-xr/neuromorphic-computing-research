- title: 'Energy-Efficient Anomaly Detection Using Spiking Neural Networks: A Systematic
    Review of Advances and Challenges in Edge AI'
  date: 2026-08
  url: https://osf.io/af5du
  category: survey
  subcategory: method
  authors:
  - Turgay Tugay Bilgin
  - Talha Koruk
  abstract: 'Research Description This project is a PRISMA 2020-compliant systematic
    literature review titled "Energy-Efficient Anomaly Detection Using Spiking Neural
    Networks: A Systematic Review of Advances and Challenges in Edge AI" (Koruk &amp;
    Bilgin, Bursa Technical University). Purpose The review systematically maps the
    state of Spiking Neural Network (SNN)-based anomaly detection research within
    the edge AI and IoT domain. SNNs are bio-inspired, event-driven neural networks
    that promise substantial energy savings over conventional deep learning—making
    them candidates for deployment on resource-constrained edge devices. Despite growing
    interest, prior surveys address SNNs, anomaly detection, and edge computing in
    isolation, leaving a critical gap for practitioners who need all three properties
    simultaneously. The review addresses five pre-specified research questions covering:
    (1) SNN architectures and learning methods used for anomaly detection; (2) comparative
    performance against conventional baselines; (3) neuromorphic hardware platforms
    and their empirical energy measurements; (4) application domains and datasets;
    and (5) open challenges and future directions. Methods Five databases were searched
    (Web of Science, Scopus, IEEE Xplore, ACM Digital Library, arXiv) for peer-reviewed
    articles and eligible preprints published between January 2015 and February 2026.
    After deduplication (987 unique records), dual-independent title/abstract screening,
    and full-text assessment, 142 studies were included. A domain-specific four-criterion
    quality rubric assessed each study on energy measurement provenance, baseline
    optimization rigor, statistical validation, and deployment tier (Lab-only / Prototype
    / Production). Expected Outcomes Systematic quantification of methodological gaps
    in the neuromorphic anomaly detection literature, including the first corpus-level
    statistics (with Wilson 95% confidence intervals) on hardware-measured energy
    reporting, baseline fairness, code availability, and real-world deployment rates.
    A three-tier deployment classification applied across all 142 studies, revealing
    the proportion of research that remains confined to laboratory settings versus
    reaching prototype or production deployment. Critical re-examination of reported
    SNN energy efficiency claims (commonly cited as 10–20× improvements), distinguishing
    simulation-based from empirically hardware-validated results. Structured research
    gap categories—hardware validation, fair benchmarking, reproducibility, real-world
    deployment, and learning algorithm maturity—each mapped to concrete, actionable
    directions for the field. The review targets global publication and is intended
    to serve as a methodological reference for researchers designing future SNN-based
    edge anomaly detection systems.'
  venue: OSF Preprints (OSF Preprints)
- title: Review on Deep Network Accelerators Towards Healthcare and Biomedical Applications
  date: 2026-04
  url: https://doi.org/10.52403/ijrr.20260436
  category: survey
  subcategory: method
  authors:
  - Pallavi Anil Talnikar
  - Hemangi Ravindra Zunjarrao
  abstract: 'Recent trends in deep learning (DL) imposed hardware accelerators as
    the most viable solution for several classes of high-performance computing (HPC)
    applications such as image classification, computer vision, and speech recognition.
    This survey summarizes and classifies the most recent advances in designing DL
    accelerators suitable to reach the performance requirements of HPC applications.
    In particular, it highlights the most advanced approaches to support deep learning
    accelerations including not only GPU and TPU-based accelerators but also design-specific
    hardware accelerators such as FPGA-based and ASIC-based accelerators, Neural Processing
    Units, open hardware RISC-V-based accelerators and co-processors. The survey also
    describes accelerators based on emerging memory technologies and computing paradigms,
    such as 3Dstacked Processor-In-Memory, non-volatile memories (mainly, Resistive
    RAM and Phase Change Memories) to implement in-memory computing, Neuromorphic
    Processing Units, and accelerators based on Multi-Chip Modules. The survey classifies
    the most influential architectures and technologies proposed in recent years,
    to offer the reader a comprehensive perspective in the rapidly evolving field
    of deep learning. Keywords: Deep network accelerators, deep learning, high-performance
    computinghttps://www.ijrrjournal.com/IJRR_Vol.13_Issue.4_April2026/IJRR36.pdf'
  venue: International Journal of Research and Review
- title: 'FROM VACUUM TUBES TO QUANTUM CHIPS: A UNIFIED SURVEY OF CPU ARCHITECTURE
    EVOLUTION AND FUTURE TRENDS'
  date: 2026-04
  url: https://doi.org/10.34218/jcet_09_01_003
  category: survey
  subcategory: development
  authors:
  - Yuvika Ajmera
  abstract: This paper will give an in-depth overview of CPU architecture, including
    the historical evolution of it, the current innovations, and the future direction
    of the architecture.Starting with the initial innovations of vacuum-tube and microprocessorbased
    designs, it points out such architectural advances as pipelining, superscalar
    implementation, and multicore systems.The present situation is considered in the
    perspective of power-performance trade-offs, security vulnerabilities, and heterogeneous
    computing.New paradigms like quantum processors, Neuromorphic computing and 3D
    chip stacking are reviewed in terms of transformative potential.It is also a review
    of the strategic roles of major industry players, and the rise of open ISAs such
    as RISC-V, unlike previous research that is either narrow in focus, either in
    classical or futuristic directions.The paper ends with the most important challenges
    and future research directions such as AI co-design with CPU, secure execution
    infrastructure, and sustainable hardware practices.
  venue: JOURNAL OF COMPUTER ENGINEERING AND TECHNOLOGY
- title: 'Memristor Technologies for Dynamic Vision Sensors: A Critical Assessment
    and Research Roadmap'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13699
  category: survey
  subcategory: method
  authors:
  - Mohamad Yazan Sadoun
  - Edris Zaman Farsa
  - Sarah Sharif
  abstract: Edge-AI deployment is bottlenecked by data-movement energy; pairing event-driven
    vision sensors with in-memory analog compute could lift that ceiling by orders
    of magnitude. Both technologies are individually mature; the framework distinguishing
    fabricated demonstrations from projected systems is missing. Of six application
    domains surveyed (robotics, autonomous vehicles, AR/VR, surveillance, medical
    imaging, IoT), half rest entirely on projection, and existing hardware sits at
    Technology Readiness Levels 2-5. This evidence-graded review applies a three-paradigm
    architectural taxonomy and benchmarks the gap against current digital neuromorphic
    alternatives. It identifies an end-to-end integrated DVS-memristor system as the
    field's open challenge, with testable accuracy and power targets.
  venue: arXiv (Cornell University)
- title: 'Advances in neuroprostheses: interfaces, materials, and applications'
  date: 2026-05
  url: https://doi.org/10.1186/s40580-026-00552-2
  category: survey
  subcategory: method
  authors:
  - Enhui He
  - K Chen
  - Shishuo Liu
  abstract: 'Neuroprostheses have become a pivotal technology for restoring sensory,
    motor, and cognitive functions, offering transformative therapeutic strategies
    for neurological disorders by bridging or bypassing damaged neural pathways through
    electronic systems. However, achieving long-term stability and high-fidelity interaction
    between biological and electronic systems remains a significant challenge due
    to the mismatch at the neural interface. This review examines the critical role
    of nanotechnology in building high performance neuroprostheses across six key
    classes: motor, visual, tactile, language, memory and olfactory. A system architecture
    of the neuroprostheses is proposed that highlights two critical interfaces, namely,
    "neural-electronic" and "environment-electronic" interfaces. We survey recent
    advances in materials and devices that shape better neural electrodes and novel
    sensors, and discuss the potential utilization of neuromorphic computing for efficient
    edge processing in neuroprostheses. This review aims to outline future trajectories
    toward high-throughput bidirectional interaction, biomimetic encoding, and adaptive
    closed-loop systems, aspiring to achieve seamless integration between electronic
    systems and biological neural circuitry.'
  venue: Nano Convergence
- title: 'Two-Dimensional Semiconductors for Postsilicon Electronics: From Transistors
    to Integrated Circuits'
  date: 2026-06
  url: https://doi.org/10.1021/acsnano.6c04950
  category: survey
  subcategory: application
  authors:
  - Yanglin Long
  - Haozhe Wang
  - Gangning Lou
  abstract: Two-dimensional (2D) semiconductors have emerged as promising channel
    materials to extend Moore's Law beyond the limitations of silicon, owing to their
    atomic thickness, dangling-bond-free surfaces, and exceptional electrostatic control.
    This review systematically examines recent progress and remaining challenges in
    2D material-based field-effect transistors (FETs) from device-level engineering
    to circuit-level integration. It begins by outlining the fundamental physical
    bottlenecks of silicon technology and the intrinsic advantages of 2D semiconductors.
    Subsequently, three critical challenges for high-performance 2D transistors are
    analyzed, including contact resistance, gate dielectric integration, and dimensional
    scaling, along with experimentally validated interface engineering strategies.
    The evolution of transistor architectures from planar to FinFET, gate-all-around
    FET (GAAFET), and complementary FET (CFET) is then reviewed, together with emerging
    memory device architectures and radiofrequency (RF) transistor designs, highlighting
    key experimental milestones achieved based on 2D materials. Finally, recent advances
    in 2D integrated circuits are systematically surveyed, covering logic circuits
    ranging from basic gates to high-complexity CPUs, high-efficiency sensing-memory-computing
    circuits realized by planar and three-dimensional (3D) integration, and neuromorphic
    and brain-inspired computing circuits for energy-efficient artificial intelligence
    hardware, as well as high-performance RF circuits for next-generation wireless
    and spaceborne communication systems. The review concludes with an outlook on
    the remaining roadblocks and future directions for 2D semiconductor-based electronics
    in the postsilicon era.
  venue: ACS Nano
- title: Edge AI for Autonomous Urban Safety Systems
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19577629
  category: survey
  subcategory: method
  authors:
  - Aadhar Gupta
  abstract: Urban safety infrastructure is undergoing a significant shift as cities
    become denser, moredynamic, and increasingly dependent on real-time decision-making.
    Traditional cloud-basedsurveillance systems, while effective at scale, often struggle
    with latency and reliability intime-critical scenarios, where even small delays
    can lead to serious consequences. In thiscontext, Edge AI the deployment of machine
    learning models directly on local devices hasemerged as a promising alternative.
    This paper presents a comprehensive review of Edge AI systems for real-time threat
    detectionin urban environments. It examines how modern deep learning models, includingconvolutional
    neural networks and transformer-based architectures, are being adaptedthrough
    model compression techniques such as quantization, pruning, and knowledgedistillation
    to operate efficiently on resource-constrained hardware platforms like FPGAs,embedded
    GPUs, and mobile SoCs. Key application areas are explored, including anomalydetection
    in public spaces, traffic incident response, and acoustic threat detection.However,
    despite strong progress in controlled settings, real-world deployment remainschallenging.
    Issues related to hardware limitations, inconsistent model performance undervarying
    environmental conditions, data privacy concerns, and evolving regulatoryframeworks
    continue to restrict large-scale adoption. Unlike many existing surveys that focus
    primarily on model performance, this reviewemphasizes the gap between laboratory
    results and real-world operational reliability. It furtherhighlights emerging
    directions such as federated learning, neuromorphic computing, anddeeper integration
    with smart city ecosystems as critical to the future of urban safety systems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Biologically Realistic Dynamics for Nonlinear Classification in CMOS+X Neurons
  date: 2026-04
  url: https://arxiv.org/abs/2604.03187v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Steven Louis
  - Hannah Bradley
  - Artem Litvinenko
  - Cody Trevillian
  - Darrin Hanna
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural networks encode information in spike timing and offer
    a pathway toward energy efficient artificial intelligence. However, a key challenge
    in spiking neural networks is realizing nonlinear and expressive computation in
    compact, energy-efficient hardware without relying on additional circuit complexity.
    In this work, we examine nonlinear computation in a CMOS+X spiking neuron implemented
    with a magnetic tunnel junction connected in series with an NMOS transistor. Circuit
    simulations of a multilayer network solving the XOR classification problem show
    that three intrinsic neuronal properties enable nonlinear behavior: threshold
    activation, response latency, and absolute refraction. Threshold activation determines
    which neurons participate in computation, response latency shifts spike timing,
    and absolute refraction suppresses subsequent spikes. These results show that
    magnetization dynamics of MTJ devices can support nonlinear computation in compact
    neuromorphic hardware.'
- title: 'BASC : Behavior-Aligned Quantization and Pruning for Low-Bit Spiking Neural
    Networks'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19239v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Linliang Chen
  - Yan Zhong
  - Xin Liu
  - Sai Li
  - Wang Kang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) encode information through binary spikes
    and compute in an event-driven manner, offering an energy-efficient paradigm for
    machine intelligence. However, high-performance SNNs incur substantial memory
    and timestep-wise computation costs that hinder deployment on resource-constrained
    devices. Quantization and pruning provide complementary routes to reducing these
    costs, yet both make their decisions with local criteria that overlook temporal
    task feedback in quantization and inter-channel dependencies in pruning. Consequently,
    optimizing either criterion can still yield suboptimal compression performance.
    We refer to this discrepancy as criterion-behavior mismatch and propose Behavior-Aligned
    SNN Compression (BASC), a unified framework with two lightweight modules. For
    quantization, the scale is applied to synaptic current at every timestep and therefore
    shifts spike timing. Temporal-Behavior Scale Correction (TSC) makes the scale
    learnable under a temporal loss, allowing firing behavior to inform scale optimization.
    For pruning, channel importance depends on how channels jointly drive the membrane
    potential across the firing threshold. Boundary-Level Inter-Channel Correction
    (BIC) uses channelwise importance scores for initial selection and inter-channel
    information to re-evaluate only channels near the pruning threshold. Extensive
    experiments on static and neuromorphic benchmarks show that lower-bit BASC models
    match or outperform higher-bit baselines and retain this accuracy advantage after
    structured pruning, while further reducing model storage and synaptic operations.
- title: Memristor-Based Spiking Neural Network Accelerator for Bio-inspired Interception
    Task
  date: 2026-05
  url: https://arxiv.org/abs/2605.31299v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Qianhou Qu
  - Sheng Lu
  - Liuting Shang
  - Jaihan Utailawon
  - Sungyong Jung
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) provide event-driven and low-power computation
    inspired by biological neural systems, but current implementations rely on von
    Neumann graphics processing units (GPUs) and central processing units (CPUs) platforms,
    where memory and computation bottlenecks limit energy efficiency. To address this
    challenge, this paper proposes an analog memristor-based spiking neural network
    (SNN) accelerator that integrates in-memory synaptic computation with analog integrate-and-fire
    (IF) neurons, eliminating multi-transistor CMOS synapse circuits and enabling
    asynchronous event-driven operation at the 45nm technology node. Additionally,
    a digital SNN accelerator is designed and optimized at the 5 nm technology node
    for comparison. The proposed architecture is evaluated using a predator-prey tracking
    task that emulates pursuit behavior. In this task, the analog SNN accelerator's
    inference closely matches the ideal software inference with a mean squared error
    (MSE) of 0.004. HSPICE simulation results show that the proposed analog SNN accelerator
    achieves 12.7 times lower energy consumption and 1.26 times lower delay compared
    to the digital baseline, demonstrating the potential of memristor-based neuromorphic
    circuits for energy-efficient real-time edge intelligence.
- title: Spiking Neural Network inference on FPGAs with hls4ml
  date: 2026-06
  url: https://arxiv.org/abs/2606.10008v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Barry M. Dillon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) provide a naturally temporal machine-learning
    framework. Their neurons maintain an internal state and propagate information
    through discrete spikes, enabling low-latency temporal inference. Although SNNs
    are often associated with asynchronous neuromorphic processors, many scientific
    real-time inference systems rely on conventional synchronous field-programmable
    gate arrays (FPGAs) and high-level synthesis (HLS) workflows. In this paper we
    present an extension of hls4ml that enables clock-driven deployment of SNNs trained
    in pytorch onto FPGA firmware. We demonstrate the workflow using a dense quantised
    SNN trained on the Heidelberg Spiking Digits dataset where it achieves inference
    latencies of approximately $34μ$s. We validate the generated design through software
    reference comparisons, HLS C simulation, HLS synthesis, export, and Vivado synthesis
    reports. This work opens up the hls4ml toolkit to neuromorphic computing, allowing
    streamlined optimisation, synthesis, and deployment of SNN models for real-time
    inference.
- title: Gradient-Free Training of Spiking Neural Networks via Low-Rank Evolution
    Strategies
  date: 2026-05
  url: https://arxiv.org/abs/2605.30361v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Dhruv Patankar
  - Sachit Ramesha Gowda
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer compelling energy efficiency on neuromorphic
    hardware, yet their training remains challenging because the discrete spike threshold
    is non-differentiable. Surrogate-gradient methods sidestep this by approximating
    the derivative, but they impose backpropagation infrastructure that is incompatible
    with on-chip learning. Evolution Strategies (\es) are a natural gradient-free
    alternative, yet their computational cost scales with the number of parameters,
    making them impractical for large weight matrices. We present a method for training
    SNNs using EGGROLL, a low-rank factorisation of ES perturbations that reduces
    per-generation memory from $\mathcal{O}(mn)$ to $\mathcal{O}(r(m{+}n))$. Combining
    EGGROLL with a Leaky Integrate-and-Fire SNN on N-MNIST, we demonstrate that gradient-free
    training achieves 79.21% test accuracy while reducing per-generation wall-clock
    time by 2.23$\times$ relative to full-rank ES. Our results demonstrate EGGROLL
    is viable for SNN training, with a clear accuracy-speed tradeoff, compatible with
    training on neuromorphic hardware without surrogate gradients.
- title: 'UniSpike: Accelerating Spiking Neural Networks on Neuromorphic Systems via
    Eliminating Address Redundancy'
  date: 2026-05
  url: https://arxiv.org/abs/2605.23796v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Qinghui Xing
  - Zhuo Chen
  - Xin Du
  - Ouwen Jin
  - Ming Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Many-core neuromorphic systems accelerate Spiking Neural Networks (SNNs),
    yet their packet-based spike communication can spend substantial traffic and energy
    repeatedly transmitting destination addresses. This overhead is amplified by the
    small payload of spike packets: in representative workloads, duplicate address
    transmissions account for up to 49% of the total traffic. This paper presents
    UniSpike, a hardware-software co-design that removes address redundancy by aggregating
    spikes destined for the same core into compact packets. UniSpike combines destination-centric
    spike scheduling, lightweight runtime packet assembly hardware, and destination-aware
    SNN partitioning. Across diverse SNN workloads, UniSpike reduces traffic by 1.93$\times$
    on average, delivering 1.77$\times$ speedup and 1.50$\times$ energy efficiency
    improvement over state-of-the-art designs.'
- title: Linearized Bregman Iterations for Sparse Spiking Neural Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.16462v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Daniel Windhager
  - Bernhard A. Moser
  - Michael Lunglmayr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer an energy efficient alternative to
    conventional Artificial Neural Networks (ANNs) but typically still require a large
    number of parameters. This work introduces Linearized Bregman Iterations (LBI)
    as an optimizer for training SNNs, enforcing sparsity through iterative minimization
    of the Bregman distance and proximal soft thresholding updates. To improve convergence
    and generalization, we employ the AdaBreg optimizer, a momentum and bias corrected
    Bregman variant of Adam. Experiments on three established neuromorphic benchmarks,
    i.e. the Spiking Heidelberg Digits (SHD), the Spiking Speech Commands (SSC), and
    the Permuted Sequential MNIST (PSMNIST) datasets, show that LBI based optimization
    reduces the number of active parameters by about 50% while maintaining accuracy
    comparable to models trained with the Adam optimizer, demonstrating the potential
    of convex sparsity inducing methods for efficient neuromorphic learning.
- title: Breaking Global Self-Attention Bottlenecks in Transformer-based Spiking Neural
    Networks with Local Structure-Aware Self-Attention
  date: 2026-05
  url: https://arxiv.org/abs/2605.13887v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Lingdong Li
  - Hangming Zhang
  - Qiang Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Transformer-based Spiking Neural Networks (SNNs) integrate SNNs with global
    self-attention and have demonstrated impressive performance. However, existing
    Transformer-based SNNs suffer from two fundamental limitations. First, they typically
    employ max pooling layers to reduce the size of feature maps, but the max pooling
    captures only the strongest response and fails to comprehensively preserve representative
    regional features. Second, the global self-attention involves all global feature
    interactions, resulting in computational redundancy and quadratic computational
    complexity, thus conflicting with the sparse and energy-efficient characteristics
    of SNNs. To address these challenges, we develop Local Structure-Aware Spiking
    Transformer (LSFormer), a novel Transformer-based Spiking Neural Network that
    incorporates Spiking Response Pooling (SPooling) and Local Structure-Aware Spiking
    Self-Attention (LS-SSA). For the first time, our LSFormer leverages a local dilated
    window mechanism to capture both local details and long-range dependencies. Experimental
    results demonstrate that our LSFormer achieves state-of-the-art performance compared
    to existing advanced Transformer-based SNNs. Notably, on the more challenging
    static dataset Tiny-ImageNet and neuromorphic dataset N-CALTECH101, LSFormer substantially
    outperforms state-of-the-art baselines by 4.3\% and 8.6\% in top-1 classification
    accuracy, respectively. These results highlight the potential of LSFormer to advance
    energy-efficient spiking models toward practical deployment in large-scale vision
    applications.
- title: A Spiking Sequence Generator for Polar Trajectories on Neuromorphic Hardware
  date: 2026-07
  url: https://arxiv.org/abs/2607.02753v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - William R. P. Nourse
  - Roger D. Quinn
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Neuromorphic controllers for size, weight, and power-constrained systems
    require neural architectures that are both energy-efficient and interpretable
    at the level of system dynamics. However, existing approaches either rely on end-to-end
    trained spiking networks with limited interpretability, or on converted classical
    controllers that fail to fully exploit neuromorphic dynamics. We present a spiking
    neural network (SNN) architecture for generating polar trajectories, using a winner-take-all
    (WTA) architecture with accessory populations that induce controlled transitions
    in neural activity. We demonstrate tuning rules for these population dynamics,
    and utilize a form of shunting inhibition to enable independent control of direction,
    speed, and radius of the resulting polar trajectories. We implement the network
    on the SpiNNaker2 neuromorphic processor, and demonstrate a two to three orders
    of magnitude reduction in wall-clock step time and three to four orders of magnitude
    reduction in energy expenditure when compared to conventional computing platforms.
- title: A Neuromorphic Trigger for Efficient Audio Event Detection
  date: 2026-06
  url: https://arxiv.org/abs/2606.17775v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Benjamin Hatton
  - Oliver Rhodes
  - Luca Peres
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Efficient processing of continuous audio streams remains a key challenge
    for real-time and resource-constrained systems. This paper introduces a neuromorphic
    trigger for audio event detection, based on a spiking neural network (SNN) that
    selectively gates input to downstream models. The proposed neuromorphic trigger
    acts as a flexible low-cost front-end, identifying salient audio segments and
    enabling these to be processed by a more computationally intensive model for tasks
    such as classification. The trigger is implemented as a lightweight fully connected
    SNN using a close-open filter for postprocessing, and is evaluated on two representative
    tasks: Anomalous Sound Detection (ASD) and Sound Event Detection (SED). For ASD,
    the trigger achieves a one-second segment-based F1 score of 0.97 on a class-agnostic
    form of the URBAN-SED dataset, demonstrating high reliability in identifying relevant
    audio regions. For SED, the trigger is combined with the Dang classifier on the
    DCASE 2017 Challenge Task 2 dataset, showing a potential $42.6\times$ reduction
    in FLOPs while reducing the lower bound of the event-based error rate from 0.41
    to 0.25. These results highlight the potential of neuromorphic triggers as real-time,
    energy-efficient front-end filters, enabling substantial reductions in computational
    cost.'
- title: Direct-to-Event Spiking Neural Network Transfer
  date: 2026-05
  url: https://arxiv.org/abs/2605.07207v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Nhan Trong Luu
  - Duong Trung Luu
  - Pham Ngoc Nam
  - Truong Cong Thang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs) have gained increasing attention due to
    their potential for low-power computation on neuromorphic hardware. A widely adopted
    training strategy for SNNs is direct coding, which enable backpropagation on neuron
    implementations using continuous-valued surrogate activations. However, recent
    studies have shown that direct-coded SNNs remain substantially less energy-efficient
    than their event-based counterparts, limiting their practical deployment in energy
    sensitive scenarios. Still, to promote the reusability of pretrained SNN database
    on direct code, this motivates an important yet underexplored question: How can
    a SNN pretrained with direct code be effectively converted into an event-based
    representation? In this research, we present the first systematic investigation
    into this transfer problem, analyze the key challenges that arise when transitioning
    from direct-coded to event-based computation and propose a set of methods to enable
    energy-efficient transfer while preserving model performance.'
- title: Generalization Bounds of Spiking Neural Networks via Rademacher Complexity
  date: 2026-04
  url: https://arxiv.org/abs/2605.02927v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Shao-Qun Zhang
  - Zhi-Hua Zhou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) have garnered increasing attention as one
    of bio-inspired models due to their great potential in neuromorphic computing
    and sparse computation. Many practical algorithms and techniques have been developed;
    however, theoretical understandings of the generalization, that is, the extent
    to which SNNs perform well on unseen data, are far from clear. Recent advances
    disclosed an excitation-dependent and architecture-related generalization bound
    such that the Rademacher complexity of SNNs with stochastic firing can be upper
    bounded by an exponential function relative to the excitation probability and
    the architecture depth. In this paper, we theoretically investigate the generalization
    bounds of SNNs with several integration-and-fire schemes via Rademacher complexity.
    We recognize that the empirical Rademacher complexity of SNNs is close to the
    SNN configurations, which is exponential to the network depth and the maximum
    time duration of received spike sequences, superlinear and subquadratic to the
    network width, polynomial to the parameter norm, inverse-linear to the number
    of training samples, and independent of the computations within spiking neurons,
    achieving a more precise rate than conventional studies. Our theoretical results
    may support the scope of SNN theories and shed some insight into the development
    of SNNs.
- title: Reconstructing Spiking Neural Networks Using a Single Neuron with Autapses
  date: 2026-03
  url: https://arxiv.org/abs/2603.24692v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Wuque Cai
  - Hongze Sun
  - Quan Tang
  - Shifeng Mao
  - Zhenxing Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) are promising for neuromorphic computing,
    but high-performing models still rely on dense multilayer architectures with substantial
    communication and state-storage costs. Inspired by autapses, we propose time-delayed
    autapse SNN (TDA-SNN), a framework that reconstructs SNNs with a single leaky
    integrate-and-fire neuron and a prototype-learning-based training strategy. By
    reorganizing internal temporal states, TDA-SNN can realize reservoir, multilayer
    perceptron, and convolution-like spiking architectures within a unified framework.
    Experiments on sequential, event-based, and image benchmarks show competitive
    performance in reservoir and MLP settings, while convolutional results reveal
    a clear space--time trade-off. Compared with standard SNNs, TDA-SNN greatly reduces
    neuron count and state memory while increasing per-neuron information capacity,
    at the cost of additional temporal latency in extreme single-neuron settings.
    These findings highlight the potential of temporally multiplexed single-neuron
    models as compact computational units for brain-inspired computing.
- title: A Spiking Neural Architecture for Coordinating Arm and Locomotor Control
  date: 2026-06
  url: https://arxiv.org/abs/2606.11034v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Lea Steffen
  - Kathryn Simone
  - Graeme Damberger
  - Travis DeWolf
  - Hudson Ly
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) coupled with neuromorphic hardware offer
    energy-efficient solutions for humanoid robot control. However, existing SNN-based
    motor control systems address bipedal locomotion and arm control in isolation,
    leaving integrated control of both unaddressed. We present a spiking architecture
    that coordinates force-based arm control and bipedal locomotion in a simulated
    humanoid, using the Neural Engineering Framework (NEF) and Semantic Pointer Architecture
    (SPA). High-level action selection between locomotor and arm control is mediated
    by a biologically grounded spiking basal ganglia model. We validate the system
    through co-simulation of Nengo, for the neural control, and Isaac Sim, demonstrating
    successful target reaching, continuous digit drawing, path-following locomotion,
    and finally, switching between walking and arm control via basal ganglia disinhibition.
    To our knowledge, this is the first integrated spiking controller to combine bipedal
    locomotion and arm control on a full-scale humanoid platform. The full spike-based
    implementation enables future deployment on low-power neuromorphic hardware.
- title: 'YANA: Bridging the Neuromorphic Simulation-to-Hardware Gap'
  date: 2026-04
  url: https://arxiv.org/abs/2604.03432v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Brian Pachideh
  - Sven Nitzsche
  - Moritz Neher
  - Jann Krausse
  - Carmen Weigelt
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) promise significant advantages over conventional
    Artificial Neural Networks (ANNs) for applications requiring real-time processing
    of temporally sparse data streams under strict power constraints -- a concept
    known as the Neuromorphic Advantage. However, the limited availability of neuromorphic
    hardware creates a substantial simulation-to-hardware gap that impedes algorithmic
    innovation, hardware-software co-design, and the development of mature open-source
    ecosystems. To address this challenge, we introduce Yet Another Neuromorphic Accelerator
    (YANA), an FPGA-based digital SNN accelerator designed to bridge this gap by providing
    an accessible hardware and software framework for neuromorphic computing. YANA
    implements a five-stage, event-driven processing pipeline that fully exploits
    temporal and spatial sparsity while supporting arbitrary SNN topologies through
    point-to-point neuron connections. The architecture features an input preprocessing
    scheme that maintains steady event processing at one event per cycle without buffer
    overflow risks, and implements hardware-efficient event-driven neuron updates
    using lookup tables for leak calculations. We demonstrate YANA's sparsity exploitation
    capabilities through experiments on the Spiking Heidelberg Digits dataset, showing
    near-linear scaling of inference time with both spatial and temporal sparsity
    levels. Deployed on the accessible AMD Kria KR260 platform, a single YANA core
    utilizes 740 LUTs, 918 registers, 7 BRAMS and 24 URAMs, supporting up to $2^{17}$
    synapses and $2^{10}$ neurons. We release the YANA framework as an open-source
    project, providing an end-to-end solution for training, optimizing, and deploying
    SNNs that integrates with existing neuromorphic computing tools through the Neuromorphic
    Intermediate Representation (NIR).
- title: 'SpikingMoE: SDPrompt-Guided Dynamic Expert Fusion in Spiking Neural Networks'
  date: 2026-05
  url: https://arxiv.org/abs/2605.23188v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yukai Yang
  - Chenxi Qin
  - Jungang Li
  - Xin Zhang
  - Wenwei Shao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) provide an energy-efficient paradigm for
    visual recognition. We present SpikingMoE, which integrates a spike-driven Transformer
    with a Mixture-of-Experts (MoE) framework for dynamic computation. Inspired by
    the lateral geniculate nucleus (LGN), a spike-driven prompt (SDprompt) enables
    input-dependent expert routing in a biologically plausible manner. By replacing
    standard MLPs with spike-compatible expert modules and enforcing binary spike
    communication, SpikingMoE is designed for neuromorphic hardware. Experiments on
    CIFAR-10 and CIFAR-100 achieve 94.09% and 74.54% top-1 accuracy, showing that
    modular expert routing can be incorporated while retaining reasonable performance.
    To our knowledge, SpikingMoE is the first open-source SNN framework that integrates
    MoE into a spike-driven Transformer with LGN-inspired routing.
- title: 'SuperNeuroMAT: An Efficient Matrix-based Simulator for Spiking Neural Networks'
  date: 2026-08
  url: https://arxiv.org/abs/2608.08479v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Prasanna Date
  - Kevin Zhu
  - Shruti Kulkarni
  - Ashish Gautam
  - Chathika Gunaratne
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) offer a promising pathway to energy-efficient
    AI and brain-inspired computing. However, their widespread adoption is hindered
    by a lack of fast, accessible, and versatile simulation frameworks. In this paper,
    we introduce SuperNeuroMAT, an open-source, scalable, and highly efficient Python-based
    SNN simulator. We devise a novel matrix-based approach to model the leaky integrate-and-fire
    (LIF) neuron dynamics and natively support dense and sparse execution modes. This
    enables fast simulation of approximately 10,000 neurons in dense mode and 100,000
    neurons in sparse mode on standard laptops and desktops without requiring specialized
    hardware. We demonstrate that SuperNeuroMAT consistently outperforms four established
    SNN simulators---NEST, Brian2, BindsNET, and snnTorch---on two performance metrics
    (execution speed and peak resident memory) and across various network sizes and
    connection probabilities. Furthermore, we demonstrate SuperNeuroMAT's applicability
    across a diverse set of problems. SuperNeuroMAT can efficiently handle conventional
    machine learning benchmarks such as the Digits and citation network datasets as
    well as neuromorphic event-based vision tasks such as N-CARS and ASL-DVS. Moreover,
    it can be extended beyond machine learning workloads and facilitate general-purpose
    workloads. We validated this by implementing the neuromorphic shortest path algorithm
    and two arithmetic primitives (addition and multiplication). SuperNeuroMAT can
    be installed via the Python Package Index (PyPI), thereby lowering the barrier
    to entry into the field of neuromorphic computing and accelerating the broader
    development of neuromorphic algorithms.
- title: A 32-channel event-based bio-signal analog front-end with adaptive delta
    and pulse frequency encoding
  date: 2026-07
  url: https://arxiv.org/abs/2607.12901v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Narayanan Shyam
  - Saptarshi Ghosh
  - Giacomo Indiveri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Low-power event-based Analog Front-Ends (AFEs) are essential for building
    efficient, end-to-end neuromorphic signal processing systems. In this paper, we
    present an event-based AFE Application-Specific Integrated Circuit (ASIC) optimized
    for biomedical signal acquisition and encoding. The chip features 32 independently
    programmable input channels with dual-mode encoding mechanism outputs, comprising
    Pulse Frequency Modulation (PFM) and adaptive Asynchronous Delta Modulator (aADM)
    circuits. The aADM encoder provides an auto-scaling mechanism that adapts the
    encoding data-rate based on the input signal envelope in real-time, enabling very
    high data compression for low-power information transmission. This approach paves
    the way toward adaptive wireless communication of neural signals for on-line processing
    in brain-computer interfaces. Fabricated in a 180 nm CMOS process, the proposed
    ASIC offers a highly configurable interface compatible with state-of-the-art Spiking
    Neural Network (SNN) neuromorphic processors.
- title: 'Benchmarking Fairness in Spiking Neural Networks: Data Bias, Spurious Features,
    and Hardware Effects'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27407v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Hudi He
  - Fukun Wang
  - Zhe Wang
  - Xinyi Wang
  - Shuhan Ye
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Evaluating fairness in Spiking Neural Networks (SNNs) demands rigorous
    benchmarks that reflect real-world complexities, yet existing assessments remain
    limited by superficial dataset diversity and idealized hardware assumptions. This
    work introduces the first systematic fairness benchmark for SNNs, addressing three
    critical dimensions of realism: (1) demographic coverage gaps in training data,
    (2) spurious feature leakage (e.g., skin tone as a proxy for class labels), and
    (3) deployment-environment mismatches (e.g., edge devices with constrained spike
    encoding). Our framework integrates four cross-demographic datasets with controlled
    bias injections and three neuromorphic hardware simulators (Loihi 2, SpiNNaker),
    enabling isolated analysis of fairness-performance trade-offs under resource constraints.
    Standardized evaluations of 12 state-of-the-art SNNs reveal stark disparities:
    models trained on biased data exhibit 23\% higher false positive rates for underrepresented
    groups, while hardware limitations (e.g., reduced spike precision) further amplify
    accuracy gaps by up to 41\% in edge deployments. Critically, bias mitigation strategies
    developed for cloud-based SNNs often degrade under resource constraints, highlighting
    the need for co-design principles that jointly optimize fairness and hardware
    efficiency. By bridging algorithmic fairness research with neuromorphic engineering,
    our benchmark provides a foundation for trustworthy SNNs in socially critical
    applications such as healthcare and autonomous systems. Our code is available
    at: https://anonymous.4open.science/r/SNN-Benchmarks-8017.'
- title: Reducing ANN-SNN Conversion Error via Residual Membrane Potential Alignment
  date: 2026-08
  url: https://arxiv.org/abs/2608.13952v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Zirui Chen
  - Zihan Huang
  - Tong Bu
  - Jianhao Ding
  - Yiting Dong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) serve as core architectures for neuromorphic
    computing thanks to event-driven operation and ultra-low power consumption. Direct
    SNN training is hindered by non-differentiable spikes that induce vanishing gradients
    and unstable optimization. ANN-SNN conversion circumvents such issues by reusing
    well-trained ANN weights for low-latency, energy-efficient inference. Nevertheless,
    existing conversion schemes suffer from severe accuracy drops at small timesteps,
    large inference delays and cumulative quantization errors, even with marginal
    performance loss at large $T$. To address these limitations, we first analyze
    flaws of conventional conversion pipelines from residual membrane potential statistics
    and propose a novel conversion strategy combining dynamic initial potential tuning
    and feature enhancement. We then introduce a regularization loss $\mathcal{L}_{\mathrm{RMPD}}$
    to adapt initial potential of IF neurons and mitigate systematic truncation bias
    from boundary aggregation. A dedicated SCR-Conv2d competitive refinement layer
    with grouped convolution is further built to sharpen feature discrimination, eliminate
    redundant spikes and stabilize encoding under tiny time windows. Integrated with
    the state-of-the-art QCFS baseline, our approach delivers consistent low-latency
    performance gains and generalizes to ReLU CNNs, ANN Transformers, and multi-threshold
    SNN variants. Evaluations on CIFAR-10, CIFAR-100 and ImageNet verify prominent
    accuracy improvements at $T=2,4,8$, with negligible extra computation overhead.
    This work offers an effective conversion paradigm to facilitate real-world SNN
    deployment on neuromorphic chips.
- title: A Hardware-Aware Open-Source Framework for Design Space Exploration of Mixed-Signal
    Spiking Neural Networks
  date: 2026-07
  url: https://arxiv.org/abs/2607.06456v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Sayma Nowshin Chowdhury
  - Vineeta Nair
  - Taseen Forhad
  - Aishwarya Natarajan
  - Corey Hart
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Energy-efficient neuromorphic computing at the edge requires simulation
    tools that can capture the non-ideal behavior of mixed-signal spiking neural network
    (SNN) hardware while supporting system-level design exploration. This work presents
    an open-source hardware-aware simulation framework for mixed-signal SNNs that
    enables comparative analysis across neuron, synapse and architecture choices.
    The framework supports multiple neuron models, including Leaky Integrate-and-Fire
    (LIF), Hodgkin-Huxley (HH) and Axon-Hillock (AH), together with non-volatile analog
    synapses based on floating-gate transistors and ReRAM devices. By incorporating
    device-level nonlinearities directly into PyTorch-based training and inference,
    the tool enables optimization of physical synaptic parameters rather than idealized
    abstract weights. The framework is evaluated on standard neuromorphic benchmarks,
    including N-MNIST, DVS Gesture and Spiking Heidelberg Digits (SHD). For each model
    dataset configuration, it reports classification accuracy together with hardware-oriented
    metrics such as silicon area, power consumption and quantization sensitivity.
    These capabilities enable cross-layer design space exploration and help identify
    neuron-synapse configurations that best satisfy application-specific constraints
    on accuracy, energy efficiency, area and hardware fidelity.
- title: An Event-Driven E-Skin System with Dynamic Binary Scanning and real time
    SNN Classification
  date: 2026-03
  url: https://arxiv.org/abs/2603.10537v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Gaishan Li
  - Zhengnan Fu
  - Anubhab Tripathi
  - Junyi Yang
  - Arindam Basu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a novel hardware system for high-speed, event-sparse
    sampling-based electronic skin (e-skin)that integrates sensing and neuromorphic
    computing. The system is built around a 16x16 piezoresistive tactile array with
    front end and introduces a event-based binary scan search strategy to classify
    the digits. This event-driven strategy achieves a 12.8x reduction in scan counts,
    a 38.2x data compression rate and a 28.4x equivalent dynamic range, a 99% data
    sparsity, drastically reducing the data acquisition overhead. The resulting sparse
    data stream is processed by a multi-layer convolutional spiking neural network
    (Conv-SNN) implemented on an FPGA, which requires only 65% of the computation
    and 15.6% of the weight storage relative to a CNN. Despite these significant efficiency
    gains, the system maintains a high classification accuracy of 92.11% for real-time
    handwritten digit recognition. Furthermore, a real neuromorphic tactile dataset
    using Address Event Representation (AER) is constructed. This work demonstrates
    a fully integrated, event-driven pipeline from analog sensing to neuromorphic
    classification, offering an efficient solution for robotic perception and human-computer
    interaction.
- title: Spiking and Event-driven Neuromorphic Mamba Models for Efficient Speech Recognition
  date: 2026-05
  url: https://arxiv.org/abs/2606.01135v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Tauseef Ahmed
  - Tao Sun
  - Jeronimo Castrillon
  - Kanishkan Vadivel
  - Guangzhi Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deep learning has greatly advanced automatic speech recognition (ASR),
    enabling widespread deployment on edge devices such as smartphones and smart home
    systems. However, the computational and energy demands of deep neural networks
    pose significant challenges for such resource-constrained deployments, introducing
    latency and limiting real-time interaction. Neuromorphic computing offers a promising
    solution by introducing activation sparsity through spiking neural networks (SNNs)
    and event-driven neural networks, converting dense operations into sparse computations.
    However, a study that evaluates the hardware benefits of different neuromorphic
    strategies remains lacking for ASR. This paper explores spiking and event-driven
    neuromorphic neural networks to improve activation sparsity in the state-of-the-art
    SpeechMamba model for ASR. We introduce an event-driven SpeechMamba with FATReLU
    activation, achieving over 60% activation sparsity with less than 1% accuracy
    degradation on LibriSpeech. We also propose a spiking SpeechMamba that attains
    over 70% sparsity while using 30% fewer parameters than comparable SNNs. Finally,
    we develop a cycle-accurate event-driven simulator enabling flexible algorithm-hardware
    co-exploration, which helps us identify computational bottlenecks and yields over
    10% additional efficiency improvements.
- title: A Multiplication-Free Spike-Time Learning Algorithm and its Efficient FPGA
    Implementation for On-Chip SNN Training
  date: 2026-04
  url: https://arxiv.org/abs/2604.23218v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Maryam Mirsadeghi
  - Mojtaba Mirbagheri
  - Saeed Reza Kheradpisheh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer a biologically inspired foundation
    for low-power, event-driven intelligence, yet their direct on-chip supervised
    training remains a key hardware challenge. This paper presents a multiplication-free,
    spike-time-based learning algorithm specifically designed for efficient FPGA realization.
    The proposed approach eliminates floating-point arithmetic and explicit gradient
    storage, enabling a fully event-driven, digital training pipeline. Implemented
    on a Xilinx Artix-7 FPGA, the architecture achieves high operating speed and minimal
    resource usage while maintaining competitive accuracy. These results demonstrate
    that the learning algorithm effectively maps onto reconfigurable hardware, achieving
    both computational and energy efficiency. Software simulations further validate
    scalability, with 96.5\% and 84.8\% accuracy on MNIST and Fashion-MNIST. With
    its spike-driven and multiplier-free operation, the proposed framework delivers
    a practical and scalable hardware solution for real-time, on-chip SNN learning
    in edge environments.
- title: Hybrid ANN-SNN Pipeline with Local Plasticity
  date: 2026-06
  url: https://arxiv.org/abs/2606.20151v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Denis Larionov
  - Khairutin Shtanchaev
  - Mikhail Kiselev
  - Mikhail Korovin
  - Ivan Tugoy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This work proposes a hybrid ANN-SNN pipeline that effectively leverages
    the rich embeddings of pretrained artificial neural networks (ANNs) to enable
    high-performance spiking neural networks (SNNs). The architecture couples a pretrained
    EfficientNet encoder with a CoLaNET spiking classifier. We convert the encoder's
    activations into spike trains via rate-coding and train the subsequent SNN classifier
    using local, biologically inspired learning rules, bypassing end-to-end gradient
    propagation. This approach achieves 99.09% accuracy on a 64-class ImageNet benchmark,
    demonstrating performance on par with conventional deep networks. The work presents
    a biologically plausible and efficient framework for adapting powerful pretrained
    encoders to downstream spiking neural network tasks.
- title: 'Stable Spike: Dual Consistency Optimization via Bitwise AND Operations for
    Spiking Neural Networks'
  date: 2026-03
  url: https://arxiv.org/abs/2603.11676v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yongqi Ding
  - Kunshan Yang
  - Linze Li
  - Yiyang Zhang
  - Mengmeng Jing
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Although the temporal spike dynamics of spiking neural networks (SNNs)
    enable low-power temporal pattern capture capabilities, they also incur inherent
    inconsistencies that severely compromise representation. In this paper, we perform
    dual consistency optimization via Stable Spike to mitigate this problem, thereby
    improving the recognition performance of SNNs. With the hardware-friendly ``AND"
    bit operation, we efficiently decouple the stable spike skeleton from the multi-timestep
    spike maps, thereby capturing critical semantics while reducing inconsistencies
    from variable noise spikes. Enforcing the unstable spike maps to converge to the
    stable spike skeleton significantly improves the inherent consistency across timesteps.
    Furthermore, we inject amplitude-aware spike noise into the stable spike skeleton
    to diversify the representations while preserving consistent semantics. The SNN
    is encouraged to produce perturbation-consistent predictions, thereby contributing
    to generalization. Extensive experiments across multiple architectures and datasets
    validate the effectiveness and versatility of our method. In particular, our method
    significantly advances neuromorphic object recognition under ultra-low latency,
    improving accuracy by up to 8.33\%. This will help unlock the full power consumption
    and speed potential of SNNs.
- title: 'Brain-inspired AI for Edge Intelligence: a systematic review'
  date: 2026-03
  url: https://arxiv.org/abs/2603.26722v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yingchao Cheng
  - Meijia Wang
  - Zhifeng Hao
  - Rajkumar Buyya
  venue: ''
  code_url: ''
  project_url: ''
  abstract: While Spiking Neural Networks (SNNs) promise to circumvent the severe
    Size, Weight, and Power (SWaP) constraints of edge intelligence, the field currently
    faces a "Deployment Paradox" where theoretical energy gains are frequently negated
    by the inefficiencies of mapping asynchronous, event-driven dynamics onto traditional
    von Neumann substrates. Transcending the reductionism of algorithm-only reviews,
    this survey adopts a rigorous system-level hardware-software co-design perspective
    to examine the 2020-2025 trajectory, specifically targeting the "last mile" technologies
    - from quantization methodologies to hybrid architectures - that translate biological
    plausibility into silicon reality. We critically dissect the interplay between
    training complexity (the dichotomy of direct learning vs. conversion), the "memory
    wall" bottlenecking stateful neuronal updates, and the critical software gap in
    neuromorphic compilation toolchains. Finally, we envision a roadmap to reconcile
    the fundamental "Sync-Async Mismatch," proposing the development of a standardized
    Neuromorphic OS as the foundational layer for realizing a ubiquitous, energy-autonomous
    Green Cognitive Substrate.
- title: A2SG:Adaptive and Asymmetric Surrogate Gradients for Training Deep Spiking
    Neural Networks
  date: 2026-05
  url: https://arxiv.org/abs/2606.11236v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yechan Kang
  - Yongjin Kweon
  - Mingyeong Seo
  - Sohee Park
  - Yeonguk Jeon
  venue: ICML 2026
  code_url: https://github.com/KIST-NCL/A2SG.git
  project_url: ''
  abstract: 'Training deep spiking neural networks (SNNs) remains challenging due
    to sharp loss landscapes and temporal inconsistency caused by surrogate gradients.
    To address these challenges, we propose a unified framework: adaptive and asymmetric
    surrogate gradients A2SG. The adaptive gradients adjust an effective window for
    spatio-temporal adaptation, reducing spatial gradient variation and maintaining
    directional consistency of gradients over time. The asymmetric gradients reflect
    neuronal dynamics by assigning larger gradients to neurons with higher membrane
    potentials, and we prove that they yield lower variation than symmetric surrogates.
    Our analysis further establishes a direct connection between local gradient variation
    and the curvature of the loss landscape, providing a principled explanation for
    how A2SG promotes convergence to flatter minima and improves generalization. We
    conduct extensive experiments on diverse models, including CNN-based and Transformer-based
    SNNs, across various tasks such as image classification using both static and
    neuromorphic datasets, as well as segmentation. The results demonstrate that A2SG
    consistently improves accuracy and energy efficiency, establishing it as a general
    and reliable solution for training deep SNNs. Our code is available at https://github.com/KIST-NCL/A2SG.git.'
- title: 'mlx-snn: Spiking Neural Networks on Apple Silicon via MLX'
  date: 2026-03
  url: https://arxiv.org/abs/2603.03529v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jiahao Qin
  venue: ''
  code_url: https://github.com/D-ST-Sword/mlx-snn
  project_url: ''
  abstract: We introduce mlx-snn, the first spiking neural network (SNN) library built
    natively on Apple's MLX framework. As SNN research grows rapidly, all major libraries
    -- snnTorch, Norse, SpikingJelly, Lava -- target PyTorch or custom backends, leaving
    Apple Silicon users without a native option. mlx-snn provides six neuron models
    (LIF, IF, Izhikevich, Adaptive LIF, Synaptic, Alpha), four surrogate gradient
    functions, four spike encoding methods (including an EEG-specific encoder), and
    a complete backpropagation-through-time training pipeline. The library leverages
    MLX's unified memory architecture, lazy evaluation, and composable function transforms
    (mx.grad, mx.compile) to enable efficient SNN research on Apple Silicon hardware.
    We validate mlx-snn on MNIST digit classification across five hyperparameter configurations
    and three backends, achieving up to 97.28% accuracy with 2.0--2.5 times faster
    training and 3--10 times lower GPU memory than snnTorch on the same M3 Max hardware.
    mlx-snn is open-source under the MIT license and available on PyPI. https://github.com/D-ST-Sword/mlx-snn
- title: 'XOResNet: Exclusive-OR Meta-Residuals Facilitate Deep Spiking Neural Networks
    Learning'
  date: 2026-05
  url: https://arxiv.org/abs/2605.30362v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jianfang Wu
  - Junsong Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) hold promise for demonstrating superior
    learning and representation capabilities in deep models. Given the tremendous
    success of ResNet in deep learning, it would naturally follow to train deep SNNs
    with residual learning. However, existing residual structures for constructing
    deep SNNs still present challenges of spike redundancy or information loss, as
    well as redundant learning. In the present study, we first aim to address issues
    of relative spike redundancy in identity mapping and information loss in non-identity
    mapping. To this end, we propose an OR-ADD (OA) shortcut connection to merge output
    spikes/currents from two branches in the residual structure. Furthermore, to mitigate
    redundant learning in the backbone branch of the residual structure, we introduce
    the concept of XOR meta-residuals, i.e., selecting pre-learning residuals using
    the Exclusive-OR (XOR) operation for the backbone branch. Finally, by integrating
    the OA shortcut and XOR meta-residuals, we devise the XOR residual block and further
    construct XOResNet with varying depths based on this block. Extensive experiments
    on four datasets, Fashion-MNIST, CIFAR-10, CIFAR-100, and miniImageNet, show that
    the proposed XOResNet outperforms existing state-of-the-art deep SNNs optimized
    via gradient descent. These results validate the effectiveness of our OA shortcut
    and XOR meta-residual components in overcoming fundamental limitations of residual
    learning in SNNs, providing new architectural insights for building high-performance
    neuromorphic systems.
- title: Co-Evolved Spiking Neural Network Ensembles via Marginal Contribution Fitness
  date: 2026-06
  url: https://arxiv.org/abs/2606.13985v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Catherine Rodriquez
  - James Ghawaly
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Evolutionary optimization of spiking neural networks (SNNs) becomes increasingly
    difficult as task complexity grows because they must search a combined topology--parameter
    space that grows super-exponentially with network size. We address this scaling
    challenge through a co-evolutionary ensemble framework in which a population of
    candidate SNNs is evolved with fitness defined by each network's marginal contribution
    to group performance. Grounded in cooperative game theory and difference evaluation
    functions from multiagent systems, this credit assignment rewards networks that
    consistently improve ensemble performance and penalizes redundancy, encouraging
    complementary specialization during evolution rather than relying on post-hoc
    combination of independently trained networks. We evaluate the approach on classification,
    regression, and control tasks under $μ$Caspian neuromorphic hardware constraints.
    Co-evolved ensembles achieve statistically significant improvements over both
    single-network evolution and post-hoc ensembles across all tasks, with the most
    pronounced gains in control, where standard evolution fails to discover effective
    policies and co-evolution enables a qualitative transition to near-optimal performance.
- title: 'The Sparsity Ceiling: Where Spiking Networks Can and Cannot Trade Activity
    for Energy'
  date: 2026-07
  url: https://arxiv.org/abs/2607.26648v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Zeyu Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural networks (SNNs) are promoted as an energy-efficient substrate
    because sparse, event-driven activity replaces dense multiply-accumulates with
    cheap accumulates. We argue the energy dividend of sparsity is not a property
    of SNNs but of the task. Holding architecture fixed and swapping only the hidden
    unit (continuous vs. leaky-integrate-and-fire), plus a two-sided target-firing-rate
    probe, we measure how far activity can be pushed down before quality breaks. Low-load
    feed-forward perception sparsifies to 5% firing at no accuracy cost; a recurrent
    language model cannot go below ~50% -- the recurrent state must stay active to
    carry information. A spiking Transformer, by contrast, sparsifies freely to 2%
    (3 seeds) -- so the ceiling is a property of recurrent compression, not sequence
    modeling. Attention escapes the floor only by storing the full key-value cache,
    trading a firing floor for a memory wall: on neuromorphic hardware, recurrence
    and attention pay on different axes, neither escapes. We formalize the ceiling
    with an information-theoretic bound rho &gt;= H_b^{-1}(log2 M / H) and confirm
    its predictions: the floor rises with memory load, falls with state width, and
    (refuting a naive memory-only reading) rises with task difficulty. A layer-wise
    input floor further caps op reduction under dense input, isolating event-driven
    perception as where neuromorphic hardware wins.'
- title: 'QDS-SNN: Energy-efficient Quantum Deeply-Supervised Spiking Neural Network
    Algorithm for Traffic Sign Recognition'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07657v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Zhiguo Qu
  - Keqi Li
  - Le Sun
  - Wenjie Liu
  - Yimin Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Traffic sign recognition is crucial for intelligent transportation and
    autonomous driving, as it can improve driving efficiency and ensure road safety.
    However, traditional recognition methods are based on large datasets and intensive
    computation, which limits their real-time applicability. Spiking Neural Networks
    (SNNs) offer a biologically inspired, energy-efficient alternative due to their
    spatiotemporal processing capabilities, but suffer from information loss and vanishing
    gradients during training. To overcome these limitations, this study proposes
    a Quantum Deep-supervised Spiking Neural Network (QDS-SNN) that integrates Quantum
    Neural Networks (QNNs) for efficient, low-power deep supervision. Using quantum
    superposition and entanglement, QNNs enable expressive representations and parallel
    computation, thereby enhancing performance without compromising energy efficiency.
    The proposed QDS-SNN incorporates a temporally and spatially adaptive LIF (TSA-LIF)
    neuron and a quantum-assisted classifier module (QACM) to mitigate gradient issues
    and improve training effectiveness. This study conducts experiments on the PennyLane
    quantum simulation platform, and the results show that QDS-SNN achieves 99.72\%
    accuracy on the GTSRB dataset in only 6 time steps -- outperforming the MS-ResNet
    baseline by 1.32\% while reducing energy consumption by 55.77\%. In the TSRD dataset,
    it achieves 97.90\% accuracy while reducing energy use to 52.68\% of the baseline.
    These results demonstrate that QDS-SNN offers a high-performance, energy-efficient
    solution for traffic sign recognition in intelligent transportation systems.
- title: Globally Optimal Training of Spiking Neural Networks via Parameter Reconstruction
  date: 2026-05
  url: https://arxiv.org/abs/2605.08022v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Himanshu Udupi
  - Xiaocong Yang
  - ChengXiang Zhai
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) have been proposed as biologically plausible
    and energy-efficient alternatives to conventional Artificial Neural Networks (ANNs).
    However, the training of SNN usually relies on surrogate gradients due to the
    non-differentiability of the spike function, introducing approximation errors
    that accumulate across layers. To address this challenge, we extend the work on
    convexification of parallel feedforward threshold networks to parallel recurrent
    threshold networks, which subsume parallel SNNs as a structured special case.
    Building on this theoretical framework, we propose a parameter reconstruction
    algorithm for SNN training that demonstrates consistent and significant advantages
    across various tasks, both as a standalone method and in combination with surrogate-gradient
    training. The ablations further demonstrate the data scalability and robustness
    to model configurations of our training algorithm, pointing toward its potential
    in large-scale SNN training.
- title: SRAM-Based Compute-in-Memory Accelerator for Linear-decay Spiking Neural
    Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.12739v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Hongyang Shang
  - Shuai Dong
  - Yahan Yang
  - Junyi Yang
  - Peng Zhou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) have emerged as a biologically inspired
    alternative to conventional deep networks, offering event-driven and energy-efficient
    computation. However, their throughput remains constrained by the serial update
    of neuron membrane states. While many hardware accelerators and Compute-in-Memory
    (CIM) architectures efficiently parallelize the synaptic operation (W x I) achieving
    O(1) complexity for matrix-vector multiplication, the subsequent state update
    step still requires O(N) time to refresh all neuron membrane potentials. This
    mismatch makes state update the dominant latency and energy bottleneck in SNN
    inference. To address this challenge, we propose an SRAM-based CIM for SNN with
    Linear Decay Leaky Integrate-and-Fire (LD-LIF) Neuron that co-optimizes algorithm
    and hardware. At the algorithmic level, we replace the conventional exponential
    membrane decay with a linear decay approximation, converting costly multiplications
    into simple additions while accuracy drops only around 1%. At the architectural
    level, we introduce an in-memory parallel update scheme that performs in-place
    decay directly within the SRAM array, eliminating the need for global sequential
    updates. Evaluated on benchmark SNN workloads, the proposed method achieves a
    1.1 x to 16.7 x reduction of SOP energy consumption, while providing 15.9 x to
    69 x more energy efficiency, with negligible accuracy loss relative to original
    decay models. This work highlights that beyond accelerating the (W x I) computation,
    optimizing state-update dynamics within CIM architectures is essential for scalable,
    low-power, and real-time neuromorphic processing.
- title: Adaptive Speech-to-Spike Encoding for Spiking Neural Networks
  date: 2026-06
  url: https://arxiv.org/abs/2606.19039v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Taharim Rahman Anon
  - Jakaria Islam Emon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The mismatch between continuous acoustic signals and discrete event-driven
    processing remains a fundamental bottleneck for neuromorphic speech processing.
    Current systems typically rely on fixed spike encoders, forcing downstream Spiking
    Neural Networks (SNNs) to compensate for non-adaptive input representations. To
    address this, we present a learnable residual speech-to-spike encoder jointly
    trained end-to-end with a Recurrent Leaky Integrate-and-Fire (R-LIF) backbone.
    We validate this approach on the Google Speech Commands v2 (GSC-v2) benchmark,
    achieving up to 94.97% accuracy. Notably, the learned encoder remains highly parameter-efficient
    with a compact 35k-parameter variant that reaches 89.8%, matching or exceeding
    prior baselines that require an order of magnitude more parameters. Our encoder-focused
    analysis, including linear probing and gradient-residual inspection, indicates
    that the encoder does not target faithful signal reconstruction but instead learns
    task-aligned spike representations that enhance class separability. Finally, we
    benchmark bio-inspired, hardware-friendly credit assignment by comparing Direct
    Feedback Alignment (DFA) with surrogate-gradient BPTT under identical architectures
    and training conditions. We find that DFA reaches 91.5% accuracy, quantifying
    the performance trade-off of bio-inspired learning rules for modern neuromorphic
    audio.
- title: On the Evaluation of Spiking Neural Network Configurations for Network Intrusion
    Detection
  date: 2026-05
  url: https://arxiv.org/abs/2606.01442v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Raj Patel
  - David Amebley
  - Taye Akinrele
  - Shaswata Mitra
  - Sayanton Dibbo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Network intrusion detection is a core component of modern cybersecurity
    infrastructure, yet the deep learning models that dominate the field are computationally
    demanding, motivating interest in lightweight alternatives suited to edge and
    neuromorphic deployment. Spiking Neural Networks (SNNs) are therefore a natural
    candidate, but their design space, spanning the choice of neuron model and spike
    encoding scheme, remains poorly characterized for intrusion detection. We bridge
    this gap by using a controlled ablation study using 9 neurons coupled with 3 spike
    encoding schemes, making 27 variants, all implemented on snntorch evaluated over
    raw inputs with limited preprocessing on four benchmark datasets (NSL KDD, KDDCup99,
    CIC-IDS2017, and CTU-13) with 5 seeds. We find that spike encoding scheme is a
    better determinant for detection quality than the neuron model, where rate and
    delta spike encodings perform worse than latency encoding over the sweep. The
    LeakyParallel neuron with latency encoding performed the best overall, averaging
    at 92.11% accuracy and 0.80 macro- F1 at a rate of 2.01% false positives averaged
    over all 4 datasets, with accuracy close to perfect for CIC-IDS2017 and CTU-13,
    and also performed the fastest on inference. These results highlight the potential
    of SNNs as a viable alternative to traditional methods of intrusion detection
    when considering low-latency or resource-constrained deployments.
- title: Burst Spiking Neural Networks
  date: 2026-07
  url: https://arxiv.org/abs/2607.11914v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jiahong Zhang
  - Sijun Shen
  - Man Yao
  - Han Xu
  - Mingqiang Huang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A central goal of current Spiking Neural Network (SNN) research is to
    improve their accuracy toward becoming low-power alternatives to Artificial Neural
    Networks (ANNs). This work further argues that realizing this ambition requires
    improving not only accuracy but also robustness, defined as the ability to maintain
    correct predictions under input perturbations. We identify two key issues in existing
    SNN methods that undermine robustness. First, binary spiking activations can produce
    large activation-state changes under small perturbations. Second, the lack of
    effective weight constraints makes network outputs more sensitive to input variations.
    To this end, we propose Burst Spiking Neural Networks (BuSNNs), built upon Burst-enhanced
    Spiking Neurons (BSNs) and a Dynamic Weight Constraint (DWC) mechanism. BSNs incorporate
    burst firing to provide a graded spiking pattern. This spiking mechanism mitigates
    perturbation-induced transitions in activation states and thereby enhances robustness.
    DWC penalizes connection weights based on activation states, effectively reducing
    weight magnitudes and improving robustness while preserving accuracy. We provide
    theoretical analyses to support these robustness effects. Experimental results
    further show that, on smaller-scale benchmarks such as CIFAR-10, BuSNNs outperform
    both SNN and ANN counterparts in accuracy and robustness. On large-scale ImageNet,
    BuSNN with the MS ResNet-34 backbone further improves top-1 accuracy and corruption
    robustness over the corresponding SNN baseline by 3.18% and 2.66%, respectively.
    Despite using spike-based activations, BuSNNs surpass 4-bit activation-quantized
    ANN baselines and approach 8-bit ANN baselines on ImageNet. They also preserve
    SNNs' low-power advantage. This work studies the accuracy-robustness problem in
    SNNs, advancing their practical viability in robust and energy-efficient applications.
- title: Winner-Take-All Spiking Transformer for Language Modeling
  date: 2026-04
  url: https://arxiv.org/abs/2604.11321v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Chenlin Zhou
  - Sihang Guo
  - Jiaqi Wang
  - Dongyang Ma
  - Kaiwei Che
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Transformers, which combine the scalability of Transformers with
    the sparse, energy-efficient property of Spiking Neural Networks (SNNs), have
    achieved impressive results in neuromorphic and vision tasks and attracted increasing
    attention. However, existing directly trained spiking transformers primarily focus
    on vision tasks. For language modeling with spiking transformer, convergence relies
    heavily on softmax-based spiking self-attention, which incurs high energy costs
    and poses challenges for neuromorphic deployment. To address this issue, we introduce
    Winner-Take-All (WTA) mechanisms into spiking transformers and propose two novel
    softmax-free, spike-driven self-attention modules: WTA Spiking Self-Attention
    (WSSA) and Causal WTA Spiking Self-Attention (CWSSA). Based on them, we design
    WTA-based Encoder-only Spiking Transformer (WE-Spikingformer) for masked language
    modeling and WTA-based Decoder-only Spiking Transformer (WD-Spikingformer) for
    causal language modeling, systematically exploring softmax-free, spiking-driven
    Transformer architectures trained end-to-end for natural language processing tasks.
    Extensive experiments on 16 datasets spanning natural language understanding,
    question-answering tasks, and commonsense reasoning tasks validate the effectiveness
    of our approach and highlight the promise of spiking transformers for general
    language modeling and energy-efficient artificial intelligence.'
- title: Criticality-Constrained Iterative Pruning for Energy-Efficient Spiking Neural
    Networks via Combined Importance Scoring
  date: 2026-06
  url: https://arxiv.org/abs/2606.30676v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Muhammad Hamza
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Deploying spiking neural networks (SNNs) on neuromorphic hardware demands
    aggressive synaptic pruning while preserving temporal computation integrity. Existing
    strategies either neglect neuronal criticality or rely on convex relaxations of
    the inherently combinatorial pruning problem whose fractional masks, upon binarisation,
    destroy accuracy at moderate-to-high sparsity. We present Criticality-Constrained
    Quadratic Pruning (CQP), a native PyTorch pipeline that fuses weight magnitude
    with surrogate-gradient criticality into an analytically exact importance metric,
    eliminating the rounding artefacts endemic to solver-based approaches. We formally
    characterise a continuous-relaxation trap wherein OSQP-solver fractional masks
    overshoot the intended sparsity by up to 12 percentage points (pp), precipitating
    a 44 pp accuracy collapse. We identify and remediate a zombie-weight failure mode
    in which Adam''s first-moment tensors resurrect pruned synapses, violating the
    binary sparsity guarantee. An iterative schedule - prune, fine-tune with gradient
    masking, recompute criticality, and repeat - eliminates gradient staleness at
    high sparsity. A KL-divergence temporal analysis identifies a redundant simulation
    timestep, enabling a free 10% theoretical energy reduction without weight modification.
    On MNIST (60,000 training examples), CQP yields 95.6% accuracy at 90% sparsity
    versus 93.4% for magnitude pruning (+2.2 pp). A criticality-threshold sweep reveals
    an empirical criticality cliff: accuracy falls from 87.0% to 14.4% as the threshold
    reaches tau = 0.9, constituting a quantitative SNN-level analogue of the Critical
    Brain Hypothesis. Combined weight sparsification and temporal truncation yield
    a compound 73% reduction in per-inference energy at 70% sparsity, confirming the
    practical value of the proposed pipeline for neuromorphic deployment.'
- title: 'CATFormer: When Continual Learning Meets Spiking Transformers With Dynamic
    Thresholds'
  date: 2026-03
  url: https://arxiv.org/abs/2603.15184v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Vaishnavi Nagabhushana
  - Kartikay Agrawal
  - Ayon Borthakur
  venue: AAAI 2026
  code_url: ''
  project_url: ''
  abstract: Although deep neural networks perform extremely well in controlled environments,
    they fail in real-world scenarios where data isn't available all at once, and
    the model must adapt to a new data distribution that may or may not follow the
    initial distribution. Previously acquired knowledge is lost during subsequent
    updates based on new data. a phenomenon commonly known as catastrophic forgetting.
    In contrast, the brain can learn without such catastrophic forgetting, irrespective
    of the number of tasks it encounters. Existing spiking neural networks (SNNs)
    for class-incremental learning (CIL) suffer a sharp performance drop as tasks
    accumulate. We here introduce CATFormer (Context Adaptive Threshold Transformer),
    a scalable framework that overcomes this limitation. We observe that the key to
    preventing forgetting in SNNs lies not only in synaptic plasticity but also in
    modulating neuronal excitability. At the core of CATFormer is the Dynamic Threshold
    Leaky Integrate-and-Fire (DTLIF) neuron model, which leverages context-adaptive
    thresholds as the primary mechanism for knowledge retention. This is paired with
    a Gated Dynamic Head Selection (G-DHS) mechanism for task-agnostic inference.
    Extensive evaluation on both static (CIFAR-10/100/Tiny-ImageNet) and neuromorphic
    (CIFAR10-DVS/SHD) datasets reveals that CATFormer outperforms existing rehearsal-free
    CIL algorithms across various task splits, establishing it as an ideal architecture
    for energy-efficient, true-class incremental learning.
- title: Combining Convolution and Delay Learning in Recurrent Spiking Neural Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.15997v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Lúcio Folly Sanches Zebendo
  - Eleonora Cicciarella
  - Michele Rossi
  venue: ''
  code_url: https://github.com/luciozebendo/delrec_snn
  project_url: ''
  abstract: 'Spiking neural networks (SNNs) are rapidly gaining momentum as an alternative
    to conventional artificial neural networks in resource constrained edge systems.
    In this work, we continue a recent research line on recurrent SNNs where axonal
    delays are learned at runtime along with the other network parameters. The first
    proposed approach, dubbed DelRec, demonstrated the benefit of recurrent delay
    learning in SNNs. Here, we extend it by advocating the use of convolutional recurrent
    connections in conjunction with the DelRec delay learning mechanism. According
    to our tests on an audio classification task, this leads to a streamlined architecture
    with smaller memory footprint (around 99% savings in terms of number of recurrent
    parameters) and a much faster (52x) inference time, while retaining DelRec''s
    accuracy. Our code is available at: https://github.com/luciozebendo/delrec_snn/tree/conv_delays'
- title: Spike-driven Large Language Model
  date: 2026-04
  url: https://arxiv.org/abs/2604.16475v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Han Xu
  - Xuerui Qiu
  - Baiyu Chen
  - Xinhao Luo
  - Xingrun Xing
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Current Large Language Models (LLMs) are primarily based on large-scale
    dense matrix multiplications. Inspired by the brain''s information processing
    mechanism, we explore the fundamental question: how to effectively integrate the
    brain''s spiking-driven characteristics into LLM inference. Spiking Neural Networks
    (SNNs) possess spike-driven characteristics, and some works have attempted to
    combine SNNs with Transformers. However, achieving spike-driven LLMs with billions
    of parameters, relying solely on sparse additions, remains a challenge in the
    SNN field. To address the issues of limited representational capacity and sparsity
    in existing spike encoding schemes at the LLM level, we propose SDLLM, a spike-driven
    large language model that eliminates dense matrix multiplications through sparse
    addition operations. Specifically, we use the plug-and-play gamma-SQP two-step
    spike encoding method to ensure that the quantization process aligns with the
    model''s semantic space, mitigating representation degradation caused by binary
    spikes. Furthermore, we introduce bidirectional encoding under symmetric quantization
    and membrane potential clipping mechanisms, leading to spike trains with no or
    low firing counts dominating, significantly reducing the model''s spike firing
    rate, while halving the number of time steps. Experimental results show that SDLLM
    not only significantly reduces inference costs but also achieves state-of-the-art
    task performance under the spike-based paradigm. For example, compared to previous
    spike-based LLMs, SDLLM reduces energy consumption by 7x and improves accuracy
    by 4.2%. Our model provides inspiration for the architecture design of the next
    generation of event-driven neuromorphic chips.'
- title: Elastic Spiking Transformers for Efficient Gesture Understanding
  date: 2026-05
  url: https://arxiv.org/abs/2605.13869v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Alberto Ancilotto
  - Gianluca Amprimo
  - Stefano Di Carlo
  - Elisabetta Farella
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs), particularly Spiking Transformers, offer
    energy-efficient processing of event-based sensor data for healthcare applications.
    Yet current architectures are rigid: they are trained and deployed as static networks
    with fixed parameter counts and computational graphs. This limits deployment on
    neuromorphic hardware such as Loihi and SpiNNaker, where on-chip constraints often
    require smaller models that trade accuracy for feasibility. We introduce the Elastic
    Spiking Transformer, a runtime-adaptive architecture that brings elasticity into
    the spiking paradigm. Inspired by Matryoshka-style representation learning, it
    embeds nested elasticity in the Feature Extractor, Spiking Self-Attention, and
    Feed-Forward blocks. Through granularity-aware weight sharing, a single universal
    model can dynamically slice network width and attention heads at inference time
    without retraining. This design provides two key advantages for SNNs. First, it
    allows the model to adjust its parameter footprint to different hardware memory
    budgets. Second, reducing active neurons also lowers spike firing rates, yielding
    proportional reductions in synaptic operations, an energy benefit not directly
    available in standard artificial neural networks. We evaluate the approach on
    CIFAR10/100, CIFAR10-DVS, and the EHWGesture clinical gesture understanding dataset.
    Results show that one Elastic Spiking Transformer spans a broad range of complexity-accuracy
    trade-offs, matching or surpassing independently trained baselines while supporting
    adaptive, real-time gesture recognition on resource-constrained edge devices.'
- title: 'VQ4SNN: Vector Quantization for Memory-Efficient FPGA Spiking Neural Networks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20675v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Dimitrios Sekertzis
  - Giorgos Dimitrakopoulos
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer an energy-efficient paradigm for
    edge AI, making them attractive for hardware acceleration. However, deploying
    dense SNNs on FPGAs is constrained by limited on-chip memory for synaptic weight
    storage. To address this bottleneck, we propose VQ4SNN, a hardware-aware architecture
    that reduces memory requirements through Vector Quantization (VQ)-based weight
    sharing. To the best of our knowledge, this is the first application of VQ to
    pipelined spatial-dataflow SNN accelerators on FPGAs. VQ4SNN replaces conventional
    weight storage with a two-level memory organization consisting of compact pointers
    and a shared codebook of quantized weight vectors. The proposed design integrates
    FPGA-aware memory mapping with analytical VQ parameter selection, enabling efficient
    deployment on such accelerators while preserving inference accuracy. The experimental
    results show a reduction of 52-61% in the total number of BRAMs compared to the
    state-of-the-art uncompressed FPGA SNNs without increasing overall logic utilization.
- title: 'MorphSNN: Adaptive Graph Diffusion and Structural Plasticity for Spiking
    Neural Networks'
  date: 2026-03
  url: https://arxiv.org/abs/2603.14285v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yongsheng Huang
  - Peibo Duan
  - Yujie Wu
  - Kai Sun
  - Zhipeng Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs) currently face a critical bottleneck:
    while individual neurons exhibit dynamic biological properties, their macro-scopic
    architectures remain confined within conventional connectivity patterns that are
    static and hierarchical. This discrepancy between neuron-level dynamics and network-level
    fixed connectivity eliminates critical brain-like lateral interactions, limiting
    adaptability in changing environments. To address this, we propose MorphSNN, a
    backbone framework inspired by biological non-synaptic diffusion and structural
    plasticity. Specifically, we introduce a Graph Diffusion (GD)mechanism to facilitate
    efficient undirected signal propagation, complementing the feedforward hierarchy.
    Furthermore, it incorporates a Spatio-Temporal Structural Plasticity (STSP) mechanism,
    endowing the network with the capability for instance-specific, dynamic topological
    reorganization, thereby overcoming the limitations of fixed topologies. Experiments
    demonstrate that MorphSNN achieves state-of-the-art accuracy on static and neuromorphic
    datasets; for instance, it reaches 83.35% accuracy on N-Caltech101 with only 5
    timesteps. More importantly, its self-evolving topology functions as an intrinsic
    distribution fingerprint, enabling superior Out-of- Distribution (OOD) detection
    without auxiliary training. The code is available at anonymous.4open.science/r/MorphSNN-B0BC.'
- title: Spiking Neural Networks for fMRI-Based Visual Semantic Decoding
  date: 2026-07
  url: https://arxiv.org/abs/2607.19170v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jiahong Zhang
  - Jinning Zhao
  - Sijun Shen
  - Siyuan Xu
  - Bo Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Functional magnetic resonance imaging (fMRI)-based visual decoding aims
    to recover visual information from measured brain activity, commonly by mapping
    fMRI responses into latent visual features for downstream decoding tasks. Most
    existing methods learn mappings from fMRI responses to visual features extracted
    by artificial neural networks (ANNs), yet it remains unclear whether ANN-derived
    features provide suitable targets for brain decoding. In this study, we investigate
    spiking neural network (SNN)-derived visual features as alternative targets for
    fMRI-based visual decoding. We compare an ANN baseline with four SNN variants
    from the same architectural family, which differ in their spiking dynamics. To
    isolate the effect of the target features, all models use the same L2-regularized
    linear fMRI-to-feature decoder, while only the feature vectors used as regression
    targets are varied. Compared with the ANN baseline, SNN-derived features exhibit
    stronger alignment with fMRI responses and improve visual semantic decoding performance.
    For instance, on the GoD dataset, SNN-derived features reduce feature-prediction
    error from 0.7707 to 0.0282 and improve top-1 semantic decoding accuracy from
    0.1800 to 0.4400. Ablation results further indicate that both spiking neural dynamics
    and temporal simulation steps contribute to the observed advantage. These findings
    support SNN-derived features as effective brain-decodable visual representations
    and highlight target feature design as an important component of fMRI-based visual
    decoding.
- title: Neuromorphic Continual Learning for Sequential Deployment of Nuclear Plant
    Monitoring Systems
  date: 2026-04
  url: https://arxiv.org/abs/2604.18611v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Samrendra Roy
  - Sajedul Talukder
  - Syed Bahauddin Alam
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Anomaly detection in nuclear industrial control systems (ICS) requires
    continuous, energy-efficient monitoring across multiple subsystems that are often
    deployed at different stages of plant commissioning. When a conventional neural
    network is sequentially trained to monitor new subsystems, it catastrophically
    forgets previously learned anomaly patterns, a safety-critical failure mode. We
    present the first spiking neural network (SNN)-based anomaly detection system
    with continual learning for nuclear ICS, addressing both challenges simultaneously.
    Our approach introduces spike-encoded asynchronous sensor fusion, a delta-based
    encoding that converts heterogeneous sensor streams into sparse spike trains at
    rates dictated by each sensor's natural dynamics, achieving 92.7% input sparsity.
    We evaluate five continual learning strategies, including sequential fine-tuning,
    Elastic Weight Consolidation (EWC), Synaptic Intelligence (SI), experience replay,
    and a hybrid EWC+Replay approach, on the HAI 21.03 nuclear ICS security dataset
    across three sequentially deployed subsystems (boiler, turbine, water treatment).
    The hybrid EWC+Replay method achieves an average F1 score of 0.979 with near-zero
    average forgetting (AF = 0.000 single seed; 0.035 +/- 0.039 across three seeds),
    while requiring 12.6x fewer operations (an estimated 2.5x in energy based on published
    hardware specifications) than an equivalent artificial neural network. The system
    detects all tested attacks with a mean latency of 0.6 seconds. These results demonstrate
    that neuromorphic computing offers a viable path toward always-on, energy-efficient,
    and adaptable safety monitoring for next-generation nuclear facilities.
- title: 'NeuroTrain: Surveying Local Learning Rules for Spiking Neural Networks with
    an Open Benchmarking Framework'
  date: 2026-05
  url: https://arxiv.org/abs/2605.15058v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Alessio Caviglia
  - Filippo Marostica
  - Roberta Bardini
  - Alessandro Savino
  - Stefano Di Carlo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid expansion of spiking neural networks (SNNs) has led to a proliferation
    of training algorithms that differ widely in biological inspiration, computational
    structure, and hardware suitability. Despite this progress, the field lacks a
    unified, fine-grained taxonomy that systematically organizes these approaches
    and clarifies their conceptual relationships. This survey provides a comprehensive
    taxonomy of SNN training algorithms, spanning surrogate-gradient backpropagation,
    local and three-factor learning rules, biologically inspired plasticity mechanisms,
    ANN-to-SNN conversion pipelines, and non-standard optimization strategies. We
    analyze each class in terms of its computational principles, learning signals,
    and locality properties. To support reproducible research, we release NeuroTrain,
    an open-source snnTorch-based framework that implements a representative set of
    these algorithms within a unified, modular, and extendable framework, enabling
    consistent benchmarking across datasets, architectures, and training regimes.
    By consolidating fragmented literature and providing a reusable benchmarking framework,
    this survey identifies common patterns, highlights open challenges, and outlines
    promising directions for future work on scalable, efficient SNN training.
- title: General aspects of internal noise in spiking neural networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.13612v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - I. D. Kolesnikov
  - D. A. Maksimov
  - V. M. Moskvitin
  - N. Semenova
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This study examines the impact of additive and multiplicative noise on
    both a single leaky integrate-and-fire (LIF) neuron and a trained spiking neural
    network (SNN). Noise was introduced at different stages of neural processing,
    including the input current, membrane potential, and output spike generation.
    The results show that multiplicative noise applied to the membrane potential has
    the most detrimental effect on network performance, leading to a significant degradation
    in accuracy. This is primarily due to its tendency to suppress membrane potentials
    toward large negative values, effectively silencing neuronal activity. To address
    this issue, input pre-filtering strategies were evaluated, with a sigmoid-based
    filter demonstrating the best performance by shifting inputs to a strictly positive
    range. Under these conditions, additive noise in the input current becomes the
    dominant source of performance degradation, while other noise configurations reduce
    accuracy by no more than 1\%, even at high noise intensity. Additionally, the
    study compares the effects of common and uncommon noise across neuron populations
    in hidden layer, revealing that SNNs exhibit greater robustness to common noise.
    Overall, the findings identify the most critical noise mechanisms affecting SNNs
    and provide practical approaches for improving their robustness.
- title: 'Multi-Timescale Conductance Spiking Networks: A Sparse, Gradient-Trainable
    Framework with Rich Firing Dynamics for Enhanced Temporal Processing'
  date: 2026-05
  url: https://arxiv.org/abs/2605.11835v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Alex Fulleda-Garcia
  - Saray Soldado-Magraner
  - Josep Maria Margarit-Taulé
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) promise low-power event-driven computation
    for temporally rich tasks, but commonly used neuron models often trade off gradient-based
    trainability, dynamical richness, and high activity sparsity. These limitations
    are acute in regression, where approximation error, noise and spike discretization
    can severely degrade continuous-valued outputs. Indeed, many state-of-the-art
    (SOTA) SNNs rely on simple phenomenological dynamics trained with surrogate gradients
    and offer limited control over spiking diversity and sparsity. To overcome such
    limitations, we introduce multi-timescale conductance spiking networks, a gradient-trainable
    framework in which neural dynamics emerge from shaping the current-voltage (I-V)
    curve by tuning fast, slow and ultra-slow conductances. This parametrization allows
    systematic control over excitability, can be implemented efficiently in analog
    circuits, and yields rich firing regimes including tonic, phasic and bursting
    responses within a single model. We derive a discrete-time formulation of these
    differentiable dynamics, enabling direct backpropagation through time without
    surrogate-gradient approximations. To probe both trainability and accuracy, we
    evaluate feedforward networks of these neurons at the predictability limit of
    Mackey-Glass time-series regression and compare them to baseline LIF and SOTA
    AdLIF networks. Our model outperforms LIF and AdLIF networks, while exhibiting
    substantially sparser activity from both communication and computational perspectives.
    These results highlight multi-timescale conductance spiking neurons as a promising
    building block for energy-aware temporal processing and neuromorphic implementation.
- title: 'SMM Transformer: Leveraging Spiking Neural Networks for Multimodal Tasks'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01622v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Xiubo Liang
  - Jinxing Han
  - Yuke Li
  - Haoqi Zhu
  - Yu Zhao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) enable event-driven computation with sparse
    activations, but building multimodal Transformers on SNNs is hindered by unstable
    training in deep spiking stacks and the mismatch between dense softmax attention
    and spike-based communication. We propose SMM Transformer, an SNN-based multimodal
    Transformer framework that combines (i)PLMP, a Parallel LIF with Multistage Learnable
    Parameters neuron and a tailored P-STBP algorithm for stable deep SNN training,
    (ii) SMSA, an attention-inspired spike-driven token-mixing module that replaces
    dense pairwise softmax attention with channel-wise spike co-activation and self-compensation,
    and (iii)SMoE, a spiking mixture-of-experts module for modality-aware fusion.
    Across visual and multimodal benchmarks, SMM Transformer achieves competitive
    accuracy compared to ANN baselines. Under a standard MAC/AC arithmetic model,
    SMSA reduces the estimated operator-level compute energy of the attention module
    by up to 97%, while whole-model profiling shows more moderate but consistent efficiency
    gains.
- title: 'Spiker-LL: An Energy-Efficient FPGA Accelerator Enabling Adaptive Local
    Learning in Spiking Neural Networks'
  date: 2026-05
  url: https://arxiv.org/abs/2605.18003v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Alessio Caviglia
  - Filippo Marostica
  - Alessandro Savino
  - Stefano Di Carlo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deploying adaptive intelligence at the edge remains challenging due to
    the high computational and energy cost of training neural models. Spiking Neural
    Networks (SNNs) offer a promising alternative, but enabling on-device learning
    requires hardware-algorithm co-design. This paper presents SPIKER-LL, an FPGA-based
    SNN accelerator that extends the open-source Spiker+ inference architecture with
    efficient support for the STSF local learning rule. Through targeted microarchitectural
    extensions, SPIKER-LL performs inference and online learning with minimal overhead.
    Across MNIST, F-MNIST, and DIGITS, it achieves up to 93% accuracy, sub-millisecond
    latency, and less than 0.1 mJ per inference, while remaining DSP-free and highly
    scalable for edge-FPGA deployments.
- title: Gradient-Free Continual Learning in Spiking Neural Networks via Inter-Spike
    Interval Regularization
  date: 2026-04
  url: https://arxiv.org/abs/2604.16496v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Samrendra Roy
  - Kazuma Kobayashi
  - Souvik Chakraborty
  - Sajedul Talukder
  - Syed Bahauddin Alam
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Continual learning, the ability to acquire new tasks sequentially without
    forgetting prior knowledge, is essential for deploying neural networks in dynamic
    real-world environments, from nuclear digital twin monitoring to grid-edge fault
    detection. Existing synaptic importance methods, such as Elastic Weight Consolidation
    (EWC) and Synaptic Intelligence (SI), rely on gradient computation, making them
    incompatible with neuromorphic hardware that lacks backpropagation support. We
    propose ISI-CV, the first gradient-free synaptic importance metric for SNN continual
    learning, derived from the Coefficient of Variation (CV) of Inter-Spike Intervals
    (ISIs). Neurons that fire regularly (low CV) encode stable, task-relevant features
    and are protected from overwriting; neurons with irregular firing are permitted
    to adapt freely. ISI-CV requires only spike time counters and integer arithmetic,
    all of which are native to every neuromorphic chip. We evaluate on four benchmarks
    of increasing difficulty: Split-MNIST, Permuted-MNIST, Split-FashionMNIST, and
    Split-N-MNIST using real Dynamic Vision Sensor (DVS) event data. Across three
    seeds, ISI-CV achieves zero forgetting (AF = 0.000 +/- 0.000) on Split-MNIST and
    Split-FashionMNIST, near-zero forgetting on Permuted-MNIST (AF = 0.001 +/- 0.000),
    and the highest accuracy with the lowest forgetting on real neuromorphic DVS data
    (AA = 0.820 +/- 0.012, AF = 0.221 +/- 0.014). On N-MNIST, gradient-based methods
    produce unreliable importance estimates and perform worse than no regularization;
    ISI-CV avoids this failure by design.'
- title: 'NeuroRing: Scaling Spiking Neural Networks via Multi-FPGA Bidirectional
    Ring Topologies and Stream-Dataflow Architectures'
  date: 2026-04
  url: https://arxiv.org/abs/2604.28059v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Muhammad Ihsan Al Hafiz
  - Artur Podobas
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) are a promising paradigm for energy-efficient
    event-driven computation, but large-scale SNN execution remains challenging because
    sparse spike communication and synchronization can dominate runtime. Existing
    solutions across CPU, GPU, ASIC, and FPGA platforms offer different trade-offs
    between programmability, efficiency, and scalability. To address this gap, we
    present NeuroRing, a modular and scalable SNN accelerator based on a stream-dataflow
    architecture and a bidirectional ring topology, implemented in High-Level Synthesis
    (HLS) on FPGAs. NeuroRing supports modular single- and multi-FPGA deployment and
    is compatible with existing SNN workflows through integration with the NEST simulator.
    We evaluate NeuroRing on the cortical microcircuit benchmark and a Sudoku constraint-satisfaction
    workload. Results show that NeuroRing preserves the key activity statistics of
    the NEST reference model, achieves faster-than-real-time execution of the full-scale
    cortical microcircuit with a real-time factor (RTF) of 0.83, exhibits meaningful
    strong and weak scaling, and provides competitive energy efficiency on two programmable
    FPGAs. These results position NeuroRing as a flexible and scalable platform for
    both neuroscience simulation and broader event-driven applications.
- title: 'SpikeDecoder: Realizing the GPT Architecture with Spiking Neural Networks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.12287v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Claas Beger
  - Florian Walter
  - Alois Knoll
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Transformer architecture is widely regarded as the most powerful tool
    for natural language processing, but due to a high number of complex operations,
    it inherently faces the issue of high energy consumption. To address this issue,
    we consider Spiking Neural Networks (SNNs), which are an energy-efficient alternative
    to conventional Artificial Neural Networks (ANNs) due to their naturally event-driven
    approach to processing information. However, this inherently makes them difficult
    to train. Often, many SNN-based models circumvent this issue by converting pre-trained
    ANNs. More recently, attempts have been made to design directly trainable SNN-based
    adaptations of the Transformer model structure. Although the results showed great
    promise, the application field was computer vision. Moreover, the proposed model
    incorporates only encoder blocks. In this paper, we propose SpikeDecoder, a fully
    SNN-based implementation of the Transformer decoder block, for applications in
    natural language processing. In a series of experiments, we analyze the impact
    of exchanging different blocks of the ANN model with spike-based alternatives
    to identify trade-offs and significant sources of performance loss. We further
    investigate the role of residual connections and the selection of SNN-compatible
    normalization techniques. Besides the work on the model architecture, we formulate
    and compare different embedding methods to project text data into spikes. Finally,
    we demonstrate that our proposed SNN-based decoder block reduces the theoretical
    energy consumption by 87% to 93% compared to the ANN baseline.
- title: 'EdgeSpike: Spiking Neural Networks for Low-Power Autonomous Sensing in Edge
    IoT Architectures'
  date: 2026-04
  url: https://arxiv.org/abs/2604.27004v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Gustav Olaf Yunus Laitinen-Fredriksson Lundstrom-Imanov
  - Taner Yilmaz
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We propose EdgeSpike, a co-designed spiking neural network (SNN) framework
    for autonomous low-power sensing in edge Internet of Things (IoT) architectures.
    EdgeSpike unifies (i) a hybrid surrogate-gradient and direct-encoding training
    pipeline, (ii) a hardware-aware neural architecture search (NAS) bounded by per-inference
    energy and memory budgets, (iii) an event-driven runtime targeting Intel Loihi
    2, SpiNNaker 2, and commodity ARM Cortex-M microcontrollers with custom spike-sparse
    SIMD kernels, and (iv) a lightweight local plasticity rule enabling continual
    on-device adaptation without backpropagation. The framework is evaluated across
    five sensing tasks (keyword spotting, vibration-based machine fault detection,
    surface electromyography gesture recognition, 77 GHz radar human-activity classification,
    and structural-health acoustic-emission monitoring) on three hardware targets.
    EdgeSpike achieves a mean classification accuracy of 91.4%, within 1.2 percentage
    points (pp) of strong INT8 convolutional neural network (CNN) baselines (mean
    92.6%), while reducing energy per inference by 18x to 47x on neuromorphic hardware
    (mean 31x) and by 4.6x to 7.9x on Cortex-M (mean 6.1x). End-to-end latency remains
    at or below 9.4 ms across all 15 task-hardware configurations. A seven-month,
    64-node wireless field deployment confirms a 6.3x extension in projected battery
    lifetime (from 312 to 1978 days at 2 Wh per node) and bounded accuracy degradation
    under seasonal drift (0.7 pp with on-device adaptation versus 2.1 pp without).
    Hardware-aware NAS evaluates 8400 candidates and yields a 12-point Pareto front.
    EdgeSpike will be released as open source with reproducible training pipelines,
    hardware-portable runtimes, and benchmark suites.
- title: 'AS-FedBridge: Pseudo-Spike Bridge Distillation for Heterogeneous ANN-SNN
    Federated Learning'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03324v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Shengyang Li
  - Yiting Dong
  - Liuyang Song
  - Ximing Wang
  - Luyuan Xie
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Federated learning enables collaborative model training across distributed
    edge devices while strictly preserving data privacy. To facilitate practical deployment
    on resource-constrained edge devices, Spiking Neural Networks (SNNs) have emerged
    as a promising alternative to traditional Artificial Neural Networks (ANNs) due
    to their sparse computing mechanisms and high energy efficiency. However, jointly
    training ANNs and SNNs exposes a challenge of representational misalignment, which
    is intrinsically caused by differences in information representation, specifically
    the semantic gap between continuous real-valued activations in ANNs and discrete
    spatio-temporal spikes in SNNs. To overcome this barrier, we propose AS-FedBridge,
    a novel federated learning framework tailored for mixed ANN-SNN clients. AS-FedBridge
    features a lightweight Bridge equipped with a Pseudo-Spike Interface, which effectively
    projects continuous signals into a spike-compatible space to facilitate ANN-SNN
    alignment. Given the absence of existing mixed ANN-SNN federated frameworks, we
    establish a comprehensive benchmark to evaluate against multiple advanced heterogeneous
    FL methods. Our empirical analysis demonstrates a positive correlation between
    the degree of ANN-SNN alignment and the collaborative FL performance. Across four
    datasets, AS-FedBridge consistently demonstrates advanced accuracy while mitigating
    extreme scale, architecture, and client heterogeneity challenge. Furthermore,
    our framework enables a highly controllable trade-off between model performance
    and resource efficiency. AS-FedBridge accomplishes these robust performance gains
    while introducing only marginal computational overhead, establishing a robust
    and practical foundation for mixed ANN-SNN federated learning systems.
- title: 'SAGE: Surrogate-gradient Adaptation via Attention-Guided Entropy for Spiking
    Transformers'
  date: 2026-08
  url: https://arxiv.org/abs/2608.13702v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Kiran Nair
  - Rodrigue Rizk
  - KC Santosh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) offer an energy-efficient alternative to
    conventional deep neural networks by exploiting sparse event-driven computation,
    but their training remains challenging because the non-differentiable spike function
    requires surrogate gradients whose fixed shape may be suboptimal across layers
    and training stages. In this work, we introduce SAGE, an uncertainty-modulated
    surrogate-gradient mechanism for Transformer-based SNNs. SAGE estimates block-level
    uncertainty from normalized self-attention entropy and uses this signal to adapt
    the surrogate-gradient slope during training while leaving the inference model
    unchanged. By modulating only the training-time surrogate parameter, the proposed
    method preserves the original architecture and deployment cost while improving
    optimization flexibility. Experiments on CIFAR-10/100 demonstrate that SAGE achieves
    improved accuracy over fixed-surrogate baselines, with results up to 1-2\% consistent
    gains across multiple simulation time steps. These results highlight the potential
    of attention-derived uncertainty as a lightweight training signal for adaptive
    surrogate-gradient learning in transformer-based SNNs.
- title: Reinterpreting Safety Thresholds as Neuron Spiking Thresholds
  date: 2026-05
  url: https://arxiv.org/abs/2605.30368v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Enrico Del Re
  - Mohamed Sabry
  - Cristina Olaverri-Monreal
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Surrogate Safety Measures (SSMs) are extensively utilised in the evaluation
    of traffic risk in automated driving contexts. However, the majority of SSM-based
    evaluations employ fixed thresholds that fail to capture the human response to
    sustained borderline conditions or the reaction to brief, high-risk peaks. The
    present work proposes a biologically inspired reinterpretation of SSM thresholds.
    This is modelled as spiking thresholds of leaky integrate-and-fire (LIF) neurons,
    with multiple SSM inputs combined into a spiking neural network (SNN). The SNN
    is trained to emit spikes that are aligned with human braking onsets. The training
    data was recorded in a controlled car-following experiment using the 3D-CoAutoSim
    platform with CARLA/Unreal and a 6-DOF motion platform, where induced critical
    events were generated. The results demonstrate that the learned spiking activity
    qualitatively aligns with braking behaviour across scenarios and captures reactions
    that are not consistently explained by threshold crossings alone. Analysis across
    participants further indicates that learned input thresholds remain relatively
    consistent, while learned decay factors encode different temporal sensitivities
    for the SSMs. The findings of this study indicate that spiking dynamics may serve
    as a mechanism to facilitate the convergence of objective SSMs with subjective
    human safety perception.
- title: 'SpikeMLLM: Spike-based Multimodal Large Language Models via Modality-Specific
    Temporal Scales and Temporal Compression'
  date: 2026-04
  url: https://arxiv.org/abs/2604.18610v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Han Xu
  - Zhiyong Qin
  - Di Shang
  - Jiahong Zhang
  - Xuerui Qiu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multimodal Large Language Models (MLLMs) have achieved remarkable progress
    but incur substantial computational overhead and energy consumption during inference,
    limiting deployment in resource-constrained environments. Spiking Neural Networks
    (SNNs), with their sparse event-driven computation, offer inherent energy efficiency
    advantages on neuromorphic hardware, yet extending them to MLLMs faces two key
    challenges: heterogeneous modalities make uniform spike encoding insufficient,
    and high-resolution image inputs amplify timestep unfolding overhead. We propose
    SpikeMLLM, the first spike-based framework for MLLMs, which unifies existing ANN
    quantization methods in the spiking representation space and incorporates Modality-Specific
    Temporal Scales (MSTS) guided by Modality Evolution Discrepancy (MED) and Temporally
    Compressed LIF (TC-LIF) for timestep compression from T=L-1 to T=log2(L)-1. Experiments
    on four representative MLLMs across diverse multimodal benchmarks show that SpikeMLLM
    maintains near-lossless performance under aggressive timestep compression (Tv/Tt=3/4),
    with average gaps of only 0.72% and 1.19% relative to the FP16 baseline on InternVL2-8B
    and Qwen2VL-72B. We further develop a dedicated RTL accelerator tailored to the
    spike-driven datapath, observing 9.06x higher throughput and 25.8x better power
    efficiency relative to an FP16 GPU baseline under a deployment-oriented co-design
    setting, suggesting the promise of algorithm-hardware co-design for efficient
    multimodal intelligence.'
- title: Equivalence of approximation by networks of single- and multi-spike neurons
  date: 2026-03
  url: https://arxiv.org/abs/2603.13478v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Dominik Dold
  - Philipp Christian Petersen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In a spiking neural network, is it enough for each neuron to spike at
    most once? In recent work, approximation bounds for spiking neural networks have
    been derived, quantifying how well they can fit target functions. However, these
    results are only valid for neurons that spike at most once, which is commonly
    thought to be a strong limitation. Here, we show that the opposite is true for
    a large class of spiking neuron models, including the commonly used leaky integrate-and-fire
    model with subtractive reset: for every approximation bound that is valid for
    a set of multi-spike neural networks, there is an equivalent set of single-spike
    neural networks with only linearly more neurons (in the maximum number of spikes)
    for which the bound holds. The same is true for the reverse direction too, showing
    that regarding their approximation capabilities in general machine learning tasks,
    single-spike and multi-spike neural networks are equivalent. Consequently, many
    approximation results in the literature for single-spike neural networks also
    hold for the multi-spike case.'
- title: 'SNNF: An SNN-based Near-Sensor Noise Filter for Dynamic Vision Sensors'
  date: 2026-05
  url: https://arxiv.org/abs/2605.01937v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yahan Yang
  - Pradeep Kumar Gopalakrishnan
  - Chang Chip Hong
  - Arindam Basu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Dynamic Vision Sensors (DVS) exhibit exceptional dynamic range and low
    power consumption, making them ideal for edge applications in the Internet of
    Video Things (IoVT). However, their output is often degraded by spurious Background
    Activity (BA) noise, leading to unnecessary computational overhead. This paper
    proposes SNNF, a near-sensor BA noise filter that integrates a compact Event-Based
    Binary Image (EBBI) representation, a parallel memory architecture, and a single-layer
    Spiking Neural Network (SNN) classifier. Trained on representative DVS data, the
    SNN distinguishes signal events from noise with an AUC of 0.89 on standard datasets.
    The binary-array-based EBBI eliminates timestamp dependency, significantly reducing
    memory footprint. Moreover, the SNN's spike-based computation replaces power-hungry
    multipliers with simple accumulation logic and minimizes inter-neuron data width,
    resulting in an extremely hardware-efficient design. FPGA implementation results
    show that SNNF reduces memory and logic resources to approximately 11% and 40%,
    respectively of state-of-the-art filters, while achieving a throughput of 29 Mega
    events per second (Meps). In a 65 nm CMOS ASIC implementation, SNNF achieves 44.4
    Meps with an area and power consumption of only ~13% and &lt;5% of the corresponding
    ANN-based designs. These results demonstrate that SNNF provides an excellent balance
    between filtering accuracy and hardware efficiency, making it highly suitable
    for resource-constrained, near-sensor deployment.
- title: Adaptive Spiking Neurons for Vision and Language Modeling
  date: 2026-04
  url: https://arxiv.org/abs/2604.12365v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Chenlin Zhou
  - Sihang Guo
  - Jiaqi Wang
  - Dongyang Ma
  - Jin Cheng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Regarded as the third generation of neural networks, Spiking Neural Networks
    (SNNs) have garnered significant traction due to their biological plausibility
    and energy efficiency. Recent advancements in large models necessitate spiking
    neurons capable of high performance, adaptability, and training efficiency. In
    this work, we first propose a novel functional perspective that provides general
    guidance for designing the new generation of spiking neurons. Following the insightful
    guidelines, we propose the Adaptive Spiking Neuron (ASN), which incorporates trainable
    parameters to learn membrane potential dynamics and enable adaptive firing. ASN
    adopts an integer training and spike inference paradigm, facilitating efficient
    SNN training. To further enhance robustness, we propose a specialized variant
    of ASN, the Normalized Adaptive Spiking Neuron (NASN), which integrates normalization
    to stabilize training. We evaluate our neuron model on 19 datasets spanning five
    distinct tasks in both vision and language modalities, demonstrating the effectiveness
    and versatility of the ASN family. Our ASN family is expected to become the new
    generation of general-purpose spiking neurons.
- title: Integer-State Dynamics of Quantized Spiking Neural Networks for Efficient
    Hardware Acceleration
  date: 2026-04
  url: https://arxiv.org/abs/2604.01042v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Lei Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) support energy-efficient machine intelligence
    because event-driven computation and sparse activity map naturally to low-power
    digital hardware. In practical implementations, however, membrane states, synaptic
    weights, and thresholds are represented with finite-precision integer arithmetic.
    Quantization, clipping, and overflow can therefore alter network dynamics, not
    just approximate a higher-precision model. This paper adopts an integer-state
    dynamical perspective, modeling a hardware-oriented SNN as a deterministic map
    on a bounded integer lattice. Under this view, recurrence, periodic orbits, and
    regime changes become intrinsic properties of the system. We introduce a lightweight
    update rule with integer-valued states and shift-based leakage, and demonstrate
    the approach through exploratory simulations with network sizes N = 30-130, connection
    densities 0.1-0.9, and bit widths 4/8/16 over T = 1000 steps. The results show
    bounded and recurrent temporal structure with strong quantization sensitivity.
    The observed regimes depend heavily on representation semantics and scaling choices.
    These findings suggest that numerical precision acts as a dynamical design variable
    and highlight integer-state analysis as a useful framework for hardware-aware
    SNN co-design, motivating future work on attractor analysis, precision-aware training,
    and FPGA/ASIC validation.
- title: Scalable Learning in Structured Recurrent Spiking Neural Networks without
    Backpropagation
  date: 2026-05
  url: https://arxiv.org/abs/2605.00402v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Bo Tang
  - Weiwei Xie
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs) provide a promising framework for energy-efficient
    and biologically grounded computation; however, scalable learning in deep recurrent
    architectures with sparse connectivity remains a major challenge. In this work,
    we propose a structured multi-layer recurrent SNN architecture composed of locally
    dense recurrent layers augmented with sparse small-world long-range projections
    to a readout population. The long-range connectivity is largely fixed, preserving
    routing efficiency and hardware scalability, while synaptic adaptation is performed
    using strictly local plasticity mechanisms. To enable supervised learning without
    backpropagation or surrogate gradients, we introduce a biologically motivated
    learning framework that combines: (i) population-based winner-take-all (WTA) teaching
    signals at the output layer, (ii) fixed random broadcast alignment feedback pathways,
    and (iii) low-dimensional modulatory neuron populations that gate synaptic updates
    through three-factor learning rules with eligibility traces. This design supports
    deep recurrent computation with sparse global communication and purely local synaptic
    updates. We analyze the algorithmic properties, computational complexity, and
    hardware feasibility of the proposed approach, and demonstrate stable learning
    and competitive performance on benchmark classification tasks. The results highlight
    the potential of structured recurrence and neuromodulatory learning to enable
    scalable, hardware-compatible SNN training beyond gradient-based methods.'
- title: 'ReSCom: A Reconfigurable Spiking Neural Network Accelerator Using Stochastic
    Computing'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13560v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Ali Alipour Fereidani
  - Mohammad Rasoul Roshanshah
  - Saeed Safari
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) provide an attractive framework for energy-efficient
    inference due to their event-driven computation and biologically inspired dynamics.
    However, efficient hardware realization of SNNs remains challenging because neuronal
    computations incur significant power and area costs, and uncontrolled approximate
    arithmetic can destabilize recurrent state updates when precision is not properly
    managed. To address these challenges, this paper presents ReSCom, a reconfigurable
    SNN accelerator that leverages stochastic computing to reduce hardware complexity
    while maintaining stable inference. The proposed architecture employs stochastic
    arithmetic for multiplication operations in neuron dynamics, while preserving
    exact fixed-point addition/subtraction operations. This stochastic strategy enables
    runtime trade-offs between accuracy, latency, and energy consumption. A unified
    reconfigurable neuron design supports Integrate-and-Fire (IF), Leaky Integrate-and-Fire
    (LIF), and Synaptic neuron models within a single hardware framework. Experimental
    results for MNIST inference on a Xilinx Artix-7 FPGA show that ReSCom achieves
    $92.80\%$ classification accuracy while consuming just $0.05~\mathrm{mJ}$ of operational
    energy per image at $100~\mathrm{MHz}$, outperforming the energy efficiency of
    recent state-of-the-art implementations. Furthermore, managing the stochastic
    bit-stream length allows explicit, dynamic control over accuracy-latency-energy
    trade-offs to meet target application constraints.
- title: 'SupraSNN: Exploiting Synapse-Level Parallelism in Spiking Neural Network
    Accelerators through Co-Optimized Mapping and Scheduling'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13354v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Seyed Sadra Ghavami
  - Mohammad Hossein Nikkhah
  - Mohammad Rasoul Roshanshah
  - Saeed Safari
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer a brain-inspired path toward highly
    efficient computation, but their practical deployment is constrained by the challenge
    of managing and executing their massive parallelism on physical hardware. This
    problem mirrors the historical challenge in processor design of moving beyond
    serial execution, a barrier broken by superscalar architectures that dispatch
    multiple instructions to parallel functional units. Drawing inspiration from this
    paradigm, we introduce a hardware-software co-design framework that treats synaptic
    events as parallelizable micro-operations. We present SupraSNN, a superscalar-inspired
    architecture that achieves high synapse-level parallelism by physically decoupling
    synaptic and neuronal computations. Within this architecture, a Multi-Cast Tree
    routes spike data to multiple parallel Synapse Processing Units serve as the computational
    pipelines, while a Merge Tree consolidates distributed results for processing
    by a unified Neuron Unit--deliberately centralizing complex neuron state dynamics
    to mitigate hardware overhead and resource duplication. The efficacy of this architecture
    is enabled by a sophisticated partitioning and scheduling framework that first
    maps the SNN onto hardware respecting memory constraints, then heuristic scheduling
    determines the synaptic execution order, maximizing throughput and resource utilization.
    Implementing a feedforward SNN trained on MNIST (93.44% accuracy), SupraSNN achieves
    149 $μs$ inference latency and 0.025 mJ per image (0.276 nJ per synapse) on the
    Xilinx Zynq XC7Z020 FPGA--delivering 47.6% lower latency and 5.6$\times$ better
    energy efficiency than prior FPGA-based SNN accelerators. Beyond vision tasks,
    a recurrent SNN on the Spiking Heidelberg Dataset (71.82% accuracy) achieves 1.41
    ms latency and 0.77 mJ per sample on XC7Z030.
- title: 'Collapse or Preserve: Data-Dependent Temporal Aggregation for Spiking Neural
    Network Acceleration'
  date: 2026-03
  url: https://arxiv.org/abs/2603.13810v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jiahao Qin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spike sparsity is widely believed to enable efficient spiking neural
    network (SNN) inference on GPU hardware. We demonstrate this is an illusion: five
    distinct sparse computation strategies on Apple M3 Max all fail to outperform
    dense convolution, because SIMD architectures cannot exploit the fine-grained,
    unstructured sparsity of i.i.d. binary spikes. Instead, we propose Temporal Aggregated
    Convolution (TAC), which exploits convolution linearity to pre-aggregate $K$ spike
    frames before a single convolution call, reducing $T$ calls to $T/K$. On rate-coded
    data, TAC achieves 13.8times speedup with +1.6% accuracy on MNIST and +5.4% on
    Fashion-MNIST -- a simultaneous improvement in both speed and accuracy. However,
    on event-based data where the temporal dimension carries genuine motion information,
    TAC''s temporal collapse is harmful. We therefore introduce TAC-TP (Temporal Preservation),
    which shares each group''s convolution output across K independent LIF steps,
    preserving full temporal resolution for downstream layers. On DVS128-Gesture,
    TAC-TP achieves 95.1% accuracy (vs. 96.3% baseline) with 50% fewer convolution
    calls, while standard TAC drops to 91.3%. Our key finding is that the optimal
    temporal aggregation strategy is data-dependent: collapse the temporal dimension
    for rate-coded data (noise reduction) but preserve it for event data (information
    retention). Speedup is hardware-agnostic: TAC achieves 11.0times on NVIDIA V100,
    confirming the mechanism transfers across GPU architectures. All operators in
    the mlx-snn library are open source.'
- title: 'SpikF-GO: Spiking Fourier Graph Operators for Multivariate Time Series Forecasting'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13901v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jafar Bakhshaliyev
  - Niels Landwehr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) have emerged as an energy-efficient alternative
    to conventional neural networks, demonstrating strong performance in computer
    vision and robotics. More recently, SNNs have been applied to time series forecasting
    (TSF), with methods exploring spiking temporal backbones, spike-compatible positional
    encodings, Fourier-domain processing, and redesigned neuron dynamics. However,
    existing SNN forecasting approaches process variables independently, lacking explicit
    mechanisms for modeling inter-variable dependencies. This is a critical limitation
    in multivariate settings, where cross-variable correlations carry substantial
    predictive information. We propose Spiking Fourier Graph Operators (SpikF-GO),
    which addresses this gap by combining a hypervariate graph formulation in which
    every scalar observation becomes a graph node with spike-driven spectral processing.
    SpikF-GO introduces a Hard Concrete frequency gate for learnable sparse frequency
    selection and a Complex LIF gate that applies independent spiking neurons to real
    and imaginary Fourier components, preserving binary, event-driven computation
    throughout the spectral domain. We further present a variant incorporating Central
    Pattern Generator-based positional encodings for stronger long-range temporal
    modeling. Evaluated on eight benchmarks under a unified experimental protocol,
    SpikF-GO achieves the best average rank among all SNN methods and outperforms
    its ANN counterpart, FourierGNN, at reduced energy cost. SpikF-GO maintains competitive
    accuracy even at substantially smaller embedding dimensions, thereby achieving
    significant energy reductions. To our knowledge, this is among the first works
    to bring graph-based multivariate modeling into the spiking domain for TSF and
    the first to provide a unified comparison across SNN forecasting architectures
    under a common experimental protocol.
- title: Advancing Direct Training for Spiking Neural Networks with Circulate-Firing
    Neurons and Learnable Gradients
  date: 2026-05
  url: https://arxiv.org/abs/2605.27412v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Feifan Zhou
  - Xiang Wei
  - Yang Liu
  - Qiang Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs) have emerged with promising energy-efficient
    property, yet a substantial performance gap persists compared to Artificial Neural
    Networks (ANNs). This gap stems from at least two key limitations: first, conventional
    spiking neurons offer limited information representation capacity, underutilizing
    the rich dynamics of membrane potentials; second, fixed surrogate gradient (SG)
    functions across time steps leads to imprecise gradient propagation, impeding
    effective direct training. To address these two challenges, we propose a new direct
    training algorithm with three core innovations: first, a circulate-firing spiking
    neuron model that enhances information representation capacity by leveraging membrane
    potentials more effectively; second, a time-step-wise learnable surrogate gradient
    function, enabling accurate gradient estimation during backpropagation; third,
    a positive-negative balanced loss function to achieve equilibrium between positive
    and negative membrane potentials and further boost SNN performance. Extensive
    experiments demonstrate that our methods achieve competitive performance across
    multiple datasets. Our methods can generalize seamlessly to advanced architectures
    of Transformer, consistently outperforming existing methods. Our work highlights
    the effectiveness of further harnessing intrinsic membrane dynamics of SNNs for
    performance improvement, and thus open a new avenue for advancing high-performance
    spiking neural architectures.'
- title: Efficient and Robust Spiking Neural Networks for sEMG-Based Muscle Fatigue
    Detection
  date: 2026-07
  url: https://arxiv.org/abs/2607.11065v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Kaiwen Tang
  - Jiaqi Dong
  - Zhanglu Yan
  - Weng-Fai Wong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Detecting muscle fatigue via surface electromyography (sEMG) is essential
    for applications in sports, rehabilitation, and wearable health monitoring. Accurate
    and timely detection of fatigue is crucial for preventing injuries, optimizing
    physical performance, and ensuring user safety during prolonged activity. However,
    existing deep learning models are often unsuitable for this task due to their
    high computational cost and dependence on large-scale data. In this work, we propose
    an energy-efficient framework for muscle fatigue detection based on Spiking Neural
    Networks (SNNs), which exploit sparse, event-driven computation and temporal modeling.
    We further introduce a quantization-compatible training scheme (SDH) that combines
    multiple regularization terms to improve robustness under noisy conditions. Evaluated
    on two public sEMG datasets against a broad set of baselines and under seven noise
    conditions including physically motivated perturbations, our quantized SNNs match
    or exceed strong baselines while remaining more stable under diverse noise and
    reducing estimated energy consumption by up to 201.77x. These results demonstrate
    the framework's strong potential for real-time deployment in low-power wearable
    systems.
- title: 'L-SPINE: A Low-Precision SIMD Spiking Neural Compute Engine for Resource-efficient
    Edge Inference'
  date: 2026-04
  url: https://arxiv.org/abs/2604.03626v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Sonu Kumar
  - Mukul Lokhande
  - Santosh Kumar Vishvakarma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer a promising solution for energy-efficient
    edge intelligence; however, their hardware deployment is constrained by memory
    overhead, inefficient scaling operations, and limited parallelism. This work proposes
    L-SPINE, a low-precision SIMD-enabled spiking neural compute engine for efficient
    edge inference. The architecture features a unified multi-precision datapath supporting
    2-bit, 4-bit, and 8-bit operations, leveraging a multiplier-less shift-add model
    for neuron dynamics and synaptic accumulation. Implemented on an AMD VC707 FPGA,
    the proposed neuron requires only 459 LUTs and 408 FFs, achieving a critical delay
    of 0.39 ns and 4.2 mW power. At the system level, L-SPINE achieves 46.37K LUTs,
    30.4K FFs, 2.38 ms latency, and 0.54 W power. Compared to CPU and GPU platforms,
    it reduces inference latency from seconds to milliseconds, achieving an up to
    three orders-of-magnitude improvement in energy efficiency. Quantisation analysis
    shows that INT2/INT4 configurations significantly reduce memory footprint with
    minimal accuracy loss. These results establish L-SPINE as a scalable and efficient
    solution for real-time edge SNN deployment.
- title: A Formal Tool for Verification of Probabilistic Spiking Neural Networks Based
    on Quotient Abstractions
  date: 2026-06
  url: https://arxiv.org/abs/2606.20674v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Nikan Zandian Jazi
  - Elisabetta De Maria
  - Christopher Leturc
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs) model biological neural dynamics more
    faithfully than classical artificial networks, but their stochastic, event-driven
    computation -- rooted in ion-channel noise and unreliable synaptic vesicle release
    -- demands probabilistic models for which deterministic abstractions are mathematically
    inadequate. Formal verification of such models via probabilistic model checking
    faces a fundamental barrier: the state space explosion problem, where the Discrete-Time
    Markov Chain (DTMC) encoding grows exponentially with the number of neurons. General-purpose
    quotient model abstractions [1] can in principle mitigate this growth by partitioning
    membrane potentials into equivalence classes, but a naïve application to SNNs
    discards synaptic weight information, limiting the properties that can be verified.
    This paper introduces a weight-discretized quotient model abstraction that maps
    continuous synaptic weights to a compact integer range while preserving the relative
    contribution of each synapse, and presents CogSpike, a unified workbench that
    integrates SNN design, simulation, and PRISM-based formal verification within
    a single isomorphic tool chain. The discretization is accompanied by formal correctness
    guarantees: a two-sided fidelity theorem confines any firing disagreement to a
    bounded gray zone around threshold, and an Asymptotic Silence theorem gives the
    exact limit guarantee that unforced neurons fall permanently silent. A topology-dependent
    scaling analysis shows that the state space reduction compounds exponentially
    -- approximately $17\times$ per neuron for discretization parameter $W = 3$ --
    enabling verification of networks that are otherwise intractable, as confirmed
    empirically across seven canonical topologies.'
- title: 'Federated Few-Shot Learning on Neuromorphic Hardware: An Empirical Study
    Across Physical Edge Nodes'
  date: 2026-03
  url: https://arxiv.org/abs/2603.13037v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Steven Motta
  - Gioele Nanni
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Federated learning on neuromorphic hardware remains unexplored because
    on-chip spike-timing-dependent plasticity (STDP) produces binary weight updates
    rather than the floating-point gradients assumed by standard algorithms. We build
    a two-node federated system with BrainChip Akida AKD1000 processors and run approximately
    1,580 experimental trials across seven analysis phases. Of four weight-exchange
    strategies tested, neuron-level concatenation (FedUnion) consistently preserves
    accuracy while element-wise weight averaging (FedAvg) destroys it (p = 0.002).
    Domain-adaptive fine-tuning of the upstream feature extractor accounts for most
    of the accuracy gains, confirming feature quality as the dominant factor. Scaling
    feature dimensionality from 64 to 256 yields 77.0% best-strategy federated accuracy
    (n=30, p &lt; 0.001). Two independent asymmetries (wider features help federation
    more than individual learning, while binarization hurts federation more) point
    to a shared prototype complementarity mechanism: cross-node transfer scales with
    the distinctiveness of neuron prototypes.'
- title: Dendritic In-Context Learning in a Single-Layer Spiking Neural Network
  date: 2026-07
  url: https://arxiv.org/abs/2607.02283v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Juwei Shen
  - Yujie Wu
  - Changwen Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In-context learning (ICL) operates via implicit gradient descent embedded
    in the forward pass of modern AI architectures -- Transformers, Mamba, state-space
    models, and MLPs. Capturing this capability in biologically plausible Spiking
    Neural Networks (SNNs) has remained an open challenge: existing SNNs fail the
    Garg-2022 benchmark at non-trivial task dimensions. We trace this failure to a
    structural assumption: prior SNN designs route adaptation through inference-time
    synaptic plasticity, viewing the dendritic compartment as a passive conduit for
    error or teacher signals. We challenge this assumption. The subthreshold dynamics
    of a single dendritic compartment already implement a complete online learning
    algorithm. By treating the compartment as the computational substrate rather than
    a passive conduit, we propose DendriCL -- a single-layer compartmental spiking
    architecture whose apical recurrence is structurally identical to leaky online
    Widrow-Hoff LMS. This dynamics-only update collapses the architectural depth required
    for general-purpose ICL to a single layer. DendriCL is uniquely seed-stable at
    super-dimensional Garg-2022 ICL -- where dense Transformers exhibit grokking-style
    instability and fail past moderate task dimension -- and a linear probe recovers
    the reference online-LMS trajectory directly from the apical membrane at R^2 =
    0.93, showing the algorithm is structurally embedded in the dynamics rather than
    implicitly discovered during training. Taken together, ICL requires neither attention,
    depth, nor inference-time plasticity: a single compartment with online-LMS dynamics
    is sufficient.'
- title: 'ShiftLIF: Efficient Multi-Level Spiking Neurons with Power-of-Two Quantization'
  date: 2026-05
  url: https://arxiv.org/abs/2605.01866v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Kaiwen Tang
  - Di Yu
  - Jiaqi Zheng
  - Changze Lv
  - Qianhui Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) are promising for edge sensing due to their
    event-driven computation and temporal filtering capability. However, standard
    leaky integrate-and-fire (LIF) neurons communicate only through binary spikes,
    which severely limit representational capacity. Existing multi-level spiking neurons
    improve information transmission, but often rely on uniform quantization that
    mismatches membrane-potential distributions or introduces costly synaptic multiplications.
    In this paper, we propose ShiftLIF, a multi-level spiking neuron that maps membrane
    potentials to a logarithmically spaced power-of-two spike set. This design provides
    finer representation in the small-amplitude regime, where membrane potentials
    are densely concentrated, while enabling multiplier-free synaptic computation
    through bit-shift and accumulation operations. As a result, ShiftLIF improves
    spike-level expressiveness without sacrificing the hardware-friendly nature of
    standard SNN computation. We evaluate ShiftLIF on 10 datasets spanning wireless,
    acoustic, motion, and visual sensing tasks. Results show that ShiftLIF consistently
    matches or exceeds the accuracy of existing multi-level spiking neurons while
    maintaining synaptic energy consumption close to standard binary LIF. These results
    indicate that ShiftLIF provides a favorable accuracy-efficiency trade-off for
    cross-modal edge sensing.
- title: 'BiSpikCLM: A Spiking Language Model integrating Softmax-Free Spiking Attention
    and Spike-Aware Alignment Distillation'
  date: 2026-04
  url: https://arxiv.org/abs/2605.13859v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Sihang Guo
  - Chenlin Zhou
  - Jiaqi Wang
  - Kehai Chen
  - Qingyan Meng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer promising energy-efficient alternatives
    to large language models (LLMs) due to their event-driven nature and ultra-low
    power consumption. However, to preserve capacity, most existing spiking LLMs still
    incur intensive floating-point matrix multiplication (MatMul) and nonlinearities,
    or training difficulties arising from the complex spatiotemporal dynamics. To
    address these challenges, we propose BiSpikCLM, the first fully binary spiking
    MatMul-free causal language model. BiSpikCLM introduces Softmax-Free Spiking Attention
    (SFSA), eliminating softmax and floating-point operations in autoregressive language
    modeling. For efficient training, we introduce Spike-Aware Alignment Distillation
    (SpAD), which aligns ANN teacher and SNN student across embeddings, attention
    maps, intermediate features, and output logits. SpAD framework allows BiSpikCLM
    to reach comparable performance to ANN counterparts using substantially fewer
    training tokens (e.g., only 5.6% of the tokens for the 1.3B model). As a result,
    BiSpikCLM achieves competitive performance at only 4.16% - 5.87% of the computational
    cost on natural language generation tasks. Our results highlight the feasibility
    and effectiveness of fully binary spike-driven LLMs and establish the distillation
    as a promising pathway for brain-inspired spiking NLP.
- title: Test-Time Adaptation of Spiking Neural Networks for Intracortical Neural
    Decoding using Membrane Potential Alignment
  date: 2026-06
  url: https://arxiv.org/abs/2606.14866v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Guangzhi Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Intracortical brain-computer interfaces suffer from day-to-day neural
    signal shifts that degrade pretrained decoders. Existing unsupervised adaptation
    methods rely on deep recurrent or adversarial architectures that are too computationally
    expensive for implantable hardware. We propose Membrane Potential Alignment (MPA),
    a test-time adaptation method for spiking neural networks that realigns a pretrained
    decoder to shifted recordings by only matching membrane potential distributions
    via KL divergence. By restricting updates to low-rank (LoRA) weights, MPA adapts
    fewer than 9% of parameters. On a non-human primate reaching task spanning over
    one month, MPA achieves performance competitive with the state-of-the-art NoMAD
    method, while using a simpler architecture and finer temporal resolution (4 ms
    vs. 20 ms). These results show that efficient SNN-based test-time adaptation is
    a practical path toward long-term, recalibration-free brain-computer interfaces.
- title: Optimal Memory Encoding Through Fluctuation-Response Structure
  date: 2026-03
  url: https://arxiv.org/abs/2603.21666v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Lianxiang Cui
  - Kohei Nakajima
  - Kazuyuki Aihara
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Physical reservoir computing exploits the intrinsic dynamics of physical
    systems for information processing, while keeping the internal dynamics fixed
    and training only linear readouts; yet the role of input encoding remains poorly
    understood. We show that optimal input encoding is a geometric problem governed
    by the system's fluctuation-response structure. By measuring steady-state fluctuations
    and linear response, we derive an analytical criterion for the input direction
    that maximizes task-specific linear memory under a fixed power constraint, termed
    Response-based Optimal Memory Encoding (ROME). Backpropagation-based encoder optimization
    is shown to be equivalent to ROME, revealing a trade-off between task-dependent
    feature mixing and intrinsic noise. We apply ROME to various reservoir platforms,
    including spin-wave waveguides and spiking neural networks, demonstrating effective
    encoder design across physical and neuromorphic reservoirs, even in non-differentiable
    systems.
- title: 'SpikingMOT: A Spike-Driven Multi-Object Tracker'
  date: 2026-07
  url: https://arxiv.org/abs/2607.19875v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yiding Sun
  - Xiangyang Yang
  - Dongxu Zhang
  - Qirui Wang
  - Zijie Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multi-object tracking (MOT) plays a fundamental role in visual perception,
    where accurate trajectory prediction is essential for reliable target association
    under complex motion patterns. Recent trackers have improved motion modeling with
    densely activated artificial neural networks, yet they largely overlook whether
    such dense responses are necessary for trajectory prediction. In this paper, we
    formulate activation sparsity preference (ASP) by tackling two key questions:
    1. How can we identify a model architecture that appropriately and formally explains
    ASP, and 2. How can we translate this explanation into competitive tracking performance.
    Theoretical analysis shows that sparse gating is no worse than state-independent
    dropout under the same activation rate. Based on this insight, SpikingMOT is proposed
    as a spike-driven tracker that adaptively models sparse trajectory dynamics with
    spiking neural networks (SNNs). Specifically, SpikingMOT decomposes each trajectory
    state into pseudo-trajectory bases and uses the current prediction error to calibrate
    the posterior for next-frame prediction. With this brain-inspired loop, SpikingMOT
    achieves state-of-the-art performance in extensive experiments, 74.9 HOTA on SportsMOT
    and 56.5 HOTA on DanceTrack, while reducing the parameters and energy by 72% and
    86.7%, respectively. These results bring SNNs into MOT, opening a promising direction
    for efficient tracking.'
- title: Energy-Efficient Implementation of Spiking Recurrent Cells on FPGA
  date: 2026-05
  url: https://arxiv.org/abs/2605.10679v3
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Pascal Harmeling
  - Florent De Geeter
  - Guillaume Drion
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) can reduce energy consumption compared
    to conventional Artificial Neural Networks (ANNs) when spiking activity is sparse
    and the neuron model is hardware-friendly. However, biologically faithful models
    are often too costly to implement on FPGAs, whereas very simple models (e.g.,
    IR/LIF) sacrifice part of the neuronal dynamics. In this work, we present an FPGA
    accelerator for an SNN using Spiking Recurrent Cell (SRC) neurons, providing a
    trade-off between biological plausibility and hardware cost. We propose a set
    of mathematical simplifications that remove costly unary operators (\textit{tanh},
    \textit{exp}) and avoid floating-point arithmetic through scaling and piecewise-defined
    approximations. The complete network is implemented in VHDL and validated using
    spiking traces derived from the MNIST dataset. The weight matrices computed off-line
    are stored directly in LUT-registers without any adaptation. This demonstrates
    the robustness of SRC cells. Experiments were conducted on an Artix-7 XC7A200T
    clocked at 100 MHz. The reference implementation achieves 96.31\% accuracy with
    a 220-image spiking trace and a processing time of 1.7424 ms per digit. We then
    investigate accuracy/energy trade-offs by reducing the spiking trace length and
    quantizing synaptic weights down to 4 bits, achieving 93.32\% accuracy at 0.55
    mJ per digit (55 images, 5-bit weights) and 92.89\% at 0.45 mJ (44 images, 4-bit
    weights). These results show that SRC-based SNNs can deliver competitive performance
    with reduced energy consumption, while preserving richer neuronal dynamics than
    standard LIF/IR models.
- title: Frequency Matching in Spiking Neural Networks for mmWave Sensing
  date: 2026-05
  url: https://arxiv.org/abs/2605.09983v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Di Yu
  - Zhenyu Liao
  - Changze Lv
  - Wentao Tong
  - Linshan Jiang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Millimeter-wave (mmWave) sensing enables privacy-preserving, always-on
    edge perception, but its measurements are often sparse, temporally irregular,
    and corrupted by high-frequency noise. Existing mmWave pipelines predominantly
    rely on artificial neural networks (ANNs), which achieve robustness through extensive
    preprocessing or deep architectures, thereby limiting their efficiency on edge
    devices. In this work, we study spiking neural networks (SNNs) for mmWave sensing
    from a mechanism-data alignment perspective. By leveraging the low-pass filtering
    behavior of leaky integrate-and-fire (LIF) dynamics, we analyze how their implicit
    temporal filtering interacts with the frequency structure of mmWave signals. Our
    analysis shows that when discriminative information resides in low-to-mid frequencies,
    LIF dynamics can inherently suppress high-frequency noise, clarifying when and
    why SNNs outperform ANNs. Based on this insight, we derive a principled criterion
    for configuring the membrane decay factor by matching the effective bandwidth
    of LIF dynamics to the data's discriminative spectral content. Experimental results
    across four widely used mmWave datasets validate the proposed frequency-matching
    hypothesis, yielding an average test-accuracy improvement of 6.22% and a 3.64$\times$
    reduction in theoretical energy consumption relative to ANN baselines, under a
    unified evaluation protocol.
- title: 'Ge$^\text{2}$mS-T: Multi-Dimensional Grouping for Ultra-High Energy Efficiency
    in Spiking Transformer'
  date: 2026-04
  url: https://arxiv.org/abs/2604.08894v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Zecheng Hao
  - Shenghao Xie
  - Kang Chen
  - Wenxuan Liu
  - Zhaofei Yu
  venue: ''
  code_url: https://github.com/hzc1208/Ge2mST
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer superior energy efficiency over Artificial
    Neural Networks (ANNs). However, they encounter significant deficiencies in training
    and inference metrics when applied to Spiking Vision Transformers (S-ViTs). Existing
    paradigms including ANN-SNN Conversion and Spatial-Temporal Backpropagation (STBP)
    suffer from inherent limitations, precluding concurrent optimization of memory,
    accuracy and energy consumption. To address these issues, we propose Ge$^\text{2}$mS-T,
    a novel architecture implementing grouped computation across temporal, spatial
    and network structure dimensions. Specifically, we introduce the Grouped-Exponential-Coding-based
    IF (ExpG-IF) model, enabling lossless conversion with constant training overhead
    and precise regulation for spike patterns. Additionally, we develop Group-wise
    Spiking Self-Attention (GW-SSA) to reduce computational complexity via multi-scale
    token grouping and multiplication-free operations within a hybrid attention-convolution
    framework. Experiments confirm that our method can achieve superior performance
    with ultra-high energy efficiency on challenging benchmarks. To our best knowledge,
    this is the first work to systematically establish multi-dimensional grouped computation
    for resolving the triad of memory overhead, learning capability and energy budget
    in S-ViTs. Code is available at https://github.com/hzc1208/Ge2mST.
- title: 'Rare Events, Real Signals: Functional Ensembles as Units of Computation
    in Deep Spiking Networks'
  date: 2026-05
  url: https://arxiv.org/abs/2606.00073v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Aditi Aravind
  - Konstantinos Ladakis
  - Mario Alexios Savaglio
  - Stelios M. Smirnakis
  - Maria Papadopouli
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We investigate how internal representations emerge across hierarchical
    processing systems by introducing a neuroscience-inspired framework for analyzing
    deep spiking neural networks (SNN) through the lens of functional connectivity.
    Drawing on concepts from systems neuroscience and information theory, we form
    the first-order functionally-connected (1FC) group of a neuron based on its statistically
    significant pairwise correlations with neurons from the previous layer of a trained
    SNN architecture. We then track its response properties during inference under
    various conditions. Our analysis shows that several principles of functional connectivity
    previously observed in biological cortex are preserved in spiking ResNet architectures.
    These 1FC ensembles display interesting properties: their aggregate cofiring reliably
    predicts downstream neuronal responses through a robust, ReLU-like input-output
    relationship, whose gain scales systematically with ensemble size. Reliable encoding
    of the presented class emerges only during high 1FC cofiring events, which themselves
    occur infrequently, indicating that informative representations are concentrated
    in rare but highly coordinated activity patterns. Under uniform random noise or
    adversarial perturbations, these response profiles are disrupted, particularly
    in early and intermediate layers. This enables a targeted high-resolution interrogation
    at specific nodes and pathways. We showed that the functional connectivity structure
    is shaped by learning and this structure breaks under weight permutation. These
    establish 1FC ensembles as a functionally meaningful substrate for input encoding
    and information transfer, with potential implications in designing targeted fine-grained
    diagnostics on the information flow.'
- title: Sharpness Aware Surrogate Training for Spiking Neural Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.18039v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Maximilian Nicholson
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Surrogate gradients are a standard tool for training spiking neural networks
    (SNNs), but conventional hard forward or surrogate backward training couples a
    nonsmooth forward model with a biased gradient estimator. We study sharpness aware
    Surrogate Training (SAST), which applies sharpness aware Minimization (SAM) to
    a surrogate forward SNN trained by backpropagation. In this formulation, the optimization
    target is an ordinary smooth empirical risk, so the training gradient is exact
    for the auxiliary model being optimized. Under explicit boundedness and contraction
    assumptions, we derive compact state stability and input Lipschitz bounds, establish
    smoothness of the surrogate objective, provide a first order SAM approximation
    bound, and prove a nonconvex convergence guarantee for stochastic SAST with an
    independent second minibatch. We also isolate a local mechanism proposition, stated
    separately from the unconditional guarantees, that links per sample parameter
    gradient control to smaller input gradient norms under local Jacobian conditioning.
    Empirically, we evaluate clean accuracy, hard spike transfer, corruption robustness,
    and training overhead on N-MNIST and DVS Gesture. The clearest practical effect
    is transfer gap reduction: on N-MNIST, hard spike accuracy rises from 65.7% to
    94.7% (best at $ρ=0.30$) while surrogate forward accuracy remains high; on DVS
    Gesture, hard spike accuracy improves from 31.8% to 63.3% (best at $ρ=0.40$).
    We additionally specify the compute matched, calibration, and theory alignment
    controls required for a final practical assessment.'
- title: An Optimization Framework for Automated Assessment of Biological Plausibility
    of Spiking Neurons
  date: 2026-06
  url: https://arxiv.org/abs/2606.17853v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Sven Nitzsche
  - Alexandru Ionita
  - Andreas Faust
  - Bogdan Ionescu
  - Juergen Becker
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Biological plausibility is a key concept in neuromorphic computing and
    spiking neural networks, yet it remains inconsistently defined and difficult to
    quantify. In this work, we present an open-source framework for the automated
    assessment of biological plausibility in spiking neuron models. Our method builds
    on the idea of evaluating a model's ability to replicate canonical neuronal firing
    patterns observed in biological systems, following the classification proposed
    by Izhikevich. By encoding these patterns into objective functions and optimizing
    model parameters accordingly, our framework enables empirical assessment without
    requiring prior analytical modeling. Treating neuron models as black boxes, it
    provides a practical and flexible means of characterizing their dynamic capabilities.
    We demonstrate the effectiveness of the framework on several established models
    and a previously unexplored custom model. Implemented in Python and compatible
    with PyTorch and the Norse library, the framework is tailored for machine learning
    contexts. It is intended as a starting point for systematic research into the
    relationship between biological plausibility and network-level performance metrics
    such as accuracy, energy efficiency, robustness, and adaptability.
- title: Neuromorphic Parameter Estimation for Power Converter Health Monitoring Using
    Spiking Neural Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.15714v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Hyeongmeen Baik
  - Hamed Poursiami
  - Maryam Parsa
  - Jinia Roy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Always-on converter health monitoring demands sub-mW edge inference,
    a regime inaccessible to GPU-based physics-informed neural networks. This work
    separates spiking temporal processing from physics enforcement: a three-layer
    leaky integrate-and-fire SNN estimates passive component parameters while a differentiable
    ODE solver provides physics-consistent training by decoupling the ODE physics
    loss from the unrolled spiking loop. On an EMI-corrupted synchronous buck converter
    benchmark, the SNN reduces lumped resistance error from $25.8\%$ to $10.2\%$ versus
    a feedforward baseline, within the $\pm 10\%$ manufacturing tolerance of passive
    components, at a projected ${\sim}270\times$ energy reduction on neuromorphic
    hardware. Persistent membrane states further enable degradation tracking and event-driven
    fault detection via a $+5.5$ percentage-point spike-rate jump at abrupt faults.
    With $93\%$ spike sparsity, the architecture is suited for always-on deployment
    on Intel Loihi 2 or BrainChip Akida.'
- title: 'CLANE: Continual Learning of Actions on Neuromorphic Hardware from Event
    Cameras'
  date: 2026-05
  url: https://arxiv.org/abs/2605.28387v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Elvin Hajizada
  - Michael Neumeier
  - Edward Paxon Frady
  - Yulia Sandamirskaya
  - Axel von Arnim
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Recognizing and continuously learning novel human actions without forgetting
    prior classes is a requirement for emerging AR/VR and robotics applications. For
    these applications, both on-device processing and learning are essential for privacy
    and low-latency adaptation. Event cameras address the efficiency of visual sensing
    with sparse, asynchronous output that is naturally compatible with neuromorphic
    processing. Yet no prior system has deployed a continual on-device learning pipeline
    for event-based action recognition using neuromorphic hardware. We present CLANE,
    Continual Learning of Actions on Neuromorphic Hardware from Event Cameras, deployed
    end-to-end on Intel Loihi 2. CLANE combines a spiking 2D CNN for spatiotemporal
    feature extraction with CLP-SNN as its on-chip learning head, extended to action
    clips via a Temporal Aggregation Layer and a fixed-point Normalization Layer,
    both novel Loihi 2 modules. On THU E-ACT-50, a 50-class dataset captured under
    real-world conditions, CLANE achieves 70.4% accuracy in a continual learning task
    while delivering more than 100x energy reduction and 16x lower latency over a
    sequential CNN+GRU+CLP edge GPU baseline, validated through iso-algorithm cross-platform
    benchmarking across three evaluation levels.
- title: 'Spike-HTR: Spiking Neural Transformer for Handwritten Text Recognition'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01646v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Xiubo Liang
  - Jinxing Han
  - Yuke Li
  - Haoqi Zhu
  - Yu Zhao
  venue: ''
  code_url: https://github.com/QomolangmaH/SpikeHTR
  project_url: ''
  abstract: 'Handwritten Text Recognition (HTR) is computationally imbalanced in two
    ways: most image pixels are background, and many width-axis sequence positions
    are blank-dominated. This creates a mismatch for Spiking Neural Networks (SNNs):
    handwriting is observed as a static image, whereas spiking computation unfolds
    over timesteps. We propose Spike-HTR, a hybrid spiking recognizer that controls
    both the number of spiking steps and the number of width positions processed by
    the deep sequence mixer. To make a static image suitable for short-horizon spiking
    inference, InkCoder converts it into a coarse-to-fine input stream, where early
    steps cover broad stroke regions and later steps emphasize sharper stroke details.
    To reduce sequence computation, a CTC-guided length reducer keeps likely character
    or uncertain positions and compresses long blank-dominated stretches before deep
    mixing. With $T{=}2$, Spike-HTR trains only on target data, decodes without language
    models or lexicons, and reaches validation/test CERs of 3.5/5.4, 2.3/2.5, and
    4.2/3.9 on IAM, LAM, and READ2016. Codes are available at https://github.com/QomolangmaH/SpikeHTR.'
- title: Characterization of Off-wafer Pulse Communication in BrainScaleS Neuromorphic
    System
  date: 2026-03
  url: https://arxiv.org/abs/2603.24854v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Bernhard Vogginger
  - Vasilis Thanasoulis
  - Johannes Partzsch
  - Christian Mayr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Neuromorphic VLSI systems take inspiration from biology to enable efficient
    emulation of large-scale spiking neural networks and to explore new computational
    paradigms. To establish large neuromorphic systems, a sophisticated routing infrastructure
    is needed to communicate spikes between chips and to/from the host computer. For
    the BrainScaleS wafer-scale neuromorphic system considered in this work, especially
    the stimulation with input spikes and the recording of spikes is demanding, requiring
    high bandwidth and temporal resolution due to the accelerated emulation of neural
    dynamics 10.000 faster than biological real time. Here, we present a systematic
    characterization of the BrainScaleS off-wafer communication infrastructure implemented
    around Kintex7 FPGAs. The communication flow is characterized in terms of throughput,
    transmission delay, jitter and pulse loss. Further, we analyze the effect of the
    communication distortions (like pulse loss and jitter) on a neural benchmark model
    with highly varying spike activity. The presented methods and techniques for communication
    evaluation are general applicable and provide useful insights for the mapping
    of network models to the hardware such as the distribution of input spikes across
    communication channels.
- title: Robust PnP on a Neuromorphic Processor for Object Pose Estimation
  date: 2026-07
  url: https://arxiv.org/abs/2607.16834v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Tam Ngoc-Bang Nguyen
  - Mohsi Jawaid
  - Tat-Jun Chin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Neuromorphic computing is gaining attention in robotic perception due
    to its higher energy efficiency. While neural network-based methods can more readily
    exploit the distributed and parallelized structure of neuromorphic computers,
    crafting neuromorphic solutions for non-learning tasks is less straightforward.
    This hampers the usage of neuromorphic computing for perception pipelines that
    depend on both learning and non-learning components, such as object pose estimation
    (OPE) where state-of-the-art methods use a deep network to predict 2D landmarks
    and nonlinear optimization to solve perspective-n-point (PnP). In this paper,
    we propose a novel neuromorphic-deployable formulation for robust PnP, where given
    outlier-prone 2D-3D correspondences, the object pose with the largest number of
    inliers is determined. Underpinning our method is a distributed algorithm for
    robust least squares estimation of rigid body pose that can be executed on a neuromorphic
    processor. We also design a spiking neural network (SNN) to predict 2D landmarks
    from event data, where the main layers of the SNN were designed according to the
    principles of spiking neurons. Overall, our work enables neuromorphic treatment
    of the major stages of an OPE pipeline, from event sensing and learned landmark
    prediction, to geometric optimization for robust PnP. Results on neuromophic hardware
    (Intel Loihi 2) indicate the higher energy efficiency our neuromorphic robust
    PnP, while achieving competitive accuracy.
- title: 'The SpiNNaker2 chip: a many-core platform for flexible and scalable brain-inspired
    computing'
  date: 2026-07
  url: https://arxiv.org/abs/2607.24396v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Stefan Scholze
  - Johannes Partzsch
  - Sebastian Höppner
  - Florian Kelber
  - Andreas Dixius
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In deep learning, efficiency gets more and more important to compensate
    for the ongoing growth in model sizes and applications. Neuromorphic hardware
    has long been advocated as an upcoming alternative to deep networks, taking inspiration
    from the brain for achieving unprecedented energy efficiency. However, demonstrations
    of these gains only recently began to grow in complexity and real-world applicability.
    With SpiNNaker2, we present a chip that bridges the gap between deep networks
    and neuromorphic computing and allows for flexible exploration of computing approaches
    that combine both worlds. It features 152 processing elements equipped with an
    ARM M4F processor and dedicated accelerators, an extended SpiNNaker routing fabric
    for scalable event-based communication and a range of external interfaces for
    system integration, including Gbit Ethernet and an LPDDR4 memory interface. We
    demonstrate performance and efficiency of the SpiNNaker2 chip for neuromorphic
    and deep network workloads, as well as novel event-based computing approaches.
    For deep network workloads, the chip achieves up to 4.5 TOPS in high performance
    mode and up to 2.7 TOPS/W efficiency in high efficiency mode for INT8 workloads.
    The chip supports spiking neural networks with &gt;150000 neurons and &gt;1.8
    billion synaptic events/s when simulated with a 1 ms time step. Its low baseline
    power of less than 250 mW allows for efficiency even under varying workload conditions,
    allowing to explore sparse and event-based modes of computation. All this demonstrates
    the chip's capabilities as a universal hardware platform for scalable brain-inspired
    computing and its combinations with mainstream deep network approaches.
- title: 'S2Act: Simple Spiking Actor'
  date: 2026-03
  url: https://arxiv.org/abs/2603.15725v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Ugur Akcal
  - Seung Hyun Kim
  - Mikihisa Yuasa
  - Hamid Osooli
  - Jiarui Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural networks (SNNs) and biologically-inspired learning mechanisms
    are attractive in mobile robotics, where the size and performance of onboard neural
    network policies are constrained by power and computational budgets. Existing
    SNN approaches, such as population coding, reward modulation, and hybrid artificial
    neural network (ANN)-SNN architectures, have shown promising results; however,
    they face challenges in complex, highly stochastic environments due to SNN sensitivity
    to hyperparameters and inconsistent gradient signals. To address these challenges,
    we propose simple spiking actor (S2Act), a computationally lightweight framework
    that deploys an RL policy using an SNN in three steps: (1) architect an actor-critic
    model based on an approximated network of rate-based spiking neurons, (2) train
    the network with gradients using compatible activation functions, and (3) transfer
    the trained weights into physical parameters of rate-based leaky integrate-and-fire
    (LIF) neurons for inference and deployment. By globally shaping LIF neuron parameters
    such that their rate-based responses approximate ReLU activations, S2Act effectively
    mitigates the vanishing gradient problem, while pre-constraining LIF response
    curves reduces reliance on complex SNN-specific hyperparameter tuning. We demonstrate
    our method in two multi-agent stochastic environments (capture-the-flag and parking)
    that capture the complexity of multi-robot interactions, and deploy our trained
    policies on physical TurtleBot platforms using Intel''s Loihi neuromorphic hardware.
    Our experimental results show that S2Act outperforms relevant baselines in task
    performance and real-time inference in nearly all considered scenarios, highlighting
    its potential for rapid prototyping and efficient real-world deployment of SNN-based
    RL policies.'
- title: Low-Power, Neuromorphic, Acoustic Anomaly Detection for Persistent Machine
    Monitoring
  date: 2026-08
  url: https://arxiv.org/abs/2608.18341v1
  category: neuromorphic-hardware
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Persistent acoustic monitoring can detect machine faults without physical
    contact, but always-on inference is constrained by power, latency, and deployment
    complexity. We demonstrate autoencoder-based acoustic anomaly detection on an
    Intel Loihi 2 neuromorphic processor under clean and noisy conditions. Log-mel
    features are computed off chip; normalization, autoencoder inference, L1 reconstruction
    scoring, and thresholding run on chip. In a clean, microphone-position-invariant
    ToyADMOS ToyCar benchmark, the on-chip model achieves 0.9959 AUC and 0.9785 standardized
    pAUC at maximum false-positive rate 0.1. In the DCASE 2026 Task 2 ToyCar noisy
    benchmark, the model achieves source AUC 0.7990, target AUC 0.6466, and pAUC 0.6426,
    exceeding reported baseline metrics. Power profiling on a 16-chip Loihi 2 VPX
    system shows real-time throughput with 0.0406$\unicode{x2013}$0.0426 mJ dynamic
    energy per sample, two orders of magnitude lower than both a CPU and GPU. These
    results support neuromorphic acoustic anomaly detection as a practical candidate
    for low-power, persistent machine monitoring.
- title: On the Role of Preprocessing and Memristor Dynamics in Reservoir Computing
    for Image Classification
  date: 2026-04
  url: https://arxiv.org/abs/2604.21602v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Rishona Daniels
  - Duna Wattad
  - Ronny Ronen
  - David Saad
  - Shahar Kvatinsky
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reservoir computing (RC) is an emerging recurrent neural network architecture
    that has attracted growing attention for its low training cost and modest hardware
    requirements. Memristor-based circuits are particularly promising for RC, as their
    intrinsic dynamics can reduce network size and parameter overhead in tasks such
    as time-series prediction and image recognition. Although RC has been demonstrated
    with several memristive devices, a comprehensive evaluation of device-level requirements
    remains limited. In this paper, we analyze and explain the operation of a parallel
    delayed feedback network (PDFN) RC architecture with volatile memristors, focusing
    on how device characteristics -- such as decay rate, quantization, and variability
    -- affect reservoir performance. We further discuss strategies to improve data
    representation in the reservoir using preprocessing methods and suggest potential
    improvements. The proposed approach achieves 95.89% classification accuracy on
    MNIST, comparable with the best reported memristor-based RC implementations. Furthermore,
    the method maintains high robustness under 20% device variability, achieving an
    accuracy of up to 94.2%. These results demonstrate that volatile memristors can
    support reliable spatio-temporal information processing and reinforce their potential
    as key building blocks for compact, high-speed, and energy-efficient neuromorphic
    computing systems.
- title: Programmable superconducting neuron with intrinsic in-memory computation
    and dual-timescale plasticity for ultra-efficient neuromorphic computing
  date: 2026-03
  url: https://arxiv.org/abs/2603.04966v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Muen Wang
  - Shucheng Yang
  - Yuxiang Lin
  - Yuntian Gao
  - Xue Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The escalating energy demands of artificial intelligence pose a critical
    challenge to conventional computing. Leveraging the efficiency of event-driven,
    in-memory neuromorphic architectures into the superconducting circuits with ultra-high
    speed and low power dissipation advantages offers a promising solution to energy-efficient
    computing. However, the potential of such a solution has yet to be realized, owning
    to the absence of a fundamental superconducting unit that unifies programmability,
    local memory, and multi-timescale plasticity. Here, we introduce a programmable
    Josephson-junction-based leaky integrate-and-fire (LIF) neuron that features intrinsic
    static memory and precise programmability by encoding somatic and synaptic parameters
    directly in the bias current. This neuron is also capable of dual-timescale plasticity:
    picosecond-scale short-term modulation of spike transmission and long-term weight
    retention exceeding 10,000 seconds, facilitating both rapid temporal adaptation
    and robust weight storage. It can operate up to 45 GHz with femtojoule-level energy
    dissipation per spike, and supports 10 somatic threshold levels and 20 synaptic
    states. Furthermore, we demonstrate a crossbar-based spiking neural network (SNN)
    utilizing this neuron, which achieves outstanding performance across multiple
    tasks. By fusing computation, memory and plasticity into a single superconducting
    unit, our work paves the way for the next generation of ultrafast, energy-efficient
    neuromorphic computing.'
- title: 'AIGOR: A Modular, Event-Driven Neuromorphic Architecture for Configurable
    SNN Inference'
  date: 2026-07
  url: https://arxiv.org/abs/2607.03191v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Pierpaolo Perticaroli
  - Roberto Ammendola
  - Andrea Biagioni
  - Ottorino Frezza
  - Francesca Lo Cicero
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural networks (SNNs) run today on a fragmented landscape of
    hardware: dedicated neuromorphic processors, application-specific FPGA accelerators,
    and large-scale neuroscience simulators, each typically built around a fixed neuron
    model, execution strategy, or workload class. We present AIGOR, a modular, event-driven
    neuromorphic architecture for spiking neural network inference. AIGOR organizes
    neurons into timestep-synchronized processing cores that exchange spikes as packets
    over a packet-switched communication layer, and it is assembled from a library
    of parameterized compute, memory, and communication IP blocks rather than as a
    one-off design for a single network. The neuron model, numeric precision, the
    folding of neurons onto hardware, and the partitioning across cores are configured
    per instance rather than committed at design time; a single declarative specification
    then generates the cores, neuron kernels, and synaptic-memory images that realize
    a given network. We validate a first prototype on the AMD Versal VPK180 across
    two deliberately different workloads mapped onto the same cores: a feedforward
    image classifier trained in snnTorch and a recurrent bal anced random network
    modeled in NEST. The classifier reproduces its snnTorch reference accuracy, and
    the recurrent network matches its NEST reference at spike-level precision across
    multiple cores spanning two FPGAs. We report post-implementation resource utilization
    and validate the multi-node synchronization scheme in simulation up to one thousand
    cores on a three-dimensional torus. The prototype''s measured limits localize
    the throughput bottleneck in the synaptic-delivery datapath and the global timestep
    barrier, and motivate a set of datapath refinements, now in development, that
    the configurable structure of the architecture admits as changes to the same cores.'
- title: 'Nanoscale memristive devices: Threats and solutions'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18978v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Amir M. Hajisadeghi
  - Javad Talafy
  - Hamid R. Zarandi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Due to their incentivizing features, memristors are a promising candidate
    for replacing CMOS-based memories, which are faced with various functional challenges
    in deep submicron process technologies. Memristors are nonvolatile, have low leakage,
    and are dense in comparison to CMOS-based memories like SRAM. In this regard,
    resistive RAM (ReRAM) and spin-transfer-torque RAM (STT-RAM) memristors are distinguished
    among other memristor-based memory technologies, due to their superiority in process
    maturity and metrics such as memory operation energy, memory latency, and area.
    Hence, this chapter focuses on these two memristor-based memory technologies.
    Despite the good features of these types of memory, they suffer from some reliability
    threats. Reliability parameters affect each other, and examining their positive
    and negative effects has a significant impact on the effectiveness of the proposed
    solutions. In one view, the threats can be categorized into two classes: (1) read/write
    error and (2) soft error. In this chapter, we comprehensively describe these threats
    and present the state-of-the-art solutions that enable the widespread use of memristors,
    particularly ReRAM and STT-RAM, in different applications. Finally, we introduce
    the emerging ability of memristors as a computing unit aiming to minimize data
    restoration in computing, and we show how to perform logic and arithmetic computation
    in a crossbar array.'
- title: Compact and Energy-Efficient Memristive Spiking Neuromorphic Accelerator
    for Bio-inspired Interception Tasks
  date: 2026-05
  url: https://arxiv.org/abs/2605.31141v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Qianhou Qu
  - Sheng Lu
  - Sungyong Jung
  - Qilian Liang
  - Chenyun Pan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) provide an efficient event-driven computing
    paradigm for bio-inspired interception tasks. However, most implementations rely
    on von Neumann digital computing platforms, where memory and computation bottlenecks
    limit energy efficiency. This work presents a compact and energy-efficient memristive
    neuromorphic accelerator for bio-inspired interception tasks. A novel one-transistor-one-resistor
    (1T1R) crossbar array is designed to emulate synaptic operations in the in-memory
    computing (IMC) domain, while circuit-level optimization mitigates membrane drift
    and improves integration fidelity. In addition, an integrate-and-fire (IF) neuron
    with separated input and membrane nodes is developed to improve inference robustness
    during array-interfaced operation. Implemented in the SkyWater SKY130 PDK, the
    proposed neuron achieves an energy consumption of 10.67 pJ/spike and an area of
    906 um^2. System-level results show that the memristive IMC output closely matches
    the software SNN baseline, with a correlation coefficient of 0.9622, while achieving
    a 96% interception success rate. These results demonstrate the effectiveness of
    the proposed design for compact and reliable memristive SNN inference in bio-inspired
    interception tasks.
- title: Uncertainty-triggered wake-up enables energy-efficient, error-resilient edge
    AI with memristor front ends
  date: 2026-05
  url: https://arxiv.org/abs/2605.29533v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Théo Ballet
  - Aymen Romdhane
  - Bruno Lovison-Franco
  - Théo Dupuis
  - Adrien Renaudineau
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Memristor computing offers a route to low-energy edge AI, but device variability,
    sensitivity to operating conditions, and system-integration challenges can hinder
    deployment. Here we show that these limitations can be mitigated by using memristor
    AI not as the final decision maker but as the ultra-low-power, always-on front
    end of a heterogeneous inference system. We implement this architecture by coupling
    a fabricated memristor Bayesian machine to a programmable CPU running a higher-power,
    higher-accuracy software neural network. The memristor front end acts as a probabilistic
    screener. When it predicts an abnormal event or produces an ambiguous or invalid
    output, a dedicated hardware wake-up path activates the CPU, which produces the
    final decision. We validate this architecture on a heartbeat-classification benchmark
    by interfacing the fabricated Bayesian machine with an FPGA-based wake-up platform
    and CPU back end. The resulting uncertainty-triggered wake-up system achieves
    high final classification accuracy under nominal operation and maintains this
    accuracy even when the memristor front end is degraded by voltage scaling or reduced
    programming margins, because unreliable outputs are converted into recoverable
    wake-up events instead of becoming silent errors. Post-layout analysis of an ASIC
    implementation shows that average energy is governed primarily by wake-up frequency,
    providing practical design rules for choosing front-end operating points. These
    results establish uncertainty-triggered wake-up as a strategy for energy-efficient,
    error-resilient edge AI.
- title: Positional Encoding in the Context of Memristor-Based Analog Computation
    for Automatic Speech Recognition
  date: 2026-06
  url: https://arxiv.org/abs/2606.13379v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Benedikt Hilmes
  - Nick Rossenbach
  - Ralf Schlüter
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Memristors provide a new chance for resource-efficient computation of
    neural models for natural language processing by enabling analog execution of
    vector-matrix-multiplication. Yet, computations on these devices are currently
    subject to larger distortion, both in weight programming and execution. In this
    work, we identify large output values of transformed positional encodings to cause
    major degradation within analog-to-digital conversion (ADC) as part of memristor-based
    computation. By adjusting the proportion of weight and precision bits of the ADC
    of specific memristor layers, we reduce the degradation of the execution by ~50%
    relative, while keeping the estimated energy consumption stable. Additionally,
    we investigate scenarios where the ADC cannot be modified. In that case the degradation
    can be reduced by ~30% relative after removing encoding-related linear transformations.
- title: 'DendroNN: Dendrocentric Neural Networks for Energy-Efficient Classification
    of Event-Based Data'
  date: 2026-03
  url: https://arxiv.org/abs/2603.09274v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Jann Krausse
  - Zhe Su
  - Kyrus Mama
  - Maryada
  - Klaus Knobloch
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spatiotemporal information is at the core of diverse sensory processing
    and computational tasks. Feed-forward spiking neural networks can be used to solve
    these tasks while offering potential benefits in terms of energy efficiency by
    computing event-based. However, they have trouble decoding temporal information
    with high accuracy. Thus, they commonly resort to recurrence or delays to enhance
    their temporal computing ability which, however, bring downsides in terms of hardware-efficiency.
    In the brain, dendrites are computational powerhouses that just recently started
    to be acknowledged in such machine learning systems. In this work, we focus on
    a sequence detection mechanism present in branches of dendrites and translate
    it into a novel type of neural network by introducing a dendrocentric neural network,
    DendroNN. DendroNNs identify unique incoming spike sequences as spatiotemporal
    features. This work further introduces a rewiring phase to train the non-differentiable
    spike sequences without the use of gradients. During the rewiring, the network
    memorizes frequently occurring sequences and additionally discards those that
    do not contribute any discriminative information. The networks display competitive
    accuracies across various event-based time series datasets. We also propose an
    asynchronous digital hardware architecture using a time-wheel mechanism that builds
    on the event-driven design of DendroNNs, eliminating per-step global updates typical
    of delay- or recurrence-based models. By leveraging a DendroNN's dynamic and static
    sparsity along with intrinsic quantization, it achieves up to 4x higher efficiency
    than state-of-the-art neuromorphic hardware at comparable accuracy on the same
    audio classification task, demonstrating its suitability for spatiotemporal event-based
    computing. This work offers a novel approach to low-power spatiotemporal processing
    on event-driven hardware.
- title: 'An Open-Source LFSR-Based Stochastic Leaky Integrate-and-Fire Neuron in
    SkyWater 130 nm: Design, Stochastic Characterisation, and Rate Coding'
  date: 2026-06
  url: https://arxiv.org/abs/2606.23532v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Poornima Kumaresan
  - Santhosh Sivasubramani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Stochastic spiking neurons trade exact arithmetic for controlled randomness,
    lowering area and tolerating input noise, which suits event-driven edge hardware.
    We present a compact, configurable stochastic leaky integrate-and-fire neuron
    in standard-cell CMOS on the SkyWater 130 nm process, released openly. A 16-bit
    configurable-polynomial linear-feedback shift register drives an eight-entry programmable
    activation table that sets a Bernoulli firing probability, and a saturating 16-bit
    leaky integrator with a programmable threshold and a refractory period of zero
    to seven cycles produces the spike train. All parameters are set through a sixteen-register
    serial interface, and the neuron runs from parallel inputs or entirely from the
    register file. From a model checked bit-exact against the register-transfer code,
    the period is 65535 states for a maximal-length polynomial and 63 for the shipped
    default, the eight-bit comparison value is uniform over the full period, and the
    per-entry firing probability equals the table value divided by 256. We also characterise
    a property a system-level model would not expose: the comparator output is serially
    correlated at short lags, with a negative lobe near lag eight, because the compared
    byte shifts by one bit each cycle; subsampling every sixteen cycles restores whiteness.
    Rate-coding sweeps show monotonic control of the output rate by the input weight
    and the threshold, and the refractory period caps the rate at one spike per refractory-plus-one
    cycles. The neuron occupies about 10,600 square micrometres at 70 per cent utilisation
    on a single Tiny Tapeout tile, meets 50 MHz timing with positive margin, and passes
    eighteen directed cocotb tests at register-transfer and gate level. All results
    are pre-silicon, from simulation and the open flow. The neuron is an openly released
    companion to a four-block neuromorphic suite reported separately.'
- title: A Comparative Analysis of Ising Formulations for Neuromorphic Maximum-Likelihood
    Channel Decoding
  date: 2026-07
  url: https://arxiv.org/abs/2607.12862v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - George N. Katsaros
  - Morgan Sabine
  - Konstantinos Nikitopoulos
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Neuromorphic computing has so far been driven predominantly by machine-learning
    workloads, yet its underlying properties also make it particularly well suited
    to combinatorial optimization problems expressed in Ising or QUBO form. While
    neuromorphic Ising solvers have been demonstrated, how a given problem should
    be formulated to best suit neuromorphic dynamics has received far less attention.
    Maximum-likelihood (ML) channel decoding can be expressed as an Ising/QUBO problem,
    and two distinct formulations already exist in the quantum-annealing literature:
    a squared-penalty formulation that uses few spins but produces dense intra-check
    couplings, and a chain-product formulation that improves locality at the cost
    of additional auxiliary spins. Both place the ML codeword at the ground state
    under sufficient constraint enforcement, but they have not been compared under
    the constraints that neuromorphic hardware imposes. This work provides the first
    systematic side-by-side comparison of QUBO/Ising formulations of ML decoding for
    linear codes. We show that the two formulations impose fundamentally different
    tradeoffs in neuron count, synaptic density, locality, and convergence behavior.
    The preferred formulation is inseparable from the choice of solver, and the two
    must be considered jointly. Finally, we show that ground-state correctness alone
    is an insufficient design criterion, and that signal processing tasks should ideally
    be co-formulated with their neuromorphic hardware models if neuromorphic computing
    is to extend into the receiver pipeline.'
- title: Neural dynamical systems on ferroelectric compute-in-memory for real-time
    forecasting
  date: 2026-06
  url: https://arxiv.org/abs/2606.16896v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Keshava Katti
  - Adithya Selvakumar
  - Pratik Chaudhari
  - Deep Jariwala
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Neural dynamical systems are expressive temporal predictors that capture
    continuous-time dynamics through fine-grained state updates. However, this sequential
    structure maps poorly onto digital hardware optimized for dense matrix operations,
    a mismatch that analog neuromorphic computing, with its native continuous-time
    dynamics, can resolve. We introduce FerroNDS, a neuromorphic system built from
    two analog primitives: an integrator for temporal accumulation and an oscillator
    for frequency-selective filtering. We map this system onto compute-in-memory hardware
    based on multi-bit ferrodiodes. A 128-neuron instance of FerroNDS computes short-time
    Fourier transform and forecasts a 500-ms horizon for periodic, quasi-periodic,
    and chaotic signals. The system achieves sub-watt real-time operation with per-neuron
    per-inference energy of 1.64 $μ$J (200 Hz) and 0.29 $μ$J (10 kHz), 25-40$\times$
    area reduction over SRAM-based digital systems, and per-layer latency of 3.18
    ms (200 Hz) and 63.87 $μ$s (10 kHz). To our knowledge, this is the first end-to-end
    integration of a ferrodiode into a neuromorphic computational framework, establishing
    ferroelectric compute-in-memory as a practical substrate for analog neural dynamical
    systems.'
- title: Implicitly Parallel Neuromorphic Solver Design for Constraint Satisfaction
    Problems
  date: 2026-03
  url: https://arxiv.org/abs/2603.01150v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Recep Bugra Uludag
  - Ahmet Efe
  - Ismail Akturk
  - Ulya R Karpuzcu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Many real-life problems of practical importance -- spanning a wide range
    of applications from chip design to bioinformatics -- represent constraint satisfaction
    problems, where classical solvers have to rely on heuristic approximations due
    to the computational complexity. Neuromorphic solvers, on the other hand, offer
    a unique alternative representation which enables an inherently parallel exploration
    of the solution space. This paper provides a theoretical characterization and
    experimental demonstration of this native type of parallelism that is hard to
    apply to classical solvers. We observe that more than two orders of magnitude
    faster operation is possible without compromising solution accuracy. Our study
    represents the first step toward bridging the theory vs. practice gap to unlock
    the performance potential of emerging neuromorphic solvers.
- title: 'Functional Interface Blocks for Neuromorphic Hardware: A Junction-Centered
    Framework'
  date: 2026-06
  url: https://arxiv.org/abs/2606.04281v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Wellington Avelino
  - Yann Beillard
  - Fabien Allibart
  - Dominique Drouin
  - Gilberto Medeiros-Ribeiro
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Heterogeneous neuromorphic hardware integrates devices with dissimilar
    electrical characteristics and dynamics, making functional compatibility at their
    interconnections a primary design challenge. Direct coupling alone is insufficient
    to ensure correct operation, because the load-line conditions established at each
    junction determine the effective operating regime. Here, we propose a junction-centered
    interface framework in which inter-device connections are described through assigned
    drive/sense roles and organized into canonical functional interface blocks. As
    a concrete hardware realization, a second-generation current conveyor (CCII)-based
    implementation is then adopted as a composite realization of these interface primitives.
    The framework is validated experimentally in a Pavlovian-conditioning demonstrator
    combining a memristive synapse with a unijunction-transistor (UJT) post-neuron.
    By linking local junction conditions to reusable interface functions, the proposed
    methodology provides a systematic basis for the design and analysis of heterogeneous
    neuromorphic systems.
- title: A Fast and Energy-Efficient Latch-Based Memristive Analog Content-Addressable
    Memory
  date: 2026-05
  url: https://arxiv.org/abs/2605.11847v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Paul-Philipp Manea
  - Aishwarya Natarajan
  - Jim Ignowski
  - John Paul Strachan
  - Luca Buonanno
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Analog content-addressable memories (aCAMs) based on memristors provide
    a promising pathway toward energy-efficient large-scale associative computing
    for Edge AI and embedded intelligence applications. They have been successfully
    applied to decision-tree inference and extend the capabilities of compute-in-memory
    (CIM) architectures beyond conventional vector-matrix multiplication. However,
    conventional designs such as the 6T2M architecture suffer from static search power,
    limited voltage gain, and pronounced match-line crosstalk, constraining analog
    precision and scalability. We introduce a strong-arm latched memristor (SALM)
    aCAM cell that replaces static voltage division with a dynamic current-race comparator,
    enabling high regenerative gain, intrinsic result latching, and near-zero static
    search power. Compared to 6T2M, SALM reduces read energy by 33% at identical latency
    while eliminating the gain and crosstalk limitations that prevent 6T2M from scaling
    to large arrays. SALM further enables scalable sequential and parallel latch sharing,
    and a dataset-aware optimization framework exposes an explicit energy-latency
    tradeoff, achieving up to 50% energy reduction at 3x latency across representative
    workloads. To enable architectural exploration, we develop a circuit-accurate
    behavioral model derived from SPICE lookup tables in 22 nm FD-SOI technology,
    capturing match-line dynamics and crosstalk. Integrated into the X-TIME decision-tree
    compiler, this framework demonstrates that SALM maintains near-software accuracy
    for high-dimensional datasets, whereas baseline designs degrade due to limited
    gain and cumulative crosstalk.
- title: 'Design and Development of a Neuromorphic Silicon Suite: PVT Sensing, Stochastic
    LIF Inference, On-Chip STDP Learning, and Crossbar Programming'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22635v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Poornima Kumaresan
  - Santhosh Sivasubramani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Edge neuromorphic systems need compact, configurable hardware that combines
    probabilistic inference, local learning, and an interface to emerging analogue
    memory. We present four interface-compatible digital IP blocks implemented as
    standard-cell CMOS on the SkyWater 130 nm process: a process, voltage and temperature
    (PVT) sensor built from five selectable ring oscillators that also provides a
    jitter-based true-random-number generator and a frequency-bounds health monitor;
    a stochastic leaky integrate-and-fire (LIF) neuron with a configurable LFSR, a
    programmable activation table, and a refractory period; an on-chip spike-timing-dependent
    plasticity (STDP) controller with a programmable curve and reward-modulated, eligibility-trace,
    and anti-Hebbian modes; and a memristive-crossbar controller supporting forming,
    set, reset, read, and automated current-voltage sweep with current-compliance
    limiting and half-select biasing. All four blocks share a common serial peripheral
    interface (SPI) register file; the sensor also exposes a parallel readout. Each
    occupies a single tile at a 50 MHz target. The suite was verified with 99 cocotb
    tests at register-transfer and gate level (all passing) and taken through an open
    standard-cell flow, then submitted for tapeout via the Tiny Tapeout shared-silicon
    programme. Mapped to the open cell library, each block occupies a post-synthesis
    cell area of 9.3 to 10.6 thousand square micrometres, places at 61 to 70 per cent
    tile utilisation, meets the 50 MHz constraint with positive setup and hold margin
    after clock-tree synthesis, and draws an estimated 0.64 to 0.70 mW under a default
    switching-activity assumption. The contribution is a coherent, openly released
    set of building blocks unified by one register interface and one verification
    flow. All results are from simulation and the implementation flow; no fabricated
    silicon is reported.'
- title: Nanoparticle Networks for Neuromorphic Computing
  date: 2026-07
  url: https://arxiv.org/abs/2607.27844v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Jonas Mensing
  - Wilfred G. van der Wiel
  - Andreas Heuer
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Physical computing leverages complex dynamical systems for energy-efficient
    data processing. In this work, we present a neuromorphic architecture based on
    metallic nanoparticles interconnected by molecular junctions on a $\text{SiO}_2$/Si
    substrate. We demonstrate that surrounding static control electrodes transform
    this nanoparticle network from a passive reservoir into a tunable nonlinear dynamical
    system. By analyzing how these electrodes route simple one-dimensional voltage
    inputs into multidimensional signal responses, we establish three core design
    rules to maximize computational performance. First, operating near the system's
    cutoff frequency achieves an optimal balance between nonlinear charge tunneling
    and linear capacitive memory. Second, tuning the underlying $\text{SiO}_2$ thickness
    sets the electrostatic screening length and dictates the memory type. Thick oxide
    layers reduce the screening length, causing networks larger than this length to
    transition into a persistent, non-volatile-like regime. Conversely, networks smaller
    than the screening length exhibit only fading memory. Third, introducing structural
    disorder via heterogeneous molecular junctions overcomes inherent limits on expressivity.
    While a network's computational expressivity scales with its physical size, it
    is ultimately capped by the screening length. Breaking internal spatial symmetries
    with localized disorder bypasses this saturation, allowing control voltages to
    independently manipulate specific signal amplitudes and phases, universally maximizing
    performance for dynamic neuromorphic applications.
- title: Stochastic binary networks with asymmetric and time-delayed interactions
  date: 2026-07
  url: https://arxiv.org/abs/2607.15215v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Hantao Zhang
  - Sidra Gibeault
  - Matthew W. Daniels
  - Philippe Talatchian
  - Ursula Ebels
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Stochastic binary networks are widely used to describe collective dynamics
    in complex systems and to perform neuromorphic computation, yet realistic networks
    often contain both asymmetric interactions and finite signal propagation times
    that fall outside conventional theories. Here we study stochastic binary networks
    with asymmetric and time-delayed interactions motivated by experimental observations
    in coupled superparamagnetic tunnel junctions. We find that time delay fundamentally
    reshapes the dynamics induced by anti-symmetric couplings, producing strong oscillatory
    temporal correlations consistent with experiment. At the same time, sufficiently
    long delays drive the steady-state probabilities toward equal state occupations
    even in strongly coupled systems. These apparently featureless probability distributions
    coexist with pronounced temporal correlations, distinguishing them from equilibrium
    high-temperature behavior. We further show analytically that delay-induced uniform
    distributions emerge in a broad class of stochastic networks, while symmetry-breaking
    bias fields restore interaction-dependent steady states with qualitatively modified
    behavior. Simulations of networks with five coupled spins demonstrate that these
    effects persist beyond minimal systems with only two spins. Our results establish
    a unified framework for stochastic binary networks in the intermediate regime
    between symmetric instantaneous interactions and asymmetric or time-delayed interactions,
    and suggest that asymmetry and delay can be exploited as functional resources
    in neuromorphic hardware and complex network dynamics.
- title: 'Novel models of computation from novel physical substrates: a bosonic example'
  date: 2026-03
  url: https://arxiv.org/abs/2603.24531v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Sampreet Kalita
  - Benjamin W. Butler
  - Susan Stepney
  - Viv Kendon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Unconventional physical computing is producing many novel and exotic devices
    that can potentially be used in a computational mode. Currently, these tend to
    be used to implement traditional models of computation, such as boolean logic
    circuits, or neuromorphic approaches. This runs the risk of failing to exploit
    the devices to their full potential. Here we describe a methodology for deriving
    a model of computation and domain specific language more closely matched to a
    given physical device's capabilities, and illustrate it with a case study of bosonic
    computing as implemented by a physical multi-component interferometer.
- title: Intrinsic Neuro-Synaptic Spiking Dynamics and Resonance in Memristive Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.18015v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Yinhao Xu
  - Georg A. Gottwald
  - Zdenka Kuncic
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-organizing memristive networks are physical circuits that dynamically
    reconfigure their circuitry in response to external input signals. Their adaptive
    behavior arises from intrinsic neuro-synaptic dynamics combined with a heterogeneous
    network topology. In this work, we demonstrate that such networks naturally generate
    neuronal population spiking dynamics similar to those observed in biological neuronal
    systems. This study investigates the intrinsic and emergent dynamics of memristive
    networks mathematically and numerically for both DC and AC input signals. Nonlinear
    spike-like features are maximized when the frequency of the input driving signal
    matches the network's intrinsic dynamical timescale, where nonlinear resonance
    is observed. Furthermore, the optimal frequency for computation is found to be
    the maximal frequency before the onset of resonance.
- title: Breaking Local-Minimum Traps in Spiking Neural Network-Based Solvers for
    CSPs via Parallel Tempering
  date: 2026-07
  url: https://arxiv.org/abs/2607.08897v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Recep Bugra Uludag
  - Ahmet Efe
  - Ismail Akturk
  - Ulya R. Karpuzcu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural networks (SNNs) with stochastic neurons can solve constraint
    satisfaction problems (CSPs) by encoding constraints via connectivity and performing
    probabilistic search via spike dynamics. However, fixed-temperature stochastic
    dynamics often get trapped in local minima - near-satisfying configurations -
    a vulnerability that escalates with problem difficulty. To overcome this, we integrate
    parallel tempering (PT) into the neural sampling solver, running multiple parallel
    replicas at varying inverse temperatures. Replicas periodically exchange temperatures
    rather than network states, managing the trade-off between exploration and concentration
    around low-energy configurations while preserving asynchronous, spike-based computation.
    We evaluate this architecture against a parallel baseline of four independent,
    fixed-temperature solvers using equal computational resources across 1000 instances
    from the SATLIB uf20-91 benchmark. Parallel tempering improves success probability
    on 332 instances while worsening only 5. Crucially, these gains are concentrated
    on hard instances where independent solvers fail. Violation trajectory analysis
    confirms the underlying mechanism: temperature exchanges allow replicas to traverse
    energy barriers unreachable by fixed-temperature dynamics, successfully escaping
    the narrow basins that constrain the baseline. To our knowledge, this represents
    the first integration of parallel tempering into an SNN-based CSP solver.'
- title: 'Self-organizing Architecture of Receptron Units: a Hardware-Aware Framework
    for Edge Intelligence'
  date: 2026-07
  url: https://arxiv.org/abs/2607.20162v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Stefano Radice
  - Ludovico Casaccia
  - Riccaro Emanuele Beccalli
  - Bruno Paroli
  - Paolo Milani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The growing demand for intelligent processing at the edge of IoT networks
    is constrained by the severe computational and memory limitations of microcontroller
    units, which render impractical conventional deep learning approaches. We propose
    a neuromorphicinspired classifier based on the Receptron model, a single-unit
    architecture capable of implementing non-linearly separable decision boundaries,
    without resorting to multi-layer networks. The model is designed for direct deployment
    on mid-range MCUs, while supporting continuous on-device adaptation. Experimental
    evaluation on basic dataset benchmarks yields cross-validated accuracies compatible
    with standard machine learning method baselines. These results position the Receptron
    as a viable and interpretable alternative for resource-constrained neuromorphic
    edge systems operating in dynamic, non-stationary environments.
- title: Investigating reservoir computing for branch prediction in pipelined processors
    using emerging CMOS memristor devices
  date: 2026-07
  url: https://arxiv.org/abs/2607.27140v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Harvey Samuel George Johnson
  - Sendy Phang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This project aimed to develop a novel reservoir compute (RC) implementation
    framework targeting high-speed operation and integration with CMOS digital logic.
    With the target workload of branch prediction (BP) for multistage pipelined central
    pro-cessing unit (CPU) cores. For this, a novel memristor based RC design framework
    was developed within the context of the workload requirements. This was then implemented
    in simulation using industry standard modelling languages of System Verilog (SV)
    and Verilog-AMS (VAMS).The developed RC design framework was subsequently verified
    using a basic sequence detection task before further benchmarking for its effectiveness
    at BP. The developed RC framework was tested using the Dhrystone performance benchmark,
    while targeting the RISC-V RV64GC instruction set architecture (ISA). Conducted
    testing demonstrates that RC shows great promise for ap-plication to BP and is
    capable of achieving impressive overall prediction accuracy. However, testing
    also shows that further refinement of the developed RC design framework is necessary
    to address shortfalls in the adaptability of the proposed RC system. As comparison
    against the state of the art TAGE predictor showed the proposed RC design framework
    to be 15x slower to adapt to changes in branching behaviour.
- title: 'Optical Flow Sensor: A Direction-Selective Bionic Retina Design'
  date: 2026-07
  url: https://arxiv.org/abs/2607.28686v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Juchen Zhou
  - Bonan Yan
  - Yuchao Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optical flow characterizes motion in the visual field and is fundamental
    to motion perception and tracking in biological and artificial vision systems.
    Biological retinas extract motion efficiently through local ON/OFF pathways and
    parallel processing, while conventional frame-based optical flow relies on dense
    sampling and global computation, resulting in high latency and power consumption.
    To overcome these limitations, we present a pixel-level Optical Flow Sensor (OFS)
    integrated circuit. The design combines Dynamic Vision Sensor (DVS) ON/OFF event
    comparison with time-difference measurement to enable fully parallel optical flow
    computation on-chip. An optical-flow-specific Address-Event Representation (OF-AER)
    interface supports low-power, high-throughput readout. \rev{Based on the CMOS-based
    OFS, we further propose optical memristor-based OFS to reduce sensor power consumption
    and area overhead.} Experimental results show that the proposed OFS achieves a
    303$\times$ reduction in power consumption compared with FPGA-accelerated DVS
    systems while maintaining microsecond-level latency. Moreover, by directly outputting
    optical flow vectors, the OFS reduces output data size by approximately 3.3$\times$,
    demonstrating strong potential for ultra-high-speed, low-power vision sensing
    applications.
- title: Experimental Demonstration of an On-Chip CMOS-Integrated 3T-1MTJ Probabilistic
    Bit -- A P-Bit
  date: 2026-04
  url: https://arxiv.org/abs/2604.05191v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Xuejian Zhang
  - John Arnesh Divakaruni Daniel
  - Neil Dilley
  - Zhihong Chen
  - Joerg Appenzeller
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Ongoing semiconductor scaling challenges and the rise of neuromorphic
    computing have sparked interest in exploring novel computing schemes to achieve
    higher power efficiency and computational capabilities. Probabilistic computing
    is one candidate that endows low power consumption, capability of solving probability-encoded
    computational problems, and the ease of integration with existing CMOS technology.
    A basic building block of this scheme is the probabilistic bit (P-Bit), which
    utilizes a novel device such as a stochastic magnetic tunnel junction (sMTJ) to
    generate tunable randomness by nature. This work presents the first experimental
    demonstration of a fully CMOS-integrated sMTJ-based P-Bit, capable of generating
    rail-to-rail stochastic output with a mere collection of 3 transistors + 1 sMTJ.
    Furthermore, simulations also confirm this P-Bit's functionality in probabilistic
    logic circuits. The demonstration of such P-Bit paves the way towards realizing
    monolithic large-scale probabilistic computing architecture on CMOS chips.
- title: Remotely programming the weights of a spintronic neural network by a radiofrequency
    broadcast signal
  date: 2026-04
  url: https://arxiv.org/abs/2604.24561v4
  category: neuromorphic-hardware
  subcategory: systems
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Selectively programming large number of non-volatile synaptic weights
    without compromising scalability is a key challenge for in-memory computing. Here,
    we demonstrate remote programming of synaptic weights in series-connected chains
    of 11 vortex-based magnetic tunnel junctions using broadcast radiofrequency signals
    applied through a shared strip line. The programming relies on frequency-selective
    reversal of the vortex-core polarity and therefore does not require individual
    access lines or selector devices. By reconfiguring the binary states of these
    chains, we reshape the weighted sums they perform on frequency-multiplexed RF
    inputs. Using a 22-synapse network composed of two such chains, we remotely reconfigure
    the same hardware to perform two distinct tasks: handwritten-digit classification
    and drone RF-signature identification. The digit-optimized configuration reaches
    94.91 +/- 0.26% accuracy on handwritten digits but only 13.17 +/- 0.47% on drone
    RF signatures, whereas the drone-optimized configuration reaches 97.33 +/- 0.62%
    on drones but only 47.59 +/- 1.5% on digits. Broadcast RF programming thus provides
    a compact and scalable route to rapidly reconfigurable spintronic neuromorphic
    hardware.'
- title: Unidirectional information flow in a nanomagnetic metamaterial
  date: 2026-04
  url: https://arxiv.org/abs/2604.09420v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Johannes H. Jensen
  - Ida Breivik
  - Arthur Penty
  - Anders Strømberg
  - Henrik Tidemann Kaarbø
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Artificial spin ice (ASI) are metamaterials composed of interacting nanomagnets.
    Although ASI hold promise for low-power computing, the ability to transmit information
    through these two-dimensional systems has been limited. Inspired by non-reciprocal
    transport in nature, we develop a framework for non-reciprocal influence between
    nanomagnets. Using the framework we discover a family of ASI geometries with inherent
    directionality. Directional ASI have the property that, when driven by an external
    field protocol, domains grow and reverse in the same direction, illustrating an
    emergent non-reciprocity of the system. Combining growth and reversal results
    in unidirectional domain movement through the metamaterial. We focus on one member
    of the directional ASI family, and demonstrate unidirectional domain growth experimentally.
    Furthermore, we show that the direction of growth is reconfigurable by tuning
    the external field strengths. Finally, we demonstrate how the directionality of
    the system significantly improves memory capabilities in a reservoir computing
    framework. Our work is the first demonstration of an ASI with inherent directionality,
    offering a magnetic computing platform that combines memory and computation within
    a single neuromorphic substrate.
- title: 'Autonomous Physical Computation: A Categorical Closure Criterion for Physical
    and Neuromorphic Reservoirs'
  date: 2026-07
  url: https://arxiv.org/abs/2607.23902v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Nima Dehghani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Physical reservoirs, neuromorphic devices, and wave-mediated systems
    often possess memory, feedback, and rich state-dependent dynamics, but these properties
    do not by themselves establish autonomous computation. Here we develop a closure
    criterion for autonomous physical computation, motivated by the wave--particle
    walker. We formulate the walker as a stroboscopic reservoir with state, where
    the wave field stores an exponentially decaying trace of previous droplet impacts
    and guides future motion through local slope coupling. This model separates physical
    writing, storage, reading, feedback, and externally triggered erasure. We then
    define computation as robust coarse-grained transition preservation: a physical
    map implements an abstract transition only when a coarse-graining satisfies compositionality,
    with abstract states realized by separated physical basins and transitions stable
    under noise. Autonomous physical computation requires a further closure condition:
    an internal physical readout state must select the next physical operation. This
    criterion classifies the wave--particle walker as a wave-memory machine with genuine
    Turing-like primitives, but not as a closed autonomous physical computer, because
    the erasing phase shift is externally imposed. The framework turns this distinction
    into a design principle: memory becomes autonomous computation when physical readout
    basins are coupled back to operation selection.'
- title: 'Synthetic Biological Intelligence: System-Level Abstractions and Adaptive
    Bio-Digital Interaction'
  date: 2026-04
  url: https://arxiv.org/abs/2604.27933v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Martin Schottlender
  - Pengjie Zhou
  - Veronika Volkova
  - Fatima Rani
  - Ruifeng Zheng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Concurrent advances across fields such as organoid technology, Microelectrode
    Arrays (MEAs), neuromorphic computing, and machine learning have given rise to
    a groundbreaking research paradigm: Synthetic Biological Intelligence (SBI). SBI
    refers to engineered systems in which living Biological Neural Networks (BNNs)
    are interfaced with hardware and software to perform task-oriented information
    processing in a closed loop. This cutting-edge technology, while still in its
    infancy, has the potential to deliver highly efficient performance across both
    computing capabilities and energy consumption. The early stage of this field underscores
    the need for reliable multi-scale and cross-domain interaction interfaces to support
    applications in robotics, biomedicine, signal processing, and neuroscience research.
    The hitherto lack of commercially available SBI platforms has slowed the development,
    as the conditions to produce a testbed are expensive and cumbersome. The introduction
    of standardized, platform- and cloud-integrated BNNs has been a crucial catalyst
    for the scientific community, improving the accessibility of SBI and leading the
    way to further developments. In this survey, we summarize the innovations that
    contributed to the emergence of SBI and the first testbed interfaces that enabled
    its embodiment. This work reframes SBI as a bio-digital interaction system and
    introduces a unified protocol across encoding, decoding, system engineering, and
    benchmarking.'
- title: 'Multi-Level Resistive Synapses for On-Chip Neural Networks: A Physics-Based
    Design of a Memristive Crossbar Fabric with Quasi-Continuous Conductance States'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22621v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - David Alejandro Trejo Pizzo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Building on resistive communication, this paper presents a physics-based
    design of an on-chip neural network with multi-level memristive synapses supporting
    a dense spectrum of conductance states. Derived from ionic transport physics,
    we develop a state-variable model and quantify storable sub-levels under thermal
    noise, drift, and quantized conductance. We assemble these devices into a 1T1R
    crossbar fabric, derive the linear algebra of analog vector-matrix multiplication
    (VMM) under wire resistance, and design a differential synapse for signed weights.
    A multilayer pipeline executes inference, backpropagation, and weight updates
    physically in the analog domain. We derive the in-situ outer-product learning
    rule, its discretization onto the conductance lattice, and the resulting quantization
    noise. We provide energy, area, capacity, and inter-tile models, showing this
    substrate is ideally suited for large language models (LLMs). Our design eliminates
    weight movement, surpassing binary ReRAM and traditional CMOS. We detail the material
    stack (HfO_2-based), the FEOL/BEOL CMOS foundry-integration flow, a self-contained
    SPICE model, the complete memristive-FPGA neuromorphic system, and an in-memory
    self-attention engine with current-mode translinear softmax. Finally, a ternary
    BitNet datapath shows projected per-token efficiency orders of magnitude better
    than advanced CPUs or GPUs. The result is a self-contained hardware-native blueprint
    for a high-density, analog, in-memory neural processor.
- title: Machine vision with small numbers of detected photons per inference
  date: 2026-03
  url: https://arxiv.org/abs/2603.23974v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Shi-Yuan Ma
  - Jérémie Laydevant
  - Mandar M. Sohoni
  - Logan G. Wright
  - Tianyu Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Machine vision, including object recognition and image reconstruction,
    is a central technology in many consumer devices and scientific instruments. The
    design of machine-vision systems has been revolutionized by the adoption of end-to-end
    optimization, in which the optical front end and the post-processing back end
    are jointly optimized. However, while machine vision currently works extremely
    well in moderate-light or bright-light situations -- where a camera may detect
    thousands of photons per pixel and billions of photons per frame -- it is far
    more challenging in very low-light situations. We introduce photon-aware neuromorphic
    sensing (PANS), an approach for end-to-end optimization in highly photon-starved
    scenarios. The training incorporates knowledge of the low photon budget and the
    stochastic nature of light detection when the average number of photons per pixel
    is near or less than 1. We report a proof-of-principle experimental demonstration
    in which we performed low-light image classification using PANS, achieving 73%
    (82%) accuracy on FashionMNIST with an average of only 4.9 (17) detected photons
    in total per inference, and 86% (97%) on MNIST with 8.6 (29) detected photons
    -- orders of magnitude more photon-efficient than conventional approaches. We
    also report simulation studies showing how PANS could be applied to other classification,
    event-detection, and image-reconstruction tasks. By taking into account the statistics
    of measurement results for non-classical states or alternative sensing hardware,
    PANS could in principle be adapted to enable high-accuracy results in quantum
    and other photon-starved setups.
- title: Energy-efficient codon optimization on thermodynamic hardware
  date: 2026-06
  url: https://arxiv.org/abs/2606.17327v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Andraz Jelincic
  - Ross C. Walker
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The growing energy demand for computation is becoming increasingly unsustainable.
    Thermodynamic computing, which harnesses physical thermal fluctuations as a computational
    resource rather than suppressing them, offers orders-of-magnitude energy savings
    for probabilistic and combinatorial tasks. Pharmaceutical R&amp;D, heavily reliant
    on computational optimization and sampling, is a natural application domain. Here
    we present what is, to our knowledge, the first concrete pharmaceutical application
    mapped to thermodynamic hardware with energy estimates grounded in prototype measurements.
    We reduce mRNA codon optimization, a combinatorial problem routinely solved in
    drug development, to sampling from an Ising model, making it directly executable
    on a thermodynamic sampling unit (TSU). Benchmarking three approaches (Potts sampling,
    Ising sampling, and a genetic algorithm baseline) on the SARS-CoV-2 spike protein,
    we find that all achieve comparable optimization quality (scores ~234-240), but
    energy estimates based on validated hardware models indicate that a TSU could
    solve this problem using approximately 10e6 times less energy than a conventional
    GPU. All code is released under an open-source license.
- title: Evaluating Encoding Strategies for Closed-Loop Classification in Biological
    Neural Networks
  date: 2026-07
  url: https://arxiv.org/abs/2607.13644v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Martin Schottlender
  - Veronika Volkova
  - Pengjie Zhou
  - Ruifeng Zheng
  - Frank H. P. Fitzek
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Interfacing with Biological Neural Networks (BNNs) requires encoding information
    into stimulation patterns that can be effectively processed and that enable the
    underlying system to adapt. Nevertheless, the role of stimulation encoding remains
    poorly understood. In this work, we compare multiple encoding strategies, including
    rate-based, phase-based, burst-based, and time-to-first-spike temporal encodings,
    in a closed-loop neural classification task using cultured BNNs. We encode visual
    inputs as spatiotemporal stimulation patterns delivered via a Multi-Electrode
    Array (MEA) and evaluate classification performance for each encoding scheme.
    We find that burst-based temporal encoding yields the highest observed performance,
    achieving up to 95.6 % accuracy in a binary classification task, compared to substantially
    lower performance from rate- and phase-based approaches. We further show that
    performance is highly sensitive to the spatial distribution of stimulation, with
    suboptimal electrode selection significantly degrading accuracy. These findings
    indicate that effective interfacing with biological neural systems requires the
    joint optimization of temporal and spatial encoding strategies, and highlight
    temporal encoding as a key design dimension for bio-digital computing.
- title: Local Synaptic Rules Can Implement a SIGReg Gradient Without Backpropagation
  date: 2026-07
  url: https://arxiv.org/abs/2607.21622v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Martin Andrews
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We prove that two canonical local synaptic learning rules, the potentiation
    arm of spike-timing-dependent plasticity (STDP$^+$) and homeostatic plasticity
    (instantiated here via flashlight granule-cell-like neurons), together can implement
    the exact gradient of a SIGReg-like self-supervised learning objective. The equivalence
    requires no gradient calculations, no global error signals, no weight transport,
    and no label information: the only inputs are pre- and post-synaptic firing rates,
    local firing statistics, and the temporal contiguity of natural sensory streams.
    On a synthetic clustering task designed to probe whether class structure can be
    recovered from temporal ordering of inputs alone, ordered presentation raised
    cluster separation (CSR) to 2.49 while random ordering left it near baseline (0.83),
    a roughly threefold ($\approx 3.5σ$) separation attributable solely to input ordering.
    On temporally ordered MNIST, a two-layer network trained entirely with these rules
    achieved 87.3% linear-probe accuracy, showing that the mechanism functions end-to-end.'
- title: Modeling of Self-sustained Neuron Population without External Stimulus
  date: 2026-04
  url: https://arxiv.org/abs/2604.13719v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - İhsan Ertuğrul Karakaş
  - Özden Özel
  - İlkay Ulusoy
  - Orhan Murat Koçak
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-sustained neural activity in the absence of ongoing external input
    is a fundamental feature of nervous system dynamics, yet the conditions under
    which it can emerge in biophysically grounded network models remain incompletely
    understood. We studied whether a recurrent network of Hodgkin-Huxley neurons with
    spike-timing-dependent plasticity and intrinsic stochasticity can maintain autonomous
    activity after brief transient stimulation. The simulated network comprised 200
    neurons (160 excitatory, 40 inhibitory) with 80% connection probability, incorporating
    excitatory and inhibitory STDP, probabilistic vesicle release, probabilistic synapse
    formation, receptor variability, and voltage-dependent inhibition. After a brief
    200 ms initialization stimulus to 30 excitatory neurons, the network received
    no further external input. In one 1800 s simulation and two additional 500 s simulations,
    the network maintained sparse, irregular activity without ongoing drive. In the
    1800 s run, 67% of neurons exhibited mean firing rates below 1 Hz, the population
    mean firing rate was 1.13 +/- 1.34 Hz, participation increased across longer observation
    windows, and population-mean Fano factors remained near 1-2, consistent with irregular
    spike timing. Raster activity also showed spontaneous qualitative reorganizations
    in collective firing patterns over time. These findings suggest that recurrent
    Hodgkin-Huxley networks with plastic and stochastic synapses can sustain long-duration
    autonomous activity in a sparse firing regime after brief initialization.
- title: Beyond LLMs, Sparse Distributed Memory, and Neuromorphics &lt;A Hyper-Dimensional
    SRAM-CAM "VaCoAl" for Ultra-High Speed, Ultra-Low Power, and Low Cost&gt;
  date: 2026-04
  url: https://arxiv.org/abs/2604.11665v7
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Hiroyuki Chuma
  - Kanji Otsuka
  - Yoichi Sato
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'VaCoAl (Python: PyVaCoAl) attacks the Binding Problem algebraically rather
    than statistically: an SRAM/DRAM-CAM organised end-to-end around one primitive,
    XOR-and-shift over GF(2) via primitive-polynomial LFSRs. Rooted in Kanerva''s
    Sparse Distributed Memory, it retrieves in a million-dimensional binary space
    by Galois-field diffusion; Binding and Unbinding are exactly reversible at O(L),
    giving compositional generalisation with post-hoc auditability. Unexpectedly,
    a path-dependent semantic selection mechanism emerges undesigned, functionally
    equivalent to Spike-Timing-Dependent Plasticity (STDP) and predictable a priori
    from a closed form matching measurement on tens of millions of records. It is
    the Don''t Care (collision-tolerance) rule: not a defect to engineer away, but
    the source of its ability to rank paths by quality. Capability: reversible binding
    plus tolerated collisions yields a path-integral confidence measure (CR2) ranking
    candidates by accumulated reliability, absent from hash-based search. Necessity:
    repair the collisions fully and the ranking vanishes; a memory that never fails
    has no record of which paths were difficult. Position: we do not surpass large
    language models; the substrate is orthogonal, supplying the auditable path-ranking
    layer they lack. A mentor-student ontology of ~470,000 WIKIDATA scholars, traversed
    backwards from all 64 Fields Medalists to depth 57 and &gt;25.5M paths, stress-tests
    multi-hop reasoning over a large DAG. Ablation shows Don''t Care imposing a depth-dependent
    exponential penalty that prunes circuitous routes and preserves direct ones: an
    Occam''s razor. Per-generation CR1 stays within 0.995-0.999, yet cumulative CR2
    decays monotonically to ~0.905 by generation 56, matching the closed form 0.997^56
    = 0.846 within observed variation. All measurements are from PyVaCoAl, a software
    DRAM-CAM; speed and power figures are projections.'
- title: Neuromorphic Graph Anomaly Detection via Adaptive STDP and Spiking Graph
    Neural Networks
  date: 2026-04
  url: https://arxiv.org/abs/2605.13863v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Abdul Joseph Fofanah
  - Lian Wen
  - David Chen
  - Tsungcheng Yao
  - Kwabena Sarpong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Anomaly detection in dynamic networks is critical for applications from
    cybersecurity to industrial monitoring, yet existing methods face challenges in
    energy efficiency, temporal precision, and adaptability. This paper introduces
    ASTDP-GAD, a novel Adaptive Spiking Temporal Dynamics Plasticity framework for
    Graph Anomaly Detection that integrates spiking graph neural networks with STDP
    learning for energy-efficient neuromorphic detection in dynamic networks. Our
    framework unifies spiking neural computation, STDP learning, and graph-based anomaly
    detection through the following key innovations: temporal spike graph encoding
    with adaptive Leaky Integrate-and-Fire (LIF) dynamics; LIF-based graph attention
    with lateral inhibition; event-driven hypergraph memory with STDP-inspired prototype
    updates; spike rate contrast pooling based on spiking irregularity; adaptive STDP
    layers capturing causal temporal relationships; and multi-scale temporal convolution
    with multi-factor anomaly fusion. Theoretical analysis provides rigorous guarantees:
    spike encoding preserves input information with resolution scaling linearly in
    simulation steps and hidden dimension; LIFGAT approximates any continuous attention
    function; hypergraph memory converges to optimal prototypes; contrast pooling
    achieves provable anomaly selection bounds; STDP learning converges stably; and
    multi-factor fusion produces calibrated scores with up to $5\times$ variance reduction.
    Extensive experiments on nine datasets on both dynamic and static graphs demonstrate
    superior anomaly detection accuracy while maintaining biological plausibility
    and energy efficiency for neuromorphic deployment.'
- title: Self-Organized Optical Pathways in Optofluidic Photonic Crystals
  date: 2026-03
  url: https://arxiv.org/abs/2603.25845v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Steven Motta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper reports FDTD simulations of optofluidic reconfiguration in
    two-dimensional silicon photonic crystal waveguides, treating structural plasticity
    (the creation and destruction of optical pathways) via selective fluid infiltration.
    Using MPB eigenmode analysis, we decouple bandgap narrowing from defect-mode weakening,
    showing that defect weakening dominates (2.4 times faster transmission decay than
    bandgap narrowing at CS_2 indices). Infiltration topology controls signal routing
    (L-bend selectivity S = 0.98), though modulation depth is weak (Delta varepsilon/
    varepsilon_ textSi = 11 %). A phenomenological optothermal feedback model produces
    self-organized pathways that achieve 63 % of a hand-designed waveguide''s bandgap
    transmission (7.6 times the heavily suppressed empty-crystal baseline). Amplitude
    competition between counter-propagating sources produces strong, monotonic pathway
    steering (DeltaCOM_x from +0.03 to +4.92 ;a), while pulsed spike-timing-dependent
    plasticity yields a predictable null result: the timing-sensitive cross-term is
    suppressed by &gt;10^2 when pulse delays exceed the temporal pulse width. The
    results provide benchmarks and identify physical limits for bio-inspired reconfigurable
    optofluidic photonics.'
- title: Soliton-like Waves in a Two-Dimensional Recurrent Spiking Neural Network
    with Weighted Spike-Timing-Dependent Plasticity
  date: 2026-06
  url: https://arxiv.org/abs/2606.21432v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Ch. Meessen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We construct a minimal but biologically plausible spiking neuron model
    operating in discrete time, combining multiplicative spike-timing-dependent plasticity
    (WSTDP), divisive normalization of synaptic integration, homeostatic threshold
    adaptation, and a one-step refractory period. We show that this normalization
    admits a biologically plausible dendritic implementation in which each binary
    junction operates using only locally available information. Assembling excitatory-inhibitory
    pairs of such neurons into a two-dimensional recurrent network and applying periodic
    localized stimulation, we find that the network spontaneously gives rise to stable,
    self-propagating wave packets with the properties of dissipative solitons: they
    maintain a stable spatial profile, propagate at constant speed, and annihilate
    upon frontal collision. Their emergence requires a geometric asymmetry between
    excitatory and inhibitory connection radii, and initial inhibitory synapses stronger
    than excitatory ones. WSTDP engraves the direction of propagation into the synaptic
    weight profile, so that the network learns by itself to sustain propagation in
    one direction while suppressing the reverse. When two sources are active simultaneously,
    the resulting waves annihilate upon collision, defining a semi-persistent boundary
    whose position encodes the relative phase and frequency of the two sources. These
    results provide a minimal computational framework for studying the emergence of
    cortical traveling waves, activity zone delimitation, and spatial memory from
    local plasticity rules alone.'
- title: 'Reward-Modulated Local Learning in Spiking Encoders: Controlled Benchmarks
    with STDP and Hybrid Rate Readouts'
  date: 2026-02
  url: https://arxiv.org/abs/2603.00710v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Debjyoti Chakraborty
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a controlled empirical study of biologically motivated
    local learning for handwritten digit recognition. We evaluate an STDP-inspired
    competitive proxy and a practical hybrid benchmark built on the same spiking population
    encoder. The proxy is motivated by leaky integrate-and-fire E/I circuit models
    with three-factor delayed reward modulation. The hybrid update is local in pre
    x post rates but uses supervised labels and no timing-based credit assignment.
    On sklearn digits, fixed-seed evaluation shows classical pixel baselines from
    98.06 to 98.22% accuracy, while local spike-based models reach 86.39 +/- 4.75%
    (hybrid default) and 87.17 +/- 3.74% (STDP-style competitive proxy). Ablations
    identify normalization and reward-shaping settings as the strongest observed levers,
    with a best hybrid ablation of 95.52 +/- 1.11%. A network-free synthetic temporal
    benchmark supports the same timing-versus-rate interpretation under matched local-update
    training. A descriptive 2x2 analysis further shows reward-shaping effects can
    reverse sign across stabilization regimes, so reward-shaping conclusions should
    be reported jointly with normalization settings.
- title: Cross-Species RSA Reveals Conserved Early Visual Alignment but Divergent
    Higher-Area Rankings Across Human fMRI and Macaque Electrophysiology
  date: 2026-05
  url: https://arxiv.org/abs/2605.22401v2
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Nils Leutenegger
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'CORRECTION (August 2026): an evaluation-mode defect in the shared feature-extraction
    pipeline affected the predictive-coding and STDP conditions. It applies to both
    sides of every comparison here: the human values are reprinted from the companion
    study and the macaque values use the same checkpoints. In a single-seed re-evaluation
    with repaired checkpoints, macaque STDP at V1 moves from 0.305 to 0.266 and PC
    from 0.210 to 0.178, level with the untrained baseline, so finding (2) holds for
    STDP but not for PC; the V4 and IT orderings also change, while V2 is unchanged.
    Findings (1), (3) and (4) are unaffected, and the other conditions change by at
    most 0.0034. The five-seed analysis, Kendall''s tau, noise ceilings and stimulus
    control have not been re-computed. See the correction note on page 1; the original
    abstract below is unchanged from v1. Follow-up study: arXiv:2608.12408. Does the
    relationship between learning rules and brain alignment generalize across species?
    We test the same five learning rules against macaque electrophysiology. The macaque
    data come from MajajHong2015 (V4/IT, 3,200 presentations, 88/168 neurons) and
    FreemanZiemba2013 (V1/V2, 135 stimuli, 102/103 neurons). Using RSA with identical
    model weights from our human study, we find: (1) all models achieve higher alignment
    with macaque early visual cortex (rho = 0.15-0.30 at V1/V2) than with human fMRI
    (rho = 0.01-0.08); (2) STDP and PC produce the highest macaque V1/V2 alignment;
    (3) at IT, rankings show no detectable correlation across species (Kendall''s
    tau = 0.00), though this null is expected given that n = 5 provides power only
    at tau = +/-1.0; (4) a pretrained ResNet-50 achieves rho = 0.25 at macaque IT,
    substantially above all custom CNN conditions (rho = 0.07-0.14), suggesting IT
    alignment is limited by model capacity rather than by the learning rule.'
- title: Intrinsic Numerical Robustness and Fault Tolerance in a Neuromorphic Algorithm
    for Scientific Computing
  date: 2026-03
  url: https://arxiv.org/abs/2603.10246v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Bradley H. Theilman
  - James B. Aimone
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The potential for neuromorphic computing to provide intrinsic fault tolerance
    has long been speculated, but the brain''s robustness in neuromorphic applications
    has yet to be demonstrated. Here, we show that a previously described, natively
    spiking neuromorphic algorithm for solving partial differential equations is intrinsically
    tolerant to structural perturbations in the form of ablated neurons and dropped
    spikes. The tolerance band for these perturbations is large: we find that as many
    as 32 percent of the neurons and up to 90 percent of the spikes may be entirely
    dropped before a significant degradation in the accuracy results. Furthermore,
    this robustness is tunable through structural hyperparameters. This work demonstrates
    that the specific brain-like inspiration behind the algorithm contributes to a
    significant degree of robustness expected from brain-like neuromorphic algorithms.'
- title: 'Bio-plausible Neuromorphic Disturbance Observer Based on Emulation Theory:
    Extended Version'
  date: 2026-05
  url: https://arxiv.org/abs/2606.05189v2
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Hongfu Xu
  - Xiaoyu Guo
  - Shengbo Wang
  - Shuo Gao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Biological neural systems achieve remarkable robustness and adaptability
    in uncertain environments through sparse, event-driven spike-based information
    processing and adaptive regulation. Inspired by this paradigm, this paper develops
    a neuromorhpic disturbance observer (NDO) and control framework that replaces
    conventional continuous-time signal representations with spike-timing encoding.
    Both disturbance estimates and control inputs are constructed via integrate-and-fire
    (IF) neuron dynamics from discrete spike events, yielding intrinsically event-driven
    updates. An adaptive-threshold triggering mechanism is inspired by spike-frequency
    adaptation (SFA), enabling history-dependent regulation of spike generation. Simulation
    results demonstrate that the proposed framework achieves neurally inspired robustness
    and adaptability, while the adaptive-threshold spiking scheme reduces spike events
    to 42.6% of the fixed-threshold case under noisy conditions.
- title: Benchmarking the Energy Cost of Assurance in Neuromorphic Edge Robotics
  date: 2026-03
  url: https://arxiv.org/abs/2603.13880v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Sylvester Kaczmarek
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deploying trustworthy artificial intelligence on edge robotics imposes
    a difficult trade-off between high-assurance robustness and energy sustainability.
    Traditional defense mechanisms against adversarial attacks typically incur significant
    computational overhead, threatening the viability of power-constrained platforms
    in environments such as cislunar space. This paper quantifies the energy cost
    of assurance in event-driven neuromorphic systems. We benchmark the Hierarchical
    Temporal Defense (HTD) framework on the BrainChip Akida AKD1000 processor against
    a suite of adversarial temporal attacks. We demonstrate that unlike traditional
    deep learning defenses which often degrade efficiency significantly with increased
    robustness, the event-driven nature of the proposed architecture achieves a superior
    trade-off. The system reduces gradient-based adversarial success rates from 82.1%
    to 18.7% and temporal jitter success rates from 75.8% to 25.1%, while maintaining
    an energy consumption of approximately 45 microjoules per inference. We report
    a counter-intuitive reduction in dynamic power consumption in the fully defended
    configuration, attributed to volatility-gated plasticity mechanisms that induce
    higher network sparsity. These results provide empirical evidence that neuromorphic
    sparsity enables sustainable and high-assurance edge autonomy.
- title: Efficient event-driven retrieval in high-capacity kernel Hopfield networks
  date: 2026-05
  url: https://arxiv.org/abs/2605.05978v2
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Akira Tamamori
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High-capacity associative memory models, such as Kernel Logistic Regression
    (KLR) Hopfield networks, have demonstrated strong storage capabilities but typically
    rely on computationally expensive synchronous updates. This reliance poses a bottleneck
    for deployment on energy-efficient, event-driven neuromorphic hardware. In this
    paper, we investigate the asynchronous retrieval dynamics of KLR Hopfield networks.
    We show empirically that, under appropriately tuned kernel parameters, asynchronous
    sequential updates exhibit trajectories that are statistically indistinguishable
    from those of synchronous dynamics, while maintaining high recall accuracy within
    the tested regime for random patterns. Furthermore, we find that the asynchronous
    network achieves empirical storage capacities approaching $P/N \approx 30$ in
    static random pattern regimes, exceeding classical limits. To evaluate computational
    efficiency, we analyze the total number of state transitions (bit flips) required
    for error correction. The results show that the network converges using a number
    of events close to the initial Hamming distance from the target pattern, without
    observable spurious oscillations. These findings suggest that the large-margin
    attractors induced by KLR learning create a smooth energy landscape suited for
    sparse, event-driven computation, providing a basis for scalable and low-power
    associative memory on neuromorphic architectures.
- title: Regime Mapping of Oscillatory States in Balanced Spiking Networks with Multiple
    Time Scales
  date: 2026-04
  url: https://arxiv.org/abs/2604.04770v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Tsung-Han Kuo
  - Tzu-Chia Tung
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Balanced spiking networks can transition between silent, asynchronous-irregular,
    and oscillatory states depending on interacting synaptic and temporal time scales,
    while their joint parameter structure remains incompletely characterized. In this
    work, we systematically map how postsynaptic decay (τs), conduction delay (d),
    and plasticity rate (λp) jointly shape oscillatory regimes in recurrent leaky
    integrate-and-fire networks. By combining Brian2 simulations across the (τs, d,
    λp) space with a coarse Hopf-reference boundary, we construct regime maps that
    directly visualize SIL-AI-OSC transitions and corresponding spectral prominence
    landscapes. The mapped results show that increasing λp expands oscillatory regions
    toward shorter τs and moderate-to-long delays, while prominence maps identify
    parameter regions with the strongest rhythmic coherence. Representative control
    experiments further connect this global landscape to local rhythm-forming mechanisms,
    showing that STDP freezing weakens rhythmic coherence whereas delay jitter enhances
    it with minimal change in mean firing rate. As a result, these findings provide
    a useful reference for operating-point selection, synchrony modulation studies,
    and future biologically grounded spiking-network modeling within similar balanced-network
    settings.
- title: An event-driven framework for fly-inspired visual motion detection
  date: 2026-07
  url: https://arxiv.org/abs/2607.05205v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Qinbing Fu
  - Jingyu Huang
  - Yan Xie
  - Jigen Peng
  - Yuchao Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Fast and reliable motion detection is essential for machine vision and
    autonomous systems operating in dynamic environments. This work integrates emerging
    event-based sensing with biologically structured neural computation to establish
    an efficient computational paradigm for visual motion detection. The proposed
    framework is built upon a recently developed fly-inspired neural network that
    emulates motion-processing circuits in the optic lobe. Owing to its feed-forward
    and training-free architecture, the neural model requires only a small number
    of interpretable parameters and is well suited for real-time embedded implementation.
    Event cameras provide low-latency, low-power, and high-dynamic-range visual sensing
    by asynchronously transmitting brightness-change events. However, their performance
    can be degraded by event noise, including temporal noise and junction-leakage-induced
    activity, particularly under low-light conditions. Moreover, effective integration
    between event-based visual representations and biologically inspired neural processing
    remains under-explored. To address these challenges, we propose an event-driven
    computational framework that combines time-surface encoding for front-end event
    representation with a fly optic-lobe-inspired neural network for foreground motion-direction
    estimation. A bottom-up attention mechanism is further incorporated to suppress
    background motion and enhance the saliency of foreground targets. The proposed
    method is evaluated on real-world ground-vehicle datasets and compared with a
    baseline frame-based model and an optimization-based approach. Experimental results
    demonstrate that the framework effectively combines the temporal advantages of
    event-driven vision with the efficiency and interpretability of bio-inspired neural
    processing.
- title: Petri Net Description of Biological Neural Circuits for Fast Hardware Prototyping
  date: 2026-08
  url: https://arxiv.org/abs/2608.20147v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Carlo daCunha
  - Rodrigo Pena
  - Marcos Turqueti
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Current approaches to simulating biological neural circuits, whether
    on general-purpose hardware or dedicated neuromorphic platforms, remain constrained
    by fixed-timestep numerical integration, hardware-imposed precision limits, and
    an inability to guarantee timing correctness for event-driven spiking dynamics
    under real-time constraints. Here, we propose a Petri net description of biological
    neural circuits that overcomes these limitations by modeling neurons, synapses,
    and spike events as a T-timed Petri net with formally verifiable timing semantics,
    enabling deadline-guaranteed real-time execution and analytically tractable correspondence
    to continuous-time leak-integrate-and-fire dynamics, independent of the underlying
    integration timestep. To test the model, we present the results of three simulated
    microcircuits: feedback inhibition, lateral inhibition, and hierarchical feature
    detector. The Petri neuron reproduces the expected dynamical signatures of each
    circuit while providing formally bounded timing guarantees throughout, with worst-case
    response times matching analytical predictions across all three cases.'
- title: 'Temporal Coding as a Substrate for Sensorimotor Object Inference: A Spiking
    Reinterpretation of Thousand Brains Architecture'
  date: 2026-05
  url: https://arxiv.org/abs/2605.22206v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Joy Bose
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The Thousand Brains Theory (TBT) and its open-source Monty framework
    model object recognition through sensorimotor inference -- identifying objects
    by actively moving a sensor across their surface and building evidence contact
    by contact. The current implementation encodes each contact as a dense floating-point
    vector. While Monty tracks inter-step displacement and accumulates evidence across
    contacts, it treats the feature activation pattern at each contact as an unordered
    set - the directional sequence in which features are encountered carries no representational
    weight. In TBT, the sequence of contacts carries spatial meaning: knowing that
    feature A was felt before feature B during a left-to-right sweep tells you something
    about where A and B sit on the object. Dense vectors discard this ordering. We
    propose replacing dense vectors with rank-order spike packets: each contact produces
    a brief burst of neural events where the most strongly activated neuron fires
    first. The time gap between successive bursts implicitly encodes sensor displacement
    without explicit coordinate calculations. A biologically motivated learning rule
    (STDP) encodes traversal direction into synaptic weights. A learnable parameter
    lambda adjusts reliance on earlier versus recent contacts, adapting to each object''s
    geometry. We derive three testable predictions and specify an implementation of
    four components in approximately 450 lines of NumPy. Three synthetic experiments
    confirm the core claims: temporal coding achieves perfect discrimination accuracy
    on objects with identical features in different spatial arrangements, where dense
    accumulation performs at chance; temporal coding maintains a 30-50 percentage
    point advantage across all tested noise levels; the adaptive lambda converges
    to distinct values, reflecting object geometric complexity. End-to-end evaluation
    on Monty''s YCB benchmark is left for future work.'
- title: 'When Spike Sparsity Does Not Translate to Deployed Cost: VS-WNO on Jetson
    Orin Nano'
  date: 2026-04
  url: https://arxiv.org/abs/2604.17040v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Jason Yoo
  - Shailesh Garg
  - Souvik Chakraborty
  - Syed Bahauddin Alam
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural operators are appealing for neuromorphic edge computing
    because event-driven substrates can, in principle, translate sparse activity into
    lower latency and energy. Whether that advantage survives deployment on commodity
    edge-GPU software stacks, however, remains unclear. We study this question on
    a Jetson Orin Nano 8 GB using five pretrained variable-spiking wavelet neural
    operator (VS-WNO) checkpoints and five matched dense wavelet neural operator (WNO)
    checkpoints on the Darcy rectangular benchmark. On a reference-aligned path, VS-WNO
    exhibits substantial algorithmic sparsity, with mean spike rates decreasing from
    54.26% at the first spiking layer to 18.15% at the fourth. On a deployment-style
    request path, however, this sparsity does not reduce deployed cost: VS-WNO reaches
    59.6 ms latency and 228.0 mJ dynamic energy per inference, whereas dense WNO reaches
    53.2 ms and 180.7 mJ, while also achieving slightly lower reference-path error
    (1.77% versus 1.81%). Nsight Systems indicates that the request path remains launch-dominated
    and dense rather than sparsity-aware: for VS-WNO, cudaLaunchKernel accounts for
    81.6% of CUDA API time within the latency window, and dense convolution kernels
    account for 53.8% of GPU kernel time; dense WNO shows the same pattern. On this
    Jetson-class GPU stack, spike sparsity is measurable but does not reduce deployed
    cost because the runtime does not suppress dense work as spike activity decreases.'
- title: 'The Free-Market Algorithm: Self-Organizing Optimization for Open-Ended Complex
    Systems'
  date: 2026-03
  url: https://arxiv.org/abs/2603.24559v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Martin Jaraiz
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We introduce the Free-Market Algorithm (FMA), a novel metaheuristic inspired
    by free-market economics. Unlike Genetic Algorithms, Particle Swarm Optimization,
    and Simulated Annealing -- which require prescribed fitness functions and fixed
    search spaces -- FMA uses distributed supply-and-demand dynamics where fitness
    is emergent, the search space is open-ended, and solutions take the form of hierarchical
    pathway networks. Autonomous agents discover rules, trade goods, open and close
    firms, and compete for demand with no centralized controller. FMA operates through
    a three-layer architecture: a universal market mechanism (supply, demand, competition,
    selection), pluggable domain-specific behavioral rules, and domain-specific observation.
    The market mechanism is identical across applications; only the behavioral rules
    change. Validated in two unrelated domains. In prebiotic chemistry, starting from
    900 bare atoms (C, H, O, N), FMA discovers all 12 feasible amino acid formulas,
    all 5 nucleobases, the formose sugar chain, and Krebs cycle intermediates in under
    5 minutes on a laptop -- with up to 240 independent synthesis routes per product.
    In macroeconomic forecasting, reading a single input-output table with zero estimated
    parameters, FMA achieves Mean Absolute Error of 0.42 percentage points for non-crisis
    GDP prediction, comparable to professional forecasters, portable to 33 countries.
    Assembly Theory alignment shows that FMA provides the first explicit, tunable
    mechanism for the selection signatures described by Sharma et al. (Nature, 2023).
    The event-driven assembly dynamics resonate with foundational programs in physics
    -- causal set theory, relational quantum mechanics, constructor theory -- suggesting
    that Darwinian market dynamics may reflect a deeper organizational principle that
    lead to the unfolding of Nature itself.'
- title: Sharpness-Aware Surrogate Training for On-Sensor Spiking Neural Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.09696v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Maximilian Nicholson
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking neural networks (SNNs) are a natural computational model for
    on-sensor and near-sensor vision, where event driven processors must operate under
    strict power budgets with hard binary spikes. However, models trained with surrogate
    gradients often degrade sharply when the smooth surrogate nonlinearity is replaced
    by a hard threshold at deployment; a surrogate-to-hard transfer gap that directly
    limits on-sensor accuracy. We study Sharpness-Aware Surrogate Training (SAST),
    which applies Sharpness-Aware Minimization (SAM) to a surrogate-forward SNN so
    that the training objective is smooth and the gradient is exact, and position
    it as one gap-reduction strategy under the tested settings rather than the only
    viable mechanism. Under explicit contraction assumptions we provide state-stability,
    input-Lipschitz, and smoothness bounds, together with a corresponding nonconvex
    convergence result. On two event-camera benchmarks, swap-only hard-spike accuracy
    improves from 65.7\% to 94.7\% on N-MNIST and from 31.8\% to 63.3\% on DVS Gesture.
    Under a hardware-aware inference simulation (INT8/INT4 weight quantization, fixed-point
    membrane potentials, discrete leak factors), SAST remains strong: on N-MNIST,
    hard-spike accuracy improves from 47.6\% to 96.9\% (INT8) and from 43.2\% to 81.0\%
    (INT4), while on DVS Gesture it improves from 25.3\% to 47.6\% (INT8) and from
    26.0\% to 43.8\% (INT4). SynOps also decrease under the same hardware-aware setting,
    including 1734k$\rightarrow$1315k (N-MNIST, INT8) and 86221k$\rightarrow$4323k
    (DVS Gesture, INT8). These results suggest that SAST is a promising component
    in a broader toolbox for on-sensor spiking inference under the tested settings.'
- title: Neuromorphic Reinforcement Learning for Quadruped Locomotion Control on Uneven
    Terrain
  date: 2026-05
  url: https://arxiv.org/abs/2605.09595v2
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Zhuangyu Han
  - Abhronil Sengupta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reinforcement learning (RL) has enabled robust quadruped locomotion over
    complex terrain, but most learned controllers are trained offline with backpropagation
    in massively parallel simulation and deployed as fixed policies, limiting adaptation
    to terrain variation, payload changes, actuator wear, and other real-world conditions
    under onboard power constraints. Local learning provides a potential path toward
    energy-aware on-robot adaptation by replacing global backpropagation graphs with
    updates driven by local neural states, making the learning rule more compatible
    with neuromorphic and in-memory computing substrates. This work proposes an equilibrium-propagation
    (EP)-based proximal policy optimization (PPO) framework for uneven-terrain quadruped
    locomotion. The controller combines a bio-inspired central pattern generator (CPG)
    policy with a residual postural adjustment policy, while replacing conventional
    backpropagation-trained policy and value networks with EP-enabled local learning.
    To train stochastic continuous-control policies with EP, we derive an EP-compatible
    PPO output-nudging signal and introduce a two-sided ratio clipping mechanism that
    stabilizes policy updates during relaxation. Experiments on a 12-DoF A1 quadruped
    show that the proposed controller achieves stable policy convergence in a two-stage
    uneven terrain locomotion task. Its locomotion performance is comparable to a
    backpropagation-trained PPO baseline in success rate, velocity tracking, actuator
    power, and body stability, while improving GPU memory efficiency by 4.3\(\times\)
    compared with backpropagation through time (BPTT). These results suggest that
    local equilibrium-based learning can support high-dimensional embodied locomotion
    and provide an algorithmic foundation for low-power on-robot adaptation and fine-tuning.
- title: Optimising Urban Flood Resilience
  date: 2026-04
  url: https://arxiv.org/abs/2604.18620v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - James Mckenna
  - Christos Iliadis
  - Vassilis Glenis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Due to the increasing frequency and severity of storm events, driven by
    the escalation of anthropogenic climate change and urban expansion, there is a
    requirement for increasingly efficient flood risk management strategies. While
    Blue-Green Infrastructure (BGI) offers a sustainable solution for managing flood
    risk, optimal implementation is challenging. To help overcome this challenge,
    this study presents a novel multi-objective optimisation tool that couples a state-of-the-art
    hydrodynamic model with a bespoke evolutionary algorithm. The use of a fully dynamic
    hydrodynamic model enables the tool to accurately evaluate the effectiveness of
    proposed BGI features with respect to property scale flood vulnerability and hazard
    analysis. This contrasts with alternative approaches which utilise simplified
    models, which can only reliably predict inundation extents, thus the proposed
    optimisation tool provides greater certainty regarding the optimality of the solutions.
    As a hydrodynamic simulation is required to evaluate each candidate solution,
    the bespoke evolutionary algorithm is specifically designed to minimise the number
    of simulations required, ensuring the tool is computationally practical. The effectiveness
    of the tool in this regard is validated via the derivation of exact convergence
    measures, for a tractable search space, and via comparisons with benchmark algorithms,
    for an intractable search space. Compared with traditional design practices, the
    proposed tool offers an automated approach capable of efficiently exploring a
    wide range of solutions, providing decision-makers with a set of optimal solutions
    from which they can make informed investment decisions. The presented methods
    provide a robust framework for optimising a variety of BGI features in complex
    urban environments.
- title: 'Error Highways: Scaling Predictive Coding to Very Deep Networks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22744v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Amirhossein Mohammadi
  - Alexander G. Ororbia
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Predictive coding networks (PCNs) offer a biologically-plausible, local-learning
    alternative to back-propagation of errors (backprop). Nevertheless, they have
    remained largely confined to shallow architectures and evaluated on simple machine
    intelligence benchmarks. A central obstacle to scaling PCNs is that the learning
    signal decays rapidly as it propagates away from the clamped boundaries, leaving
    interior layers effectively unchanged. To directly counter this problem, we propose
    highway error propagation (HEP), a scheme that augments the free energy function
    underlying predictive coding (PC) by altering its neural structure with feedback
    matrices $V_{L\to i}$ that couple selected hidden states directly to the clamped
    output error. Since this coupling is linear in the hidden state, the highway pathway
    delivers a correction at every inference step whose magnitude is independent of
    depth, in contrast to vanilla PC where the output error reaches the $i$-th hidden
    layer with attenuation that decays exponentially in depth. This bypasses the Jacobian
    chain while preserving the local PC synaptic update rule. On MNIST and Fashion-MNIST,
    we show that HEP effectively trains MLPs of up to 128 layers with accuracy that
    is robust with respect to depth.
- title: Self-supervised local learning rules learn the hidden hierarchical structure
    of high-dimensional data
  date: 2026-05
  url: https://arxiv.org/abs/2605.18557v1
  category: neuromorphic-algorithms
  subcategory: method
  authors:
  - Ariane Delrocq
  - Wu S. Zihan
  - Guillaume Bellec
  - Wulfram Gerstner
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The brain learns abstract representations of high-dimensional sensory
    input, but the plasticity rules that enable such learning are unknown. We study
    biologically plausible algorithms on the Random Hierarchy Model (RHM), an artificial
    dataset designed to investigate how deep neural networks learn the intrinsic hierarchical
    structure of high-dimensional data. We focus on two types of local learning rules
    that avoid both a long convergence time and the use of a symmetric error network.
    The first type uses direct feedback signals to approximate error propagation from
    the output layer. The second type uses layerwise self-supervised contrastive or
    non-contrastive loss functions that do not explicitly approximate errors at the
    output layer. We show that all rules of the first type fail to solve the tasks
    of the RHM and trace this failure back to input-specific nonlinearities (`masking')
    that are implemented in full backpropagation and are essential for learning complex
    tasks. However, algorithms of the second type are able to learn the hierarchical
    hidden structure of the RHM tasks and are as data-efficient as supervised backpropagation
    training, while being compatible with known rules of synaptic plasticity in cortex.
- title: An Instruction Set Architecture for IMPLY-based Memristive Processing-in-Array
  date: 2026-06
  url: https://arxiv.org/abs/2606.27319v1
  category: memristive
  subcategory: systems
  authors:
  - Liam Splittgerber
  - Fabian Seiler
  - Nima TaheriNejad
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The push towards expanded ultra-low-power edge computing necessitates
    hardware capable of operating under extremely strict energy constraints. Traditional
    Complementary Metal-Oxide-Semiconductor (CMOS) microcontrollers are fundamentally
    limited in this domain by the von Neumann bottleneck and by the static power leakage
    inherent to volatile memory. Memristive In-Memory Computing (IMC) offers a promising
    solution to these inefficiencies by unifying data storage and computation into
    a single non-volatile component. However, the State of the Art (SoA) predominantly
    focuses on accelerators designed to be a co-processor for data-intensive computation.
    This leaves the prospect of standalone, general-purpose IMC microcontroller architectures
    underexplored. This thesis proposes such an architecture tailored for ultra-low-power
    edge devices, alongside an instruction set closely derived from the RV32I standard.
    Using the IMPLY stateful logic paradigm, a complete implementation of the proposed
    instruction set is provided, and the novel addressing schema required to support
    computation in the memristive crossbar array is described as well. Then, the energy
    use and other circuit-level metrics of the proposed architecture are evaluated
    through simulation and compared against those of traditional microcontrollers.
    Finally, the functional viability of the design is demonstrated through an application
    case study, describing how the proposed design could be used in an intelligent
    environmental sensor node.
- title: 'RRAM-DP: Device-Calibrated Differential Privacy for In-Memory Edge Learning'
  date: 2026-07
  url: https://arxiv.org/abs/2607.18169v2
  category: memristive
  subcategory: systems
  authors:
  - Kwunhang Wong
  - Jichang Yang
  - Karl M. H. Lai
  - Hegan Chen
  - Songqi Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Edge Artificial Intelligence of Things (AIoT) systems often collect sensitive
    data in situ, raising serious privacy concerns. Resistive-switching random-access
    memory (RRAM) is an attractive substrate for efficient AIoT thanks to its multi-bit
    storage and compute-in-memory (CiM) capabilities, while its inherently stochastic
    write behavior provides a natural source of randomness that can be leveraged for
    differential privacy (DP) protection. Yet how to transform this device-level randomness-typically
    viewed as detrimental to accuracy-into a principled randomized mechanism while
    preserving model utility remains underexplored. We propose RRAM-DP, a hardware-algorithm
    co-design that relaxes RRAM write-verify operations to inject calibrated noise
    for inherently (epsilon, delta)-DP with formal DP analysis; together with pretraining
    techniques, it renders a novel private, high-utility CiM training paradigm. On
    CIFAR-10/100, STS-B, and SST-2, RRAM-DP-SGD incurs at best only a 3.8% accuracy
    drop at (epsilon=2, delta=O(1/n))-DP relative to non-private SGD. At the same
    privacy level, RRAM-DP-SGD delivers up to 57x and 3.2x energy savings and 2.7x
    and 1.8x speedups over A100 and DiVa-GEMM, respectively. These results point toward
    efficient, privacy-preserving in-memory training on RRAM at the edge.
- title: 'XL-HD: Extended Learning in Hyperdimensional Computing via Deterministic
    Projections for In-Memory Accelerators'
  date: 2026-05
  url: https://arxiv.org/abs/2605.24788v1
  category: memristive
  subcategory: systems
  authors:
  - Sabrina Hassan Moon
  - Abu Kaisar Mohammad Masum
  - Sercan Aygun
  - Dayane Reis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Hyperdimensional computing (HDC) is a promising approach for energy-efficient
    edge machine learning (ML), where low latency, low power, and tight memory budgets
    are essential. However, traditional HDC relies on symbolic binding and pseudo-random
    high-dimensional vectors, which require large dimensionality and heuristic updates
    to reach competitive accuracy, limiting deployment on edge hardware. We introduce
    XL-HD, a deterministic, projection-based, fully learnable HDC framework tailored
    for in-memory acceleration within edge computing systems. The method uses a fixed
    Sobol sequence to project binary inputs, extending learning beyond conventional
    HDC. During training, class prototypes are optimized in real-valued space and
    later binarized, enabling an entirely binary dot-product inference pipeline ideal
    for IMC hardware such as ReRAM crossbars. XL-HD achieves competitive accuracy
    on MNIST, UCIHAR, and ISOLET while maintaining a compact IMC-based inference engine
    with $0.395 \ \text{mm}^2$ area and only $0.40 \ μ\text{J}$ per single-cycle inference.
- title: 'Cross-Domain Acceleration of Open Modification Search: From Commodity Platforms
    to Emerging Memory and Storage Devices'
  date: 2026-07
  url: https://arxiv.org/abs/2607.17569v1
  category: memristive
  subcategory: systems
  authors:
  - Sumukh Pinge
  - Chang Eun Song
  - Po-Kai Hsu
  - Zheyu Li
  - Ashkan Moradifirouzabadi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Open modification search (OMS) in mass spectrometry (MS) is a data-intensive
    workload whose performance is dominantly limited by reference data movement rather
    than computation. Prior OMS accelerators have largely been evaluated in isolation,
    making it difficult to understand system-level trade-offs across platforms. This
    paper presents the first workload-driven, cross-platform survey of accelerators
    for MS search by studying not only commodity platforms, but also emerging memory-
    and storage-centric architectures, including GPUs, near-storage FPGAs, DRAM near-memory
    processing, ReRAM/PCM in-memory processing, and 3D NAND/FeNAND in-storage processing,
    under consistent algorithmic and accuracy assumptions. Leveraging a binary hyperdimensional
    computing (HDC)-based OMS formulation that reduces similarity evaluation to lightweight
    bitwise primitives and tolerates device-level non-idealities, we enable a robust
    execution on memory-centric architectures despite device-level non-idealities
    and limited computing capability. Overall, this study identifies memory- and storage-centric
    architectures as a key architectural breakthrough for large-scale, high-speed
    search acceleration, delivering up to &gt;100x speedup and &gt;40,000x improvement
    in energy efficiency.
- title: 'CQ-CiM: Hardware-Aware Embedding Shaping for Robust CiM-Based Retrieval'
  date: 2026-02
  url: https://arxiv.org/abs/2602.20083v3
  category: memristive
  subcategory: systems
  authors:
  - Xinzhao Li
  - Alptekin Vardar
  - Franz Müller
  - Navya Goli
  - Umamaheswara Rao Tida
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deploying Retrieval-Augmented Generation (RAG) on edge devices is in high
    demand, but is hindered by the latency of massive data movement and computation
    on traditional architectures. Compute-in-Memory (CiM) architectures address this
    bottleneck by performing vector search directly within their crossbar structure.
    However, CiM's adoption for RAG is limited by a fundamental ``representation gap,''
    as high-precision, high-dimension embeddings are incompatible with CiM's low-precision,
    low-dimension array constraints. This gap is compounded by the diversity of CiM
    implementations (e.g., SRAM, ReRAM, FeFET), each with unique designs (e.g., 2-bit
    cells, 512x512 arrays). Consequently, RAG data must be naively reshaped to fit
    each target implementation. Current data shaping methods handle dimension and
    precision disjointly, which degrades data fidelity. This not only negates the
    advantages of CiM for RAG but also confuses hardware designers, making it unclear
    if a failure is due to the circuit design or the degraded input data. As a result,
    CiM adoption remains limited. In this paper, we introduce CQ-CiM, a unified, hardware-aware
    data shaping framework that jointly learns Compression and Quantization to produce
    CiM-compatible low-bit embeddings for diverse CiM designs. To the best of our
    knowledge, this is the first work to shape data for comprehensive CiM usage on
    RAG.
- title: 'Ternary Memristive Logic: Hardware for Reasoning Realized via Domain Algebra'
  date: 2026-04
  url: https://arxiv.org/abs/2604.20891v2
  category: memristive
  subcategory: systems
  authors:
  - Chao Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Memristive crossbars store numerical weights needing aggregation and
    decoding; a single junction means nothing alone. This paper presents a fundamentally
    different use: each junction stores a complete, domain-scoped logical assertion
    (holds/negated/undefined). Ternary resistance states encode these values directly.
    We establish a structure-preserving mapping from a domain algebra to crossbar
    topology: domains become isolated arrays, specialization becomes directed wiring,
    relation typing controls inheritance gates, and cross-domain links become explicit
    registers. The physical layout thus embodies the algebra; changing wiring changes
    reasoning semantics. We detail an ICD-11 respiratory disease classification chip
    (1,247 entities, ~136k 1T1R junctions) enabling domain scoping, three-valued logic,
    transitive cascade, typed inheritance, and cross-axis queries. Behavioral simulation
    (sigma_log=0.15, SNR=20dB) shows error-free operation across 100,000 trials per
    task with wide tolerance margins. Where prior work unified representation and
    computation in software, this work unifies them in hardware: reading one junction
    answers one question, without symbolic interpretation.'
- title: Design of Memristive Lightweight Encryption For In-Memory Image Steganography
  date: 2026-05
  url: https://arxiv.org/abs/2605.03494v2
  category: memristive
  subcategory: systems
  authors:
  - Seyed Erfan Fatemieh
  - Reza Shahdi Alizadeh
  - Esmail Zarezadeh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: With the expansion of data-intensive applications and increasing data
    volumes, providing an efficient solution to address growing energy consumption
    and performance degradation caused by the transfer of large amounts of data between
    the processor and the main memory has become a severe challenge. The frequent
    transfer of large amounts of data between internal chip units, memories, and their
    interconnections exacerbates the vulnerability of the data being accessed. Employing
    a memristive Computation In-Memory-Array (CIM-A) architecture limits data transfer,
    thereby addressing both challenges. Furthermore, by integrating lightweight cryptography,
    developed to secure data in hardware-constrained devices, with CIM-A architectures,
    the security of data in transit, especially across interconnections, can be ensured.
    This paper implements two standard lightweight stream ciphers, Trivium and Grain-128a,
    for CIM using stateful material implication (IMPLY) logic to address these combined
    security and performance challenges. In addition to redesigning the cryptographic
    structures, we reduce the hardware complexity of conventional IMPLY-based implementations
    by proposing an efficient method for shifting data within the shift registers.
    Applying the proposed data-shifting method to the registers of these ciphers reduces
    the number of computational steps and decreases energy consumption by up to 42%
    and 44%, respectively, compared to conventional implementations. Finally, the
    performance of the proposed circuits is evaluated in a steganography application,
    demonstrating their practical efficiency.
- title: 'Beyond Silicon: Materials, Mechanisms, and Methods for Physical Neural Computing'
  date: 2026-04
  url: https://arxiv.org/abs/2604.09833v2
  category: memristive
  subcategory: systems
  authors:
  - Stefan Fischer
  - Nihat Ay
  - Olaf Landsiedel
  - Esfandiar Mohammadi
  - Sebastian Otte
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Physical implementations of neural computation now extend far beyond silicon
    hardware, encompassing substrates such as memristive devices, photonic circuits,
    mechanical metamaterials, microfluidic networks, chemical reaction systems, and
    living neural tissue. By exploiting intrinsic physical processes such as charge
    transport, wave interference, elastic deformation, mass transport, and biochemical
    regulation, these substrates can realize neural inference and adaptation directly
    in matter. As silicon GPU-centered AI faces growing energy and data-movement constraints,
    physical neural computation is becoming increasingly relevant as a complementary
    path beyond conventional digital accelerators. This trend is driven in particular
    by pervasive intelligence, i.e., the deployment of on-device and edge AI across
    large numbers of resource-constrained systems. In such settings, co-locating computation
    with sensing and memory can reduce data shuttling and improve efficiency. Meanwhile,
    physical neural approaches have emerged across disparate disciplines, yet progress
    remains fragmented, with limited shared terminology and few principled ways to
    compare platforms. This survey unifies the field by mapping neural primitives
    to substrate-specific mechanisms, analyzing architectural and training paradigms,
    and identifying key engineering constraints including scalability, precision,
    programmability, and I/O interfacing overhead. To enable cross-domain comparison,
    we introduce a first-order benchmarking scheme based on standardized static and
    dynamic tasks and physically interpretable performance dimensions. We show that
    no single substrate dominates across the considered dimensions; instead, physical
    neural systems occupy complementary operating regimes, enabling applications ranging
    from ultrafast signal processing and in-memory inference to embodied control and
    in-sample biochemical decision making.
- title: 'STAR: Astrocyte-Inspired State-Augmented Repair for Supervised Memristive
    AI Hardware Systems'
  date: 2026-07
  url: https://arxiv.org/abs/2607.15415v1
  category: memristive
  subcategory: systems
  authors:
  - Yusuf Ahmed Khan
  - Zhuangyu Han
  - Abhronil Sengupta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Memristive crossbar arrays have emerged as a promising platform for efficient
    on-chip learning, enabling local learning rules such as Equilibrium Propagation
    (EP) to be realized without the memory overhead of conventional backpropagation.
    However, as these devices age, permanent stuck-at (SA) faults accumulate at individual
    synaptic elements, irreversibly corrupting the stored weights and degrading model
    performance in ways that in-situ retraining alone cannot address. Existing mitigation
    strategies either rely on hardware redundancy at significant area and power cost,
    or require explicit fault localization that is impractical to perform continuously
    on-chip. This paper adopts a brain-inspired fault recovery route motivated by
    self-repair functionalities enabled by astrocytes -- a type of glial cell. We
    couple a computational neuroscience study of astrocytic neuromodulation under
    permanent synaptic faults with an algorithmic recovery mechanism for faulted crossbar-mapped
    networks. Our computational neuroscience study characterizes how astrocytes modulate
    surviving synapses in a bidirectional EP-specific network setting under both SA-0
    and high-conductance stuck-at fault conditions, revealing that recovery operates
    at the neural population level. Motivated by this observation, we propose a retraining-based
    repair mechanism that augments EP with an additional repair nudge anchored to
    pre-fault activation targets of the healthy network, encouraging surviving weights
    to collectively reconstruct pre-fault internal representations without any information
    of which weights are faulty. To our knowledge, STAR is the first astrocyte-inspired
    repair mechanism to operate under a supervised local learning rule and to scale
    to convolutional networks.
- title: 'phys-MCP: A Control Plane for Heterogeneous Physical Neural Networks'
  date: 2026-05
  url: https://arxiv.org/abs/2605.04256v1
  category: memristive
  subcategory: systems
  authors:
  - Stefan Fischer
  - Maliheh Hariri
  - Sebastian Otte
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Physical neural networks (PNNs) embed computation directly in material
    dynamics, including molecular, chemical, biological, photonic, memristive, and
    mechanical substrates. They are attractive for edge computing, especially at the
    extreme edge, where computation can be placed at the interface to sensing, actuation,
    or the physical process itself. However, PNNs are difficult to integrate into
    edge-cloud software stacks because each substrate exposes distinct interfaces,
    timing behavior, observability limits, and lifecycle requirements. This paper
    argues that the missing systems component is a common control plane for heterogeneous
    PNNs. We present phys-MCP, a substrate-aware orchestration architecture that exposes
    physical neural substrates as discoverable and invocable resources for edge, fog,
    and cloud workflows, while preserving their possible placement at the extreme
    edge. phys-MCP defines a capability model, lifecycle semantics, telemetry interfaces,
    and digital-twin bindings that retain substrate-specific properties such as latency,
    resetability, plasticity, and I/O modality. We instantiate the architecture through
    a prototype with three representative backend classes, an HTTP-backed execution
    path, and an integrated Cortical Labs adapter exposing a wetware-facing API path
    through the same control model. The evaluation combines controlled experiments
    on representative backends with end-to-end validation of the Cortical Labs path.
    Results show descriptor-portable integration across heterogeneous backends, improved
    runtime-aware matching over simpler baselines, telemetry-aware recovery under
    representative faults, successful execution against the API-backed wetware path,
    and small local control-path overhead. Overall, results provide prototype-level
    evidence that substrate-aware control can span heterogeneous physical AI resources,
    twin-backed backends, and a wetware-facing API path.
- title: Signed Spiking Neuron Enabled by an Orthogonal-Easy-Axis Magnetic Tunnel
    Junction
  date: 2026-06
  url: https://arxiv.org/abs/2606.03796v1
  category: neuromorphic-sensors
  subcategory: application
  authors:
  - Huannan Zheng
  - Jingli Liu
  - Kezhou Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Signed spiking neurons carry richer information than standard spiking
    neurons. This work proposes a compact magnetic tunnel junction (MTJ)-based neuron
    for signed leaky integrate-and-fire (LIF) operation. With orthogonal easy axes
    in the free and pinned layers, the device enables bipolar spike generation and
    maps magnetic-moment dynamics to signed LIF membrane-potential evolution. Landau--Lifshitz--Gilbert
    simulations show that proper free-layer dimensions allow the device response to
    follow a signed LIF equation. A representative design of 10 nm x 45 nm x 50 nm
    corresponds to an aspect ratio of about 2:9:10. Network evaluations using the
    fitted device-neuron model achieve 91.06% on CIFAR-10 and 77.40% on CIFAR10-DVS,
    retaining most of the accuracy of ideal signed LIF neurons.
- title: Spiking Local Interaction and Adaptive Complementary Fusion for Spiking Transformer
  date: 2026-08
  url: https://arxiv.org/abs/2608.19238v1
  category: neuromorphic-sensors
  subcategory: application
  authors:
  - Dongcheng Zhao
  - Sicheng Shen
  - Zhenyu Yang
  - Zhiyuan Li
  - Jinyan Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Transformers model token interactions primarily through spiking
    self-attention (SSA). However, binary query and key representations map continuous
    similarities to sparse and discrete relation responses, which may suppress weak
    relations and limit the propagation of local spatial context. To address this
    limitation, we introduce Spiking Local Interaction (SLI) and Adaptive Complementary
    Fusion (ACF). SLI establishes an attention-independent pathway for direct information
    exchange among neighboring spiking tokens using lightweight depthwise--pointwise
    transformations. ACF integrates SSA and SLI through layer-specific, channel-wise
    coefficients that adaptively balance their contributions at different network
    depths. The proposed design preserves the original attention formulation and can
    be incorporated into different Spiking Transformer architectures with modest parameter
    overhead. Experiments on ImageNet-1K, CIFAR-10, CIFAR-100, CIFAR10-DVS, and ADE20K
    show consistent improvements across image classification, event-based recognition,
    and semantic segmentation. In particular, QKFormer with SLI and ACF achieves $84.37\%$
    Top-1 accuracy on ImageNet-1K and $37.5\%$ mIoU on ADE20K, where the segmentation
    model is trained without ImageNet pretraining. Ablation studies and qualitative
    analyses further indicate that SSA and SLI capture complementary interaction patterns
    and that learnable fusion consistently outperforms fixed weighting.
- title: Analog Quantum Asynchronous Event-Based Graph Neural Network
  date: 2026-06
  url: https://arxiv.org/abs/2606.11000v1
  category: neuromorphic-sensors
  subcategory: application
  authors:
  - Kristian Sotirov
  - Shaheen Acheche
  - Antonio A. Gentile
  - Osvaldo Simeone
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Asynchronous, event-based graph neural networks (AEGNNs) have recently
    emerged as an efficient paradigm for processing the sparse and high-temporal-resolution
    data from event cameras. In this paper, we propose quantum analog AEGNNs (QA-AEGNNs),
    a novel framework to implement an AEGNN on a neutral-atom quantum computer. Neutral-atom
    quantum processors offer a programmable analog quantum computing platform based
    on controllable Rydberg-atom interactions. To this end, we map the streaming event
    data to an array of trapped neutral atoms, where each atom represents a graph
    node (event) and is positioned such that geometric proximity reflects the spatio-temporal
    neighborhood of events. The native Rydberg Hamiltonian of the quantum processor
    is programmed to mirror the message-passing computations of the AEGNN, with atomic
    qubit states serving as node feature embeddings and inter-atom interactions realizing
    graph edges. Furthermore, we propose a hybrid quantum-classical training scheme
    in which the analog Hamiltonian parameters (e.g., laser pulse amplitudes and detunings)
    are optimized using classical feedback to learn the quantum AEGNN model from data.
    Our approach leverages the continuous Hamiltonian dynamics and massive parallelism
    of neutral-atom quantum systems to natively execute event-based graph computations
    with potential accuracy improvements
- title: 'CANNs: A Toolkit for Research on Continuous Attractor Neural Networks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.27783v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Sichao He
  - Aiersi Tuerhong
  - Shangjun She
  - Tianhao Chu
  - Yuling Wu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Continuous attractor neural networks (CANNs) are the canonical computational
    framework for how the brain encodes continuous variables such as spatial position,
    head direction, and movement direction, and explain the activity of hippocampal
    place cells, entorhinal grid cells, and head-direction cells. CANN research, however,
    is fragmented: most results rest on lab-specific implementations, general-purpose
    simulators lack CANN-specific abstractions, and the path from spike trains to
    attractor geometry in real recordings lacks a standardized toolkit. Here, we present
    a comprehensive open-source toolkit that unifies the full CANN research workflow.
    It combines three tightly integrated components: 1) canns, a Python library on
    BrainPy/JAX that provides standardized 1D/2D CANNs, spike-frequency-adaptation
    variants, grid cell networks, hierarchical path-integration models, and brain-inspired
    attractor architectures, together with curated datasets, task generators, an analyzer
    module and trainer modules for biologically plausible plasticity; 2) canns-lib,
    a Rust acceleration backend delivering hundreds-of-times speedups for spatial-navigation
    workloads and modest gains for Ripser-based persistent homology; 3) ASA (Attractor
    Structure Analyzer), a PySide6 pipeline applying persistent homology and cohomology
    to experimental neural recordings to detect ring-like and toroidal attractor signatures
    in real data. The toolkit ships with full-detail reproducible pipelines that recover
    recent CANN results including SFA-driven anticipative tracking, theta sweeps in
    head-direction/place/grid systems, and hierarchical path integration.'
- title: Effective pruning of task-trained recurrent neural networks using noisy fluctuations
    and connection rescaling
  date: 2026-08
  url: https://arxiv.org/abs/2608.05464v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Sanjith Senthil
  - Rishidev Chaudhuri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The pruning of network connections is key to brain function but, despite
    its importance, there exist few biologically-plausible pruning rules with demonstrated
    good performance. In this work we evaluate noise-prune, a recently introduced
    unsupervised local pruning rule for recurrent networks that uses noisy fluctuations
    to determine the importance of connections. Noise-prune has previously only been
    empirically tested on random networks without a specific computational function.
    We show that noise-prune preserves task-performance in task-trained recurrent
    neural networks, greatly outperforming a strategy that only uses the magnitude
    of connections and performing on par with or exceeding a non-local strategy that
    uses second-order information. Rather than deterministically removing connections
    that fall below a certain threshold importance, noise-prune samples connections
    to preserve based on their importance and strengthens retained connections to
    preserve average synaptic strength. We show that this sampling and rescaling is
    essential to good performance, but that the optimal empirical degree of rescaling
    is lower than that predicted by the original theoretical argument. Our work thus
    validates noise-prune as a biologically-plausible pruning rule for functional
    recurrent network architectures and characterizes its optimal parameter settings.
- title: Frame Theoretical Derivation of Three Factor Learning Rule for Oja's Subspace
    Rule
  date: 2026-04
  url: https://arxiv.org/abs/2604.02849v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Taiki Yamada
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We show that the error-gated Hebbian rule for PCA (EGHR-PCA), a three-factor
    learning rule equivalent to Oja's subspace rule under Gaussian inputs, can be
    systematically derived from Oja's subspace rule using frame theory. The global
    third factor in EGHR-PCA arises exactly as a frame coefficient when the learning
    rule is expanded with respect to a natural frame on the space of symmetric matrices.
    This provides a principled, non-heuristic derivation of a biologically plausible
    learning rule from its mathematically canonical counterpart.
- title: 'Single-Entity Spiking Neuron Models: Survey'
  date: 2026-07
  url: https://arxiv.org/abs/2607.07429v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Leon Parepko
  - Danila Shulepin
  - Albert Nasybullin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this work, we reviewed different approaches in mathematical modeling
    of biologically plausible neural systems. Models are characterized and classified
    based on their common features and special use cases. In addition to spiking models,
    different types of discrete and continuous analogs are considered to accurately
    simulate biological processes, including membrane potential dynamics. The models
    under investigation include neurons and various components encountered in neural
    systems and affected the dynamics. The selection of specific approaches was driven
    by their prevalence and innovative perspectives in order to enhance the relevance
    of the presented information.
- title: 'NeuroSynth: A Biologically Inspired Continual Reinforcement Learning Architecture
    for Mitigating Catastrophic Forgetting'
  date: 2026-07
  url: https://arxiv.org/abs/2607.28663v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Yash Kini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Artificial Intelligence (AI) systems often perform well on isolated tasks
    but struggle under continual learning conditions, where training on new tasks
    can overwrite previously acquired knowledge, a failure mode known as catastrophic
    forgetting. Biological learning systems reduce this interference through complementary
    memory processes involving rapid hippocampal encoding and slower cortical consolidation.
    This study introduces NeuroSynth, a brain-inspired continual reinforcement learning
    architecture designed to mitigate catastrophic forgetting through a dual-pathway
    consolidation mechanism. NeuroSynth separates rapid task acquisition from long-term
    retention using distinct "plan" and "habit" pathways combined with replay and
    knowledge distillation. NeuroSynth was evaluated against Proximal Policy Optimization
    (PPO) and Elastic Weight Consolidation (EWC) across three sequential navigation
    tasks with changing goal locations in a non-revisitation continual learning setting.
    Across six independent seeds, NeuroSynth preserved substantially more early-task
    knowledge than PPO after sequential training, achieving 18.00% Task A success
    rate compared to 0.33% for PPO (p = 0.014929, Cohen's d = 1.49) and 35.33% Task
    B success rate compared to 0.00% for PPO (p = 0.002376, Cohen's d = 2.31). NeuroSynth
    also demonstrated higher final Task C performance than EWC, achieving 9.00% compared
    to 2.00% (p = 0.226643, Cohen's d = 0.56), indicating a moderate but not statistically
    significant advantage. These findings suggest that biologically inspired consolidation
    mechanisms may improve the stability-plasticity balance in continual reinforcement
    learning systems.
- title: 'From Optimal Policies to Individual Differences: Rethinking Reinforcement
    Learning for Biology'
  date: 2026-07
  url: https://arxiv.org/abs/2607.16542v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Patrick Govoni
  - Palina Bartashevich
  - Clémence Bergerot
  - Valerii Chirkov
  - Valentin Lecheval
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Reinforcement learning (RL) is primarily known as a computational method
    for optimizing control tasks, but it is increasingly used to explain biological
    behavior. While RL successfully captures key aspects of biology, a major gap remains:
    between-agent behavioral variability. Consistent individual differences naturally
    permeate biological populations, yet RL models typically present only the single
    best individual or the population average. Addressing this gap requires moving
    beyond current practices to generate behavioral diversity using biologically plausible
    mechanisms. Here, we examine approaches from various subfields of RL and outline
    potential paths forward to close the gap between biology and simulation.'
- title: Structure Abstraction and Generalization in a Hippocampal-Entorhinal Inspired
    World Model
  date: 2026-05
  url: https://arxiv.org/abs/2605.15733v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Tianqiu Zhang
  - Muyang Lyu
  - Xiao Liu
  - Si Wu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Humans abstract experiences into structured representations to facilitate
    pattern inference and knowledge transfer. While the hippocampal-entorhinal (HPC-MEC)
    circuit is known to represent both spatial and conceptual spaces, the mechanisms
    for concurrently extracting abstract structures from continuous, high-dimensional
    dynamics remain poorly understood. We propose a brain-inspired hierarchical model
    that simultaneously infers latent transitions and constructs a predictive visual
    world model. Our architecture employs an inverse model for structural extraction
    alongside an HPC-MEC coupling model that dissociates relational structures (MEC)
    from integrated episodic scenes (HPC). Using primitive transformation dynamics
    as a benchmark, we demonstrate the model's capacity for structural abstraction.
    By leveraging velocity-driven path integration, the framework enables robust prediction
    and structural reuse across diverse contexts, thereby achieving structural generalization.
    This work provides a novel computational framework for understanding how brain-inspired,
    self-supervised learning of world models facilitates the acquisition of reusable
    abstract knowledge.
- title: Causal Learning with Neural Assemblies
  date: 2026-04
  url: https://arxiv.org/abs/2604.26919v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Evangelia Kopadi
  - Dimitris Kalles
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Can Neural Assemblies -- groups of neurons that fire together and strengthen
    through co-activation -- learn the direction of causal influence between variables?
    While established as a computationally general substrate for classification, parsing,
    and planning, neural assemblies have not yet been shown to internalize causal
    directionality. We demonstrate that the inherent operations of neural assemblies
    -- projection, local plasticity control, and sparse winner selection -- are sufficient
    for directional learning. We introduce DIRECT (DIRectional Edge Coupling/Training),
    a mechanism that co-activates source and target assemblies under an adaptive gain
    schedule to internalize directed relations. Unlike backpropagation-based methods,
    DIRECT relies solely on local plasticity, making the resulting causal claims auditable
    at the mechanism level. Our findings are verified through a dual-readout validation
    strategy: (i) synaptic-strength asymmetry, measuring the emergent weight gap between
    forward and reverse links, and (ii) functional propagation overlap, quantifying
    the reliability of directional signal flow. Across multiple domains, the framework
    achieves perfect structural recovery under a supervised, known-structure setting.
    These results establish neural assemblies as an auditable bridge between biologically
    plausible dynamics and formal causal models, offering an "explainable by design"
    framework where causal claims are traceable to specific neural winners and synaptic
    asymmetries.'
- title: Scalable neuromorphic computing from autonomous spiking dynamics in a clockless
    reconfigurable chip
  date: 2026-05
  url: https://arxiv.org/abs/2605.16114v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Eric Oliveira Gomes
  - Damien Rontani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We propose a scalable neuromorphic architecture based on spiking dynamics
    emerging from the autonomous time-continuous evolution of clockless (asynchronous)
    digital circuits. Implemented on commercially available field-programmable gate
    arrays (FPGAs), our system implements networks of interacting Boolean spiking
    neurons with configurable excitatory and inhibitory synaptic weights. A complete
    processing pipeline enables efficient handling of spike-encoded data for solving
    machine-learning tasks. We demonstrate competitive performance for an audio classification
    task with spike-based encoding and high-speed processing. Power consumption is
    significantly lower than traditional digital implementations; this makes our approach
    an efficient alternative that bridges the gap to dedicated analog neuromorphic
    systems without the need for specialized hardware design. More generally, our
    approach establishes clockless digital hardware as a viable platform for neuromorphic
    computing. It paves the way for reconfigurable chips to be turned into energy-efficient
    quasi-analog neuromorphic processors.
- title: Towards transferable lightweight neuromorphic computing through a model-free
    temporal-switch framework
  date: 2026-07
  url: https://arxiv.org/abs/2607.02608v2
  category: brain-inspired
  subcategory: theory
  authors:
  - Zefeng Zhang
  - Chao Li
  - Siyao Chen
  - Pei Chen
  - Bo-Wei Qin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Lightweight neuromorphic computing offers a promising route to efficient
    AI, with particular benefits for resource-constrained edge deployments. However,
    its scalable deployment that can reliably transfer the expected performance has
    long been hindered by device-to-device variations, which necessitate costly and
    repeated re-training on new copies and undermine the practical advantages. To
    address this issue, we introduce a model-free temporal-switch (TS) framework to
    improve the direct transfer performance, without post-training calibration or
    adjustment. The TS framework provides a methodology to incorporate a broader spectrum
    of devices in the training process. In the validation using memristor-based reservoir
    computing, it enables high performance on unseen devices with a directly transferred
    readout. It achieves improved prediction in the representative Mackey--Glass benchmark,
    and the accuracy of 92.4% in spoken digit classification. Its efficacy is validated
    across different memristor families and RC configurations. Theoretical analysis
    not only reveals the general computational mechanism underlying its efficacy,
    but also underlines its potential applicability to other physical platforms.
- title: 'The Forward-Backward Disconnect: State Dynamics, Credit Assignment, and
    Biological Grounding in Neural Computation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19995v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Hadi Al Mubasher
  - Mariette Awad
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'A recurring pattern in neural computation is the reintroduction of dynamical
    and biological structure into models originally simplified for scalable optimization.
    Early feedforward networks reduced biological neurons to threshold or rate-like
    summation units, an abstraction compatible with global-gradient training at scale.
    Since then, forward computation has diversified: modern architectures carry recurrent
    state, retrieve from long contexts through attention and associative memory, compress
    histories through structured state-space dynamics, evolve in continuous time,
    settle to implicit equilibria, and communicate through sparse spikes. Training
    has diversified less. Scalable learning remains concentrated around backpropagation,
    backpropagation through time, adjoint methods, implicit differentiation, and surrogate-gradient
    variants. We call this asymmetry the forward-backward disconnect and develop a
    taxonomy spanning neural model families along three coupled axes: state-dynamics
    structure, credit-assignment mechanism, and biological grounding. Forward and
    learning grounding are treated separately, and the unit of analysis is the architecture-learning
    configuration rather than the architecture name alone. Across static, recurrent,
    attention-based, state-space, continuous-time, implicit, spiking, biologically
    plausible, and neuromorphic families, forward dynamics have diversified while
    the highest demonstrated scales remain concentrated in global or closely gradient-derived
    error-propagation mechanisms. Closing this disconnect requires better alignment
    among state dynamics, credit assignment, and computational substrate.'
- title: A Variational Latent Equilibrium for Learning in Neuronal Circuits
  date: 2026-03
  url: https://arxiv.org/abs/2603.09600v2
  category: brain-inspired
  subcategory: theory
  authors:
  - Simon Brandt
  - Paul Haider
  - Walter Senn
  - Federico Benitez
  - Mihai A. Petrovici
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Brains remain unrivaled in their ability to recognize and generate complex
    spatiotemporal patterns. While AI is able to reproduce some of these capabilities,
    deep learning algorithms remain largely at odds with our current understanding
    of brain circuitry and dynamics. This is prominently the case for backpropagation
    through time (BPTT), the go-to algorithm for learning complex temporal dependencies.
    In this work we propose a general formalism to approximate BPTT in a controlled,
    biologically plausible manner. Our approach builds on, unifies and extends several
    previous approaches to local, time-continuous, phase-free spatiotemporal credit
    assignment based on principles of energy conservation and extremal action. Our
    starting point is a prospective energy function of neuronal states, from which
    we calculate real-time error dynamics for time-continuous neuronal networks. In
    the general case, this provides a simple and straightforward derivation of the
    adjoint method result for neuronal networks, the time-continuous equivalent to
    BPTT. With a few modifications, we can turn this into a fully local (in space
    and time) set of equations for neuron and synapse dynamics. Our theory provides
    a rigorous framework for spatiotemporal deep learning in the brain, while simultaneously
    suggesting a blueprint for physical circuits capable of carrying out these computations.
    These results reframe and extend the recently proposed Generalized Latent Equilibrium
    (GLE) model.
- title: Reconfigurable Nonlinear Photonic Networks for In-Situ Learning and Memory
    Formation via Driven-Dissipative Dynamics
  date: 2026-05
  url: https://arxiv.org/abs/2605.19911v2
  category: brain-inspired
  subcategory: theory
  authors:
  - Isaac Yorke
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Photonic neuromorphic computing offers a promising route to overcoming
    the limitations of conventional Von Neumann architectures by exploiting the high
    bandwidth, low latency, and massive parallelism of optical systems. However, most
    existing implementations rely on fixed dynamical substrates such as classic reservoir
    computing, where learning is restricted to external readout layers and memory
    is limited to transient fading effects. This work proposes a Reconfigurable Nonlinear
    Photonic Decision Network (RNPDN), a physically grounded neuromorphic framework
    in which computation, memory, and learning emerge directly from driven-dissipative
    dynamics. Through numerical simulations, this work demonstrates the simultaneous
    realization of key properties: local physical learning rules enabling adaptive
    state evolution, a tunable stability-plasticity tradeoff governed by decay and
    hysteresis mechanisms, controlled memory formation and erasure via bistable photonic
    states, fading memory, in-situ learning, and hardware-faithful nonlinear dynamics
    incorporating saturation and dissipation. In contrast to conventional approaches,
    the proposed system enables intrinsic adaptation within the physical layer while
    supporting both transient and persistent memory. These results establish a unified
    framework for adaptive photonic information processing and provide a pathway toward
    scalable and energy-efficient neuromorphic photonic hardware.'
- title: 'Diffusing Blame: Task-Dependent Credit Assignment in Biologically Plausible
    Dual-Stream Networks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.31700v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Yutaro Yamada
  - Luca Grillotti
  - Rujikorn Charakorn
  - Sebastian Risi
  - David Ha
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Biological neural circuits obey Dale''s principle: each neuron''s synapses
    are uniformly excitatory or inhibitory. Artificial networks that respect this
    constraint must coordinate separate excitatory and inhibitory populations, fundamentally
    changing how credit is assigned during learning. Several biologically plausible
    learning rules avoid backpropagation''s weight transport requirement, but it has
    been difficult to achieve strong performance under Dale''s principle beyond MNIST.
    Error Diffusion (ED) was originally proposed in a dual-stream excitatory/inhibitory
    architecture, where learning is driven by routing global error signals to all
    layers without transporting transposed forward weights or relying on random feedback
    matrices. Whether such a rule can scale under Dale''s principle across both supervised
    classification and reinforcement learning remains unknown. Here, we introduce
    modulo error routing to extend Error Diffusion beyond binary classification, and
    show that a dual-stream excitatory/inhibitory architecture trained with this method
    achieves 96.7% on MNIST and establishes a 61.7% baseline on CIFAR-10, demonstrating
    that representation learning is possible even when strictly enforcing Dale''s
    principle. For the classification setting, we introduce three domain-specific
    innovations: layer-specific sigmoid widths, batch-centered class error signals,
    and asymmetric initialization, and ablation analysis reveals that their relative
    importance reverses between MNIST and CIFAR-10, exposing task-dependent credit-assignment
    bottlenecks invisible to single-benchmark evaluation. In reinforcement learning,
    we integrate ED with Proximal Policy Optimization (PPO) and evaluate it on continuous-control
    tasks in Google Brax and on Craftax, an open-ended exploration task. We show that
    ED-PPO achieves competitive performance relative to Direct Feedback Alignment,
    a backpropagation-free baseline.'
- title: Controlled Dynamics Attractor Transformer
  date: 2026-06
  url: https://arxiv.org/abs/2606.15207v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Cheng Zhang
  - Minnan Luo
  - Zesheng Yang
  - Ming Li
  - Yong-Jin Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Transformer architectures have dramatically advanced representation learning
    and inference in deep models through self-attention mechanisms. In parallel,associative
    memory (AM) frameworks map representations onto energy landscapes, offering interpretable
    retrieval mechanisms. However, their continuous-time inference dynamics lack the
    biological plausibility of classical Continuous Attractor Neural Networks (CANNs).
    To bridge this gap, we propose Controlled Dynamics Attractor Transformer (CDAT),
    which couples a mixture von Mises-Fisher (Mo-vMF) attention energy with a Hopfield
    refinement energy, while augmenting energy descent with a CANN-inspired excitation-inhibition
    modulation. CDAT instantiates a topology-constrained dynamical system whose couplings
    encode relational structure among tokens, thereby linking attractor-style dynamics
    to modern energy-based attention. We further provide a constructive dissipation
    analysis to formally establish their controlled inference dynamics. Benefiting
    from these robust and structured dynamics, CDAT achieves state-of-the-art performance
    across multiple benchmarks in graph anomaly detection and graph classification.
- title: Harnessing cortical geometry, wiring, and function as inductive biases for
    recurrent neural networks
  date: 2026-06
  url: https://arxiv.org/abs/2606.14975v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Mo Shakiba
  - Rana Rokni
  - Mohammad Mohammadi
  - Nima Dehghani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: How the wiring and functional organization of cortex shape recurrent computation
    remains a central question in both neuroscience and machine learning. Here, we
    leverage data released through the Machine Intelligence from Cortical Networks
    (MICrONS) program--a functional connectomics resource spanning multiple areas
    of mouse visual cortex, in which dense calcium imaging is co-registered with high-resolution
    electron microscopy reconstruction from the same animal--to build biologically
    grounded recurrent neural networks. Using neuronal spatial coordinates, anatomical
    connectivity, and function-derived relationships from nearly 12,000 coregistered
    excitatory neurons, we initialize recurrent weights and impose communication-aware
    spatial constraints during learning. Across three cognitive decision-making tasks,
    networks constrained by cortical structure and function consistently outperform
    baseline and partially constrained models. Functional weight initialization provides
    the largest gain, while real spatial embedding yields robust additional improvements
    across conditions. These biologically grounded networks also develop low-entropy,
    modular, and small-world organization, and retain strong performance even when
    recurrence is restricted to positive weights. Together, our results show that
    the machinery of cortex--its geometry, wiring, and functional structure--can be
    harnessed as a powerful inductive basis for building recurrent networks that learn
    more effectively while converging toward key organizational principles of biological
    computation.
- title: Energy-Efficient Information Representation in MNIST Classification Using
    Biologically Inspired Learning
  date: 2026-02
  url: https://arxiv.org/abs/2603.00588v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Patrick Stricker
  - Florian Röhrbein
  - Andreas Knoblauch
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Efficient representation learning is essential for optimal information
    storage and classification. However, it is frequently overlooked in artificial
    neural networks (ANNs). This neglect results in networks that can become overparameterized
    by factors of up to 13, increasing redundancy and energy consumption. As the demand
    for large language models (LLMs) and their scale increase, these issues are further
    highlighted, raising significant ethical and environmental concerns. We analyze
    our previously developed biologically inspired learning rule using information-theoretic
    concepts, evaluating its efficiency on the MNIST classification task. The proposed
    rule, which emulates the brain's structural plasticity, naturally prevents overparameterization
    by optimizing synaptic usage and retaining only the essential number of synapses.
    Furthermore, it outperforms backpropagation (BP) in terms of efficiency and storage
    capacity. It also eliminates the need for pre-optimization of network architecture,
    enhances adaptability, and reflects the brain's ability to reserve 'space' for
    new memories. This approach advances scalable and energy-efficient AI and provides
    a promising framework for developing brain-inspired models that optimize resource
    allocation and adaptability.
- title: Quadratic integrate-and-fire neurons exhibit less fragmented loss landscapes
    and outperform leaky integrate-and-fire neurons in spike-based gradient descent
  date: 2026-06
  url: https://arxiv.org/abs/2606.03935v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Carlo Wenig
  - Raoul-Martin Memmesheimer
  - Christian Klos
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The ability to train spiking neural networks is essential for modeling
    biological neural networks as well as for neuromorphic computing. However, for
    the extensively used leaky integrate-and-fire (LIF) neurons, arbitrarily small
    parameter changes can induce spike (dis)appearances that disrupt subsequent activity,
    leading to unstable neural representations and permanently silent neurons during
    exact spike-based gradient descent. Recent work shows that a class of neuron models,
    which includes the quadratic integrate-and-fire (QIF) neuron, avoids these discontinuities
    and enables continuous and even smooth spike-based gradient descent. However,
    it remains unclear whether these advantages translate into practice. Here, we
    demonstrate that they do so via a controlled comparison between networks of LIF
    and QIF neurons on the popular Spiking Heidelberg Digits dataset. Specifically,
    in a first step, we perform a thorough hyperparameter search to optimize both
    models, revealing a clear performance advantage of QIF neurons. In a second step,
    we visualize the loss and gradient landscapes. Consistent with their inferior
    performance, we find that the loss landscapes of LIF neurons, which are discontinuous,
    appear more fragmented and the related gradients more erratic. An analysis of
    the landscapes of single samples indicates that these features arise from changes
    in the temporal order of spikes, which often cause disruptive spike (dis)appearances.
    Overall, our results advocate replacing LIF neurons with neuron models exhibiting
    continuous spiking dynamics, such as QIF neurons, for gradient descent training.
- title: Scaling Laws and Tradeoffs in Recurrent Networks of Expressive Neurons
  date: 2026-05
  url: https://arxiv.org/abs/2605.12049v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Aaron Spieler
  - Georg Martius
  - Anna Levina
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Cortical neurons are complex, multi-timescale processors wired into recurrent
    circuits, shaped by long evolutionary pressure under stringent biological constraints.
    Mainstream machine learning, by contrast, predominantly builds models from extremely
    simple units, a default inherited from early neural-network theory. We treat this
    as a normative architectural question. How should one split a fixed parameter
    budget $P$ between the number of units $N$, per-unit effective complexity $k_e$,
    and per-unit connectivity $k_c$? What controls the optimal allocation? This calls
    for a model in which per-unit complexity can be tuned independently of width and
    connectivity. Accordingly, we introduce the ELM Network, whose recurrent layer
    is built from Expressive Leaky Memory (ELM) neurons, chosen to mirror functional
    components of cortical neurons. The architecture allows for individually adjusting
    $N$, $k_e$, and $k_c$ and trains stably across orders of magnitude in scale. We
    evaluate the model on two qualitatively different sequence benchmarks: the neuromorphic
    SHD-Adding task and Enwik8 character-level language modeling. Performance improves
    monotonically along each of the three axes individually. Under a fixed budget,
    a clear non-trivial optimum emerges in their tradeoff, and larger budgets favor
    both more and more complex neurons. A closed-form information-theoretic model
    captures these tradeoffs and attributes the diminishing returns at two ends to:
    per-neuron signal-to-noise saturation and across-neuron redundancy. A hyperparameter
    sweep spanning three orders of magnitude in trainable parameters traces a near-Pareto-frontier
    scaling law consistent with the framework. This suggests that the simple-unit
    default in ML is not obviously optimal once this tradeoff surface is probed, and
    offers a normative lens on cortex''s reliance on complex spatio-temporal integrators.'
- title: A Theory-grounded Hybrid Neural Network Integrating Complementary Estimation
    Mechanisms for Stable Visual Object TrackingA
  date: 2026-06
  url: https://arxiv.org/abs/2606.22604v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Yancheng Zhou
  - Hanle Zheng
  - Lei Deng
  - Yujie Wu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Hybrid neural networks (HNNs) that integrate artificial neural networks
    (ANNs) with brain-inspired neural networks have achieved broad success across
    perception and control tasks. However, much of the current success is confined
    to neuron-scale hybridization, where discrete, spike-based coding fundamentally
    limits applicability to continuous-state estimation tasks. In neuroscience, continuous
    attractor neural networks (CANNs) represent continuous states through neural ensembles,
    pointing to a population-scale route for HNNs to address this limitation. Yet,
    principled methodologies for ANN-CANN integration remain largely underexplored.
    In this work, we propose a theory-grounded ANN-CANN hybridization framework and
    instantiate it as a hybrid tracking neural network (HTNN) for visual object tracking,
    a representative continuous-state estimation task. The framework aligns ANN response
    maps with CANN dynamics in the same state space, enabling the two heterogeneous
    branches to interact through the shared state representation. Furthermore, we
    uncover a functional bias-variance complementarity: data-driven ANNs provide asymptotically
    unbiased estimates, while CANN estimates are low-variance but temporally lagged.
    By operationalizing this complementarity, HTNN achieves stable and accurate tracking
    across nine visual tracking benchmarks, consistently outperforming single-network
    baselines and existing hybrid models. Notably, these performance gains are robustly
    maintained even under diverse environmental variations, including occlusion, motion
    blur, and background interference. Through this proof-of-concept study, our framework
    offers a generalizable foundation for advancing HNNs toward population-scale hybridization.'
- title: Updating the standard neuron model in artificial neural networks
  date: 2026-05
  url: https://arxiv.org/abs/2605.30370v3
  category: brain-inspired
  subcategory: theory
  authors:
  - Raul Mohedano
  - Thomas Batard
  - Erik Velasco-Salido
  - Ramsses De Los Santos Mendoza
  - Jorge H. Martínez
  venue: ''
  code_url: ''
  project_url: ''
  abstract: From their inception in the 1950s, artificial neural networks (ANNs) started
    using the so-called point neuron model then prevalent in neuroscience, hoping
    that this analogy would allow for a better emulation of brain function. Over the
    years the neuroscience literature has shown that the point neuron model is too
    simplistic to properly represent many fundamental neural processes; however, the
    standard neuron model in ANNs still remains the same. Here we substitute it by
    a very recent model of cortical cells and demonstrate through theoretical analyses
    and experimental results how, simply by using a more realistic neural unit element
    without augmenting the number of parameters, the resulting ANNs offer a number
    of important advantages that include increases in expressivity, robustness and
    learning speed, and a reduction in memorization and the amount of training data
    needed.
- title: Masked Autoencoders Learn Perception-Relevant Representations from Resting
    State Neural Data
  date: 2026-06
  url: https://arxiv.org/abs/2607.22615v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Aleksandr Kovalev
  - Antonio Lozano
  - Fabrizio Grani
  - Cristina Soto Sanchez
  - Leili Soo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Clinical neuroprosthetics face a data bottleneck: labeled perception
    trials are scarce while hours of spontaneous neural activity are largely underutilized.
    Here, we test whether self-supervised learning can use these unlabeled datasets
    to improve perception decoding. We pretrained a masked autoencoder on 14.6 hours
    of spontaneous multiunit activity from an intracortical array in a blind participant''s
    V1. The model captured interpretable brain structure without supervision: V1''s
    spatial organization and perceptual state separation both emerged purely from
    its latent representations. To test these features, we used linear probing (logistic
    regression on the frozen latents) to measure performance on the data with stimulation.
    Perception decoding accuracy reached 84.1% on a general psychometric task. On
    the more difficult threshold-level task, accuracy reached 64.0%. This work shows
    that spontaneous cortical activity is not noise; it contains rich, task-relevant
    structure. Unsupervised pretraining on this data is a promising strategy to improve
    neural decoding.'
- title: 'Structure as Computation: Developmental Generation of Minimal Neural Circuits'
  date: 2026-04
  url: https://arxiv.org/abs/2604.15143v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Duan Zhou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This work simulates the developmental process of cortical neurogenesis,
    initiating from a single stem cell and governed by gene regulatory rules derived
    from mouse single-cell transcriptomic data. The developmental process spontaneously
    generates a heterogeneous population of 5,000 cells, yet yields only 85 mature
    neurons - merely 1.7% of the total population. These 85 neurons form a densely
    interconnected core of 200,400 synapses, corresponding to an average degree of
    4,715 per neuron. At iteration zero, this minimal circuit performs at chance level
    on MNIST. However, after a single epoch of standard training, accuracy surges
    to over 90% - a gain exceeding 80 percentage points - with typical runs falling
    in the 89-94% range depending on developmental stochasticity. The identical circuit,
    without any architectural modification or data augmentation, achieves 40.53% on
    CIFAR-10 after one epoch. These findings demonstrate that developmental rules
    sculpt a domain-general topological substrate exceptionally amenable to rapid
    learning, suggesting that biological developmental processes inherently encode
    powerful structural priors for efficient computation.
- title: Neuromorphic Computing Based on Parametrically-Driven Oscillators and Frequency
    Combs
  date: 2026-04
  url: https://arxiv.org/abs/2604.21861v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Mahadev Sunil Kumar
  - Adarsh Ganesan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Parametrically driven oscillators provide a natural platform for neuromorphic
    computation, where nonlinear mode coupling and intrinsic dynamics enable both
    memory and high-dimensional transformation. Here, we investigate a two-mode system
    exhibiting 2:1 parametric resonance and demonstrate its operation as a reservoir
    computer across distinct dynamical regimes, including sub-threshold, parametric
    resonance, and frequency-comb states. By encoding input signals into the drive
    amplitude and sampling the resulting temporal and spectral responses, we perform
    one step-ahead prediction of benchmark chaotic systems, including Mackey-Glass,
    Rossler, and Lorenz dynamics. We find that optimal computational performance is
    achieved within the parametric resonance regime, where nonlinear interactions
    are activated while temporal coherence is preserved. In contrast, although frequency-comb
    states introduce increased spectral dimensionality, their performance is not consistently
    good across their existence band and also degrades in the chaotic comb regime
    due to loss of phase coherence. Mapping prediction error over parameter space
    reveals a direct correspondence between computational capability and the underlying
    bifurcation structure, with low-error regions aligned with the parametric resonance
    boundary. We further show that the input modulation, the detuning from the frequency
    matching condition, damping ratio, and input data rate systematically control
    the accessible dynamical regimes and thereby the computational performance. These
    results establish parametric resonance as a robust operating regime for oscillator-based
    reservoir computing and provide design principles for tuning physical systems
    toward optimal neuromorphic functionality.
- title: Self-organized MT Direction Maps Emerge from Spatiotemporal Contrastive Optimization
  date: 2026-05
  url: https://arxiv.org/abs/2605.11718v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Zhaotian Gu
  - Molan Li
  - Jie Su
  - Chang Liu
  - Tianyi Qian
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The spatial and functional organization of the primate visual cortex is
    a fundamental problem in neuroscience. While recent computational frameworks like
    the Topographic Deep Artificial Neural Network (TDANN) have successfully modeled
    spatial organization in the ventral stream, the computational origins of the dorsal
    stream's distinct topographies, such as direction-selective maps in the middle
    temporal (MT) area, remain largely unresolved. In this work, we present a spatiotemporal
    TDANN to investigate whether MT topography is governed by the same universal principles.
    By training a 3D ResNet on naturalistic videos via a Momentum Contrast (MoCo)
    self-supervised paradigm alongside a biologically inspired spatial loss, we demonstrate
    the spontaneous emergence of brain-like direction maps and topological pinwheel
    structures. Crucially, we reveal that MT tuning properties, characterized by strong
    direction selectivity paired with a residual axial component, arise from a strict
    optimization trade-off between task-driven discriminative pressure and spatial
    regularization. The model's representations quantitatively match in vivo macaque
    MT physiological baselines, including direction selectivity index, circular variance,
    and pinwheel density. These findings unify the computational origins of the ventral
    and dorsal streams, establishing a general mechanism for cortical self-organization.
- title: Divisive Normalization Shapes Low-Rank Slow Manifolds for Continuous Working
    Memory
  date: 2026-08
  url: https://arxiv.org/abs/2608.01947v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Zhaotian Gu
  - Jie Su
  - Weiwei Wang
  - Chang Liu
  - Tianyi Qian
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The ability to robustly maintain and update continuous variables is a
    hallmark of working memory. While classical continuous attractor networks suffer
    from severe fine-tuning fragility, standard artificial recurrent neural networks
    (RNNs) like GRUs and LSTMs typically fail to stably learn continuous manifolds,
    instead shattering the state space into discretized point attractors. To bridge
    this gap, we draw inspiration from divisive normalization, a canonical neural
    computation widely observed across cortical circuits, and propose the Recurrent
    Divisive Normalization Network (RDNN), a minimal and algebraically isolated model
    of dynamic division. Through dynamical systems analysis on canonical working memory
    tasks, we demonstrate that this biophysical constraint allows the network to converge
    to robust, high-fidelity slow manifolds. Furthermore, we analyze the gradient
    dynamics of divisive normalization during Backpropagation Through Time (BPTT),
    showing that it introduces an activity-dependent local gradient scaling. This
    scaling dampens parameter updates in highly active regimes, which empirically
    aligns with a significant self-compression of the network's effective rank, confining
    the recurrent dynamics to a tight, low-dimensional subspace while avoiding the
    optimization pathologies associated with explicit low-rank factorization. Finally,
    ablations demonstrate that while subtractive inhibition can maintain static memories,
    divisive normalization is mathematically essential to prevent manifold shattering
    under time-varying inputs. Our findings identify divisive normalization not merely
    as a biological artifact, but as a critical computational mechanism for learning
    high-fidelity continuous representations.
- title: 'A Bayes-Markov Neuromorphic Model of Cortical Orientation Selectivity: A
    Computational Re-implementation and Quantitative Simulation Study'
  date: 2026-08
  url: https://arxiv.org/abs/2608.12388v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Abolfazl Moslemi
  - Milad Sarabadani
  - Fatemeh Sefidian
  - Hossein Peyvandi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The emergence of orientation selectivity in the primary visual cortex
    (V1) remains a central question in computational neuroscience. Shirazi''s Bayes-Markov
    model proposed a probabilistic explanation for how orientation-selective inhibition
    can arise from non-oriented lateral geniculate nucleus (LGN) inputs through local
    inference. In that formulation, the activity pattern of striate cortical inhibitory
    (SCI) cells is estimated from the LGN activity pattern by a maximum a posteriori
    (MAP) criterion over a two-layer hierarchical Markov random field, and the resulting
    inference is implemented through a local parallel relaxation algorithm. We provide
    a computationally explicit re-implementation and quantitative simulation study
    of this framework. We reconstruct the mathematical model, describe its fully LGN-driven
    update rule, and implement a vectorized simulation framework that preserves the
    original local clique operations while making systematic parameter sweeps feasible.
    We evaluate the model using orientation tuning curves, an orientation selectivity
    index (OSI), controlled LGN noise perturbations, contrast tests, and model-variant
    comparisons. We further add a spiking SCI-layer realization using leaky integrate-and-fire
    and Hodgkin-Huxley neurons to examine whether the rate-coded SCI field can be
    expressed through temporally explicit neural activity. The simulations support
    the central qualitative behavior of the Bayes-Markov framework: sharp orientation
    selectivity, robustness to moderate LGN noise, and a biologically interpretable
    proof-of-concept spiking realization of the inferred inhibitory field.'
- title: Dynamic neural manifolds for flexible closed-loop control on neuromorphic
    hardware
  date: 2026-07
  url: https://arxiv.org/abs/2607.07373v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Oskar von Seeler
  - Christian Tetzlaff
  - Andrew Lehr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In biological circuits, sequential neural activity evolves along dynamic,
    low-dimensional manifolds to enable flexible behavior. Spiking network models
    link aspects of this sequential activity to features of manifold geometry through
    specific circuit mechanisms, making dynamic neural manifolds parameterizable,
    and thereby offering an explainable framework for neural computation. Extending
    this framework to neuromorphic engineering, we present an implementation on the
    SpiNNaker 2 chip for real-time, closed-loop control. By allowing sensory inputs
    to modulate heterogeneous inhibition, gain, and transient currents, our architecture
    drives rapid subspace rotations to switch between behaviors, as well as fine-grained
    trajectory control within them. We validate this via a robotic simulation where
    an agent uses sensory feedback to dynamically reconfigure its manifold geometry
    to navigate through a maze. Our results establish dynamic manifolds as a feasible
    approach for explainable neuromorphic architectures and a substrate for investigating
    biological neural dynamics.
- title: 'The Fast Lane Hypothesis: Von Economo Neurons Implement a Biological Speed-Accuracy
    Tradeoff'
  date: 2026-04
  url: https://arxiv.org/abs/2604.09229v2
  category: brain-inspired
  subcategory: theory
  authors:
  - Esila Keskin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'von Economo neurons (VENs) are large bipolar projection neurons found
    exclusively in the anterior cingulate cortex (ACC) and frontal insula of species
    with complex social cognition, including humans, great apes, cetaceans, and elephants.
    Their selective depletion in frontotemporal dementia (FTD) and altered development
    in autism implicate them in rapid social decision-making, yet no computational
    model of VEN function has previously existed. We introduce the Fast Lane Hypothesis:
    VENs implement a biological speed-accuracy tradeoff (SAT) by providing a sparse,
    fast projection pathway that enables rapid social decisions at the cost of deliberate
    processing accuracy. We model VENs as fast leaky integrate-and-fire (LIF) neurons
    (tau=5ms, fan-in=8) alongside standard pyramidal neurons (tau=20ms, fan-in=80)
    within a spiking cortical circuit (N_pyr=2,000) trained on a social discrimination
    task. Networks are evaluated under three clinically motivated conditions across
    10 independent random seeds: typical (2% VENs), autism-like (0.4% VENs), and FTD-like
    (post-training VEN ablation). All configurations achieve equivalent asymptotic
    classification accuracy (~99.4%), consistent with the prediction that VENs modulate
    decision speed rather than representational capacity. VENs produce median first-spike
    latencies 4ms earlier than pyramidal neurons, providing direct evidence of a fast
    signalling pathway. At a fixed decision threshold of theta=3, the typical condition
    is significantly faster than FTD-like (t=-23.31, p&lt;0.0001), while the autism-like
    condition is intermediate (mean RT=26.91+/-9.01ms vs. typical 20.70+/-2.02ms;
    p=0.078, trending). To our knowledge, this is the first computational model that
    asks what a von Economo neuron actually computes.'
- title: 'Kuramoto Oscillatory Phase Encoding: Neuro-inspired Synchronization for
    Improved Learning Efficiency'
  date: 2026-04
  url: https://arxiv.org/abs/2604.07904v2
  category: brain-inspired
  subcategory: theory
  authors:
  - Mingqing Xiao
  - Yansen Wang
  - Dongqi Han
  - Caihua Shan
  - Dongsheng Li
  venue: ''
  code_url: https://github.com/microsoft/Neuro-inspired_Phase_Encoding
  project_url: ''
  abstract: Spatiotemporal neural dynamics and oscillatory synchronization are widely
    implicated in biological information processing and have been hypothesized to
    support flexible coordination such as feature binding. By contrast, most deep
    learning architectures represent and propagate information through activation
    values, neglecting the joint dynamics of rate and phase. In this work, we introduce
    Kuramoto oscillatory Phase Encoding (KoPE) as an additional, evolving phase state
    to Vision Transformers, incorporating a neuro-inspired synchronization mechanism
    to advance learning efficiency. We show that KoPE can improve training, parameter,
    and data efficiency of vision models through synchronization-enhanced structure
    learning. Moreover, KoPE benefits tasks requiring structured understanding, including
    semantic and panoptic segmentation, representation alignment with language, and
    few-shot abstract visual reasoning (ARC-AGI). Theoretical analysis and empirical
    verification further suggest that KoPE can accelerate attention concentration
    for learning efficiency. These results indicate that synchronization can serve
    as a scalable, neuro-inspired mechanism for advancing state-of-the-art neural
    network models. Code is avaliable at https://github.com/microsoft/Neuro-inspired_Phase_Encoding.
- title: Hebbian Attractor Networks for Robot Locomotion
  date: 2026-03
  url: https://arxiv.org/abs/2603.22512v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Alexander Dittrich
  - Fuda van Diggelen
  - Dario Floreano
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Biological neural networks continuously adapt and modify themselves in
    response to experiences throughout their lifetime - a capability largely absent
    in artificial neural networks. Hebbian plasticity offers a promising path toward
    rapid adaptation in changing environments. Here, we introduce Hebbian Attractor
    Networks (HAN), a class of plastic neural networks in which local weight update
    normalization induces emergent attractor dynamics. Unlike prior approaches, HANs
    employ dual-timescale plasticity and temporal averaging of pre- and postsynaptic
    activations to induce either co-dynamic limit cycles or fixed-point weight attractors.
    Using simulated locomotion benchmarks, we gain insight into how Hebbian update
    frequency and activation averaging influence weight dynamics and control performance.
    Our results show that slower updates, combined with averaged pre- and postsynaptic
    activations, promote convergence to stable weight configurations, while faster
    updates yield oscillatory co-dynamic systems. We further demonstrate that these
    findings generalize to high-dimensional quadrupedal locomotion with a simulated
    Unitree Go1 robot. These results highlight how the timing of plasticity shapes
    neural dynamics in embodied systems, providing a principled characterization of
    the attractor regimes that emerge in self-modifying networks.
- title: Epileptic Seizure Detection in Separate Frequency Bands Using Feature Analysis
    and Graph Convolutional Neural Network (GCN) from Electroencephalogram (EEG) Signals
  date: 2026-03
  url: https://arxiv.org/abs/2604.00163v2
  category: brain-inspired
  subcategory: theory
  authors:
  - Ferdaus Anam Jibon
  - Fazlul Hasan Siddiqui
  - F. Deeba
  - Gahangir Hossain
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Epileptic seizures are neurological disorders characterized by abnormal
    and excessive electrical activity in the brain, resulting in recurrent seizure
    events. Electroencephalogram (EEG) signals are widely used for seizure diagnosis
    due to their ability to capture temporal and spatial neural dynamics. While recent
    deep learning methods have achieved high detection accuracy, they often lack interpretability
    and neurophysiological relevance. This study presents a frequency-aware framework
    for epileptic seizure detection based on ictal-phase EEG analysis. The raw EEG
    signals are decomposed into five frequency bands (delta, theta, alpha, lower beta,
    and higher beta), and eleven discriminative features are extracted from each band.
    A graph convolutional neural network (GCN) is then employed to model spatial dependencies
    among EEG electrodes, represented as graph nodes. Experiments on the CHB-MIT scalp
    EEG dataset demonstrate high detection performance, achieving accuracies of 97.1%,
    97.13%, 99.5%, 99.7%, and 51.4% across the respective frequency bands, with an
    overall broadband accuracy of 99.01%. The results highlight the strong discriminative
    capability of mid-frequency bands and reveal frequency-specific seizure patterns.
    The proposed approach improves interpretability and diagnostic precision compared
    to conventional broadband EEG-based methods.
- title: Structure-Guided Diffusion Model for EEG-Based Visual Cognition Reconstruction
  date: 2026-04
  url: https://arxiv.org/abs/2604.22649v1
  category: brain-inspired
  subcategory: theory
  authors:
  - Yongxiang Lian
  - Yueyang Cang
  - Pingge Hu
  - Yuchen He
  - Li Shi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Objective: Decoding visual information from electroencephalography (EEG)
    is an important problem in neuroscience and brain-computer interface (BCI) research.
    Existing methods are largely restricted to natural images and categorical representations,
    with limited capacity to capture structural features and to differentiate objective
    perception from subjective cognition. We propose a Structure-Guided Diffusion
    Model (SGDM) that incorporates explicit structural information for EEG-based visual
    reconstruction. Approach: SGDM is evaluated on the Kilogram abstract visual object
    dataset and the THINGS natural image dataset using a two-stage generative mechanism.
    The framework combines a structurally supervised variational autoencoder with
    a spatiotemporal EEG encoder aligned to a visual embedding space via contrastive
    learning. Structural information is integrated into a diffusion model through
    ControlNet to guide image generation from EEG features. Results: SGDM outperforms
    existing methods on both abstract and natural image datasets. Reconstructed images
    achieve higher fidelity in low-level visual features and semantic representations,
    indicating improved decoding accuracy and strong generalization across diverse
    visual domains. Spatiotemporal analysis of EEG signals further reveals hierarchical
    structural encoding patterns, consistent with the neural dynamics of visual cognition.
    Significance: These findings validate the effectiveness of SGDM in capturing explicit
    structural geometry and generating images with high fidelity to individual cognitive
    representations. By enabling decoding of complex visual content from EEG signals,
    the framework extends neural decoding beyond low-dimensional or categorical outputs.
    This supports BCIs with increased degrees of freedom for intention decoding and
    more flexible brain-to-machine communication.'
- title: 'AQ4SViT: An Automated Quantization Framework with Search Gating Policy for
    Compressing Spiking Vision Transformers'
  date: 2026-06
  url: https://arxiv.org/abs/2606.15523v1
  category: edge-computing
  subcategory: application
  authors:
  - Rachmad Vidya Wicaksana Putra
  - Saad Iftikhar
  - Muhammad Shafique
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Vision Transformers (SViTs) have emerged as alternative low-power
    ViT models, but their large sizes hinder their deployments on resource-constrained
    embedded AI systems. To address this, state-of-the-art works proposed quantization
    techniques to compress SViT models, but their manual, human-guided approach needs
    a huge design time and power/energy consumption to find the appropriate quantization
    setting for each given network, making this approach not scalable for quantizing
    multiple networks. Toward this, we propose AQ4SViT, a novel automated quantization
    framework for SViTs that can provide quick quantization settings with good trade-offs
    between accuracy and memory. To achieve this, AQ4SViT employs the following key
    ideas: quantization search strategy that evaluates the quantization setting candidates
    while considering the accuracy constraint; and search gating policy that quickly
    evaluates and selects promising quantization candidates by leveraging membrane
    potential drift as a performance proxy. In the search gating policy, AQSViT employs
    two search algorithm variants to provide trade-off options: Greedy search, which
    performs fast but may lead to local optima; and Beam search, which performs slower
    but has better performance in finding global optima selection due to a wider search
    space. Experimental results show that AQ4SViT-Greedy quickly finds the appropriate
    quantization settings, achieving up to 6.6x faster search time and up to 82.5%
    memory saving compared to the state-of-the-art; while AQ4SViT-Beam further reduces
    the memory footprint by up to 90% compared to the state-of-the-art, but with 4.5x
    longer search time; all these results are obtained while maintaining high accuracy
    within 1.5% from the original/non-quantized models on the ImageNet dataset. These
    results highlight that AQ4SViT framework offers advancements toward SViT deployments
    on embedded AI systems.'
- title: Neuromorphic Energy-Aware Learning for Adaptive Deep Brain Stimulation
  date: 2026-06
  url: https://arxiv.org/abs/2606.28600v1
  category: edge-computing
  subcategory: application
  authors:
  - Binh Nguyen
  - Colleen Josephson
  - Mircea Teodorescu
  - Gert Cauwenberghs
  - Jason Eshraghian
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Neuromorphic and edge computing research has focused on reducing the inference
    cost of neural network controllers, yet in physical closed-loop systems the actuator
    can rival or exceed an efficient controller in energy. An efficient controller
    is therefore necessary but not sufficient, because the actuator becomes the cost
    worth reducing once inference no longer dominates it. Here, we introduce energy-aware
    learning, an approach that incorporates actuator energy directly into the reinforcement
    learning reward, and demonstrate it in closed-loop deep brain stimulation (DBS)
    for Parkinson's disease. A deep spiking Q-network, trained in a biophysical cortico-basal
    ganglia-thalamic circuit model, learns to suppress pathological alpha-beta oscillations
    by 45.2% while reducing stimulation charge by 80.0% relative to continuous DBS.
    Sparsity-constrained knowledge distillation compresses the policy onto the SynSense
    XyloAudio 3 neuromorphic processor at 0.52 mW inference power, yielding 28.1x
    lower energy per inference than an equivalent artificial neural network on conventional
    edge hardware. By co-optimizing stimulation energy and inference efficiency, the
    framework addresses both major power demands in implantable neuromodulation.
- title: Neuromorphic Silicon Neuron Controller for Adaptive Deep Brain Stimulation
    in Parkinson's Disease
  date: 2026-07
  url: https://arxiv.org/abs/2607.05453v1
  category: edge-computing
  subcategory: application
  authors:
  - Md Abu Bakr Siddique
  - Jakub Orłowski
  - Yan Zhang
  - Hongyu An
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Parkinson's disease (PD) affects millions worldwide and causes severe
    motor symptoms. Adaptive deep brain stimulation (aDBS) delivers physiologically
    informed stimulation that can track fluctuations in PD motor symptoms, enabling
    more intelligent DBS control. However, most existing aDBS approaches are primarily
    algorithm- and software-driven, with limited efforts toward circuit realization,
    particularly low-power and implantable integrated circuits. This paper presents
    the Silicon Leaky Integrate-and-Fire Deep Brain Stimulation (SiLIF-DBS) controller,
    a neuromorphic silicon neuron stimulator implemented with metal-oxide-semiconductor
    (CMOS) technology. For system-level evaluation, a simplified computational model
    of the SiLIF-DBS controller is derived and embedded within a Parkinsonian cortico-basal
    ganglia framework for closed-loop validation. The system is driven by beta-band
    subthalamic nucleus local field potentials (STN-LFPs), with their average rectified
    value (Beta ARV) used as the control biomarker. Our SiLIF-DBS controller for aDBS
    suppresses pathological beta activity while consuming only 25% of the power required
    by open-loop stimulation and achieving a suppression efficiency of $5.85\%$/$μ$W.
    Overall, our SiLIF-DBS controller achieves strong beta suppression at substantially
    reduced power, delivering high suppression efficiency that demonstrates it is
    a viable foundation for low-power implantable aDBS.
- title: Encoding and Decoding Temporal Signals with Spiking Bandpass Wavelets
  date: 2026-05
  url: https://arxiv.org/abs/2605.09770v1
  category: edge-computing
  subcategory: application
  authors:
  - Jens Egholm Pedersen
  - Tony Lindeberg
  - Peter Gerstoft
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spike-based encodings are sparse and energy-efficient, but have largely
    been formulated probabilistically, disconnected from most signal processing literature.
    We recast spike encoders as time-causal wavelet frames with quantitative bandwidths
    and reconstruction error bounds. The proposed wavelets preserve the sparsity and
    locality of spiking representations, with reconstruction up to spike quantization
    and time discretization. We demonstrate reconstruction on ECG and audio datasets,
    achieving a normalized RMSE comparable to continuous wavelet transforms. The spiking
    wavelets map directly to neuromorphic hardware.
- title: 'CORVET: A CORDIC-Powered, Resource-Frugal Mixed-Precision Vector Processing
    Engine for High-Throughput AIoT applications'
  date: 2026-02
  url: https://arxiv.org/abs/2602.19268v1
  category: edge-computing
  subcategory: application
  authors:
  - Sonu Kumar
  - Mohd Faisal Khan
  - Mukul Lokhande
  - Santosh Kumar Vishvakarma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This brief presents a runtime-adaptive, performance-enhanced vector engine
    featuring a low-resource, iterative CORDIC-based MAC unit for edge AI acceleration.
    The proposed design enables dynamic reconfiguration between approximate and accurate
    modes, exploiting the latency-accuracy trade-off for a wide range of workloads.
    Its resource-efficient approach further enables up to 4x throughput improvement
    within the same hardware resources by leveraging vectorised, time-multiplexed
    execution and flexible precision scaling. With a time-multiplexed multi-AF block
    and a lightweight pooling and normalisation unit, the proposed vector engine supports
    flexible precision (4/8/16-bit) and high MAC density. The ASIC implementation
    results show that each MAC stage can save up to 33% of time and 21% of power,
    with a 256-PE configuration that achieves higher compute density (4.83 TOPS/mm2
    ) and energy efficiency (11.67 TOPS/W) than previous state-of-the-art work. A
    detailed hardware-software co-design methodology for object detection and classification
    tasks on Pynq-Z2 is discussed to assess the proposed architecture, demonstrating
    a scalable, energy-efficient solution for edge AI applications.
- title: 'Computing with Living Neurons: Chaos-Controlled Reservoir Computing with
    Knowledge Transplant'
  date: 2026-04
  url: https://arxiv.org/abs/2604.02552v1
  category: edge-computing
  subcategory: application
  authors:
  - Seung Hyun Kim
  - Zhi Dou
  - Gaurav Upadhyay
  - Anay Pattanaik
  - Leo Maslov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We introduce chaos-controlled Reservoir Computing (cc-RC) for living
    neural cultures: dynamically rich substrates of unique potential for adaptive
    computation. To account for intrinsic biological variability, cc-RC combines:
    (i) pre-training identification of each culture''s dynamical signature and phase-portrait
    attractor; (ii) low-power optical chaos control to stabilize spontaneous and stimulus-evoked
    activity; (iii) readout training within this controlled regime. Across hundreds
    of neural samples, cc-RC enables robust learning and pattern classification, improving
    both accuracy and model longevity by approximately 300% over standard RC. We further
    propose Knowledge Transplant (KT), for which the reservoir map learned by an expert
    culture is transplanted to an attractor-equivalent student culture, reducing training
    time to minutes while improving performance. By enabling cross-substrate, reusable
    learned models, KT paves the way for knowledge accumulation and sharing across
    neural populations, transcending biological lifespan limits.'
- title: Neural Dynamics Self-Attention for Spiking Transformers
  date: 2026-03
  url: https://arxiv.org/abs/2603.19290v1
  category: edge-computing
  subcategory: application
  authors:
  - Dehao Zhang
  - Fukai Guo
  - Shuai Wang
  - Jingya Wang
  - Jieyuan Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Integrating Spiking Neural Networks (SNNs) with Transformer architectures
    offers a promising pathway to balance energy efficiency and performance, particularly
    for edge vision applications. However, existing Spiking Transformers face two
    critical challenges: (i) a substantial performance gap compared to their Artificial
    Neural Networks (ANNs) counterparts and (ii) high memory overhead during inference.
    Through theoretical analysis, we attribute both limitations to the Spiking Self-Attention
    (SSA) mechanism: the lack of locality bias and the need to store large attention
    matrices. Inspired by the localized receptive fields (LRF) and membrane-potential
    dynamics of biological visual neurons, we propose LRF-Dyn, which uses spiking
    neurons with localized receptive fields to compute attention while reducing memory
    requirements. Specifically, we introduce a LRF method into SSA to assign higher
    weights to neighboring regions, strengthening local modeling and improving performance.
    Building on this, we approximate the resulting attention computation via charge-fire-reset
    dynamics, eliminating explicit attention-matrix storage and reducing inference-time
    memory. Extensive experiments on visual tasks confirm that our method reduces
    memory overhead while delivering significant performance improvements. These results
    establish it as a key unit for achieving energy-efficient Spiking Transformers.'
- title: Event-based Neural Decoding for Neuroprosthetic Motor Control
  date: 2026-07
  url: https://arxiv.org/abs/2607.11445v1
  category: edge-computing
  subcategory: application
  authors:
  - Khaleelulla Khan Nazeer
  - Sirine Arfa
  - Matthias Jobst
  - Richard George
  - Christian Mayr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A substantial number of patients experience diminished mobility due to
    disabilities, diseases, or accidents. Although modern prostheses, powered by deep
    neural networks, hold the promise of significantly enhancing the quality of life
    for these individuals, their widespread adoption is hindered by significant latency,
    energy consumption, and spatial requirements. Wired connections to external high-performance
    processors restrict patient mobility, while wireless connections limit the volume
    of information that can be transmitted to these processors. Spiking neural networks
    offer the potential for compressed communication and low-power inference, yet
    they often lag behind state-of-the-art deep learning models in various applications.
    In this study, we propose a high-performance neural decoding method that effectively
    balances task performance and efficiency. An eventbased gated recurrent unit generates
    a sparse communication pattern with graded spikes, surpassing classical spiking
    neural networks in terms of task performance. Utilising an efficient training
    method and sparse inference, our model presents new opportunities for on-device
    neural decoding.
- title: Road to scalability for efficient graph search on massively parallel neuromorphic
    hardware
  date: 2026-06
  url: https://arxiv.org/abs/2606.28907v1
  category: edge-computing
  subcategory: application
  authors:
  - Oskar von Seeler
  - Elena C. Offenberg
  - Carlo Michaelis
  - Tomas Kulvicius
  - Jannik Luboeinski
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Efficient computation of shortest paths in weighted graphs is a fundamental
    problem with many applications. Neuromorphic hardware platforms promise massively
    parallel, efficient computation, changing parallelism tradeoffs. In this work,
    we introduce NEURO-MAPP (Neuromorphic-based Min-Add Parallel Propagation), a distributed
    shortest path algorithm designed to use the local computation and network communication
    available in neuromorphic systems. We provide an optimized implementation of the
    algorithm on the SpiNNaker 2 platform and evaluate its performance on a selection
    of synthetic and real-world graphs. These results are compared to Dijkstra's algorithm
    on a modern CPU. We find that the NEURO-MAPP implementation scales favorably in
    terms of runtime for many graph types while consuming less energy per shortest-path
    query than the CPU implementation in almost all cases. These findings highlight
    the potential of neuromorphic hardware featuring sparse, spike-based communication
    as a scalable and energy-efficient platform for computation in graph search and
    related tasks.
- title: Threshold-Based Early Stopping of Accumulations in Neural Networks with Binary
    Activation
  date: 2026-08
  url: https://arxiv.org/abs/2608.06177v1
  category: edge-computing
  subcategory: application
  authors:
  - Quentin Luquet de Saint-Germain
  - Massil Ait Abdeslam
  - Jean Pierre David
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Binary neural networks are very attractive for constrained deployment,
    enabling small footprint and low-power inference. For binary activations, the
    dot products become sign-controlled additions or subtractions, but the number
    of operations is unchanged. Indeed, every neuron or output channel still accumulates
    all of its input, even though only the sign will be retained, which is often wasteful.
    As the accumulation progresses, the running partial sum frequently drifts so far
    from zero that its final sign becomes highly predictable long before the last
    term is reached; every contribution evaluated after that point changes the value
    of the sum but not the final output activation. This paper turns this observation
    into a post-training early-stopping mechanism. We characterize the behavior of
    the running accumulations on the training dataset and use this information to
    predict the final sign as soon as possible. No model parameter is retrained. We
    count the number of operations under an idealized ordering of weights. On VGG11
    applied to the CIFAR-10 dataset, the method removes $86.6\%$ of the accumulation
    terms of the deepest convolution for a $0.37$-point accuracy drop, and $25\%$
    of the full-network arithmetic when used on the three deepest convolutions simultaneously,
    for a $1.36$-point drop.
- title: Joint sparse coding and temporal dynamics support context reconfiguration
  date: 2026-05
  url: https://arxiv.org/abs/2605.10178v1
  category: edge-computing
  subcategory: application
  authors:
  - Qianqian Shi
  - Yue Che
  - Faqiang Liu
  - Hongyi Li
  - Mingkun Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Adaptive behavior requires the brain to transition between distinct contexts
    while maintaining representations of prior experience. The ability to reconfigure
    neural representations without erasing previously acquired knowledge is central
    to learning in dynamic environments, yet the neural mechanisms that support this
    balance remain unclear. Understanding these mechanisms is also critical for addressing
    catastrophic forgetting in artificial systems designed for lifelong learning.
    Here, we identify joint sparse coding and temporal dynamics in both the mouse
    medial prefrontal cortex (mPFC) and computational networks as mechanisms that
    help preserve prior representations during context transitions. Specifically,
    sparsity in context-dependent representations reduces cross-context interference,
    whereas temporal dynamics within the network activity further enhance context
    separability across time. Strikingly, networks endowed with both properties, such
    as spiking neural networks, exhibit improved retention during lifelong learning
    without auxiliary heuristics. These findings establish joint sparse coding and
    temporal dynamics as a core mechanism supporting flexible context reconfiguration
    in lifelong learning and, through their activity constraining nature, as an energy-efficient
    architectural principle for stable adaptation. Together, they provide a mechanistic
    framework for understanding how the brain preserves prior knowledge while flexibly
    adapting to new contexts.
- title: Towards Topology-Aware Very Large-Scale Photonic AI Accelerators
  date: 2026-04
  url: https://arxiv.org/abs/2604.26966v1
  category: edge-computing
  subcategory: application
  authors:
  - Belal Jahannia
  - Abdolah Amirany
  - Hamed Dalir
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid growth of deep neural networks (DNNs) has exposed fundamental
    limitations in electronic accelerators, where data movement dominates energy consumption,
    commonly referred to as the memory wall. Photonic accelerators offer a compelling
    alternative due to their inherent parallelism and high-speed matrix operations.
    However, existing research largely focuses on device-level innovations, leaving
    system-level scalability insufficiently explored. In this paper, we present a
    scalable photonic accelerator architecture based on a modular scale-out paradigm
    using 4 X 4 photonic tensor core units. We perform a systematic architectural
    analysis that incorporates the practical scaling limits of photonic hardware,
    including insertion loss, fanout penalties, and laser power limits, which restrict
    monolithic photonic scaling. Through evaluation on representative DNN workloads
    (GoogleNet, ResNet-18, MobileNet, and AlphaGo Zero) with up to 1024 processing
    elements, we identify a topology-dominated scaling bottleneck in the photonic
    domain, termed the Utilization Wall, where performance is governed by grid topology
    rather than hardware size. We further establish the Symmetric Grid Rule, demonstrating
    that symmetric topologies improve utilization by up to 6X while reducing memory
    access by over 40% compared to linear configurations, which reveal that topology-aware
    scaling is essential for achieving energy-efficient and high-performance photonic
    AI accelerators.
- title: 'Focus Session: Hardware and Software Techniques for Accelerating Multimodal
    Foundation Models'
  date: 2026-04
  url: https://arxiv.org/abs/2604.21952v1
  category: edge-computing
  subcategory: application
  authors:
  - Muhammad Shafique
  - Abdul Basit
  - Muhammad Abdullah Hanif
  - Alberto Marchisio
  - Rachmad Vidya Wicaksana Putra
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This work presents a multi-layered methodology for efficiently accelerating
    multimodal foundation models (MFMs). It combines hardware and software co-design
    of transformer blocks with an optimization pipeline that reduces computational
    and memory requirements. During model development, it employs performance enhancements
    through fine-tuning for domain-specific adaptation. Our methodology further incorporates
    hardware and software techniques for optimizing MFMs. Specifically, it employs
    MFM compression using hierarchy-aware mixed-precision quantization and structural
    pruning for transformer blocks and MLP channels. It also optimizes operations
    through speculative decoding, model cascading that routes queries through a small-to-large
    cascade and uses lightweight self-tests to determine when to escalate to larger
    models, as well as co-optimization of sequence length, visual resolution &amp;
    stride, and graph-level operator fusion. To efficiently execute the model, the
    processing dataflow is optimized based on the underlying hardware architecture
    together with memory-efficient attention to meet on-chip bandwidth and latency
    budgets. To support this, a specialized hardware accelerator for the transformer
    workloads is employed, which can be developed through expert design or an LLM-aided
    design approach. We demonstrate the effectiveness of the proposed methodology
    on medical-MFMs and on code generation tasks, and conclude with extensions toward
    energy-efficient spiking-MFMs.
- title: FPGA-Accelerated Neuromorphic Vision System for Real-Time Orbital Object
    Detection
  date: 2026-06
  url: https://arxiv.org/abs/2606.20727v1
  category: edge-computing
  subcategory: application
  authors:
  - Diego Hernández
  - Sebastián Valdivia
  - Vicente Westerhout
  - Esteban Vera
  - Daniel Yunge
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The escalating congestion in orbital space demands advanced monitoring
    solutions. This work presents a comprehensive open-source framework for neuromorphic
    resident space object (RSO) detection, adapting the foundational grid clustering
    algorithm for FPGA acceleration. The system integrates a single event-based camera
    (EBC) with a custom, distributed processing architecture, where rapid spatial
    quantization is executed in programmable logic (FPGA) and cluster formation is
    managed by a software client. We validate this architecture through systematic
    sampling of night-sky observations from the EVAS dataset, demonstrating 97% detection
    accuracy for RSOs. The implementation, which serves as a foundational toolkit
    for event-based FPGA processing, achieves efficient throughput with a total power
    consumption of 8.5 W and deterministic processing latencies below 62 ms. The architecture's
    energy efficiency and high-precision detection position it as a viable solution
    for distributed space surveillance networks.
- title: MO-SAE:Multi-Objective Stacked Autoencoders Optimization for Edge Anomaly
    Detection
  date: 2026-03
  url: https://arxiv.org/abs/2603.13895v1
  category: edge-computing
  subcategory: application
  authors:
  - Lizhao Zhang
  - Shengsong Kong
  - Tao Guo
  - Shaobo Li
  - Zhenzhou Ji
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Stacked AutoEncoders (SAE) have been widely adopted in edge anomaly detection
    scenarios. However, the resource-intensive nature of SAE can pose significant
    challenges for edge devices, which are typically resource-constrained and must
    adapt rapidly to dynamic and changing conditions. Optimizing SAE to meet the heterogeneous
    demands of real-world deployment scenarios, including high performance under constrained
    storage, low power consumption, fast inference, and efficient model updates, remains
    a substantial challenge. To address this, we propose an integrated optimization
    framework that jointly considers these critical factors to achieve balanced and
    adaptive system-level optimization. Specifically, we formulate SAE optimization
    for edge anomaly detection as a multi-objective optimization problem and propose
    MO-SAE (Multi-Objective Stacked AutoEncoders). The multiple objectives are addressed
    by integrating model clipping, multi-branch exit design, and a matrix approximation
    technique. In addition, a multi-objective heuristic algorithm is employed to effectively
    balance the competing objectives in SAE optimization. Our results demonstrate
    that the proposed MO-SAE delivers substantial improvements over the original approach.
    On the x86 architecture, it reduces storage space and power consumption by at
    least 50%, improves runtime efficiency by no less than 28%, and achieves an 11.8%
    compression rate, all while maintaining application performance. Furthermore,
    MO-SAE runs efficiently on edge devices with ARM architecture. Experimental results
    show a 15% improvement in inference speed, facilitating efficient deployment in
    cloud-edge collaborative anomaly detection systems.
- title: Co-Optimization of Analog Kolmogorov-Arnold Networks for Low-Power Function
    Approximation in Flexible Electronics
  date: 2026-06
  url: https://arxiv.org/abs/2606.27892v1
  category: edge-computing
  subcategory: application
  authors:
  - Paula Carolina Lozano Duarte
  - Georgios Zervakis
  - Mehdi Tahoori
  - Sani Nassif
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Wearable devices and Internet of Things (IoT) sensors require on-sensor
    processing of biosignals and environmental data, including computationally demanding
    operations such as nonlinear activation functions for neural network inference,
    sensor calibration curves to map raw readings to physical units, and signal preprocessing
    functions like logarithmic compression and power operations for feature extraction.
    These functions exhibit significant complexity, often involving transcendental
    operations and multivariate dependencies that are costly to implement digitally.
    Analog function approximation provides a power-efficient alternative by performing
    these computations in the analog domain, thereby reducing the energy overhead
    associated with analog-to-digital conversion and subsequent digital processing.
    Flexible Electronics (FE) present a particularly attractive platform for wearable
    applications due to mechanical flexibility and low-cost fabrication, but impose
    strict constraints on circuit density and power consumption, making efficient
    analog implementations critical but challenging. This work introduces Analog Kolmogorov-Arnold
    Networks (AKANs), developed via hardware-software co-optimization, to approximate
    these complex multivariate functions accurately under hardware imperfections.
    Our method incorporates circuit-level error modeling during training and applies
    pruning at both software and hardware levels to reduce area and power. Validation
    across multiple benchmarks demonstrates that our proposed pruning methodology
    not only reduces hardware cost but can also improve approximation accuracy by
    regularizing spline parameters. Results show up to 55% area and 50% power savings,
    with average reductions of nearly 30% across datasets, highlighting AKANs as a
    robust and generalizable framework for low-power analog function approximation
    in FE.
- title: 'PSViT: A Methodology for Structurally Pruning Spiking Vision Transformers'
  date: 2026-06
  url: https://arxiv.org/abs/2606.03257v1
  category: edge-computing
  subcategory: application
  authors:
  - Rachmad Vidya Wicaksana Putra
  - Achyuta Muthuvelan
  - Alberto Marchisio
  - Muhammad Shafique
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Vision Transformer (SViT) models are promising low-power ViT
    models for solving vision-based tasks with state-of-the-art performance. However,
    their large sizes limit their deployments for resource-constrained embedded platforms,
    underscoring the needs of model compression. One of prominent compression techniques
    is pruning, and the state-of-the-art works employ unstructured pruning techniques
    to compress SViT models. Such techniques require specialized hardware architectures
    tailored for the sparsity patterns to maximize their efficiency benefits, making
    this approach not scalable. To address this, we propose PSViT, a novel methodology
    to perform structured pruning on SViT models, hence making it possible to efficiently
    accelerate their inference using the existing and widely-used computing architectures.
    To do this, PSViT employs several key steps: uniform channel-wise filter pruning
    to structurally eliminate the non-significant weights, sensitivity analysis to
    evaluate the impact of channel-wise pruning of individual layer on accuracy and
    network size, as well as fine-grained channel-wise pruning based on the sensitivity
    analysis and the given network architecture. Experimental results show that PSViT
    effectively obtains 22.4% memory saving through single-shot pruning, while maintaining
    high accuracy within 3% (70.3% without fine-tuning and 72.8% with fine-tuning)
    from the original non-pruned SViT model (73.3%) on the ImageNet-1K. These results
    also show that the PSViT methodology advances the effort in enabling efficient
    SViT deployments on resource-constrained applications.'
- title: Scalable Memristive-Friendly Reservoir Computing for Time Series Classification
  date: 2026-04
  url: https://arxiv.org/abs/2604.19343v1
  category: edge-computing
  subcategory: application
  authors:
  - Coşku Can Horuz
  - Andrea Ceni
  - Claudio Gallicchio
  - Sebastian Otte
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Memristive devices present a promising foundation for next-generation
    information processing by combining memory and computation within a single physical
    substrate. This unique characteristic enables efficient, fast, and adaptive computing,
    particularly well suited for deep learning applications. Among recent developments,
    the memristive-friendly echo state network (MF-ESN) has emerged as a promising
    approach that combines memristive-inspired dynamics with the training simplicity
    of reservoir computing, where only the readout layer is learned. Building on this
    framework, we propose memristive-friendly parallelized reservoirs (MARS), a simplified
    yet more effective architecture that enables efficient scalable parallel computation
    and deeper model composition through novel subtractive skip connections. This
    design yields two key advantages: substantial training speedups of up to 21x over
    the inherently lightweight echo state network baseline and significantly improved
    predictive performance. Moreover, MARS demonstrates what is possible with parallel
    memristive-friendly reservoir computing: on several long sequence benchmarks our
    compact gradient-free models substantially outperform strong gradient-based sequence
    models such as LRU, S5, and Mamba, while reducing full training time from minutes
    or hours down seconds or even only a few hundred milliseconds. Our work positions
    parallel memristive-friendly computing as a promising route towards scalable neuromorphic
    learning systems that combine high predictive capability with radically improved
    computational efficiency, while providing a clear pathway to energy-efficient,
    low-latency implementations on emerging memristive and in-memory hardware.'
- title: Dual-axis attribution of zebrafish tectal microcircuits for energy-efficient
    and robust neurocomputing
  date: 2026-05
  url: https://arxiv.org/abs/2605.13924v1
  category: edge-computing
  subcategory: application
  authors:
  - Ningping Li
  - Hao Zhang
  - Yi Zhou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Biological neural circuits contain specialized substructures that support
    distinct computational functions, yet many bio-inspired neural networks borrow
    biological motifs without identifying their circuit-level origins. In this study,
    we investigate whether zebrafish tectal microcircuits can be attributed along
    two computational axes: energy-efficient information processing and robustness-preserving
    stabilization. We reconstruct a directed zebrafish-inspired retinotectal microcircuit
    graph and verify retinotectal signal propagation through dynamic simulation. A
    leaky integrate-and-fire spiking neural network is then used as a nonlinear perturbation
    testbed, where predefined subcircuits are selectively ablated and evaluated using
    the Energy Sensitivity Index and the Robustness Sensitivity Index.The results
    reveal a functional dissociation between two tectal subcircuits.The \textit{ns\_TIN}
    subcircuit shows a low spike footprint but a measurable influence on prediction
    error, suggesting a role as a spike-efficient internal information gate.In contrast,
    the \textit{superficial\_TIN} subcircuit produces the highest robustness sensitivity,
    suggesting a feedback-like role in maintaining system-level stability.We further
    transfer these attributed functions into ResNet18-based artificial neural networks
    and evaluate them on CIFAR-10 under inference-budget reduction and Gaussian noise
    corruption. The \textit{ns\_TIN}-inspired module improves performance preservation
    under reduced computation, whereas the \textit{superficial\_TIN}-inspired module
    improves robustness under input noise. These findings provide a subcircuit-level
    route for linking biological circuit organization with bio-inspired neural architecture
    design.'
- title: 'STARS: Spike Tail-Aware Relational Synthesis for ANN-to-SNN Data-Free Knowledge
    Distillation'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27409v1
  category: edge-computing
  subcategory: application
  authors:
  - Shuhan Ye
  - Yi Yu
  - Qixin Zhang
  - Hui Lu
  - Jiaming He
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'SNNs promise energy-efficient and low-latency inference, but their performance
    still trails that of ANNs. ANN-to-SNN knowledge distillation helps narrow this
    gap, yet the original training data are often unavailable in practical deployment
    settings. Existing data-free knowledge distillation (DFKD) methods synthesize
    surrogate data by matching teacher-side priors, especially BN statistics, but
    these ANN-oriented constraints mainly regularize mean and variance and therefore
    remain under-constrained for SNN students whose responses depend on threshold-crossing
    dynamics. In this paper, we propose Spike Tail-Aware Relational Synthesis (STARS),
    a plug-and-play method for ANN-to-SNN DFKD that augments standard BN-guided synthesis
    with two complementary objectives: Relational Consistency Alignment, which preserves
    cross-sample relational consistency between teacher and student, and Tail-Aware
    Regularization, which regularizes threshold-relevant tail probabilities through
    soft exceedance over teacher-derived thresholds. Together, these objectives generate
    synthetic batches that remain teacher-valid while becoming more informative for
    SNN students. Experiments on CIFAR-10, CIFAR-100, and Tiny-ImageNet across multiple
    ANN-SNN pairs show that our method consistently improves conventional DFKD baselines
    and even surpasses several KD methods, with gains of up to 4.6\% on CIFAR-10 and
    6.7\% on CIFAR-100, highlighting the importance of complementing BN matching with
    relational and tail-aware constraints in SNN-oriented DFKD.'
- title: An Amortized Efficiency Threshold for Comparing Neural and Heuristic Solvers
    in Combinatorial Optimization
  date: 2026-05
  url: https://arxiv.org/abs/2605.14624v2
  category: edge-computing
  subcategory: application
  authors:
  - Sohaib Afifi
  venue: ''
  code_url: https://github.com/sohaibafifi/aet
  project_url: ''
  abstract: A common critique of neural combinatorial-optimization solvers is that
    they are less energy-efficient than CPU metaheuristics, given the operational
    energy cost of training them on GPUs. This paper examines the inferential step
    from "training is expensive" to "neural solvers are net-inefficient", which is
    where the critique actually goes wrong. Training the network costs a large fixed
    amount of GPU energy; running the metaheuristic costs a small amount of CPU energy
    on every instance, repeated as long as the solver is deployed. The two are not
    commensurable until a deployment volume is fixed. We define the Amortized Efficiency
    Threshold (AET) as the deployment volume above which a neural solver breaks even
    with a heuristic baseline in total energy or carbon, under an explicit constraint
    on solution quality. We show that the cumulative-energy ratio between the two
    solvers tends to a constant strictly below one whenever the network wins per instance,
    and that this limit does not depend on how the training cost was measured. An
    embodied-carbon term amortizes hardware fabrication symmetrically on both sides.
    We instantiate the framework on the CVRP environment at n=50 customers with the
    attention-based autoregressive solver of Kool et al. (2019), trained for 100 epochs
    on 20,000 instances over five random seeds, and HGS via PyVRP as the heuristic
    baseline. The measured operational crossover sits near 4.56e3 deployed instances
    at the median of a six-point baseline-budget sweep; the per-instance neural-to-heuristic
    ratio is 2.29e-3. The contribution is the framework, the open instrumentation,
    and the end-to-end measurement protocol. Code and benchmark pipeline are available
    at https://github.com/sohaibafifi/aet.
- title: Scalable, Energy-Efficient Optical-Neural Architecture for Multiplexed Deepfake
    Video Detection
  date: 2026-05
  url: https://arxiv.org/abs/2605.19360v1
  category: edge-computing
  subcategory: application
  authors:
  - Parnian Ghapandar Kashani
  - Shiqi Chen
  - Aydogan Ozcan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid proliferation of AI-generated visual media has created an urgent
    need for efficient, trustworthy deepfake detection systems. However, existing
    deep learning-based detection methods rely on computationally intensive and energy-demanding
    inference algorithms, limiting their scalability. Here, we present a hybrid digital-analog
    deepfake video detection framework that combines a lightweight digital front-end
    with a spatially multiplexed optical decoding back-end for massively parallel
    analog inference through a programmable spatial light modulator. By simultaneously
    processing 15 or more video streams within a single optical propagation pass,
    the system enables high-throughput and accurate video-level authenticity prediction
    at reduced computational cost compared with purely digital methods. We validated
    this hybrid deepfake video processor using different datasets spanning classical
    face-swapping, real-world deepfake recordings, and fully AI-generated videos.
    Using a spatially multiplexed experimental set-up operating in the visible spectrum,
    we achieved average deepfake detection accuracy, sensitivity and specificity of
    97.79%, 99.86% and 95.72%, respectively, on the Celeb-DF video dataset with 15
    videos tested in parallel in a single optical pass per inference. The multiplexed
    optical decoder also demonstrates resilience against various types of video degradation,
    noise, compression, experimental misalignments and black-box adversarial attacks.
    Our results show that integrating optical computation into AI inference enables
    simultaneous gains in throughput, energy efficiency, and adversarial robustness
    - three properties that are difficult to achieve together in purely digital systems.
- title: 'Physical Foundation Models: Fixed hardware implementations of large-scale
    neural networks'
  date: 2026-04
  url: https://arxiv.org/abs/2604.27911v1
  category: edge-computing
  subcategory: application
  authors:
  - Logan G Wright
  - Tianyu Wang
  - Tatsuhiro Onodera
  - Peter L. McMahon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Foundation models are deep neural networks (such as GPT-5, Gemini~3,
    and Opus~4) trained on large datasets that can perform diverse downstream tasks
    -- text and code generation, question answering, summarization, image classification,
    and so on. The philosophy of foundation models is to put effort into a single,
    large (${\sim}10^{12}$-parameter) general-purpose model that can be adapted to
    many downstream tasks with no or minimal additional training. We argue that the
    rise of foundation models presents an opportunity for hardware engineers: in contrast
    to when different models were used for different tasks, it now makes sense to
    build special-purpose, fixed hardware implementations of neural networks, manufactured
    and released at the roughly 1-year cadence of major new foundation-model versions.
    Beyond conventional digital-electronic inference hardware with read-only weight
    memory, we advocate a more radical re-thinking: hardware in which the neural network
    is realized directly at the level of the physical design and operates via the
    hardware''s natural physical dynamics -- \textit{Physical Foundation Models} (PFMs).
    PFMs could enable orders-of-magnitude advantages in energy efficiency, speed,
    and parameter density. For ${\sim}10^{12}$-parameter models, this would both reduce
    the high energy burden of AI in datacenters and enable AI in edge devices that
    today are power-constrained to far smaller models. PFMs could also enable inference
    hardware for models much larger than current ones: $10^{15}$- or even $10^{18}$-parameter
    PFMs seem plausible by some measures. We present back-of-the-envelope calculations
    illustrating PFM scaling using an optical example -- a 3D nanostructured glass
    medium -- and discuss prospects in nanoelectronics and other physical platforms.
    We conclude with the major research challenges that must be resolved for trillion-parameter
    PFMs and beyond to become reality.'
- title: Survey on Neural Routing Solvers
  date: 2026-02
  url: https://arxiv.org/abs/2602.21761v2
  category: survey
  subcategory: review
  authors:
  - Yunpeng Ba
  - Xi Lin
  - Changliang Zhou
  - Ruihao Zheng
  - Zhenkun Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Neural routing solvers (NRSs) that leverage deep learning to tackle vehicle
    routing problems have demonstrated notable potential for practical applications.
    By learning implicit heuristic rules from data, NRSs replace the handcrafted counterparts
    in classic heuristic frameworks, thereby reducing reliance on costly manual design
    and trial-and-error adjustments. This survey makes two main contributions: (1)
    The heuristic nature of NRSs is highlighted, and existing NRSs are reviewed from
    the perspective of heuristics. A hierarchical taxonomy based on heuristic principles
    is further introduced. (2) A generalization-focused evaluation pipeline is proposed
    to address limitations of the conventional pipeline. Comparative benchmarking
    of representative NRSs across both pipelines uncovers a series of previously unreported
    gaps in current research.'
- title: 'HERCULES: Hardware-Efficient, Robust, Continual Learning Neural Architecture
    Search'
  date: 2026-05
  url: https://arxiv.org/abs/2605.04103v1
  category: survey
  subcategory: review
  authors:
  - Matteo Gambella
  - Fabrizio Pittorino
  - Manuel Roveri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Neural Architecture Search (NAS) has emerged as a powerful framework
    for automatically discovering neural architectures that balance accuracy and efficiency.
    However, as AI transitions from static benchmarks to real-world deployment, the
    traditional focus on hardware-aware efficiency is no longer sufficient. We observe
    that modern NAS methods, especially those that target edge AI, are evolving to
    address a triple objective: Efficiency, Robustness, and Continual Learning. While
    efficiency ensures feasibility in resource-constrained environments, robustness
    guarantees reliability under environmental variabilities, and continual learning
    enables adaptation to sequential tasks without catastrophic forgetting. We propose
    a taxonomy of NAS approaches through this triple lens, distinguishing between
    methods targeting resource optimization, environmental resilience, and architectural
    plasticity. This unified perspective reveals that these axes, though often studied
    in isolation, are mutually reinforcing. Building on this taxonomy, we map the
    current landscape of these NAS methods into a new framework called Hardware-Efficient,
    Robust, and ContinUal LEarning Search (HERCULES). We define the desiderata, the
    twelve labours of HERCULES, addressing the non-trivial challenge of balancing
    an adequate search-space exploration with the immense computational costs of a
    multi-objective NAS, accounting for these crucial objectives of current AI systems.
    By identifying critical gaps in existing research, this survey outlines a roadmap
    toward integrated algorithmic, architectural, and hardware-software co-design
    for truly deployable, lifelong-learning AI systems.'
- title: 'EEG Benchmarking Needs a Task Specification Layer: NeuroDoc for Rulebook-Guided,
    Executable Benchmark Construction'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22925v1
  category: survey
  subcategory: review
  authors:
  - Chengxuan Qin
  - Zhige Chen
  - Shu Peng
  - Rui Yang
  - Jiping Cui
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Electroencephalography (EEG) foundation models increasingly rely on multi-dataset
    training and evaluation, yet public EEG datasets still lack a shared task specification
    layer that can turn heterogeneous recordings into reusable benchmark units. Existing
    standards organize files, metadata, and provenance, but they do not specify EEG
    tasks under a common language and rulebook, leaving critical task semantics scattered
    across papers, code, and manual interpretation. We investigate whether heterogeneous
    public EEG datasets can be standardized through a structured task specification
    language paired with a shared rulebook. Our methodology represents each benchmark
    entry as a task document synchronized with an executable task kernel, with the
    rulebook defining task fields, evidence requirements, document-kernel alignment,
    review states, and machine-checkable constraints. Using this methodology, we release
    a community-reviewed EEG benchmark corpus centered on 53 completed and reviewed
    entries with 245 task definitions spanning diverse paradigms, and we introduce
    NeuroDoc and NeuroAudit as the operational support layer for rulebook-guided drafting,
    upgrading, review, amendment, and release management. We further examine whether
    the resulting benchmark units can be instantiated in a shared downstream setting
    across four EEG foundation model backbones, providing execution-based evidence
    for reusable, auditable, and executable EEG benchmarking infrastructure.
- title: 'From Brain Models to Executable Digital Twins: Execution Semantics and Neuro-Neuromorphic
    Systems'
  date: 2026-04
  url: https://arxiv.org/abs/2604.13574v1
  category: survey
  subcategory: review
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Brain digital twins aim to provide faithful, individualized computational
    representations of brains as dynamical systems, enabling mechanistic understanding
    and supporting prediction of clinical interventions. Yet current approaches remain
    fragmented across data pipelines, model classes, temporal scales, and computing
    platforms, which prevents the preservation of execution semantics across the end-toend
    workflow. This survey introduces physically constrained executability as a unifying
    perspective for comparing approaches at the level of execution: whether an execution
    state is persistent, which events are permitted to update it (simulation, measurement,
    actuation), and how strongly execution is temporally and causally coupled to neurobiological
    dynamics. Building on modeling and simulation theory, I propose a taxonomy of
    execution regimes ranging from isolated offline models to coordinated co-simulation,
    to continuously executing digital twins sustained by online data assimilation,
    and ultimately to neuro-neuromorphic physical systems in which biological and
    computational dynamics are co-executed under shared physical constraints. The
    executability concept clarifies why accuracy alone is insufficient, and motivates
    an agenda centered on semantic interoperability, hybrid-time correctness, evaluation
    protocols, scalable reproducible workflows, and safe closed-loop validation. This
    survey adopts a systems and runtime-oriented perspective, enabling comparison
    of heterogeneous approaches based on their execution semantics rather than on
    model form or application domain alone.'
- title: 'The Red Queen Gödel Machine: Co-Evolving Agents and Their Evaluators'
  date: 2026-06
  url: https://arxiv.org/abs/2606.26294v2
  category: survey
  subcategory: review
  authors:
  - Alex Iacob
  - Andrej Jovanović
  - William F. Shen
  - Daniel Burkhardt
  - Meghdad Kurmanji
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Self-improving agents are state-of-the-art (SOTA) on agentic coding benchmarks
    and have recently been extended to general domains. However, their search methods
    generally assume a stationary evaluation criterion: a fixed verifier, benchmark,
    or labeled dataset that remains valid as the agent improves. This ignores a central
    feature of evolution: species adapt as their environments change with them. We
    aim to bring the same principle to recursive self-improvement, making evaluation
    part of the improvement loop and opening search to evolving evaluators, adversarial
    objectives, and dynamic utilities that may surpass static benchmarks. We introduce
    the Red Queen Godel Machine (RQGM), an evolutionary framework for recursive self-improvement
    under non-stationary utilities. The RQGM makes this possible through controlled
    utility evolution: search is organized into epochs with a fixed within-epoch evaluation
    criterion, while the utility can be updated at epoch boundaries, so self-improvement
    guarantees hold per epoch as the objective evolves across them. We begin by showing
    that even on verifiable coding tasks, the RQGM improves test pass rate over the
    prior SOTA by adding a complementary agent-as-a-judge code-review signal. This
    signal is cheaper and the RQGM uses 1.35x-1.72x fewer tokens. We then turn to
    scientific paper writing and reviewing, and Olympiad-level proof writing and grading,
    where the RQGM improves performance over prior self-improving agents: co-evolved
    writers reach 1.78x-1.86x higher acceptance rates under a diverse agent-as-a-judge
    panel, while co-evolved graders reach 9% higher ground-truth accuracy. In paper
    reviewing, the strongest baseline reviewer over-accepts AI-generated papers at
    up to 1.91x the human rate. The RQGM corrects this by introducing an adversarial
    objective that discovers reviewers equally stringent on AI and human work.'
- title: 'Neural Architecture Search for Traffic Prediction: A Survey of Methods,
    Challenges, and Future Directions'
  date: 2026-07
  url: https://arxiv.org/abs/2607.26467v1
  category: survey
  subcategory: review
  authors:
  - Truong Giang Vu
  - Li Yang
  - Richard W. Pazzi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Traffic prediction is a core task in intelligent transportation systems,
    supporting applications such as adaptive signal control, route guidance, and ride-hailing
    dispatch. Deep learning models, including graph convolutional networks, recurrent
    networks, and Transformers, achieve strong results on standard benchmarks, but
    their architectures are designed by hand, requiring significant expert effort
    and producing models that often generalize poorly across cities and datasets.
    Neural Architecture Search (NAS) offers a systematic alternative to manual design.
    It automates the search over candidate architectures of deep learning models,
    finding designs that match the spatial-temporal structure of traffic data without
    manual trial and error. This survey reviews NAS methods applied to traffic prediction,
    organized by search strategy: gradient-based methods, evolutionary methods, and
    one-shot weight-sharing methods. For each category, we analyze how the search
    space is designed to cover spatial and temporal traffic operators, and how the
    search strategy balances cost against architecture quality. We also discuss open
    challenges, computational scalability to large road networks, manual search space
    design, cross-city generalization, dynamic graph structure, and the open question
    of NAS for spatial-temporal foundation models, and identify directions for future
    research.'
- title: Mechanistic Interpretability of EEG Foundation Models via Sparse Autoencoders
  date: 2026-05
  url: https://arxiv.org/abs/2605.13930v3
  category: survey
  subcategory: review
  authors:
  - William Lehn-Schiøler
  - Magnus Ruud Kjær
  - Rahul Thapa
  - Magnus Guldberg Pedersen
  - Anton Mosquera Storgaard
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'EEG foundation models achieve state-of-the-art clinical performance,
    yet the internal computations driving their predictions remain opaque: a barrier
    to clinical trust. We apply TopK Sparse Autoencoders (SAEs) across three architecturally
    distinct EEG transformers: SleepFM, REVE, and LaBraM to extract sparse feature
    dictionaries from their embeddings. By grounding these features in a clinical
    taxonomy (abnormality, age, sex, and medication), we benchmark monosemanticity
    and entanglement across architectures. A single hyperparameter procedure, driven
    by an intrinsic dictionary health audit, transfers robustly across all three architectures.
    Via concept steering, we introduce a "target vs. off-target" probe area metric
    to quantify steering selectivity and reveal three operational regimes: selectively
    steerable, encoded but entangled, and non-encoded. This framework exposes critical
    representational failures: "wrecking-ball" interventions that collapse global
    model performance, and clinical entanglements, such as age-pathology confounding,
    where it is impossible to suppress one concept without corrupting the other. Finally,
    a spectral decoder maps these interventions back to the amplitude spectrum, translating
    latent manipulations into physiologically interpretable frequency signatures,
    such as pathological slow-wave suppression and $α$-band restoration.'
- title: 'Approximation Theory for Neural Networks: Old and New'
  date: 2026-05
  url: https://arxiv.org/abs/2605.21451v1
  category: survey
  subcategory: review
  authors:
  - Soumendu Sundar Mukherjee
  - Himasish Talukdar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Universal approximation theorems provide a mathematical explanation for
    the expressive power of neural networks. They assert that, under mild conditions
    on the activation function, feedforward neural networks are dense in broad function
    classes, such as continuous functions on compact subsets of $\mathbb{R}^d$, $L^p$
    spaces, or Sobolev spaces. Over the past four decades, these qualitative universality
    results have evolved into a rich quantitative theory addressing approximation
    rates, parameter efficiency, and the role of architectural features such as depth
    and width. This survey presents several glimpses into this theory. We review classical
    density results for single-hidden-layer networks, as well as quantitative bounds
    that relate approximation error to network size and smoothness assumptions on
    target functions. Particular emphasis is placed on depth--width trade-offs and
    on results demonstrating that deeper architectures can achieve superior parameter
    efficiency for structured function classes. In addition to standard feedforward
    neural networks, we also review recent developments on Kolmogorov--Arnold Networks
    (KANs), which offer an alternative architectural paradigm and whose approximation-theoretic
    properties have begun to attract significant theoretical attention.
- title: Combining Trained Models in Reinforcement Learning
  date: 2026-05
  url: https://arxiv.org/abs/2605.02159v1
  category: survey
  subcategory: review
  authors:
  - Ujjwal Patil
  - Javad Ghofrani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Deep reinforcement learning (DRL) has delivered strong results in domains
    such as Atari and Go, but it still suffers from high sample cost and weak transfer
    beyond the training setting. A common response is to reuse information from previously
    trained models through transfer, distillation, ensemble methods, or federated
    training instead of learning each target task from random initialization. The
    literature on these mechanisms is fragmented, and published comparisons are hard
    to interpret because tasks, baselines, and compute budgets differ. This paper
    presents a PRISMA-guided systematic review of empirical studies on pretrained
    knowledge reuse in DRL. Starting from 589 records retrieved from IEEE Xplore,
    the ACM Digital Library, and citation tracing, we screened 570 unique records
    and assessed 89 full texts. After applying the final eligibility criteria, 15
    empirical studies remained in the main synthesis. We analyzed them qualitatively
    across three factors: source-target similarity, diversity among reused models,
    and the fairness of comparisons against from-scratch baselines. Three patterns
    recur across the surviving corpus. First, positive results are concentrated in
    settings where source and target tasks share substantial structure or where the
    method includes an explicit gating or alignment mechanism. Second, evidence for
    ensembles and federated aggregation is promising but sparse and mostly limited
    to narrow settings. Third, compute-matched comparisons are rare, which weakens
    claims about efficiency gains over stronger single-agent baselines. The paper
    contributes a narrower and internally consistent review scope, a study-level synthesis
    of empirical evidence, and a provisional independence spectrum that should be
    treated as a hypothesis for future benchmarking rather than a validated metric.'
- title: 'Engineering Hybrid Physics-Informed Neural Networks for Next-Generation
    Electricity Systems: A State-of-the-Art Review'
  date: 2026-05
  url: https://arxiv.org/abs/2605.21903v1
  category: survey
  subcategory: review
  authors:
  - Joseph Nyangon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The integration of machine learning with domain-specific physics is transforming
    the design, monitoring, and control of electricity systems, where data scarcity,
    limited interpretability, and the need to enforce physical laws constrain purely
    data-driven models. Physics-informed machine learning (PIML) addresses these limitations
    by embedding governing equations directly into the learning process, yielding
    accurate, efficient, and scalable solutions for Industry 4.0 applications. This
    article reviews hybrid PIML architectures for electricity systems, including physics-informed
    neural networks (PINNs), Deep Operator Networks (DeepONets), Fourier Neural Operators,
    Extreme Learning Machine-enhanced PINNs, graph-based PINNs (PIGNNs), and domain-decomposition
    PINNs. Each approach is examined through case studies spanning field analysis,
    fault detection, digital twins, surrogate modeling, and control optimization.
    The review shows that embedding Maxwell's equations and other first-principles
    constraints substantially improves predictive accuracy under sparse and noisy
    data, reduces simulation time by orders of magnitude relative to finite element
    methods, and enhances generalization across operating regimes. Hybrid frameworks
    consistently outperform purely data-driven baselines on parameter sensitivity,
    dynamic behavior, and robustness, while supporting real-time digital-twin calibration
    and uncertainty quantification. Persistent challenges include training instability
    for stiff multi-scale problems, computational cost of high-fidelity models, and
    the absence of standardized benchmarks. The findings demonstrate that PIML enables
    a paradigm shift from black-box data-driven methods to transparent, physics-informed
    strategies, positioning the field for sustained innovation in resilient and intelligent
    electricity systems.
- title: LLM for the development of FCM
  date: 2026-07
  url: https://arxiv.org/abs/2607.04983v2
  category: survey
  subcategory: review
  authors:
  - Alexis Kafantaris
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This article is about the development of a fuzzy cognitive map using a
    local large language model. In the light of recent advances it is evident that
    large language models, and even local large language models are capable of extracting
    quantities from textual data. In other words, a local LLM like Qwen2.5-32B, or
    probably larger, can accept entities as prompt input and determine relevant quantitative
    data as the model output. In turn, this output can be utilized for the construction
    of a data driven fuzzy cognitive map. Hence, this implementation is achieved and
    then the model is thoroughly tested; Qwen2.5-32B is used and the data is extracted
    from hotel reviews from TripAdvisor. Furthermore, the extracted documents pass
    through the model unfiltered and then a fuzzy cognitive map is trained and evaluated.
    A case is made about Greek reviews where a star topology FCM is formed that indicates
    the preferences of the reviewers. Finally, external validation is performed to
    establish whether the fuzzy cognitive map can correlate the star rating of the
    review -an outcome outside the model's inference scope -with its predicted satisfaction.
- title: 'RDEx-SOP: Exploitation-Biased Reconstructed Differential Evolution for Fixed-Budget
    Bound-Constrained Single-Objective Optimization'
  date: 2026-03
  url: https://arxiv.org/abs/2603.27089v1
  category: survey
  subcategory: review
  authors:
  - Sichen Tao
  - Yifei Yang
  - Ruihan Zhao
  - Kaiyu Wang
  - Sicheng Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Bound-constrained single-objective numerical optimisation remains a key
    benchmark for assessing the robustness and efficiency of evolutionary algorithms.
    This report documents RDEx-SOP, an exploitation-biased success-history differential
    evolution variant used in the IEEE CEC 2025 numerical optimisation competition
    (C06 special session). RDEx-SOP combines success-history parameter adaptation,
    an exploitation-biased hybrid branch, and lightweight local perturbations to balance
    fast convergence and final solution quality under a strict evaluation budget.
    We evaluate RDEx-SOP on the official CEC 2025 SOP benchmark with the U-score framework
    (Speed and Accuracy categories). Experimental results show that RDEx-SOP achieves
    strong overall performance and statistically competitive final outcomes across
    the 29 benchmark functions.
- title: 'RCMAES: A Robust CMA-ES Variant for CEC2026 Competition'
  date: 2026-04
  url: https://arxiv.org/abs/2604.27138v1
  category: survey
  subcategory: review
  authors:
  - Khoirul Faiq Muzakka
  - Sören Möller
  - Martin Finsterbusch
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper proposes RCMAES, a novel variant of the Covariance Matrix Adaptation
    Evolution Strategy (CMA-ES) for CEC benchmark optimization. RCMAES integrates
    a dimension-dependent nonlinear population-size reduction strategy with an adaptive
    restart mechanism within a pure CMA-ES framework. RCMAES is evaluated on three
    benchmark suites (CEC2017, CEC2020, and CEC2022) and compared with state-of-the-art
    DE algorithms as well as its closely related counterpart, BIPOP-aCMAES. Experimental
    results show that RCMAES achieves competitive and robust performance across all
    benchmarks.
- title: A Scalable Benchmark Test Suite for Dynamic Multi-Objective Optimization
    with a Changing Number of Objectives
  date: 2026-05
  url: https://arxiv.org/abs/2605.25785v1
  category: survey
  subcategory: review
  authors:
  - Ke Shang
  - Zhiyun Xiao
  - Yuxuan Liu
  - Jianguo Li
  - Shaojiang Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Dynamic multi-objective optimization with a changing number of objectives
    has recently attracted increasing attention due to its relevance to real-world
    problems whose evaluation criteria may evolve over time. However, existing benchmark
    test suites for this problem setting suffer from a fundamental limitation: when
    the number of objectives changes, the objective functions themselves also change
    implicitly. This makes it difficult to isolate and evaluate an algorithm''s capability
    to handle dynamics in the number of objectives alone. In this paper, we analyze
    this issue in detail and show that several theoretical properties claimed in prior
    studies rely on an assumption that is violated by commonly used test suites. To
    address this problem, we propose a scalable benchmark test suite in which the
    objective functions are fixed throughout the optimization process, while the number
    of active objectives changes over time. Our benchmark is constructed by defining
    a maximum-objective problem and dynamically selecting subsets of objectives. To
    avoid degeneracy issues in classical DTLZ and WFG problems, we adopt Minus-DTLZ
    and Minus-WFG formulations, in which all objectives are mutually conflicting.
    Extensive benchmark studies using representative algorithms from the literature
    demonstrate the usefulness and flexibility of the proposed test suite.'
- title: Exploration of Pareto-preserving Search Space Transformations in Multi-objective
    Test Functions
  date: 2026-04
  url: https://arxiv.org/abs/2604.08173v2
  category: survey
  subcategory: review
  authors:
  - Diederick Vermetten
  - Jeroen Rook
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Benchmark problems are an important tool for gaining understanding of
    optimization algorithms. Since algorithms often aim to perform well on benchmarks,
    biases in benchmark design provide misleading insights. In single-objective optimization,
    for example, many problems used to have their optimum in the center of the search
    domain. To remedy these issues, search space transformations have been widely
    adopted by benchmark suites, preventing algorithms from exploiting unintended
    structure. In multi-objective optimization, problem design has focused primarily
    on the objective space structure. While this focus addresses important aspects
    of the multi-objective nature of the problems, the search space structures of
    these problems have received comparatively limited attention. In this work, we
    re-emphasize the importance of transformations in the search space, and address
    the challenges inherent in adding transformations to boundary constraints problems
    without impacting the structure of the objective space. We utilized two parameterized,
    bijective transformations to create different instantiations of popular benchmark
    problems, and show how these changes impact the performance of various multi-objective
    optimization algorithms. In addition to the search space transformations, we show
    that such parameterized transformations can also be applied to the objective space,
    and compare their respective performance impacts.
- title: 'Block-Bench: A Framework for Controllable and Transparent Discrete Optimization
    Benchmarking'
  date: 2026-04
  url: https://arxiv.org/abs/2604.06973v1
  category: survey
  subcategory: review
  authors:
  - Furong Ye
  - Frank Neumann
  - Thomas Bäck
  - Niki van Stein
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a novel approach for constructing discrete optimization benchmarks
    that enables fine-grained control over problem properties, and such benchmarks
    can facilitate analyzing discrete algorithm behaviors. We build benchmark problems
    based on a set of block functions, where each block function maps a subset of
    variables to a real value. Problems are instantiated through a set of block functions,
    weight factors, and an adjacency graph representing the dependency among the block
    functions. Through analyzing intermediate block values, our framework allows to
    analyze algorithm behavior not only in the objective space but also at the level
    of variable representations in the obtained solutions. This capacity is particularly
    useful for analyzing discrete heuristics in large-scale multi-modal problems,
    thereby enhancing the practical relevance of benchmark studies. We demonstrate
    how the proposed approach can inspire the related work in self-adaptation and
    diversity control in evolutionary algorithms. Moreover, we explain that the proposed
    benchmark design enables explicit control over problem properties, supporting
    research in broader domains such as dynamic algorithm configuration and multi-objective
    optimization.
- title: 'Planktonzilla: Multimodal dataset and models for understanding plankton
    ecosystems'
  date: 2026-05
  url: https://arxiv.org/abs/2606.00080v1
  category: survey
  subcategory: review
  authors:
  - Alan Gerson Contreras Montanares
  - Luis Valenzuela
  - Luis Martí
  - Nayat Sanchez-Pi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Marine plankton underpin aquatic food webs and play a key role in global
    CO2 sequestration, making reliable species identification critical for understanding
    ocean health and climate feedbacks. Existing classification models perform well
    on individual collections but fail to generalize across instruments and environments
    due to isolated training datasets and inconsistent labels. To address this, we
    introduce Planktonzilla-17M, a unified dataset consolidating publicly available
    plankton image collections spanning thirteen imaging systems. It comprises 17.4
    million images with standardized taxonomy and geo-environmental metadata, including
    3.74 million plankton images spanning over 602 taxonomic classes, of which 201
    are identified at the species level, making it the largest and most comprehensive
    plankton image dataset to date. Using this large-scale dataset, we perform a controlled
    comparison between supervised and CLIP-style image--text training on a shared
    ViT backbone. We find that a supervised classifier matches or exceeds CLIP-style
    training when trained using taxonomic lineage as text. We further observe that
    BioCLIP and BioCLIP2 perform poorly on plankton in zero-shot and few-shot settings.
    Leveraging Planktonzilla-17M improves plankton classification performance, highlighting
    the limitations of current biological foundation models in marine imaging domains.
- title: On the Runtime Analysis of Reinforcement Learning Hyper-Heuristics
  date: 2026-07
  url: https://arxiv.org/abs/2607.22036v1
  category: survey
  subcategory: review
  authors:
  - Pietro S. Oliveto
  - Zhenyu Wang
  - Peizhou Wu
  - Mengqing Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Selection Hyper-heuristics (HHs) automate algorithmic design by selecting
    from a set of low-level heuristics which one to apply at each stage of the optimisation
    process. Several impressive results have been recently rigorously proven regarding
    the performance of selection hyper-heuristics (HHs) for standard benchmark functions.
    However, the learning mechanisms employed by these HHs are considerably simplified
    compared to the machine learning techniques typically used in real world applications.
    In this paper we analyse a Reinforcement Learning Hyper-heuristic (RLHH) from
    the literature. The only previous result available proved that for a wide range
    of parameter settings, RLHH does not learn to select heuristics appropriately
    for the standard LeadingOnes benchmark function. In this paper, we rigorously
    prove that with appropriate parameter values RLHH equipped with two random local
    search operators, RLS_1 and RLS_2 optimises the LeadingOnes benchmark function
    in the best possible expected runtime achievable with the two operators up to
    lower order terms. Experiments show that for realistic problem sizes it is faster
    than the Generalised Random Gradient HH which was previously proven to also have
    optimal expected runtime up to lower order terms.
- title: 'ARES-LSHADE: Autoresearch-Enhanced LSHADE with Memetic Polish for the GNBG
    Benchmark'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13877v2
  category: survey
  subcategory: review
  authors:
  - Abdullah Naeem
  - Md Wasi Ul kabir
  - Manish Bhatt
  - Ayon Dey
  - Anav Katwal
  venue: ''
  code_url: https://github.com/anaeem1/ARES-LSHADE
  project_url: ''
  abstract: 'We present ARES-LSHADE, a memetic differential-evolution variant submitted
    to the GECCO 2026 competition on LLM-designed evolutionary algorithms for the
    Generalized Numerical Benchmark Generator (GNBG). The algorithm builds on the
    LLM-LSHADE 2025 winner, contributing two new components: (a) a scout-augmented
    mutation operator with adaptive CMA-ES integration, produced by an autonomous
    research loop across approximately thirty LLM-driven design experiments, and (b)
    a multi-start L-BFGS-B polish phase that respects strict blackbox treatment of
    the benchmark. On the official 31-run-per-function evaluation with the competition-specified
    function-evaluation budgets, ARES-LSHADE obtains 510 of 744 wins (per-function
    gap below 1e-8), reaching machine precision on 18 of 24 functions. The remaining
    six functions exhibit characteristic plateau signatures consistent with GNBG''s
    compositional structure, and were independently identified by the autoresearch
    loop as the hardest of the suite. Beyond the result itself, this report documents
    two methodological observations: (i) an LLM-driven research loop with operator-only
    edit surface and fitness-only observation space converges to a characteristic
    plateau on this benchmark; (ii) when we initially widened the observation space
    to include the benchmark''s compositional metadata, the resulting algorithm trivially
    solved all 24 functions but violated the competition''s blackbox rule, which we
    identified before submission. We discuss this tension between LLM capability and
    benchmark integrity as a design consideration for future LLM-driven optimization-algorithm
    research. Code and reproducibility artifacts are available at https://github.com/anaeem1/ARES-LSHADE.'
- title: 'RDEx-CSOP: Feasibility-Aware Reconstructed Differential Evolution with Adaptive
    epsilon-Constraint Ranking'
  date: 2026-03
  url: https://arxiv.org/abs/2603.27090v1
  category: survey
  subcategory: review
  authors:
  - Sichen Tao
  - Yifei Yang
  - Ruihan Zhao
  - Kaiyu Wang
  - Sicheng Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Constrained single-objective numerical optimisation requires both feasibility
    maintenance and strong objective-value convergence under limited evaluation budgets.
    This report documents RDEx-CSOP, a constrained differential evolution variant
    used in the IEEE CEC 2025 numerical optimisation competition (C06 special session).
    RDEx-CSOP combines success-history parameter adaptation with an exploitation-biased
    hybrid search and an ε-constraint handling mechanism with a time-varying threshold.
    We evaluate RDEx-CSOP on the official CEC 2025 CSOP benchmark using the U-score
    framework (Speed, Accuracy, and Constraint categories). The results show that
    RDEx-CSOP achieves the highest total score and the best average rank among all
    released comparison algorithms, mainly through strong speed and competitive constraint-handling
    performance across the 28 benchmark functions.
- title: Selection Hyper-heuristics Can Automatically Adjust the Learning Period to
    Optimally Solve Pseudo-Boolean Problems
  date: 2026-05
  url: https://arxiv.org/abs/2605.29916v1
  category: survey
  subcategory: review
  authors:
  - Benjamin Doerr
  - Pietro S. Oliveto
  - John Alasdair Warwicker
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Random Gradient hyper-heuristic was recently shown to be able to learn
    the optimal neighbourhood size when optimizing the LeadingOnes benchmark via the
    Randomised Local Search (RLS) meta-heuristic. However, for this to happen, a learning
    period of a certain length $τ$ had to be used, differently from classic hyper-heuristics,
    which change their behaviour based on the success of only the previous iteration.
    In this paper, we show how to automatically set this new parameter value, relieving
    the user from the non-trivial task of controlling this novel algorithm parameter.
    We prove that the resulting hyper-heuristic selects the optimal neighbourhood
    size in a $1-o(1)$ fraction of the iterations and, consequently, optimises the
    LeadingOnes benchmark in the best possible time (apart from lower-order terms)
    achievable with these neighborhood sizes.
- title: 'DALight-3D: A Lightweight 3D U-Net for Brain Tumor Segmentation from Multi-Modal
    MRI'
  date: 2026-05
  url: https://arxiv.org/abs/2605.04518v1
  category: survey
  subcategory: review
  authors:
  - Nand Kumar Mishra
  - Dhruv Mishra
  - Dr Manu Pratap Singh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Automatic brain tumor segmentation from multi-modal MRI remains challenging
    because volumetric models often incur substantial computational cost. This paper
    presents DALight-3D, a compact 3D U-Net variant that combines depthwise separable
    3D convolutions, identifier-conditioned normalization, cross-slice attention,
    and adaptive skip fusion. The method is evaluated on the Medical Segmentation
    Decathlon Task01 BrainTumour benchmark under matched optimization settings against
    standard 3D U-Net, Attention U-Net, Residual 3D U-Net, and V-Net baselines. In
    the reported 50-epoch comparison, DALight-3D achieves a mean Dice of 0.727 with
    2.22M parameters, compared with 0.710 Dice and 3.20M parameters for Residual 3D
    U-Net. Component-wise ablations show consistent performance degradation when SepConv,
    identifier-conditioned normalization, CSA, or SSFB is removed. These results indicate
    that DALight-3D offers a favorable accuracy-efficiency trade-off within the present
    benchmark setting.
- title: 'Graph Instance Landscapes: When Structural Similarity Does (Not) Reflect
    Shortest-Path Performance'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18267v1
  category: survey
  subcategory: review
  authors:
  - Maryam Gholami Shiri
  - Ivana Krminac
  - Marko Djukanović
  - Sašo Džeroski
  - Eva Tuba
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Benchmarking shortest-path algorithms is commonly based on aggregate
    performance over heterogeneous graph sets, which limits insight into how different
    search paradigms react to instance structure. We adopt an instance-landscape view
    of graph benchmarking by embedding graphs into a low-cost structural feature space
    and clustering them into regions of similar structure. Three benchmark suites
    are studied: weighted Erdős--Rényi graphs, random geometric (wireless) graphs,
    and real-world road networks. We evaluate four representative shortest-path solvers
    spanning uninformed exact search (Dijkstra), bidirectional exact search (bidirectional
    Dijkstra), heuristic-guided exact search (A$^{*}$), and deque-based strategies
    (DEQ). Clustering robustness is analyzed under multiple feature-selection schemes,
    and runtime distributions are compared across landscape regions using non-parametric
    tests. While generator parameters induce stable structural regions, we find that
    feature-space similarity does not necessarily imply performance similarity: significant
    runtime shifts are frequently observed even within the same landscape region.
    A merged-suite analysis further shows that different benchmark families occupy
    largely disjoint regions. These results highlight both the potential and the limits
    of structural landscapes for the structure-aware benchmarking of shortest-path
    algorithms.'
- title: 'Linear Ordering Problem: Time for a Change'
  date: 2026-05
  url: https://arxiv.org/abs/2605.31051v2
  category: survey
  subcategory: review
  authors:
  - Fabrizio Fagiolo
  - Marco Baioletti
  - Valentino Santucci
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Linear Ordering Problem (LOP) is a fundamental combinatorial optimization
    problem with important applications in areas such as economics, social choice,
    and machine learning. Its most prominent use is the triangulation of economic
    input-output tables, which helps identify critical industries in an economy. Most
    existing algorithms have been evaluated on benchmarks derived from outdated macroeconomic
    data, which no longer reflect the structure of contemporary economies. Furthermore,
    LOP instances often exhibit many distinct global optima that can differ substantially
    from one another, creating challenges for applications that rely on a single solution.
    To address these limitations, we introduce a novel benchmark suite derived from
    up-to-date real-world economic data and an algorithmic scheme that leverages state-of-the-art
    LOP metaheuristics to generate diverse sets of high-quality solutions, together
    with metrics for assessing both quality and diversity. Experiments were conducted
    to report results on the proposed benchmark suite under both the traditional single-solution
    setting and the newly introduced multi-solution scenario
- title: Benchmarking Stopping Criteria for Evolutionary Multi-objective Optimization
  date: 2026-04
  url: https://arxiv.org/abs/2604.25458v1
  category: survey
  subcategory: review
  authors:
  - Kenji Kitamura
  - Ryoji Tanabe
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Stopping criteria automatically determine when to stop an evolutionary
    algorithm, so as not to waste function evaluations on a stagnant population. Although
    stopping criteria play an important role in real-world applications, they have
    attracted little attention in the evolutionary multi-objective optimization (EMO)
    community. In fact, new stopping criteria for EMO have been rarely developed in
    recent years. One reason for the stagnation in developing stopping criteria for
    EMO is a lack of effective benchmarking methodologies. To address this issue,
    this paper proposes (i) a performance measure of stopping criteria for EMO and
    (ii) a file-based benchmarking approach. This paper also proposes (iii) a data
    representation method that effectively stores population states in text files.
    (i) The proposed measure represents the performance of stopping criteria as a
    single scalar value, making comparison easy. (ii) The proposed file-based approach
    not only simplifies the benchmarking process but also facilitates reproducibility.
    (iii) The proposed data representation method addresses the issue of file size
    in (ii). We demonstrate the effectiveness of our three contributions (i)--(iii)
    by benchmarking five representative stopping criteria for EMO.
- title: 'The Traveling Thief Problem with Time Windows: Benchmarks and Heuristics'
  date: 2026-04
  url: https://arxiv.org/abs/2604.06724v1
  category: survey
  subcategory: review
  authors:
  - Helen Yuliana Angmalisang
  - Frank Neumann
  venue: ''
  code_url: ''
  project_url: ''
  abstract: While traditional optimization problems were often studied in isolation,
    many real-world problems today require interdependence among multiple optimization
    components. The traveling thief problem (TTP) is a multi-component problem that
    has been widely studied in the literature. In this paper, we introduce and investigate
    the TTP with time window constraints which provides a TTP variant highly relevant
    to real-world situations where good can only be collected at given time intervals.
    We examine adaptions of existing approaches for TTP and the Traveling Salesperson
    Problem (TSP) with time windows to this new problem and evaluate their performance.
    Furthermore, we provide a new heuristic approach for the TTP with time windows.
    To evaluate algorithms for TTP with time windows, we introduce new TTP benchmark
    instances with time windows based on TTP instances existing in the literature.
    Our experimental investigations evaluate the different approaches and show that
    the newly designed algorithm outperforms the other approaches on a wide range
    of benchmark instances.
- title: 'Semantic Sections: An Atlas-Native Feature Ontology for Obstructed Representation
    Spaces'
  date: 2026-03
  url: https://arxiv.org/abs/2603.20867v1
  category: survey
  subcategory: review
  authors:
  - Hossein Javidnia
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent interpretability work often treats a feature as a single global
    direction, dictionary atom, or latent coordinate shared across contexts. We argue
    that this ontology can fail in obstructed representation spaces, where locally
    coherent meanings need not assemble into one globally consistent feature. We introduce
    an atlas-native replacement object, the semantic section: a transport-compatible
    family of local feature representatives defined over a context atlas. We formalize
    semantic sections, prove that tree-supported propagation is always pathwise realizable,
    and show that cycle consistency is the key criterion for genuine globalization.
    This yields a distinction between tree-local, globalizable, and twisted sections,
    with twisted sections capturing locally coherent but holonomy-obstructed meanings.
    We then develop a discovery-and-certification pipeline based on seeded propagation,
    synchronization across overlaps, defect-based pruning, cycle-aware taxonomy, and
    deduplication. Across layer-16 atlases for Llama 3.2 3B Instruct, Qwen 2.5 3B
    Instruct, and Gemma 2 2B IT, we find nontrivial populations of semantic sections,
    including cycle-supported globalizable and twisted regimes after deduplication.
    Most importantly, semantic identity is not recovered by raw global-vector similarity.
    Even certified globalizable sections show low cross-chart signed cosine similarity,
    and raw similarity baselines recover only a small fraction of true within-section
    pairs, often collapsing at moderate thresholds. By contrast, section-based identity
    recovery is perfect on certified supports. These results support semantic sections
    as a better feature ontology in obstructed regimes.'
- title: Multi-Objective Molecular Generation with Frequency-Controlled Evolutionary
    Dynamics
  date: 2026-06
  url: https://arxiv.org/abs/2606.27467v1
  category: survey
  subcategory: review
  authors:
  - Elia Colleoni
  - Paolo Guida
  - Didier Barradas-Bautista
  - William Lafayette Roberts
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Molecule generation methods that leverage generative models have been
    successfully applied to drug discovery. However, they often require extensive
    pre-training, suffer statistical biases in the training data, and might suffer
    from limited interpretability of generated chemical structures. In this work,
    we introduce SpectralMol, an algorithm based on evolutionary computation that
    processes chemical structures as a compact matrix of Fourier coefficients, projected
    onto a fixed basis to generate position-wise latent vectors for SELFIES decoding.
    The NSGA-II algorithm enforces diversity and enable separate objective functions
    rather than collapsed objectives into a scalar reward. The quality of the algorithm
    was tested against standardized benchmarks. The results show comparable aggregate
    benchmark performance with a task-dependent profile: SpectralMol is strongest
    on several multi-parameter optimization tasks. The same benchmark was used to
    perform an ablation study to demonstrate the advantages of a structured latent
    matrix. Finally, method was tested on a realistic ClpP-targeted drug-discovery
    benchmark, comparing it with the reinforcement-learning-based model under a fixed
    oracle-call budget. SpectralMol generates more docking hits and more diverse scaffolds
    while maintaining competitive physicochemical properties. The representation adopted
    in this work can cleanly separates scaffold-level modifications from localized
    substructure variations, as the former occur with perturbations of low-frequency
    Fourier modes and the latter with perturbations of high-frequency Fourier modes.
    The results support the evidence that frequency-controlled evolutionary dynamics
    provide an interpretable, efficient, and training-free route to multi-objective
    molecular design.'
- title: 'SDDMO-Bench: A Benchmark Suite for Streaming Data-Driven Dynamic Multi-Objective
    Optimization'
  date: 2026-08
  url: https://arxiv.org/abs/2608.00474v1
  category: survey
  subcategory: review
  authors:
  - Wenjie Xiao
  - Hui Bai
  - Junhao Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Streaming data-driven dynamic multi-objective optimization requires algorithms
    to track time-varying Pareto fronts using only sequential observations under concept
    drift. However, systematic evaluation remains difficult because real-world problems
    usually lack ground-truth optima, drift annotations, and controllable conditions,
    while existing benchmarks provide limited support for standardized comparison.
    This paper proposes SDDMO-Bench, a benchmark suite that transforms classical dynamic
    multi-objective test problems into streaming environments by combining intrinsic
    objective-mapping evolution, controllable distributional drift, and sequential
    data revelation. By combining five representative time-dependent base functions
    with six distributional drift patterns, SDDMO-Bench constructs 30 scenarios with
    diverse levels of non-stationarity, problem complexity, sample-distribution variation,
    and Pareto-front evolution. Experiments with representative evolutionary algorithms
    demonstrate that SDDMO-Bench provides challenging and discriminative test scenarios,
    offering a standardized, controllable, and reproducible benchmark for evaluating
    adaptability, robustness, and Pareto-front tracking in streaming data-driven dynamic
    multi-objective optimization.
- title: 'From Heuristic Selection to Automated Algorithm Design: LLMs Benefit from
    Strong Priors'
  date: 2026-03
  url: https://arxiv.org/abs/2603.02792v2
  category: survey
  subcategory: review
  authors:
  - Qi Huang
  - Furong Ye
  - Ananta Shahane
  - Thomas Bäck
  - Niki van Stein
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Models (LLMs) have already been widely adopted for automated
    algorithm design, demonstrating strong abilities in generating and evolving algorithms
    across various fields. Existing work has largely focused on examining their effectiveness
    in solving specific problems, with search strategies primarily guided by adaptive
    prompt designs. In this paper, through investigating the token-wise attribution
    of the prompts to LLM-generated algorithmic codes, we show that providing high-quality
    algorithmic code examples can substantially improve the performance of the LLM-driven
    optimization. Building upon this insight, we propose leveraging prior benchmark
    algorithms to guide LLM-driven optimization and demonstrate superior performance
    on two black-box optimization benchmarks: the pseudo-Boolean optimization suite
    (pbo) and the black-box optimization suite (bbob). Our findings highlight the
    value of integrating benchmarking studies to enhance both efficiency and robustness
    of the LLM-driven black-box optimization methods.'
- title: Benchmarking Zero-Shot LLM-Generated Parent Selection in Genetic Programming
    for Symbolic Regression
  date: 2026-07
  url: https://arxiv.org/abs/2607.23505v1
  category: survey
  subcategory: review
  authors:
  - Hengzhe Zhang
  - Qi Chen
  - Bing Xue
  - Wolfgang Banzhaf
  - Mengjie Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Parent selection significantly affects exploration, exploitation, and
    complexity control in genetic programming (GP) for symbolic regression. It is
    unclear whether large language models (LLMs) can synthesize effective operators
    in a zero-shot setting without iterative meta-evolution. Here, zero-shot means
    that the model receives only the task description, with no reference operators
    or iterative feedback. In this work, we benchmark zero-shot synthesis of parent-selection
    operators across eight LLMs within a standard GP framework for symbolic regression.
    Each model receives the same natural-language prompt to generate a parent-selection
    operator, which is then evaluated in a standard GP framework with only the parent-selection
    operator replaced, while all other components and the evolutionary-search budget
    are held constant. For each LLM, ten independent zero-shot operators are evaluated
    on twelve OpenML regression benchmarks and compared against automatic lexicase
    and tournament selection baselines. Claude Sonnet~4.6 and Gemini~3.1 Pro stand
    out for consistently strong performance on both training and held-out test $R^2$.
    The strongest operator in our benchmark---a Kimi~K2.5 zero-shot synthesis---surpasses
    the automatic lexicase and tournament baselines in search effectiveness. These
    results suggest that zero-shot LLM synthesis is a viable approach to generating
    competitive GP selection operators. Analysis shows that many generated operators
    use semantics to guide selection, suggesting that LLMs can produce non-trivial
    search heuristics from the task description alone. We also examine the relationship
    between public LLM leaderboard rankings and GP performance. Widely used benchmarks,
    such as Humanity's Last Exam and SWE-bench Verified, strongly correlate with training
    $R^2$, while their relationship to held-out test $R^2$ is weaker and less clear.
- title: Empirical Evaluation of No Free Lunch Violations in Permutation-Based Optimization
  date: 2026-03
  url: https://arxiv.org/abs/2603.03613v1
  category: survey
  subcategory: review
  authors:
  - Grzegorz Sroka
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The No Free Lunch (NFL) theorem guarantees equal average performance only
    under uniform sampling of a function space closed under permutation (c.u.p.).
    We ask when this averaging ceases to reflect what benchmarking actually reports.
    We study an iterative-search setting with sampling without replacement, where
    algorithms differ only in evaluation order. Binary objectives allow exhaustive
    evaluation in the fully enumerable case, and efficiency is defined by the first
    time the global minimum is reached. We then construct two additional benchmarks
    by algebraically recombining the same baseline functions through sums and differences.
    Function-algorithm relations are examined via correlation structure, hierarchical
    clustering, delta heatmaps, and PCA. A one-way ANOVA with Tukey contrasts confirms
    that algebraic reformulations induce statistically meaningful shifts in performance
    patterns. The uniformly sampled baseline remains consistent with the global NFL
    symmetry. In contrast, the algebraically modified benchmarks yield stable re-rankings
    and coherent clusters of functions and sampling policies. Composite objectives
    can also exhibit non-additive search effort despite being built from simpler components.
    Monte Carlo experiments indicate that order effects persist in larger spaces and
    depend on function class. Taken together, the results show how objective reformulation
    and benchmark design can generate structured local departures from NFL intuition.
    They motivate algorithm choice that is aware of both the problem class and the
    objective representation. This message applies to evolutionary computation as
    well as to statistical procedures based on relabeling, resampling, and permutation
    tests.
- title: An Integrated System for Real-Time Student Assessment and Career Guidance
    Using Neural Networks in Computing Disciplines
  date: 2026-06
  url: https://arxiv.org/abs/2606.15831v1
  category: survey
  subcategory: review
  authors:
  - Sakir Hossain Faruque
  - Md. Jubair Hossain
  - Sharun Akter Khushbu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Many undergraduate students in Computer Science (CS) and Software Engineering
    (SWE) struggle to identify suitable career paths, particularly when their academic
    performance, abilities, and interests do not fully align. To address this issue,
    this study proposes an AI-driven Student Assessment and Career Prediction System
    that integrates a Career Guidance Expert (CGE) system with a Web-Based Student
    Assessment (WBSA) platform. Within the integrated framework, CGE enhances personalized
    career recommendations using AI while also assisting students after graduation
    in identifying suitable jobs, research domains, and higher study opportunities
    aligned with their skills and interests. The WBSA platform further strengthens
    interaction between students and faculty through assessments, personalized tasks,
    mentorship activities, and a secure real-time chat application. The CGE system
    employs a Multilayer Perceptron (MLP) model trained on real-world academic and
    extracurricular data collected using the snowball sampling method from the students
    of universities, achieving a validation accuracy of 94.71% in predicting personalized
    career paths. A pre-survey was conducted across universities to evaluate the proposed
    model before deployment. The WBSA system was developed as a modern web application
    using technologies such as Node.js, Next.js, and PostgreSQL to ensure scalability,
    responsiveness, and secure data management. The overall system is supported by
    a secure cloud-based infrastructure, the platform provides reliable performance
    while assisting graduates to select suitable career path in IT sector. In addition,
    a post-survey involving both students and faculty was conducted to gather feedback
    and further improve the overall effectiveness and usability of the system.
- title: Neural architectures for resolving references in program code
  date: 2026-04
  url: https://arxiv.org/abs/2604.14073v1
  category: survey
  subcategory: review
  authors:
  - Gergő Szalay
  - Gergely Zsolt Kovács
  - Sándor Teleki
  - Balázs Pintér
  - Tibor Gregorics
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Resolving and rewriting references is fundamental in programming languages.
    Motivated by a real-world decompilation task, we abstract reference rewriting
    into the problems of direct and indirect indexing by permutation. We create synthetic
    benchmarks for these tasks and show that well-known sequence-to-sequence machine
    learning architectures are struggling on these benchmarks. We introduce new sequence-to-sequence
    architectures for both problems. Our measurements show that our architectures
    outperform the baselines in both robustness and scalability: our models can handle
    examples that are ten times longer compared to the best baseline. We measure the
    impact of our architecture in the real-world task of decompiling switch statements,
    which has an indexing subtask. According to our measurements, the extended model
    decreases the error rate by 42%. Multiple ablation studies show that all components
    of our architectures are essential.'
- title: Multi-Objective Evolutionary Optimization of Chance-Constrained Multiple-Choice
    Knapsack Problems with Implicit Probability Distributions
  date: 2026-03
  url: https://arxiv.org/abs/2603.08209v1
  category: survey
  subcategory: review
  authors:
  - Xuanfeng Li
  - Shengcai Liu
  - Wenjie Chen
  - Yew-Soon Ong
  - Ke Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The multiple-choice knapsack problem (MCKP) is a classic combinatorial
    optimization with wide practical applications. This paper investigates a significant
    yet underexplored extension of MCKP: the multi-objective chance-constrained MCKP
    (MO-CCMCKP) under implicit probability distributions. The goal of the problem
    is to simultaneously minimize the total cost and maximize the confidence level
    of satisfying the capacity constraint, capturing essential trade-offs in domains
    like 5G network configuration. To address the computational challenge of evaluating
    chance constraints under implicit distributions, we first propose an order-preserving
    efficient resource allocation Monte Carlo (OPERA-MC) method. This approach adaptively
    allocates sampling resources to preserve dominance relationships while reducing
    evaluation time significantly. Further, we develop NHILS, a hybrid evolutionary
    algorithm that integrates specialized initialization and local search into NSGA-II
    to navigate sparse feasible regions. Experiments on synthetic benchmarks and real-world
    5G network configuration benchmarks demonstrate that NHILS consistently outperforms
    several state-of-the-art multi-objective optimizers in convergence, diversity,
    and feasibility. The benchmark instances and source code will be made publicly
    available to facilitate research in this area.'
- title: 'Seq103: A Unified Neuroevolution Framework for Compact Sequence Architecture
    Discovery'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07664v1
  category: survey
  subcategory: review
  authors:
  - Wenxiao Li
  - Yongjian Liu
  - Qing Xie
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Neuroevolution is a representative neural architecture search paradigm
    that evolves both network topology and weights through evolutionary algorithms.
    In this paper, we propose Seq103, a unified NEAT-style neuroevolution framework
    for compact sequence architecture discovery. Seq103 consists of a shared evolutionary
    backbone and an optional recurrent extension. The shared backbone includes an
    elementary node-and-connection representation, per-class RMSE-based evaluation,
    mutation-based evolution with class-wise recombination, and elitism. The optional
    hidden-state mechanism extends the search space with hidden-state nodes and hidden
    connections, enabling temporal memory when step-wise recurrent inference is required.
    With this design, Seq103 applies the same core search pipeline to both step-wise
    recurrent and sample-wise feedforward sequence classification. In recurrent tasks,
    the hidden-state extension is enabled to provide temporal memory; in feedforward
    tasks, it is disabled while the shared evolutionary backbone remains unchanged.
    We evaluate Seq103 on 8 text classification datasets and the full UCRArchive2018
    benchmark with 128 univariate time-series datasets. On step-wise tasks, Seq103
    retains 86.96% of the best-baseline accuracy on average while using 34.6x to 3218.0x
    fewer parameters. On sample-wise tasks over the full UCRArchive2018 benchmark,
    Seq103 retains 81.95% of the best-baseline accuracy on average while using 11.8x
    to 160,601.0x fewer parameters.
- title: 'DarwinX: Evolving Agent Harnesses Through Natural Selection'
  date: 2026-07
  url: https://arxiv.org/abs/2608.07545v1
  category: survey
  subcategory: review
  authors:
  - Yifan Zhang
  - Yutong Dai
  - Juntao Tan
  - Luyu Yang
  - Rishi Mullur
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'An LLM agent''s capability depends not only on model weights but on its
    harness: prompts, tools, skills, and control flow. Self-improvement loops already
    edit harnesses, yet single-lineage search is path-dependent and local wins often
    regress other tasks. We introduce DarwinX, which treats self-evolution as selection
    over a population of harnesses with the model frozen: a preserve-and-extend contract
    admits only variants that extend coverage without regressing, an archive keeps
    alternative lineages for recombination, and failure-, teacher-, and self-derived
    evidence share one edit interface. Fitness comes from each benchmark''s own verifier:
    no gold solutions, no hand-picked winners. Across four benchmarks that progressively
    separate the evolution signal from the test, one loop adds about 17 points on
    average: Terminal-Bench 2.1 rises +7.7 to 83.2% on a matched base and to the verified
    frontier at 84.7% on a stronger one; TerminalWorld''s held-out split reaches 68.3%,
    ahead of every off-the-shelf agent; WebArena-Infinity real-task pass@1 rises from
    43.5% to 93.0% audit-clean; and a Terminal-Bench 2.1 harness transfers unchanged
    to SWE-bench Verified. What evolves is general agent competence, not benchmark-specific
    patches, so it survives changes of task, verifier, and base model. A frozen model
    need not be a fixed agent: harness selection turns evaluation compute into durable
    capability.'
- title: Mechanism and Stability Analysis of Metabolic Closed-Loop Metaheuristics
  date: 2026-07
  url: https://arxiv.org/abs/2607.01551v2
  category: survey
  subcategory: review
  authors:
  - Jinliang Xu
  - Liping Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper studies the Metabolic Multi-Agent Optimizer (MMAO) at the
    framework level rather than at the implementation or benchmark level. The central
    question is whether the metabolic resource loop of private energy, communal budget,
    role drift, and lifecycle turnover has a framework-level interpretation beyond
    narrative metaphor. We introduce a generic MMAO state model that abstracts away
    domain-specific move operators while retaining the resource bookkeeping that defines
    the framework. Under mild bounded-gain and bounded-spending assumptions, we establish
    boundedness and nonnegativity properties for private energy, communal budget,
    role state, and active population size. We then characterize three endogenous
    behavioral regimes of the loop: contraction under sustained resource deficit,
    reinvestment under surplus communal accumulation, and search redistribution under
    heterogeneous marginal returns across agents or subgroups. The analysis is intentionally
    conservative. It does not claim global convergence of the full adaptive system,
    universal superiority over specialist optimizers, or a complete stationary characterization
    of the resulting process. Instead, it identifies which internal regulation properties
    are generic consequences of the loop and which remain implementation specific.
    A compact mechanism-validation package on representative continuous and discrete
    MMAO realizations provides supporting empirical evidence for this reading, but
    is not intended to replace a full benchmark study. The resulting contribution
    is therefore a bounded, regenerative, resource-regulated interpretation of MMAO,
    rather than a complete proof of all adaptive behaviors of the full algorithm family.'
- title: 'LEVI: Stronger Search Architectures Can Substitute for Larger LLMs in Evolutionary
    Search'
  date: 2026-05
  url: https://arxiv.org/abs/2605.09764v1
  category: survey
  subcategory: review
  authors:
  - Temoor Tanveer
  venue: ''
  code_url: https://github.com/ttanv/levi
  project_url: ''
  abstract: 'LLM-guided evolutionary methods such as AlphaEvolve have proven effective
    in domains like math, systems research, and algorithmic discovery, but their reliance
    on frontier models makes each run expensive. We argue this is largely an artifact
    of how existing frameworks allocate search: archives that fail to preserve solution
    diversity force compensation through stronger mutation models; blind model use
    spends frontier dollars on local edits a smaller model could handle; and full-set
    evaluation wastes rollouts on redundant examples. We introduce LEVI, a harness-first
    evolutionary framework built on the bet that stronger search architectures can
    substitute for or even outperform larger LLMs in evolutionary search. LEVI improves
    on three core components of evolutionary search: a solution database that establishes
    diversity from the beginning, and then maintains it throughout the run; a smarter
    mutation router that plays into the strengths of large and small LLMs; and a rank-preserving
    proxy benchmark for rollout-heavy settings. Across systems-research benchmarks
    LEVI attains the highest score on a budget 3.3-6.7x smaller than the published
    frontier-model runs of existing frameworks like ShinkaEvolve, GEPA, and AdaEvolve;
    on one problem, LEVI matches the existing best at a 35x lower cost. On prompt
    optimization, LEVI matches or exceeds GEPA at less than half of its rollout budget
    on four different benchmarks. LEVI is available as an open-source framework at
    https://github.com/ttanv/levi.'
- title: A Fresh Look at Lamarckian Evolution and the Baldwin Effect
  date: 2026-05
  url: https://arxiv.org/abs/2605.28703v1
  category: survey
  subcategory: review
  authors:
  - Inès Benito
  - Johannes F. Lutzeyer
  - Benjamin Doerr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Baldwinian and Lamarckian evolution have existed for a long time in evolutionary
    algorithms (EAs) without ever dominating the academic literature or practical
    applications. In this work, we use modern empirical and theoretical methods to
    revisit Lamarckian and Baldwinian evolution and rigorously compare them with the
    generic Darwinian evolution. On the empirical side, we run a comprehensive suite
    of experiments on graphs from six different datasets from the recent GraphBench
    benchmark on Maximum Independent Set and Maximum Cut problems. Our results show
    that Baldwinian and Lamarckian evolution consistently outperform Darwinian evolution,
    confirming the great potential of local search augmented evolutionary algorithms.
    Notably, in the great majority of cases, all EAs outperform recent deep learning
    baselines and approach the performance of highly specialised heuristic and exact
    solvers. We furthermore report a high-performing set of generalist parameters
    for all studied evolution types that we hope will be of use to practitioners in
    future. On the theoretical side, we extend the existing Deceptive Leading Block
    benchmark to arbitrary block length and use tools from modern theoretical runtime
    analysis to prove upper and lower bounds on the expected runtime. For block lengths
    greater than two, Baldwinian evolution is asymptotically faster than Lamarckian
    which is asymptotically faster than Darwinian evolution. When accounting for the
    cost of the local search procedure in fitness evaluations, the ordering depends
    on the implementation with Baldwinian evolution staying fastest from small block
    lengths onwards, explaining its strong empirical performance.
- title: Sensitivity of hMPA to Controlled CEC 2017 Transformations
  date: 2026-07
  url: https://arxiv.org/abs/2607.22862v1
  category: survey
  subcategory: review
  authors:
  - Grzegorz Sroka
  - Sławomir T. Wierzchoń
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The standard CEC 2017 benchmark applies bias, shift, and rotation simultaneously,
    confounding their individual effects on algorithmic behavior. We introduce a parameterized
    implementation that controls these transformations independently while preserving
    the original functions and transformation data. The framework diagnoses the hybrid
    Marine Predators Algorithm (hMPA), whose predicted-candidate mechanism depends
    on numerical objective values and coordinate-wise reconstruction. DSC and extended
    DSC (eDSC) are adapted from algorithm-level comparison to configuration-level
    diagnosis, enabling, to our knowledge, the first exhaustive analysis of all eight
    bias-shift-rotation configurations of a parameterized CEC 2017 benchmark. We examine
    all 56 three-configuration subsets and comparisons with the untransformed control.
    Experiments cover 29 functions, dimensions 10-100, 30 independent runs, and a
    budget of 10000*dim objective-function evaluations. DSC and eDSC detect statistically
    significant differences among configurations at every dimension, but rankings
    vary across functions, preventing a consistent ordering. Shift generally worsens
    objective values; isolated rotation causes no systematic deterioration, while
    isolated bias has little effect on final-solution distributions. Shift-rotation
    combinations differ most consistently from the control. Convergence plots reveal
    function- and dimension-dependent separation, plateaus, and late improvement.
    Results are limited to hMPA, the chosen parameters, 30 runs, the fixed budget,
    and the analyzed CEC 2017 functions. Within this scope, the framework provides
    a reproducible diagnostic protocol extensible to other continuous optimizers and
    related CEC benchmarks, including CEC 2024 and CEC 2025.
- title: A Longitudinal Analysis of the CEC Single-Objective Competitions (2010-2024)
    and Implications for Variational Quantum Optimization
  date: 2026-03
  url: https://arxiv.org/abs/2603.24140v1
  category: survey
  subcategory: review
  authors:
  - Vojtěch Novák
  - Tomáš Bezděk
  - Ivan Zelinka
  - Swagatam Das
  - Martin Beseda
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper provides a historical analysis of the IEEE CEC Single Objective
    Optimization competition results (2010-2024). We analyze how benchmark functions
    shaped winning algorithms, identifying the 2014 introduction of dense rotation
    matrices as a key performance filter. This design choice introduced parameter
    non-separability, reduced effectiveness of coordinate-dependent methods (PSO,
    GA), and established the dominance of Differential Evolution variants capable
    of preserving the rotational invariance of their difference vectors, specifically
    L-SHADE. Post-2020 analysis reveals a shift towards high complexity hybrid optimizers
    that combine different mechanisms (e.g., Eigenvector Crossover, Societal Sharing,
    Reinforcement Learning) to maximize ranking stability. We conclude by identifying
    structural similarities between these modern benchmarks and Variational Quantum
    Algorithm landscapes, suggesting that evolved CEC solvers possess the specific
    adaptive capabilities required for quantum control.
- title: 'Apparent Age Estimation: Challenges and Outcomes'
  date: 2026-04
  url: https://arxiv.org/abs/2604.03335v1
  category: survey
  subcategory: review
  authors:
  - Justin Rainier Go
  - Lorenz Bernard Marqueses
  - Mikaella Kaye Martinez
  - John Kevin Patrick Sarmiento
  - Abien Fred Agarap
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Apparent age estimation is a valuable tool for business personalization,
    yet current models frequently exhibit demographic biases. We review prior works
    on the DEX method by applying distribution learning techniques such as Mean-Variance
    Loss (MVL) and Adaptive Mean-Residue Loss (AMRL), and evaluate them in both accuracy
    and fairness. Using IMDB-WIKI, APPA-REAL, and FairFace, we demonstrate that while
    AMRL achieves state-of-the-art accuracy, trade-offs between precision and demographic
    equity persist. Despite clear age clustering in UMAP embeddings, our saliency
    maps indicate inconsistent feature focus across demographics, leading to significant
    performance degradation for Asian and African American populations. We argue that
    technical improvements alone are insufficient; accurate and fair apparent age
    estimation requires the integration of localized and diverse datasets, and strict
    adherence to fairness validation protocols.
- title: Analog Optical Inference on Million-Record Mortgage Data
  date: 2026-04
  url: https://arxiv.org/abs/2604.13251v1
  category: survey
  subcategory: review
  authors:
  - Sofia Berloff
  - Pavel Koptev
  - Konstantin Malkov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Analog optical computers promise large efficiency gains for machine learning
    inference, yet no demonstration has moved beyond small-scale image benchmarks.
    We benchmark the analog optical computer (AOC) digital twin on mortgage approval
    classification from 5.84 million U.S. HMDA records and separate three sources
    of accuracy loss. On the original 19 features, the AOC reaches 94.6% balanced
    accuracy with 5,126 parameters (1,024 optical), compared with 97.9% for XGBoost;
    the 3.3 percentage-point gap narrows by only 0.5pp when the optical core is widened
    from 16 to 48 channels, suggesting an architectural rather than hardware limitation.
    Restricting all models to a shared 127-bit binary encoding drops every model to
    89.4--89.6%, with an encoding cost of 8pp for digital models and 5pp for the AOC.
    Seven calibrated hardware non-idealities impose no measurable penalty. The three
    resulting layers of limitation (encoding, architecture, hardware fidelity) locate
    where accuracy is lost and what to improve next.
- title: 'Indian Wedding System Optimization (IWSO): A Novel Socially Inspired Metaheuristic
    with Operational Design and Analysis'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13871v1
  category: survey
  subcategory: review
  authors:
  - Deepika Saxena
  - Kishu Gupta
  - Jitendra Kumar
  - Jatinder Kumar
  - Sakshi Patni
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper presents a novel population-based metaheuristic, Indian Wedding
    System Optimization (IWSO), inspired by the socio-cultural dynamics of traditional
    Indian weddings. IWSO models the matchmaking process driven by collaboration among
    families, candidates, and matchmakers as a guided, selective search framework
    for solving complex optimization problems. The algorithm introduces two key innovations:
    (i) a matchmaker-guided influence strategy, where elite solutions direct the evolution
    of weaker candidates, enhancing convergence without external parameters; and (ii)
    an adaptive elimination and reinitialization mechanism that maintains diversity
    and prevents premature convergence by replacing underperforming individuals. IWSO
    employs a weighted multi-objective fitness function and analytically derived time
    and space complexity, benchmarked against existing optimization approaches such
    as Genetic Algorithm (GA), Partical Swarm Optimization (PSO), Differential Evolution
    (DE), Cuckoo Search (CS), etc. Extensive experiments on benchmark high-dimensional
    and multimodal test functions demonstrate superior performance of IWSO in terms
    of convergence speed, solution quality, and robustness.'
- title: Hybrid Augmented Lagrangian Method for General Constrained Optimization via
    Evolutionary Algorithms
  date: 2026-07
  url: https://arxiv.org/abs/2607.16876v1
  category: survey
  subcategory: review
  authors:
  - Lampros Printzios
  - Konstantinos Chatzilygeroudis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Constrained Optimization Problems are crucial in fields such as engineering,
    economics, and robotics, where high-dimensional search spaces and complex objectives
    and constraints are common. Numerical optimization methods, including Feasible
    Direction, Interior Point, and Sequential Quadratic Programming, have shown strong
    performance in finding feasible local optima, but require accurate analytical
    gradients and effective initialization, which can be challenging in real-world
    settings. Evolutionary Algorithms, on the other hand, offer gradient-free search
    and robustness to noisy landscapes, managing to detect global optima more often
    than numerical methods, but they often suffer from high computational costs and
    slow convergence. In this work, we propose a Hybrid Augmented Lagrangian (HyAL)
    method that integrates the AL framework's constraint-handling strengths with the
    exploratory power of population-based search. Our approach employs evolutionary
    techniques to solve subproblems within the AL iterations, promoting exploration
    and aiding in the escape from local optima. We conduct extensive experiments on
    benchmark optimization problems, comparing our method against state-of-the-art
    optimizers, including IPOPT and CMA-ES, and a standalone evolutionary optimization
    baseline (with constraint enforcement via penalties). In addition, we evaluate
    four population-based methods integrated within the AL framework to study the
    effect of different evolutionary solvers. Our results show that HyAL consistently
    produces high-quality solutions across the benchmark suite. It outperforms purely
    evolutionary approaches and scales more effectively to high-dimensional constrained
    problems, where evolutionary-only methods often struggle. HyAL also surpasses
    state-of-the-art numerical optimization algorithms on complex landscapes containing
    numerous local minima and saddle points.
- title: Hybrid Quantum-Classical Encoding for Accurate Residue-Level pKa Prediction
  date: 2026-03
  url: https://arxiv.org/abs/2603.11061v1
  category: survey
  subcategory: review
  authors:
  - Van Le
  - Tan Le
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Accurate prediction of residue-level pKa values is essential for understanding
    protein function, stability, and reactivity. While existing resources such as
    DeepKaDB and CpHMD-derived datasets provide valuable training data, their descriptors
    remain primarily classical and often struggle to generalize across diverse biochemical
    environments. We introduce a reproducible hybrid quantum-classical framework that
    enriches residue-level representations with a Gaussian kernel-based quantum-inspired
    feature mapping. These quantum-enhanced descriptors are combined with normalized
    structural features to form a unified hybrid encoding processed by a Deep Quantum
    Neural Network (DQNN). This architecture captures nonlinear relationships in residue
    microenvironments that are not accessible to classical models. Benchmarking across
    multiple curated descriptor sets demonstrates that the DQNN achieves improved
    cross-context generalization relative to classical baselines. External evaluation
    on the PKAD-R experimental benchmark and an A$β$40 case study further highlights
    the robustness and transferability of the quantum-inspired representation. By
    integrating quantum-inspired feature transformations with classical biochemical
    descriptors, this work establishes a scalable and experimentally transferable
    approach for residue-level pKa prediction and broader applications in protein
    electrostatics.
- title: SILVA Networks as Structured Implicit Layers and Vector Attractors via Dynamic
    Interaction Fields
  date: 2026-07
  url: https://arxiv.org/abs/2607.28989v1
  category: survey
  subcategory: review
  authors:
  - Jose Luis Lima de Jesus Silva
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Many learning problems require representations that reconcile direct
    input, nearby structure, and broader context. In implicit neural layers, these
    influences are usually absorbed into a single fixed-point update, making it hard
    to identify what enters from the stimulus, what propagates locally, what comes
    from global context, and what is produced by solver dynamics. Here we introduce
    SILVA Networks, Structured Implicit Layers and Vector Attractors via Dynamic Interaction
    Fields. SILVA separates stimulus, local interaction, global interaction, damping,
    and readout inside one fixed-point architecture. The same template is instantiated
    for images, molecules, citation networks, and long-range graph benchmarks through
    domain-specific definitions of nodes, neighborhoods, and global summaries. Experiments
    and ablations show task-dependent roles for these terms: local interactions are
    load-bearing in the graph tasks, MNIST gains little from recurrence at the tested
    capacity, and the clearest global benefit appears in a long-range node-classification
    benchmark. SILVA therefore provides an implicit representation whose internal
    interaction dynamics can be trained, ablated, visualized, and diagnosed.'
- title: 'Recipes for Creativity: Iterative Generation and Evaluation in Large Language
    Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.07243v1
  category: survey
  subcategory: review
  authors:
  - Rens Anderson
  - Tessa Verhoef
  - Amirhossein Zohrehvand
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Generative models are often evaluated through singular artifacts, whereas
    human creativity typically emerges through iterative generation, appraisal, and
    refinement. This pilot study examines whether iterative search improves LLM creativity
    by adapting FunSearch to recipe generation for the 2024 Pillsbury Bake-Off and
    evaluating outputs against human benchmarks using TTCT-based LLM evaluation. Across
    two experiments, we test iteration count, generator temperature, and in-loop selection-scorer
    model size. Results show that iterative generation-selection can produce recipes
    with creativity scores comparable to human benchmarks, but additional iterations
    alone do not improve creativity. The in-loop evaluator matters most: a smaller
    selection scorer yields significantly higher scores across most TTCT dimensions,
    while temperature has limited effects except for originality. These findings suggest
    that evaluator design is a first-order design variable in subjective creative
    search.'
- title: 'Hub-Aware Hybrid Search: Accelerating the Locally Aligned Ant Technique'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06198v1
  category: survey
  subcategory: review
  authors:
  - Simone Vilardi
  - Reynier Peletier
  - Felipe Contreras
  - Kerstin Bunte
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Finding manifold structures in noisy and high-dimensional point clouds
    is a challenging but important problem. In astronomical observation survey and
    simulation data the detection of filaments, streams (1D), walls (2D) and clusters
    (3D) gives rise to deeper understanding of the evolution of our universe. The
    Locally Aligned Ant Technique (LAAT) uses biologically inspired agents to efficiently
    recover faint and multidimensional structures. However, very dense hubs (e.g.
    nodes or globular clusters) dominate the ants' activity, creating unnecessary
    computational overheads. In this paper we propose a two-stage solution. First
    a fast preprocessing step locates the hubs and replaces them with a tailored likelihood
    model. Subsequently, a mixed likelihood-pheromone strategy guides the ants to
    efficiently bridge the dense regions. We demonstrate improvements in detection
    efficiency and robustness of LAAT with synthetic and a large-scale astronomical
    N-body simulation of the cosmic web.
- title: Travel-Oriented Reasoning Large Language Model via Domain-Specific Knowledge
    Graphs
  date: 2026-06
  url: https://arxiv.org/abs/2606.29254v1
  category: survey
  subcategory: review
  authors:
  - Vignesh Ram Nithin Kappagantula
  - Shayan Hassantabar
  - Samuel Simpson
  - Golnaz Moallem
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models (LLMs) demonstrate broad reasoning abilities but
    struggle with accuracy and reliability in specialized domains such as travel,
    where reasoning depends on precise definitions, rules, and expert-defined conceptual
    frameworks, and where confident but unfounded outputs arise from a reasoning failure
    in which the model has not internalized the underlying domain graph rather than
    from missing domain knowledge alone. We propose a modular pipeline for building
    a travel-domain reasoning LLM grounded in an expert-designed knowledge graph (KG).
    Our pipeline integrates a travel KG that encodes domain entities and their relationships,
    a bottom-up construction procedure that walks the KG to produce multi-hop question
    answer (QA) pairs, a supervised fine-tuning stage that embeds the domain knowledge
    into a reasoning-capable LLM using the generated QA pairs as auditable reasoning
    traces, and a travel-domain benchmark dataset that measures the fine-tuned model''s
    accuracy and calibration. We evaluate our approach using Qwen3-4B with LoRA adaptation.
    Our reasoning model achieves an $82.4\%$ exact match on the benchmark. This performance
    significantly outperforms the pretrained Qwen3-4B baseline at $22.4\%$. A calibration
    analysis decomposes the residual $17.57\%$ of errors into two distinct failure
    modes: an over-confident multi-label decoder that predicts both correct answers
    plus one spurious option on most dual-answer mistakes, and a smaller reasoning
    failure on single-answer questions where the supporting facts are present in the
    KG but the model fails to reconstruct the correct multi-hop path. This split confirms
    that explicit KG-grounded reasoning substantially improves the accuracy and uncertainty
    interpretation of LLMs in specialized domains, and isolates per-option calibration
    and trace-length-aware decoding as the next axes of improvement.'
- title: 'BBOWP-Bench: Evaluating LLMs on Black-Box Optimization Word Problems'
  date: 2026-05
  url: https://arxiv.org/abs/2608.02612v1
  category: survey
  subcategory: review
  authors:
  - Yutaro Yamada
  - Kei Hiroshima
  - Nozomu Yoshinari
  - Kento Uchida
  - Shinichi Shirakawa
  venue: ''
  code_url: https://github.com/shiralab/bbowp-bench
  project_url: ''
  abstract: Formulating an optimization problem strongly affects the quality of the
    final solution, yet good formulations usually require substantial expertise. Recent
    studies have therefore examined how to automatically derive optimization problems
    from natural-language descriptions, but existing benchmarks focus on settings
    where objectives and constraints can be written explicitly as mathematical expressions.
    Many practically important problems are naturally treated as black-box optimization
    (BBO) problems, in which only objective values are observable, and the functional
    form is unavailable. In BBO, the search space design, a part of the problem formulation,
    and the selection of the optimization algorithm are crucial for problem-solving.
    Automating these processes with large language models (LLMs) is a significant
    challenge. This paper introduces Black-Box Optimization Word Problems (BBOWP),
    a novel problem setting in which a system must infer both a search space and an
    optimization algorithm from a natural-language description of a black-box optimization
    task. To support research on this setting, we establish the BBOWP Benchmark Suite
    (BBOWP-Bench), a dataset and evaluation framework for BBOWP. Each instance combines
    a natural-language problem description, an executable evaluation environment,
    and a human-designed baseline formulation, allowing evaluation of both search-space
    design and algorithm selection. Using this benchmark, we provide the first evaluation
    of LLMs and show that current LLMs are capable of selecting suitable algorithms
    based on the given evaluation budget. However, they sometimes struggle with search
    space design, particularly in identifying important variables and balancing their
    ranges when the problem description is less informative or the search space is
    highly problem-specific. Our code and dataset are available at https://github.com/shiralab/bbowp-bench.
- title: Spike-based Belief Propagation in Nonlinear Dynamical Systems
  date: 2026-08
  url: https://arxiv.org/abs/2608.19907v1
  category: survey
  subcategory: review
  authors:
  - Sepideh Adamiat
  - Hongye Wang
  - Wouter M. Kouw
  - Bert de Vries
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a Bayesian control framework that integrates spike-based
    dynamics with probabilistic inference for adaptive control. Bayesian inference
    is widely regarded as a core computational principle of brain function, providing
    a normative framework for perception, decision-making, and learning under uncertainty.
    By combining a biologically inspired spiking neural model with Bayesian inference
    principles, we propose a brain-like control algorithm capable of operating in
    uncertain environments. We use the mountain car parking problem as a benchmark
    with non-linear dynamics. Our results demonstrate that the proposed controller
    can successfully update states in real time and generate goal-directed action
    plans through spike-driven dynamics. The results highlight the proposed model's
    potential as a bridge between computational neuroscience and probabilistic control
    theory.
- title: 'GOAL: Graph-based Objective-Aligned Diffusion Solvers for Dynamic Multi-Objective
    Optimization'
  date: 2026-05
  url: https://arxiv.org/abs/2605.19119v1
  category: survey
  subcategory: review
  authors:
  - Xingyu Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Existing neural combinatorial optimization solvers frame solution search
    as imitation of optimal decisions, inherently limiting their utility to single-objective
    minimization and static constraints. We propose GOAL, a conditioned diffusion
    solver over relational graph representations that enables controllable decision
    generations by conditioning on human-specified objectives. We introduce a heterogeneous
    graph encoding in which distinct edge types, corresponding to different classes
    of constraints, define the message passing structure of the graph neural network,
    which allows information to propagate selectively according to the ontology of
    each constraint. GOAL is instantiated and evaluated on three canonical scheduling
    benchmarks of various constraint complexity: the Flow Shop Problem (FSP), the
    Job Shop Scheduling Problem (JSP), and the Flexible Job Shop Scheduling Problem
    (FJSP). Generalization is demonstrated across structurally distinct constraint
    regimes and problem types without architectural modification. On all three benchmarks,
    GOAL achieves 100% solution feasibility and near-zero MAPE (below 0.20%) on multiple
    objectives for problem sizes up to 20 jobs and 60 operations, outperforming NSGA-II
    and MOEA/D in both solution quality and inference speed by up to 25x.'
- title: 'Frenetic Cat-inspired Particle Optimization: a Markov state-switching hybrid
    swarm optimizer with application to cardiac digital twinning'
  date: 2026-04
  url: https://arxiv.org/abs/2604.15761v1
  category: survey
  subcategory: review
  authors:
  - Jorge Sánchez
  - Guadalupe García-Isla
  - Sandra Perez-Herrero
  - Beatriz Trenor
  - Javier Saiz
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Designing optimizers that remain effective under tight evaluation budgets
    is critical in expensive black-box settings such as cardiac digital twinning.
    We propose Frenetic Cat-inspired Particle Optimization (FCPO), a hybrid swarm
    method that couples particle swarm optimization-like dynamics with an explicit-state
    Markov switching controller to schedule exploration and refinement operators online.
    FCPO integrates (i) state-conditioned bounded motion, (ii) an elite-difference
    global jump operator to escape stagnation, (iii) eigen-space guided local refinement
    from elite covariance, and (iv) linear population size reduction to control late-stage
    computational cost. We benchmark FCPO on five representative functions from the
    Congress on Evolutionary Computation (CEC) 2022 suite (F1, F2, F3, F6 and F10)
    at dimensions D$\in${10,20} over 30 independent runs, comparing against PSO, CSO,
    CLPSO, SHADE, L-SHADE and CMA-ES. FCPO achieves the lowest mean runtime across
    the ten benchmark cases (average 0.183 s), about 2.3x faster than CMA-ES and 2.6x
    faster than L-SHADE in our Python implementation. On the multimodal composition
    function F10 at D=20, FCPO attains the best mean objective (9.625x 10^2 $\pm$
    1.275x 10^3) and remains faster than CMA-ES (0.602 s vs. 1.126 s mean runtime).
    On structured landscapes (F1--F3) and on the hybrid function (F6), CMA-ES remains
    the most accurate method, while FCPO substantially improves over classical swarms
    and maintains a favorable accuracy--runtime trade-off. Finally, in a ventricular
    activation digital twin calibration task, FCPO reaches the target electrocardiogram
    (ECG) fidelity (RMSE&lt;0.1 mV) within ~ 40 iterations and produces physiologically
    plausible activation maps with robust convergence across repeated initializations,
    supporting its use as a practical optimizer for expensive inverse problems.
- title: What Do Evolutionary Coding Agents Evolve?
  date: 2026-05
  url: https://arxiv.org/abs/2605.20086v1
  category: survey
  subcategory: review
  authors:
  - Nico Pelleriti
  - Sree Harsha Nelaturu
  - Zhanke Zhou
  - Zongze Li
  - Max Zimmer
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent work pairs LLMs with evolutionary search to iteratively generate,
    modify, and select code using task-specific feedback. These systems have produced
    strong results in mathematical discovery and algorithm design, yet a fundamental
    question remains: what do they actually evolve? Progress is typically summarized
    by the best score a run reaches under a task-specific evaluator, but that score
    can reflect several different mechanisms: new algorithmic structure, re-tuning
    an existing strategy, recombining ideas already in the model''s internal knowledge,
    or overfitting to the evaluator. Distinguishing these mechanisms requires inspecting
    the search process itself, not only its final outcome. We introduce EvoTrace,
    a dataset of evolutionary coding traces spanning four evolutionary frameworks,
    reasoning and non-reasoning models, and 16 tasks across mathematics and algorithm
    design. To analyze these traces, we develop EvoReplay, a replay-based methodology
    that reconstructs the local search states behind high-scoring solutions and tests
    controlled interventions, including adjusting constants, removing program components
    and substituting models or prompting contexts. We annotate every code edit in
    EvoTrace with one of nine recurring edit types using an LLM-as-judge pipeline
    validated against blind human re-annotation. Across EvoTrace, most score gains
    come from a small subset of these edit types. We further find a deterministic
    cycling pattern: about 30% of code lines added during search are byte-identical
    re-introductions of previously-deleted lines, present throughout nearly every
    run. These results show that benchmark gains in evolutionary coding agents can
    arise from qualitatively different mechanisms, only some of which correspond to
    new algorithmic structure. EvoTrace enables more diagnostic evaluation of evolutionary
    coding agents beyond final benchmark scores.'
- title: 'RDEx-CMOP: Feasibility-Aware Indicator-Guided Differential Evolution for
    Fixed-Budget Constrained Multiobjective Optimization'
  date: 2026-04
  url: https://arxiv.org/abs/2604.03708v1
  category: survey
  subcategory: review
  authors:
  - Sichen Tao
  - Yifei Yang
  - Ruihan Zhao
  - Kaiyu Wang
  - Sicheng Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Constrained multiobjective optimisation requires fast feasibility attainment
    together with stable convergence and diversity preservation under strict evaluation
    budgets. This report documents RDEx-CMOP, the differential evolution variant used
    in the IEEE CEC 2025 numerical optimisation competition (C06 special session)
    constrained multiobjective track. RDEx-CMOP integrates an ε-level feasibility
    schedule, a SPEA2-style indicator-driven fitness assignment, and a fitness-oriented
    current-to-pbest/1 mutation operator. We evaluate RDEx-CMOP on the official CEC
    2025 CMOP benchmark using the median-target U-score framework and the released
    trace data. Experimental results show that RDEx-CMOP achieves the highest total
    score and the best overall average rank among all released comparison algorithms,
    with strong target-attainment behaviour and near-zero final violation on most
    problems.
- title: Spike-Aware C++ INT8 Inference for Sparse Spiking Language Models on Commodity
    CPUs
  date: 2026-06
  url: https://arxiv.org/abs/2606.03026v1
  category: survey
  subcategory: review
  authors:
  - Ting Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking language models expose activation sparsity that dense Transformer
    runtimes do not directly exploit. This paper studies that property from a systems
    perspective. Building on the SymbolicLight V1 spike-gated language model family,
    we implement a C++ CPU inference runtime that treats sparse binary spike states
    as an execution primitive rather than only applying post-hoc weight compression.
    The runtime combines a manifest-driven weight loader, mixed row/column memory
    layout, AVX2/FMA kernels, per-channel symmetric INT8 quantization, and integer-domain
    accumulation for spike-conditioned sparse paths. On an AMD Ryzen 7 5800X, an early
    scalar FP32 baseline decodes at 9.5 tokens/s. Mixed-layout AVX2 FP32 raises this
    to 14.7 tokens/s, and AVX2 INT8 reaches 19.9 tokens/s on the same step-30k export
    while reducing the weight footprint from 3.49 GB to 1.06 GB. For the available
    186k-step 874M-parameter INT8 export, the C++ runtime decodes at 22.63 tokens/s
    in a single-thread CPU benchmark, compared with 16.31 tokens/s for TinyLlama-1.1B
    Q8_0, 11.26 tokens/s for Falcon3-1B Q8_0, and 9.70 tokens/s for Qwen2.5-1.5B Q8_0
    under llama.cpp. Thread scaling reaches 47.90 tokens/s at four CPU threads, and
    512-token prefill improves from 29.86 to 94.68 tokens/s from one to eight threads.
    The throughput result comes with a quality cost: the SNN reports WikiText-2 perplexity
    24.80, worse than the dense baselines in the same benchmark. We frame the result
    as an inference-systems study for sparse language runtimes, with longer-term motivation
    in embodied and edge agents that may benefit from local, low-core inference near
    sensors and actuators. Spike-aware execution can improve CPU throughput and memory
    behavior for sparse spiking language models, while model quality, controlled dense
    training baselines, embodied-task evaluation, and measured CPU energy remain open
    problems.'
- title: 'SPECS: Speciated Evolutionary Circuit Synthesis'
  date: 2026-07
  url: https://arxiv.org/abs/2607.14027v1
  category: survey
  subcategory: review
  authors:
  - Yağız Gençer
  - Stefan Uhlich
  - Andrea Bonetti
  - Arun Venkitaraman
  - Chia-Yu Hsieh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We propose SPECS, a genetic algorithm for automated analog circuit synthesis
    with joint topology and sizing optimization. SPECS is inspired by NeuroEvolution
    of Augmenting Topologies (NEAT), an evolutionary algorithm originally developed
    to synthesize neural networks. By reformulating the genome representation and
    adapting the genetic operators to the analog circuit domain, we successfully transfer
    the core principles of NEAT to analog circuit synthesis. Circuit-specific wiring
    constraints are incorporated to ensure valid and physically meaningful designs
    throughout the evolutionary process, and speciation is used to preserve innovation
    while maintaining population diversity. We evaluate the proposed method on a set
    of computational circuit synthesis tasks consisting of square, cube, square root,
    and cube root functions. Experimental results demonstrate that SPECS outperforms
    benchmark methods across all tasks in both solution quality and reliability. The
    synthesized circuits and their schematics are available in the supplementary repository.
- title: Search Hardness-Aware LLM-Based Problem Formulation for Expensive Simulation-Driven
    Design
  date: 2026-07
  url: https://arxiv.org/abs/2607.21220v1
  category: survey
  subcategory: review
  authors:
  - Yuchen Li
  - Handing Wang
  - Bing Xue
  - Mengjie Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Expensive simulation-driven design is widely used in engineering to identify
    requirement-satisfying designs with as few high-fidelity simulations as possible.
    Most existing efforts address this challenge by improving optimization algorithms
    under fixed formulations, yet the formulation itself shapes the search landscape
    by defining the objectives and constraints optimized by the solver. Recent LLM-based
    automatic problem formulation methods generate formulations from natural-language
    requirements, but they mainly focus on design-intent alignment and overlook whether
    the formulation induces an efficient search process. To address this limitation,
    we propose SHA-PF, a search hardness-aware LLM-based problem formulation framework.
    We find that a formulation is more likely to guide efficient search when it prioritizes
    rare samples with greater progress potential. Based on this finding, SHA-PF defines
    a formulation search objective guided by search hardness, scoring each candidate
    formulation according to the priority. SHA-PF then searches the formulation space
    under this objective through LLM-based generation, repair, and evolutionary refinement.
    Experiments on the real-world multi-objective benchmark and five expensive antenna
    design benchmarks show that the formulations discovered by SHA-PF require significantly
    fewer evaluations to reach the design requirements than other baselines.
- title: Evolutionary Warm-Starts for Reinforcement Learning in Industrial Continuous
    Control
  date: 2026-03
  url: https://arxiv.org/abs/2603.26750v1
  category: survey
  subcategory: review
  authors:
  - Tom Maus
  - Stephan Frank
  - Tobias Glasmachers
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reinforcement learning (RL) is still rarely applied in industrial control,
    partly due to the difficulty of training reliable agents for real-world conditions.
    This work investigates how evolution strategies can support RL in such settings
    by introducing a continuous-control adaptation of an industrial sorting benchmark.
    The CMA-ES algorithm is used to generate high-quality demonstrations that warm-start
    RL agents. Results show that CMA-ES-guided initialization significantly improves
    stability and performance. Furthermore, the demonstration trajectories generated
    with the CMA-ES provide a strong oracle reference performance level, which is
    of interest in its own right. The study delivers a focused proof of concept for
    hybrid evolutionary-RL approaches and a basis for future, more complex industrial
    applications.
- title: 'BDH-CQ: In-Context Learning with Recurrent Latent Reasoning'
  date: 2026-08
  url: https://arxiv.org/abs/2608.09888v1
  category: survey
  subcategory: review
  authors:
  - Björn Engdahl
  - Adrian Kosowski
  - Jan Chorowski
  - Zuzanna Stamirowska
  - Przemysław Uznański
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce BDH-CQ, a reasoning model that combines in-context learning
    with recurrent latent reasoning. Inputs presented at inference time continuously
    update the model's recurrent memory; the model then solves a query through iterative
    computation in a high-dimensional latent space, without verbalizing its intermediate
    reasoning. We evaluate the model on the public ARC-AGI-1 evaluation set and use
    controlled ARC-like interventions to study what it learns from demonstrations,
    how consistently it applies an inferred transformation, and which concepts remain
    difficult. A 150M-parameter configuration reaches 29.5% pass@2 at a computed inference
    cost of \$0.0007 per task. This operating point breaks through the previously
    reported ARC-AGI-1 cost-accuracy Pareto frontier, establishing a new state of
    the art in benchmark cost efficiency.
- title: Hybrid Metaheuristic Combining the Dragonfly Algorithm and Tabu Search for
    the Traveling Salesman Problem
  date: 2026-06
  url: https://arxiv.org/abs/2606.09529v1
  category: survey
  subcategory: review
  authors:
  - Ammar Bouketta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The Traveling Salesman Problem (TSP) is a classical NP-hard combinatorial
    optimization problem that aims to find the shortest Hamiltonian cycle visiting
    each city exactly once and returning to the starting point. This paper proposes
    a hybrid metaheuristic for the TSP by combining the Dragonfly Algorithm (DA),
    a swarm-intelligence-based global search method, with Tabu Search (TS), a memory-based
    local search technique. The proposed method follows a High-Level Relay Hybridization
    (HRH) scheme, in which DA is first used to explore the solution space and generate
    a promising initial tour, while TS subsequently refines this solution through
    neighbourhood-based improvement and tabu memory. The hybrid approach is evaluated
    on standard TSPLIB benchmark instances, including burma14, att48, and ch150, and
    compared with standalone DA, standalone TS, and several classical metaheuristics
    such as Genetic Algorithm, Ant Colony Optimization, Particle Swarm Optimization,
    and Random Search. A systematic grid-search procedure is also conducted to study
    the influence of the main hyperparameters on solution quality and execution time.
    The experimental results indicate that the proposed hybrid can improve tour quality
    compared with the standalone DA and TS on the tested instances, highlighting the
    benefit of combining global exploration with local exploitation. However, the
    results also suggest that performance remains sensitive to parameter settings
    and problem size, motivating further validation on larger benchmarks and stronger
    TSP-specific baselines.
- title: 'RDEx-MOP: Indicator-Guided Reconstructed Differential Evolution for Fixed-Budget
    Multiobjective Optimization'
  date: 2026-03
  url: https://arxiv.org/abs/2603.27092v1
  category: survey
  subcategory: review
  authors:
  - Sichen Tao
  - Yifei Yang
  - Ruihan Zhao
  - Kaiyu Wang
  - Sicheng Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multiobjective optimisation in the CEC 2025 MOP track is evaluated not
    only by final IGD values but also by how quickly an algorithm reaches the target
    region under a fixed evaluation budget. This report documents RDEx-MOP, the reconstructed
    differential evolution variant used in the IEEE CEC 2025 numerical optimisation
    competition (C06 special session) bound-constrained multiobjective track. RDEx-MOP
    integrates indicator-based environmental selection, a niche-maintained Pareto-candidate
    set, and complementary differential evolution operators for exploration and exploitation.
    We evaluate RDEx-MOP on the official CEC 2025 MOP benchmark using the released
    checkpoint traces and the median-target U-score framework. Experimental results
    show that RDEx-MOP achieves the highest total score and the best average rank
    among all released comparison algorithms, including the earlier RDEx baseline.
- title: 'SeqGPT: A Constrained Transformer Agent for the Inverse Design of Multi-Panel
    Composite Structures'
  date: 2026-07
  url: https://arxiv.org/abs/2607.11910v1
  category: survey
  subcategory: review
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Optimizing composite stacking sequences to match continuous targets (e.g.,
    Lamination or Buckling Parameters) with discrete manufacturing constraints represents
    a challenging combinatorial inverse problem that regularly occurs in composite
    design especially when numerical optimization approaches are used (bi-step, bi-level
    configurations). In multipanel configurations, this complexity is further intensified
    by blending, a global compatibility/continuity requirement between the different
    panel stackings. This study presents SeqGPT, a conditional Transformer agent developed
    to replace computationally expensive iterative methods. To ensure both global
    continuity and manufacturing feasibility by construction, we implemented a hybrid
    neurosymbolic decoding strategy. SeqGPT predicts a conditional distribution that
    guides a Constrained Beam Search, where any branch violating blending rules is
    strictly pruned. Numerical experiments on the 18-panel horseshoe benchmark demonstrate
    that SeqGPT generates solutions near-instantaneously with buckling performance
    comparable to evolutionary methods, offering a significant speed-up compared to
    the state of the art.
- title: Adaptive Protection for Evolutionary Feature Construction in Symbolic Regression
    with Application to Credit Classification
  date: 2026-08
  url: https://arxiv.org/abs/2608.14209v1
  category: survey
  subcategory: review
  authors:
  - Hengzhe Zhang
  - Qi Chen
  - Bing Xue
  - Lean Yu
  - Wolfgang Banzhaf
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Evolutionary feature construction has shown strong promise in symbolic
    regression by automatically discovering informative transformations of input features
    that enhance a simple base learner. However, existing approaches often lack explicit
    mechanisms to preserve important constructed features discovered during evolution,
    and valuable genetic material can be lost when genetic operators disrupt effective
    features. This paper introduces an adaptive protection mechanism that leverages
    feature importance metrics to selectively preserve constructed features during
    evolution. The mechanism provides stronger protection for more important constructed
    features while still allowing less important features to be modified and to incorporate
    useful building blocks from more important features. We evaluate the approach
    using multiple feature importance calculation methods and demonstrate its robustness
    across different base learners. Experimental results on 98 regression benchmark
    datasets show that the proposed mechanism consistently improves solution quality
    over baseline approaches, and experiments on two credit classification datasets
    demonstrate that the method also extends effectively to improve search effectiveness
    beyond symbolic regression.
- title: A Large-Scale Empirical Evaluation of MMAO Under Fair-Budget Continuous and
    Discrete Benchmarks
  date: 2026-06
  url: https://arxiv.org/abs/2606.31584v2
  category: survey
  subcategory: review
  authors:
  - Jinliang Xu
  - Liping Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper evaluates the Metabolic Multi-Agent Optimizer (MMAO) under
    a stricter empirical protocol rather than reintroducing the framework itself.
    The study asks whether MMAO's closed-loop resource-allocation principle remains
    credible under broader, more standard, and more explicitly budget-controlled continuous
    and discrete benchmarks. The main completed matrix covers eight CEC2017 functions
    at 10D and 30D with 20 seeds each, and five TSPLIB instances with 20 seeds each,
    together with stronger reproducible baselines including PSO-lite, ES-lite, and
    an iterated-greedy 2-opt route baseline. We further add trajectory-level diagnostics
    for communal budget, success rate, role evolution, and population turnover, plus
    an auxiliary OR-Library multiple-knapsack slice to extend the discrete evidence
    beyond routing. Under this protocol, MMAO clearly outperforms the external baseline
    set on the continuous side and on the TSPLIB side, while the ablation variants
    remain much closer to the full method than the external baselines are. We therefore
    position MMAO as a benchmark-backed cross-domain adaptive framework whose most
    clearly validated value is endogenous resource redistribution under evidence pressure,
    while also noting that the strongest remaining gap is not basic workability but
    sharper mechanism isolation and broader competition-grade comparison.
- title: 'Why Prompt Optimization Works, and Why It Sometimes Doesn''t: A Causal-Inspired
    Edit-Level Analysis'
  date: 2026-05
  url: https://arxiv.org/abs/2605.26655v1
  category: survey
  subcategory: review
  authors:
  - Shuzhi Gong
  - Hechuan Wen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Automated prompt optimization methods (e.g., DSpy, TextGrad) can substantially
    improve the performance of large language model (LLM), however, their generalization
    ability across different tasks remains underperformed. In practice, the superiority
    of the optimized prompt on one benchmark often fails to transfer to another, and
    this limitation persists even when switching across different LLM backbones. To
    investigate the underexplored sources of heterogeneity in prompt performance,
    we conduct a causal inference-inspired observational analysis of optimized prompts
    across a diverse set of optimization frameworks, LLM backbones, and NLP benchmarks.
    To achieve the goal, we build upon the propensity-adjusted associational analysis
    together with multiple complementary representations of prompt edits, where the
    consistent task-conditioned edits patterns are identified. We find that complexity-increasing
    and meta-instructional edits are negatively associated with mathematical and multi-hop
    reasoning performance, whereas step-by-step and meta-cognitive edits improve logical
    and sequential reasoning tasks. These effects are robust across cognitive-load
    annotations, surface-level text features, and edit-motif analyses, and can generalize
    across optimization frameworks. Overall, these results indicate that prompt optimization
    failures arise from systematic interactions between edit families and task characteristics
    rather than random optimization artifacts, providing feature-level characterization
    of optimizer behavior and motivating future task-conditioned optimizer design.
- title: 'Evolutionary Intelligence for Scientific Discovery: From Evolutionary Computation
    to Cumulative Discovery Systems'
  date: 2026-07
  url: https://arxiv.org/abs/2607.09025v1
  category: survey
  subcategory: review
  authors:
  - Chao Wang
  - Lingling Li
  - Fang Liu
  - Licheng Jiao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Artificial intelligence (AI) is shifting scientific discovery from task-specific
    workflows towards autonomous systems that organize exploration with experimental
    and human feedback in open-ended candidate spaces. Evolutionary computation (EC)
    provides a computational basis for feedback-driven discovery because population-based
    search can maintain diverse scientific candidates while steering exploration through
    accumulated evidence. However, EC predominantly focuses on candidate refinement
    for predefined problems, whereas cumulative discovery requires experience retention.
    To bridge this gap, this review introduces evolutionary intelligence (EI) for
    scientific discovery. EI characterizes scientific AI systems that sustain exploration
    by linking candidate refinement with experience retention across evolutionary
    cycles. We introduce a five-dimensional analytical framework that asks what evolves,
    how candidates change, why candidates are selected, where feedback originates,
    and when evolution occurs. This framework clarifies how EI transforms isolated
    search trajectories into cumulative scientific insight. We further demonstrate
    this paradigm across diverse discovery modes, from evolving concrete scientific
    entities to orchestrating automated research workflows. Finally, we identify critical
    bottlenecks regarding evaluation, process traceability, and shared infrastructure,
    providing a concrete roadmap for advancing the transition from EC to EI in scientific
    discovery.
- title: 'On the Impact of Crossover in Many-Objective Optimization: A Runtime Analysis
    of NSGA-III'
  date: 2026-05
  url: https://arxiv.org/abs/2605.11201v1
  category: survey
  subcategory: review
  authors:
  - Andre Opris
  venue: IJCAI 2026
  code_url: ''
  project_url: ''
  abstract: In recent years, a theoretical understanding has rapidly advanced regarding
    how popular multi-objective evolutionary algorithms (MOEAs) can optimize many-objective
    problems. However, the benefits of using crossover in many-objective optimization
    are theoretically not understood, except for specifically designed benchmark functions
    tuned to particular crossover operators, and still lag significantly behind its
    practical use. In this paper, we build upon this line of research and present
    a theoretical runtime analysis of the widely used NSGA-III algorithm on the classical
    $m$-objective $m$-OneJumpZeroJump function ($m$-OJZJ for short). Our results demonstrate
    that NSGA-III with crossover optimizes $m$-OJZJ asymptotically faster than NSGA-III
    without crossover for any number $m$ of objectives for huge parameter regimes.
    We complement our analysis by providing a lower runtime bound on $4$-OJZJ when
    crossover is turned off.
- title: A Hybrid Matheuristic Framework for the Chinese Postman Problem with Load-Dependent
    Costs
  date: 2026-04
  url: https://arxiv.org/abs/2607.22542v1
  category: survey
  subcategory: review
  authors:
  - Thieu Khang Nguyen
  - Thu Huong Dang
  - Truong-Son Hy
  venue: ''
  code_url: https://github.com/HySonLab/MatCPP
  project_url: ''
  abstract: The Chinese Postman Problem with load-dependent costs (CPP-LC) arises
    in real-world logistics and transportation systems where travel costs depend on
    vehicle load and energy consumption. In this work, we propose a hybrid optimization
    framework that integrates metaheuristic search with mathematical programming to
    efficiently solve CPP-LC. The proposed method combines local search procedures
    with reduced mixed-integer linear programming (MILP) models to balance exploration
    and intensification. In addition, we develop an Ant Colony Optimization (ACO)
    algorithm to enhance scalability on large instances. Extensive experiments on
    benchmark datasets demonstrate that the proposed framework consistently achieves
    high-quality solutions and outperforms existing approaches in solution quality,
    while maintaining competitive computational efficiency. These results highlight
    the effectiveness of hybrid optimization strategies for complex, load-dependent
    routing problems in practical applications. Our implementation is publicly available
    at https://github.com/HySonLab/MatCPP
- title: 'GeM-EA: A Generative and Meta-learning Enhanced Evolutionary Algorithm for
    Streaming Data-Driven Optimization'
  date: 2026-04
  url: https://arxiv.org/abs/2604.12336v1
  category: survey
  subcategory: review
  authors:
  - Yue Wu
  - Yuan-Ting Zhong
  - Ze-Yuan Ma
  - Yue-Jiao Gong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Streaming Data-Driven Optimization (SDDO) problems arise in many applications
    where data arrive continuously and the optimization environment evolves over time.
    Concept drift produces non-stationary landscapes, making optimization methods
    challenging due to outdated models. Existing approaches often rely on simple surrogate
    combinations or directly injecting solutions, which may cause negative transfer
    under sudden environmental changes. We propose GeM-EA, a Generative and Meta-learning
    Enhanced Evolutionary Algorithm for SDDO that unifies meta-learned surrogate adaptation
    with generative replay for effective evolutionary search. Upon detecting concept
    drift, a bi-level meta-learning strategy rapidly initializes the surrogate using
    environment-relevant priors, while a linear residual component captures global
    trends. A multi-island evolutionary strategy further leverages historical knowledge
    via generative replay to accelerate optimization. Experimental results on benchmark
    SDDO problems demonstrate that GeM-EA achieves faster adaptation and improved
    robustness compared with state-of-the-art methods.
- title: Fuzzy Encoding-Decoding to Improve Spiking Q-Learning Performance in Autonomous
    Driving
  date: 2026-04
  url: https://arxiv.org/abs/2604.16436v1
  category: survey
  subcategory: review
  authors:
  - Aref Ghoreishee
  - Abhishek Mishra
  - Lifeng Zhou
  - John Walsh
  - Anup Das
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This paper develops an end-to-end fuzzy encoder-decoder architecture
    for enhancing vision-based multi-modal deep spiking Q-networks in autonomous driving.
    The method addresses two core limitations of spiking reinforcement learning: information
    loss stemming from the conversion of dense visual inputs into sparse spike trains,
    and the limited representational capacity of spike-based value functions, which
    often yields weakly discriminative Q-value estimates. The encoder introduces trainable
    fuzzy membership functions to generate expressive, population-based spike representations,
    and the decoder uses a lightweight neural decoder to reconstruct continuous Q-values
    from spiking outputs. Experiments on the HighwayEnv benchmark show that the proposed
    architecture substantially improves decision-making accuracy and closes the performance
    gap between spiking and non-spiking multi-modal Q-networks. The results highlight
    the potential of this framework for efficient and real-time autonomous driving
    with spiking neural networks.'
- title: Quadratic Surrogate Attractor for Particle Swarm Optimization
  date: 2026-03
  url: https://arxiv.org/abs/2603.17163v1
  category: survey
  subcategory: review
  authors:
  - Maurizio Clemente
  - Marcello Canova
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a particle swarm optimization algorithm that leverages
    surrogate modeling to replace the conventional global best solution with the minimum
    of an n-dimensional quadratic form, providing a better-conditioned dynamic attractor
    for the swarm. This refined convergence target, informed by the local landscape,
    enhances global convergence behavior and increases robustness against premature
    convergence and noise, while incurring only minimal computational overhead. The
    surrogate-augmented approach is evaluated against the standard algorithm through
    a numerical study on a set of benchmark optimization functions that exhibit diverse
    landscapes. To ensure statistical significance, 400 independent runs are conducted
    for each function and algorithm, and the results are analyzed based on their statistical
    characteristics and corresponding distributions. The quadratic surrogate attractor
    consistently outperforms the conventional algorithm across all tested functions.
    The improvement is particularly pronounced for quasi-convex functions, where the
    surrogate model can exploit the underlying convex-like structure of the landscape.
- title: A Family of Quaternion-Valued Differential Evolution Algorithms for Numerical
    Function Optimization
  date: 2026-05
  url: https://arxiv.org/abs/2605.12362v1
  category: survey
  subcategory: review
  authors:
  - Gerardo Altamirano-Gomez
  - Álvaro Gallardo
  - Carlos Ignacio Hernández Castellanos
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The numerical optimization of continuous functions is a fundamental task
    in many scientific and engineering domains, ranging from mechanical design to
    training of artificial intelligence models. Among the most effective and widely
    used algorithms for this purpose is Differential Evolution (DE), known for its
    simplicity and strong performance. Recent research has shown that adapting AI
    models to operate over alternative number systems-such as complex numbers, quaternions,
    and geometric algebras-can improve model compactness and accuracy. However, such
    extensions remain underexplored in bio-inspired optimization algorithms. In particular,
    the use of quaternion algebra represents an emerging area in computational intelligence.
    This paper introduces a family of novel Quaternion-Valued Differential Evolution
    (QDE) algorithms that operate directly in the quaternion space. We propose several
    mutation strategies specifically designed to exploit the algebraic and geometric
    properties of quaternions. Results show that our QDE variants achieve faster convergence
    and superior performance on several function classes in the BBOB benchmark compared
    to the traditional real-valued DE algorithm.
- title: Asymptotical Analysis of the $(1+(λ,λ))$ GA Escape Time from Local Optima
    on Jump Functions
  date: 2026-07
  url: https://arxiv.org/abs/2607.14278v1
  category: survey
  subcategory: review
  authors:
  - Anton V. Eremeev
  - Valentin A. Topchii
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The paper develops the approach to the runtime analysis of evolutionary
    algorithms on the basis of limit theorems from probability theory. We consider
    the family of Jump$_k$ benchmark functions, defined on the search space of binary
    strings of length $n$, parametrized by the integer $k$, which have multiple local
    optima at the Hamming distance $k$ from a unique global optimum. In this work,
    we consider the genetic algorithm $(1+(λ,λ)) GA$ from (Doerr, Doerr and Ebel,
    2015) with tunable parameters of the mutation rate $p$, crossover bias $c$, and
    two intermediate population sizes $λ_M$ and $λ_C$, and study the time it escapes
    from the plateau in the case of Jump$_k$ fitness function when $np$ tends to infinity.
    The main result of this work is a tightened upper bound on the escape time from
    the work of Antipov, Doerr and Karavaev (2022). Besides that, the obtained bound
    applies to a wider range of algorithm parameters.
- title: A Unified Measure-Theoretic View of Diffusion, Score-Based, and Flow Matching
    Generative Models
  date: 2026-05
  url: https://arxiv.org/abs/2605.06829v1
  category: survey
  subcategory: review
  authors:
  - Aditya Ranganath
  - Mukesh Singhal
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We survey continuous-time generative modeling methods based on transporting
    a simple reference distribution to a data distribution via stochastic or deterministic
    dynamics. We present a unified framework in which diffusion models, score-based
    generative models, and flow matching are instances of learning a time-dependent
    vector field that induces a family of marginals $(ρ_t)_{t \in [0,1]}$ governed
    by continuity and Fokker-Planck equations. Such a unified theory is timely because
    these methods are converging methodologically, yet fragmented notation and competing
    derivations continue to obscure their shared structure and the practical tradeoffs
    governing sampling, stability, and computation. Within this framework, we (i)
    derive reverse-time sampling for diffusion and score-based models as controlled
    stochastic dynamics, (ii) show that the probability flow ODE yields identical
    marginals and connects diffusion to likelihood-based normalizing flows, and (iii)
    interpret flow matching as direct regression of the velocity field under a chosen
    interpolation, clarifying when it coincides with or differs from score-based training.
    We compare objectives, sampling schemes, and discretization errors under unified
    notation, discuss connections to Schrodinger bridges and entropic optimal transport,
    and summarize theoretical guarantees and open problems on approximation, stability,
    and scalability.
- title: Improving Evaluation of Recombination-based Cartesian Genetic Programming
  date: 2026-05
  url: https://arxiv.org/abs/2605.28353v1
  category: survey
  subcategory: review
  authors:
  - Duy Long Tran
  - Anja Jankovic
  - Marie Anastacio
  - Holger Hoos
  - Roman Kalkreuth
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Cartesian Genetic Programming has traditionally been using mutation as
    its main and often sole genetic operator to drive evolutionary search. Despite
    advancements in recent years, recombinationbased approaches have long been avoided,
    due to apparent lack of performance gains. This study examines two recently suggested
    recombination-based operators, subgraph crossover and discrete phenotypic recombination
    on SRBench, a benchmarking platform for symbolic regression. Using the implementations
    provided in the TinyverseGP framework, we perform hyperparameter optimisation
    of the respective representations with these two operators. Our work demonstrates
    that hyperparameter optimisation can lead to improvements in performance for recombination-based
    Cartesian Genetic Programming.
- title: 'MAEO: Multiobjective Animorphic Ensemble Optimization for Scalable Large-scale
    Engineering Applications'
  date: 2026-04
  url: https://arxiv.org/abs/2604.26973v1
  category: survey
  subcategory: review
  authors:
  - Omer F. Erdem
  - Dean Price
  - Paul Seurin
  - Majdi I. Radaideh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multiobjective optimization remains challenging for many scientific and
    engineering problems due to the need to balance convergence, diversity, and computational
    efficiency across high-dimensional objective landscapes. This work presents the
    Multiobjective Animorphic Ensemble Optimization (MAEO) framework, a parallelizable
    ensemble strategy that unifies state-of-the-art evolutionary algorithms within
    an island-based architecture, overcoming the limitations of relying on a single
    optimizer, as implied by the No Free Lunch theorem. MAEO uses a parameter-free
    hypervolume indicator for island performance assessment and a strict Pareto-rank-based
    individual scoring formulation that incorporates crowding distance and nadir-point
    proximity to ensure consistent selection pressure within each front. The framework
    is initiated using four algorithms (NSGA-III, CTAEA, AGEMOEA2, SPEA2) and evaluated
    through extensive benchmarking on 12 DTLZ/ZDT functions under 36 dimensionality
    settings using Wilcoxon signed-rank tests with both hypervolume and inverse generational
    distance metrics. Results show that MAEO achieves balanced convergence-diversity
    performance, outperforming or matching some of the leading multiobjective optimization
    algorithms across different benchmark problems. To demonstrate practical applicability,
    MAEO is applied to the equilibrium-cycle optimization of a small modular nuclear
    reactor. Eight discrete design variables (and three objectives (levelized cost
    of electricity, peak soluble boron concentration, fuel cycle length) are optimized
    under two safety constraints. The algorithm carried out roughly 40000 evaluations
    using computer simulations. MAEO identifies core designs that lower both the levelized
    cost of electricity and the peak boron concentration, while preserving fuel cycle
    length and meeting all safety constraints.
- title: Optically Writable Atomic Vapor Memory as a Substrate for Optical Reservoir
    Computing
  date: 2026-08
  url: https://arxiv.org/abs/2608.17807v1
  category: survey
  subcategory: review
  authors:
  - Elizabeth Robertson
  - Mingwei Yang
  - Lina Jaurigue
  - Guillermo Gallego
  - Kathy Lüdge
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present an optical random access memory (ORAM) based on warm cesium
    (Cs) atomic vapor and demonstrate its operation as the physical substrate of a
    reservoir computer. Information is stored in the hyperfine population distribution
    of a Cs ensemble via optical pumping and retrieved through differential probe
    absorption. Spatial multiplexing via acousto-optic deflection provides eight addressable
    memory rails able to store up to 3.8 bits of information per rail. Employing this
    platform as a temporally multiplexed reservoir, we achieve a kernel rank ($\mathrm{KR}=
    8.8 \pm 0.4$), and a minimum bit error rate of $0.02 \pm 0.01$ on the Exclusive-or
    (XOR) benchmark. We find the limited memory lifetime constrains the achievable
    temporal depth, encouraging further research into fast addressable memories. This
    constitutes the first demonstration of a free-space, optically writable atomic
    RAM as a substrate in an optical reservoir computing system.
- title: Shared Symbolic Backbones for Physically Consistent Multi-Output Symbolic
    Regression
  date: 2026-07
  url: https://arxiv.org/abs/2607.26528v1
  category: survey
  subcategory: review
  authors:
  - Manuel Rodriguez
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Symbolic regression provides analytical expressions, but it is usually
    applied one output at a time. This is limiting in process systems, where state
    variables are often coupled through shared physical parameters. Independent symbolic
    regression can give accurate individual equations that are difficult to interpret
    as one model. We present a neuro-evolutionary symbolic regression method for coupled
    multi-output systems. The method searches for a shared symbolic backbone: a set
    of latent symbolic units that is discovered once and reused by several outputs
    through sparse additive or multiplicative read-outs. The discrete model structure
    is evolved by mutation and crossover, whereas the continuous parameters are tuned
    by gradient descent and inherited by the offspring. The method is assessed on
    a set of benchmarks with known ground truth and on a hydrothermal liquefaction
    yield case. The results show that coupling is not a general route to lower prediction
    error. Its main contribution is the enforcement and diagnosis of cross-output
    consistency when a physically shared factor is embedded in a latent expression
    and is weakly identifiable from the data. This occurs for Langmuir-Hinshelwood
    and site-coverage denominators, for which independent PySR does not close the
    consistency gap or recover the same shared form. Conversely, when each output
    is already identifiable, as in the Van de Vusse benchmark, independent symbolic
    regression matches or improves the coupled model. The proposed framework, rather
    than a general purpose predictor, is a structured shared-mechanism extractor.
    Its value is highest when the target structure is sparse, shared, weakly identifiable
    or constrained by closure.'
- title: Benchmarking local Hebbian learning rules for memory storage and prototype
    extraction
  date: 2026-05
  url: https://arxiv.org/abs/2605.01074v1
  category: survey
  subcategory: review
  authors:
  - Anders Lansner
  - Andreas Knoblauch
  - Naresh B Ravichandran
  - Pawel Herman
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Associative memory or content-addressable memory is an important component
    function in computer science and information processing, and at the same time
    a key concept in cognitive and computational brain science. Many different neural
    network architectures and learning rules have been proposed to model the brain's
    associative memory while investigating key component functions like figure-ground
    segmentation, perceptual reconstruction and rivalry. A less investigated but equally
    important capability of associative memory is prototype extraction where the training
    set comprises distorted prototype instances and the task is to recall the correct
    generating prototype given a new distorted instance. In this paper we benchmark
    associative memory function of seven different Hebbian learning rules employed
    in non-modular and modular recurrent networks with winner-take-all dynamics operating
    on moderately sparse binary patterns. We measure pattern storage and weight information
    capacity, prototype extraction capabilities, and sensitivity to correlations in
    data. The original additive Hebb rule comes out with worst capacity, covariance
    learning proves to be robust but with moderate capacity, and the Bayesian-Hebbian
    learning rules show highest capacity in almost all different conditions tested.
- title: 'The Geno-Synthetic Algorithm: Type-Factored Coevolutionary Optimization
    for Heterogeneous Genotypes and Assembled Phenotypes'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13365v1
  category: survey
  subcategory: review
  authors:
  - Alex Bogdan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Many real-world optimization problems are not naturally homogeneous vectors
    but composite design objects with heterogeneous parameters: integers, real values,
    Booleans, categoricals, complex-valued descriptors, and embedding vectors. Standard
    evolutionary algorithms flatten these into a single chromosome and apply generic
    operators with rounding and repair, sacrificing representational fidelity. We
    introduce the Geno-Synthetic Algorithm (GSA), a type-factored coevolutionary framework
    in which gene families are partitioned by representational type, evolved in parallel
    with type-native operators, and assembled into executable phenotypes for joint
    fitness evaluation. GSA is formalized as a typed product-space search procedure
    with an explicit assembly operator. An open-source reference implementation (gsa-experiments,
    MIT-licensed) is released. A focused empirical study compares eight GSA variants
    against five baselines across seven benchmark problems (six synthetic plus the
    external COCO BBOB-MixInt suite) at budgets from 5,000 to 100,000 evaluations.
    The headline finding is architectural: GSA is the only method that operates when
    gene families include complex-valued descriptors or embedding vectors. On smooth
    synthetic multi-family problems, well-tuned flattened differential evolution remains
    the strongest baseline; on BBOB-MixInt at 100,000 evaluations, GSA_DIRECT becomes
    statistically indistinguishable from FLATTENED_DE while FLATTENED_EA drops from
    second to fifth rank, an asymptotic crossover. Ablations confirm that type-native
    operators are essential, elite credit dominates ensemble credit, and active assembly
    outperforms passive concatenation on gated benchmarks. The framework extends naturally
    to prompt and embedding optimization for large language model systems.'
- title: 'Socrates Loss: Unifying Confidence Calibration and Classification by Leveraging
    the Unknown'
  date: 2026-04
  url: https://arxiv.org/abs/2604.12245v1
  category: survey
  subcategory: review
  authors:
  - Sandra Gómez-Gálvez
  - Tobias Olenyi
  - Gillian Dobbie
  - Katerina Taškova
  venue: TMLR 2026. https
  code_url: ''
  project_url: ''
  abstract: 'Deep neural networks, despite their high accuracy, often exhibit poor
    confidence calibration, limiting their reliability in high-stakes applications.
    Current ad-hoc confidence calibration methods attempt to fix this during training
    but face a fundamental trade-off: two-phase training methods achieve strong classification
    performance at the cost of training instability and poorer confidence calibration,
    while single-loss methods are stable but underperform in classification. This
    paper addresses and mitigates this stability-performance trade-off. We propose
    Socrates Loss, a novel, unified loss function that explicitly leverages uncertainty
    by incorporating an auxiliary unknown class, whose predictions directly influence
    the loss function and a dynamic uncertainty penalty. This unified objective allows
    the model to be optimized for both classification and confidence calibration simultaneously,
    without the instability of complex, scheduled losses. We provide theoretical guarantees
    that our method regularizes the model to prevent miscalibration and overfitting.
    Across four benchmark datasets and multiple architectures, our comprehensive experiments
    demonstrate that Socrates Loss consistently improves training stability while
    achieving more favorable accuracy-calibration trade-off, often converging faster
    than existing methods.'
- title: A Firefly Algorithm for Mixed-Variable Optimization Based on Hybrid Distance
    Modeling
  date: 2026-03
  url: https://arxiv.org/abs/2603.26792v2
  category: survey
  subcategory: review
  authors:
  - Ousmane Tom Bechir
  - Adán José-García
  - Zaineb Chelly Garcia
  - Vincent Sobanski
  - Clarisse Dhaenens
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Several real-world optimization problems involve mixed-variable search
    spaces, where continuous, ordinal, and categorical decision variables coexist.
    However, most population-based metaheuristic algorithms are designed for either
    continuous or discrete optimization problems and do not naturally handle heterogeneous
    variable types. In this paper, we propose an adaptation of the Firefly Algorithm
    for mixed-variable optimization problems (FAmv). The proposed method relies on
    a modified distance-based attractiveness mechanism that integrates continuous
    and discrete components within a unified formulation. This mixed-distance approach
    enables a more appropriate modeling of heterogeneous search spaces while maintaining
    a balance between exploration and exploitation. The proposed method is evaluated
    on the CEC2013 mixed-variable benchmark, which includes unimodal, multimodal,
    and composition functions. The results show that FAmv achieves competitive, and
    often superior, performance compared with state-of-the-art mixed-variable optimization
    algorithms. In addition, experiments on engineering design problems further highlight
    the robustness and practical applicability of the proposed approach. These results
    indicate that incorporating appropriate distance formulations into the Firefly
    Algorithm provides an effective strategy for solving complex mixed-variable optimization
    problems.
- title: An FPGA-Based SoC Architecture with a RISC-V Controller for Energy-Efficient
    Temporal-Coding Spiking Neural Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.18054v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Mohammad Javad Sekonji
  - Ali Mahani
  - Maryam Mirsadeghi
  - Mahdi Taheri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) offer high energy efficiency and event-driven
    computation, ideal for low-power edge AI. Their hardware implementation on FPGAs,
    however, faces challenges due to heavy computation, large memory use, and limited
    flexibility. This paper proposes a compact System-on-Chip (SoC) architecture for
    temporal-coding SNNs, integrating a RISC-V controller with an event-driven SNN
    core. It replaces multipliers with bitwise operations using binarized weights,
    includes a spike-time sorter for active spikes, and skips noninformative events
    to reduce computation. The architecture runs fully on a Xilinx Artix-7 FPGA, achieving
    up to 16x memory reduction for weights and lowering computational overhead and
    latency, with 97.0% accuracy on MNIST and 88.3% on FashionMNIST. This self-contained
    design provides an efficient, scalable platform for real-time neuromorphic inference
    at the edge.
- title: Heterogeneous SoC Integrating an Open-Source Recurrent SNN Accelerator for
    Neuromorphic Edge Computing on FPGA
  date: 2026-05
  url: https://arxiv.org/abs/2605.12217v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Michelangelo Barocci
  - Vittorio Fra
  - Enrico Macii
  - Gianvito Urgese
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The growing popularity of Spiking Neural Networks (SNNs) and their applications
    has led to a significant fast-paced increase of neuromorphic architectures capable
    of mimicking the spike-based data processing typical of biological neurons. The
    efficient power consumption and parallel computing capabilities of the SNNs lead
    researchers towards the development of digital accelerators, which exploit such
    features to bring fast and low-power computation on edge devices. The spread of
    digital neuromorphic hardware however is slowed down by the prohibitive costs
    that the silicon tape out of circuits brings, that's why targeting Field Programmable
    Gate Arrays (FPGAs) could represent a viable alternative, offering a flexible
    and cost-effective platform for implementing digital neuromorphic systems and
    helping the spread of open-source hardware designs. In this work we present an
    heterogeneous System-on-Chip (SoC) where the operations of ReckOn, a Recurrent
    SNN accelerator, are managed through the integration with traditional processors.
    These include the RISC-V-based, open-source microcontroller X-HEEP and the ARM
    processor featured in Zynq Ultrascale systems. We validate our design by reproducing
    the classification results through the implementation on FPGA of the taped-out
    version of ReckOn in order to check the equivalence of the accuracy and the characteristics
    in terms of physical implementation. In a second set of experiments, we evaluate
    the online learning capability of the solution in classifying a subset of the
    Braille digit dataset recently used to compare neuromorphic frameworks and platforms.
- title: 'ExSpike: A General Full-Event Neuromorphic Architecture for Exploiting Irregular
    Sparsity with Event Compression'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20414v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yuehai Chen
  - Farhad Merchant
  venue: ''
  code_url: https://github.com/xiaoyuehai/ExSpike
  project_url: ''
  abstract: Spiking neural networks (SNNs) promise energy-efficient computing due
    to their sparse spatio-temporal activity. However, effectively translating such
    irregular sparsity into practical performance and energy gains remains challenging,
    as full-event computing architectures are still underexplored. This paper proposes
    ExSpike, a general full-event neuromorphic architecture that fully exploits irregular
    sparsity in SNNs. To realize pure event-driven execution, we first propose a set
    of dataflow optimizations to ensure that the inputs to each SNN layer remain spike-based,
    thereby enabling full-event execution throughout the network. We then design a
    hardware-efficient full-event architecture, named ExSpike, which supports the
    optimized pure event-driven dataflow and an additional Attention Core for spike-driven
    self-attention. To further improve computing efficiency, we introduce adjacent-position
    event compression to reduce redundant accumulations across spatially adjacent
    spike sequences. ExSpike is implemented on an AMD Xilinx Virtex-7 FPGA and evaluated
    on both classification and segmentation workloads. Experimental results show that
    ExSpike achieves high normalized energy efficiency across diverse SNN models while
    maintaining competitive accuracy, delivering up to 479.15 GOPS, 281.85 GOPS/W,
    and 0.80 GOPS/W/PE. In particular, ExSpike achieves up to 10$\times$ higher PE-normalized
    energy efficiency than the SOTA FPGA-based SNN accelerator (FireFly-T). The code
    for ExSpike is available at https://github.com/xiaoyuehai/ExSpike.
- title: 'Shooting Neutrons at Neurons: Radiation Testing of a Spiking Neural Network
    on Flash-Based FPGAs'
  date: 2026-04
  url: https://arxiv.org/abs/2605.00030v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Wim Nijsink
  - Bruno Endres Forlin
  - Amirreza Yousefzadeh
  - Marco Ottavi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Neuromorphic, or spiking, processors are increasingly being considered
    for use in harsh, radiation-prone environments such as space and avionics, where
    energy efficiency and graceful degradation are essential. In this study, we propose
    and experimentally validate a radiation-testing methodology specifically designed
    for neuromorphic processors that employ on-chip synaptic plasticity. We map the
    open-source ODIN SNN processor with Spike-Dependent Synaptic Plasticity (SDSP)
    onto the FPGA and expose it to a high-energy neutron beam while continuously monitoring
    MNIST classification accuracy and recording the synaptic state. From these measurements,
    we extract SEU cross-sections for ODIN's synaptic memory and develop a calibrated
    fault model to inform a complementary fault-injection campaign. By comparing inference-only
    and online-learning configurations, we demonstrate that enabling SDSP can significantly
    extend the time to application-level failure and enable partial recovery from
    accumulated bit flips, with modest hardware overhead.
- title: 'AceleradorSNN: A Neuromorphic Cognitive System Integrating Spiking Neural
    Networks and DynamicImage Signal Processing on FPGA'
  date: 2026-03
  url: https://arxiv.org/abs/2603.28429v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Daniel Gutierrez
  - Ruben Martinez
  - Leyre Arnedo
  - Antonio Cuesta
  - Soukaina El Hamry
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The demand for high-speed, low-latency, and energy-efficient object detection
    in autonomous systems -- such as advanced driver-assistance systems (ADAS), unmanned
    aerial vehicles (UAVs), and Industry 4.0 robotics -- has exposed the limitations
    of traditional Convolutional Neural Networks (CNNs). To address these challenges,
    we have developed AceleradorSNN, a third-generation artificial intelligence cognitive
    system. This architecture integrates a Neuromorphic Processing Unit (NPU) based
    on Spiking Neural Networks (SNNs) to process asynchronous data from Dynamic Vision
    Sensors (DVS), alongside a dynamically reconfigurable Cognitive Image Signal Processor
    (ISP) for RGB cameras. This paper details the hardware-oriented design of both
    IP cores, the evaluation of surrogate-gradienttrained SNN backbones, and the real-time
    streaming ISP architecture implemented on Field-Programmable Gate Arrays (FPGA).
- title: Hardware-Software Co-Design for Event-Driven SNN Deployment on Low-Cost Neuromorphic
    FPGAs
  date: 2026-04
  url: https://arxiv.org/abs/2604.22179v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jiwoon Lee
  - Souvik Chakraborty
  - Syed Bahauddin Alam
  - Cheolsoo Park
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Low-cost FPGA platforms can broaden access to neuromorphic systems research,
    but current spiking neural network (SNN) workflows remain divided between hardware-first
    implementations, which are difficult to integrate with PyTorch-style development,
    and software-first frameworks, which often stop at simulation or GPU execution.
    This paper presents a semantics-preserving hardware-software co-design framework
    for the deterministic deployment of PyTorch-defined SNNs to event-driven FPGA
    execution. A single exported artifact carries weights, thresholds, connectivity
    descriptors, and grouped time-to-first-spike (TTFS) decoding metadata from software
    definition to board execution and is reused unchanged by both the software reference
    and the board runtime. A 10-class MNIST TTFS classifier implemented in the routed
    80 MHz design achieves 87.40\% accuracy and matches the software reference on
    all 10,000 test images. The programmable-logic path delivers a service latency
    of 0.1375 μs/image and an estimated dynamic energy of 31.6 nJ/image, while scope-aware
    comparisons with matched GPU and CPU baselines keep accelerator-only and system-level
    measurements distinct. These results show that low-cost event-driven FPGA hardware
    can provide a direct and reproducible software-to-board path for software-defined
    SNN models.
- title: 'SPARQ: Spiking Early-Exit Neural Networks for Energy-Efficient Edge AI'
  date: 2026-03
  url: https://arxiv.org/abs/2603.14380v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Parth Patne
  - Mahdi Taheri
  - Ali Mahani
  - Maksim Jenihhin
  - Reza Mahani
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) offer inherent energy efficiency due to
    their event-driven computation model, making them promising for edge AI deployment.
    However, their practical adoption is limited by the computational overhead of
    deep architectures and the absence of input-adaptive control. This work presents
    SPARQ, a unified framework that integrates spiking computation, quantization-aware
    training, and reinforcement learning-guided early exits for efficient and adaptive
    inference. Evaluations across MLP, LeNet, and AlexNet architectures demonstrated
    that the proposed Quantised Dynamic SNNs (QDSNN) consistently outperform conventional
    SNNs and QSNNs, achieving up to 5.15% higher accuracy over QSNNs, over 330 times
    lower system energy compared to baseline SNNs, and over 90 percent fewer synaptic
    operations across different datasets. These results validate SPARQ as a hardware-friendly,
    energy-efficient solution for real-time AI at the edge.
- title: 'NeuDW-CIM: a 65-nm 0.8-pJ/Sop Reconfigurable Neuromorphic Compute-in-Memory
    Macro with Nonlinear Dendrites and K-Winners'
  date: 2026-06
  url: https://arxiv.org/abs/2606.08947v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Junyi Yang
  - Yahan Yang
  - Shuai Dong
  - Biyan Zhou
  - Ye Ke
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'This work presents NeuDW-CIM, a highly efficient neuromorphic Compute-in-Memory
    (CIM) macro for Spiking Neural Networks (SNNs) implemented in 65 nm CMOS. The
    design introduces a custom twin 9T bit-cell for ternary in-puts/weights and a
    reconfigurable non-linear In-Memory ADC (IMA). The macro supports two specialized
    modes: 1) Nonlinear Dendrite (NLD) mode, which utilizes reconfigurable IMA to
    emulate biological dendritic functions, achieving measured accuracies of 97.2%
    on N-MNIST and 95.5% on DVS Gesture; and 2) Top-K Winner (KWN) mode, featuring
    an early-stopping mechanism that reduces IMA conversion latency by 30% and digital
    LIF latency by 10x. Benefiting from the sparse update in KWN mode, NeuDW-CIM achieves
    a measured energy efficiency (EE) of 0.8 pJ/SOP (1.6x improvement).'
- title: 'Mega: A 22 nm Convolutional Spiking Neural Network Accelerator Achieving
    0.375 pJ/SOP for Efficient Edge Vision'
  date: 2026-06
  url: https://arxiv.org/abs/2606.30039v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Rick Luiken
  - Manil Dev Gomony
  - Sander Stuijk
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Convolutional Spiking Neural Networks (SNN) offer the potential for highly
    energy-efficient vision processing by exploiting sparse, event-driven computation.
    However, existing SNN accelerators underutilize the inherent parallelism of convolutional
    layers and lack the flexibility to accommodate varying memory demands and input
    sparsity across layers. This paper presents Mega, a digital architecture for convolutional
    SNNs that addresses these limitations through three key contributions: (1) highly
    parallel acceleration of $3 \times 3$ convolutions, (2) a unified data memory
    for spikes, neuron states, and weights, and (3) efficient spike map processing
    with low-overhead spike detection. Fabricated in GlobalFoundries 22 nm FDSOI technology,
    Mega achieves an energy efficiency of 0.375 pJ/SOP, improving the state of the
    art by $4\times$.'
- title: 'ELSA: An ELastic SNN Inference Architecture for Efficient Neuromorphic Computing'
  date: 2026-05
  url: https://arxiv.org/abs/2605.20802v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Kang You
  - Chen Nie
  - Lee Jun Yan
  - Ziling Wei
  - Cheng Zou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking neural networks (SNNs) exploit event-driven and addition-only
    computation to substantially improve efficiency for intelligent computation. A
    key temporal property of SNNs, elastic inference, allows outputs to emerge progressively,
    enabling responses to salient inputs much earlier than full evaluation. However,
    existing SNN-specific accelerators cannot capitalize on this property. Layer-by-layer
    designs emit outputs only after all layers are complete, while time-step-by-time-step
    designs rely on coarse-grained, layer-wise pipelines that require synchronizing
    all spines/tokens within a layer. This barrier prevents results from being forwarded
    immediately, delaying the earliest possible response and forfeiting the benefits
    of elastic inference. To address these challenges, we propose ELSA, a near-SRAM
    dataflow architecture that realizes true elastic inference through a fine-grained
    spine/token-wise pipeline and hardware optimizations tailored to SNNs. ELSA forwards
    each spine/token immediately upon production, forming a continuous streaming pipeline
    that substantially reduces the latency to the first response. To enhance this
    lightweight execution, ELSA introduces a bundled address event representation
    protocol to lower communication traffic of network-on-chip (NoC), and leverages
    mini-batch spiking Gustavson-product to cut memory access and exploit inherent
    sparsity. Combined with mapping and scheduling optimizations, ELSA achieves efficient,
    event-driven computation without compromising accuracy. Experiments show that
    SNNs can outperform quantized artificial neural networks (QANNs) while maintaining
    on-par accuracy. For a 4-bit ResNet-50, ELSA achieves 3.4$\times$ speedup and
    13.6$\times$ higher energy efficiency over the SOTA QANN accelerator (ANT), and
    2.9$\times$ speedup and 22.1$\times$ energy efficiency gains over the SOTA SNN
    accelerator (PAICORE).
- title: 'APEX: A Dual-Sparsity Accelerator for Precise and Efficient SNN Inference'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19046v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Devgokul Bawa Venkatesh
  - Sreeram Radhakrishnan
  - Rajshekhar Rakshit
  - Gopalakrishnan Srinivasan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spiking Neural Networks (SNNs) have emerged as an energy-efficient alternative
    to Artificial Neural Networks (ANNs), leveraging sparse accumulate operations
    in the place of power-hungry multiply-and-accumulate operations. ANN-SNN conversion
    is a widely adopted approach to realize deep SNNs with accuracy comparable to
    that of ANNs. The Quantization-Clip-Floor-Shift (QCFS) activation minimizes conversion
    error, yet requires a large number of inference timesteps to match the source
    ANN accuracy on real-world vision datasets. PASCAL addresses this by proposing
    the Precise ANN-SNN Conversion Integrate-and-Fire (PASC-IF) neuron, which guarantees
    mathematical equivalence between the converted SNN and the source ANN, thereby
    achieving ANN-equivalent accuracy at significantly reduced timesteps. Despite
    this algorithmic advancement, the hardware implications of deploying the PASC-IF
    neuron remain unexplored. In this work, we present APEX, a dual-sparsity SNN inference
    accelerator that integrates the PASC-IF neuron into the LoAS hardware framework.
    The three-stage PASC-IF datapath is realized as a fully combinational circuit
    with no additional latency cost. APEX exploits dual sparsity in both input spikes
    and weights through a fully temporal-parallel dataflow, enabling efficient sparse
    computation and reduced memory traffic. Across all evaluated models, the PASC-IF
    neuron on average achieves up to 3% higher accuracy than the standard IF neuron,
    with a power overhead of only 1.3%-5.4%, an area overhead of 2.1%-2.7%, and 40%
    energy reduction for best accuracy configurations.
- title: 'Surrogates, Spikes, and Sparsity: Performance Analysis and Characterization
    of SNN Hyperparameters on Hardware'
  date: 2026-03
  url: https://arxiv.org/abs/2603.24891v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Ilkin Aliyev
  - Jesus Lopez
  - Tosiron Adegbija
  venue: ''
  code_url: ''
  project_url: https://zenodo.org/records/18893738
  abstract: 'Spiking Neural Networks (SNNs) offer inherent advantages for low-power
    inference through sparse, event-driven computation. However, the theoretical energy
    benefits of SNNs are often decoupled from real hardware performance due to the
    opaque relationship between training-time choices and inference-time sparsity.
    While prior work has focused on weight pruning and compression, the role of training
    hyperparameters -- specifically surrogate gradient functions and neuron model
    configurations -- in shaping hardware-level activation sparsity remains underexplored.
    This paper presents a workload characterization study quantifying the sensitivity
    of hardware latency to SNN hyperparameters. We decouple the impact of surrogate
    gradient functions (e.g., Fast Sigmoid, Spike Rate Escape) and neuron models (LIF,
    Lapicque) on classification accuracy and inference efficiency across three event-based
    vision datasets: DVS128-Gesture, N-MNIST, and DVS-CIFAR10. Our analysis reveals
    that standard accuracy metrics are poor predictors of hardware efficiency. While
    Fast Sigmoid achieves the highest accuracy on DVS-CIFAR10, Spike Rate Escape reduces
    inference latency by up to 12.2% on DVS128-Gesture with minimal accuracy trade-offs.
    We also demonstrate that neuron model selection is as critical as parameter tuning;
    transitioning from LIF to Lapicque neurons yields up to 28% latency reduction.
    We validate on a custom cycle-accurate FPGA-based SNN instrumentation platform,
    showing that sparsity-aware hyperparameter selection can improve accuracy by 9.1%
    and latency by over 2x compared to baselines. These findings establish a methodology
    for predicting hardware behavior from training parameters. The RTL and reproducibility
    artifacts are at https://zenodo.org/records/18893738.'
- title: 'SpikON: A Dual-Parallel and Efficient Accelerator for Online Spiking Neural
    Networks Learning'
  date: 2026-06
  url: https://arxiv.org/abs/2606.30926v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Peilin Chen
  - Xiaoxuan Yang
  venue: ''
  code_url: https://github.com/peilin-chen/SpikON
  project_url: ''
  abstract: Spiking neural networks (SNNs) have emerged as a promising paradigm for
    energy-efficient brain-inspired computing. However, existing online unsupervised
    SNN learning suffers from low training accuracy and poor scalability. Although
    current online supervised learning algorithms perform well on large-scale datasets
    and networks, the non-hardware-friendly operations hinder efficient edge deployment.
    In this work, we propose SpikON, the first algorithm-hardware co-design framework
    for efficient and scalable end-to-end online supervised SNN learning. We first
    propose the learnable threshold through time and scaled weight centralization
    through time techniques to address the inefficiency of traditional algorithms.
    Moreover, to reduce latency and energy consumption, we introduce the novel training
    dataflow and cascade computation reuse scheme for SNNs that allows concurrent
    forward-backward computation and temporal reuse across timesteps. We further design
    the dedicated SNN accelerator with a dual-parallel engine and customized SIMD-based
    SNN core for efficient end-to-end online learning. Experiments show that the SpikON
    algorithm achieves 32.2% and 35.0% reductions in training latency and energy consumption
    over the baseline, without sacrificing accuracy. Moreover, the SpikON co-design
    achieves 7.2x (11.5x) and 26.8x (15.8x) training throughput (energy efficiency)
    compared with the edge Apple M4 GPU and TPU-like accelerator, respectively. The
    code is available at https://github.com/peilin-chen/SpikON.
- title: A PVT-Resilient Subthreshold SRAM-Based In-Memory Computing Accelerator with
    In-Situ Regulation for Energy-Efficient Spiking Neural Networks
  date: 2026-05
  url: https://arxiv.org/abs/2605.00319v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Shih-Hang Kao
  - Yang-Chan Hung
  - I-Wen Wang
  - Bing-Han Liu
  - Yu-Chia Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a PVT-resilient, subthreshold SRAM-based computing-in-memory
    (CIM) macro tailored for energy-efficient spiking neural networks (SNNs). The
    macro integrates in-situ current sensors and distributed voltage regulators to
    enable robust large-scale (1024 wordlines, 1304 bitlines and 128 shared neuron
    cells) subthreshold current-mode CIM, mitigating energy overheads and process-voltage-temperature
    (PVT) sensitivity. The neuron cells adopt a programmable, memory cell-based firing
    threshold to enhance neuron robustness against PVT variations. The architecture
    uses a stride-tick batching schedule to significantly reduce buffer overhead with
    enhanced input data reuse. Exploiting the high sparsity of SNNs, the proposed
    system demonstrates significant improvements in energy efficiency and variation
    tolerance. Fabricated in 28-nm CMOS, the prototype attains 93.64\% accuracy on
    keyword spotting, delivers up to 1181.42 TOPS/W, and achieves 7.24 TOPS/mm^2,
    demonstrating a viable and efficient solution for high-performance edge SNN processing.
- title: 'Lonic: Algorithm-Hardware Co-Design for Energy-Efficient Fully Local Online
    SNN Training with INT4 Precision'
  date: 2026-08
  url: https://arxiv.org/abs/2608.12500v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Peilin Chen
  - Xiaoxuan Yang
  venue: ''
  code_url: https://github.com/peilin-chen/Lonic
  project_url: ''
  abstract: Spiking neural networks (SNNs) have recently attracted increasing attention
    as an energy-efficient learning paradigm. Existing works also propose temporally
    and fully local online SNN training algorithms to address memory and computation
    overhead. However, they do not consider whether the algorithmic advantages can
    be effectively translated into real-device efficiency. To address this challenge,
    we present Lonic, an algorithm-hardware co-design for energy-efficient and scalable
    fully local online supervised SNN learning. On the algorithm side, we implement
    an INT4 low-precision training algorithm for fully local online SNN learning while
    maintaining accuracy. On the hardware side, to leverage the benefits of the proposed
    algorithm, we introduce reconfigurable multiplier-free integer PE arrays, dual-optimization
    zero-gating strategy, temporal prefix-accelerated local learning dataflow, and
    low-precision weight movement to significantly improve training efficiency. Compared
    to Apple M4 and Nvidia V100 GPUs, Lonic achieves average energy efficiency improvements
    of 17.44x and 66.28x, respectively, along with speedups of 3.25x and 1.02x, respectively.
    Moreover, Lonic achieves 15.95x (14.64x) and 1.52x (7.28x) energy efficiency (area
    efficiency) over ASIC TPU-like and H2Learn accelerators, respectively. The code
    for Lonic is available at https://github.com/peilin-chen/Lonic.
- title: A Fault-Tolerant Spike-Time Interface for Approximate Agreement in Distributed
    Neuromorphic Systems
  date: 2026-08
  url: https://arxiv.org/abs/2608.18151v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Arman Ferdowsi
  - Maryam DehghanChenary
  - Kevin Tierney
  - Atakan Aral
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large neuromorphic systems contain many processing tiles that may replicate
    a shared control parameter such as a threshold reference. If these copies diverge,
    identical inputs may be processed under different intended settings. We study
    how tiles can reduce this disagreement when communication carries only labeled
    spike times and up to \(f\) sender labels may be Byzantine. A raw event stream
    cannot supply the one-value-per-sender input required by classical approximate
    agreement because a faulty sender can remain silent, flood a receiver, or report
    different times to different receivers. We introduce the Spike-time Interface
    for Faults, or \SIF, which combines paced epochs, sender attribution, per-label
    \FirstSpike admission, bounded timing error, and a silence sentinel. For an affine
    one-spike code, midpoint decoding attains the exact deterministic minimax error
    \(ρ=\min\{1/2,ω/L\}\), where \(ω\) is the residual timing uncertainty and \(L\)
    is the usable encoding window. \SpikeTrim applies the classical mean-subsequence-reduced
    (MSR) rule to the sender-indexed decoded values. For \(n\ge3f+1\), it guarantees
    one-step robust validity, the tight noiseless contraction factor \(f/(n-2f)\)
    under direct updates, an explicit worst-case asymptotic disagreement bound, and
    finite recovery after transient agreement-state corruption. A closed-form test
    determines whether a validated timing budget meets a target disagreement. Simulations
    illustrate the fault threshold, timing dependence, flooding resistance, and recovery.
    A controlled spiking classifier experiment shows an association between faster
    control-state alignment and lower prediction disagreement under a finite maintenance
    budget.
- title: 'The Sparsity Tax: Weight Sparsity Trade-offs in Event-Driven SIMD and SIMT
    Neuromorphic Cores'
  date: 2026-07
  url: https://arxiv.org/abs/2607.22790v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Mattias Westerink
  - Sameed Sohail
  - Berend-Jan van der Zwaag
  - Sabih Gerez
  - Amirreza Yousefzadeh
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Event-driven neuromorphic inference exploits activation sparsity by updating
    neuron state only on spikes. However, weight sparsity introduces irregular gather-style
    updates that undermine lockstep Single Instruction Multiple Data (SIMD) execution.
    We call the resulting overheads in control, metadata, and memory activity the
    sparsity tax. This paper quantifies that tax by comparing three closely related
    accelerators integrated into one neuromorphic core: (i) baseline lockstep SIMD,
    (ii) bitmap-gated Sparse-SIMD that selectively disables lanes without compressing
    weights, and (iii) a Single Instruction Multiple Threads (SIMT) style design with
    per-PE address generation and run-length coded sparse weights. Using an RTL-to-gates
    flow in GF22FDX+ and activity-driven energy estimation, we evaluate event-driven
    neural network inference across varying post-training pruning levels. Results
    show that total core area changes are insignificant because SRAM dominates area,
    while performance and energy strongly depend on how sparsity is handled: SIMD
    and Sparse-SIMD exhibit near-constant throughput, Sparse-SIMD achieves limited
    energy savings due to bitmap and dense-storage overheads, and SIMT provides the
    strongest energy scaling and substantial speedups at high sparsity, albeit with
    sublinear gains due to metadata reads, load imbalance, and sparsity-independent
    phases. The hardware code for the proposed architectures and experiments is publicly
    accessible for research purposes.'
- title: 'Memory Wall is not gone: A Critical Outlook on Memory Architecture in Digital
    Neuromorphic Computing'
  date: 2026-04
  url: https://arxiv.org/abs/2604.08774v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Amirreza Yousefzadeh
  - Sameed Sohail
  - Ana Lucia Varbanescu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The rapid advancement of neuromorphic technology aims to address the memory
    wall challenge inherent in conventional von Neumann architectures. This paper
    critically examines current digital neuromorphic processors and their strategies
    to mitigate this bottleneck. While designed to bring computation closer to memory
    through distributed architectures, our findings indicate that on-chip memory systems,
    including SRAM and emerging technologies like STT-MRAM, have become significant
    consumers of area and energy, leading to a new memory wall. Through an analysis
    of energy and area efficiency in various memory technologies, we argue that without
    a re-evaluation of memory organization, digital neuromorphic processors may struggle
    to compete effectively in edge and embedded applications. We conclude with potential
    pathways for future research to overcome the limitations of on-chip memory in
    neuromorphic systems.
- title: 'NeuroPDE+: A Scalable Neuromorphic PDE Accelerator Based on Spintronic and
    Ferroelectric Devices'
  date: 2026-03
  url: https://arxiv.org/abs/2603.28042v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Siqing Fu
  - Lizhou Wu
  - Tiejun Li
  - Xuchao Xie
  - Sheng Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The pursuit of high-performance PDE solvers rests on three fundamental
    challenges: (i) the curse of dimensionality in kinetic and financial equations,
    (ii) the poor extrapolation of purely data-driven surrogates, and (iii) the widening
    gap between algorithm design and hardware specialization. To overcome these challenges,
    we present NeuroPDE+, a scalable neuromorphic PDE solver design based on spintronic
    and ferroelectric devices for accelerating PDE solutions. NeuroPDE+ consists of
    two dedicated units: a diffusion tracking unit (DTU), which emulates random walks
    on Markov chains through activations between hardware neurons, and a scattering
    tracking unit (STU), which samples non-local jumps via a multi-level probability
    tree. System-level simulations suggest that NeuroPDE+ achieves a squared error
    below 1e-2 in steady-state heat equation and particle transport problems. Simulation
    results further indicate that the DTU achieves up to a 315x performance gain over
    previous neuromorphic processors, and that the STU achieves a 1000x speedup compared
    to a general-purpose CPU. Co-designing algorithm and hardware with intrinsic stochasticity
    and non-volatile in-memory computing, NeuroPDE+ preliminarily explores a new paradigm
    for efficient and scalable neuromorphic PDE solvers. This approach could pave
    the way for probabilistic computing architectures in large-scale scientific simulations.'
- title: Neuromorphic Computing for Low-Power Artificial Intelligence
  date: 2026-04
  url: https://arxiv.org/abs/2604.04727v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Keshava Katti
  - Pratik Chaudhari
  - Deep Jariwala
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Classical computing is beginning to encounter fundamental limits of energy
    efficiency. This presents a challenge that can no longer be solved by strategies
    such as increasing circuit density or refining standard semiconductor processes.
    The growing computational and memory demands of artificial intelligence (AI) require
    disruptive innovation in how information is represented, stored, communicated,
    and processed. By leveraging novel device modalities and compute-in-memory (CIM),
    in addition to analog dynamics and sparse communication inspired by the brain,
    neuromorphic computing offers a promising path toward improvements in the energy
    efficiency and scalability of current AI systems. But realizing this potential
    is not a matter of replacing one chip with another; rather, it requires a co-design
    effort, spanning new materials and non-volatile device structures, novel mixed-signal
    circuits and architectures, and learning algorithms tailored to the physics of
    these substrates. This article surveys the key limitations of classical complementary
    metal-oxide-semiconductor (CMOS) technology and outlines how such cross-layer
    neuromorphic approaches may overcome them.
- title: A 65-nm Privacy-Preserving Neuromorphic Encoder With 7.13-nJ Efficiency,
    2.38-Mb/mm^2 Item-Memory Density, and Federated Learning Support
  date: 2026-06
  url: https://arxiv.org/abs/2606.09460v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Boyang Cheng
  - Jianbo Liu
  - Steven Davis
  - Zephan M. Enciso
  - Likai Pei
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The increasing demand for privacy-preserving personal data analytics in
    smart assistants, wearable health monitors, and context-aware systems calls for
    hardware that is both energy-efficient and secure. This work presents a 65-nm
    privacy-preserving neuromorphic encoder that leverages transistor-level process
    variation as physically unclonable entropy for hyperdimensional computing. The
    proposed 2T-2T entropy cell enables compact, device-specific, and write-free item
    memory, allowing privacy-preserving bio-signal encoding without storing random
    basis vectors in conventional memory. The fabricated prototype achieves 7.13 nJ
    per encoding, 2.38 Mb/mm^2 item-memory density, 76.44 nJ per prediction, and 357.32
    nJ per training update. It also supports in-situ decision-making, continual learning,
    and federated learning for multi-user deployment and cold-start personalization.
    Evaluations across bio-signal datasets demonstrate 93.2% accuracy on EMG and 96.1%
    accuracy on UCI-HAR, while reducing hypervector dimensionality by 14.3x compared
    with binary hyperdimensional computing. These results demonstrate an energy-efficient
    and privacy-preserving neuromorphic hardware platform for secure edge biomedical
    intelligence.
- title: A 0.5-V Linear Neuromorphic Voltage-to-Spike Encoder Using a Bulk-Driven
    Transconductor
  date: 2026-04
  url: https://arxiv.org/abs/2604.09315v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Meysam Akbari
  - Erika Covi
  - Kea-Tiong Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This work introduces an ultralow-power voltage-to-spike encoder that achieves
    near-linear voltage-to-firing-rate conversion by pairing a linearized bulk-driven
    transconductor with a DPI-based LIF neuron. A tail-less bulk-driven differential
    pair improves large-signal linearity, while a translinear linearization network
    suppresses the dominant sinh nonlinearity and stabilizes the bias-tunable V-to-I
    gain. The resulting current feeds a DPI front-end that linearizes current-to-spike
    conversion. Fabricated in TSMC 0.18-um CMOS and operating at VDD = 0.5 V with
    2-27 nA reference current, the encoder achieves a deviation of less than 5.6 percent
    from linearity over 0.1-0.4 V input, consumes 22-180 nW, and occupies 0.0074 mm^2.
- title: 'MOSAIC: A Workload-Driven Simulation and Design-Space Exploration Framework
    for Heterogeneous NPUs'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05362v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Arghadip Das
  - Hoseok Kim
  - Soomin Lee
  - Arnab Raha
  - Deepak A Mathaikutty
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI model architectures are diversifying rapidly. Although dense matrix
    multiplication underlies today''s CNNs and transformers, emerging architectures
    (state-space models, long convolutions via the fast Fourier transform (FFT), Kolmogorov-Arnold
    networks, and spiking networks) are not multiply-accumulate (MAC) dominated; they
    spend much of their computation on vector and non-MAC primitives that homogeneous,
    MAC-centric neural processing units (NPUs) serve poorly. This has motivated heterogeneous
    NPUs (HPUs) built from non-identical tiles. Prior heterogeneous designs vary only
    one or two coarse knobs (typically MAC precision or array size) and are evaluated
    on narrow workloads; no existing framework supports fine-grained HPU design, where
    tiles differ across many architectural dimensions at once. We present MOSAIC,
    an analytical simulator and design-space-exploration (DSE) framework for HPU microarchitecture
    design. MOSAIC searches the joint space of tile-level heterogeneity: beyond array
    size and precision, it varies tile-type composition (large Big, small Little,
    and non-MAC Special-Function tiles), dataflow, sparsity mode, MAC engine type,
    and special-function units for non-MAC operators (FFT, spiking-integrate, polynomial).
    Unlike prior simulators that model a single homogeneous tile type, MOSAIC models
    non-MAC tiles with their own energy, area, and timing models and maps operators
    across a mix of tiles with a heterogeneity-aware compiler. A multi-seed pipeline
    pairing a stratified sweep with genetic-algorithm refinement returns Pareto-optimal
    designs, with cost models calibrated to a 7 nm node and cross-validated against
    NVIDIA''s Deep Learning Accelerator (NVDLA). Across a 20-workload suite, the best
    general-purpose HPU found by MOSAIC (~200 mm^2 Big+Little+Special-Function) achieves
    +46.91% mean iso-area energy savings over the best iso-area homogeneous baseline.'
- title: 'AXELRAM: Quantize Once, Never Dequantize'
  date: 2026-04
  url: https://arxiv.org/abs/2604.02638v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Yasushi Nishida
  venue: ''
  code_url: https://github.com/Axelidea/AXELRAM
  project_url: ''
  abstract: 'We propose AXELRAM, a smart SRAM macro architecture that computes attention
    scores directly from quantized KV cache indices without dequantization. The key
    enabler is a design-time fixed codebook: orthogonal-transform-based quantization
    concentrates each coordinate''s distribution to N(0,1/d), so the optimal quantizer
    depends only on dimension d and bit-width b, not on input data. The asymmetric
    path design -- transform on write, table-lookup on read with no inverse transform
    -- reduces per-query multiplications by 102.4x (a mathematical identity). Through
    multi-seed evaluation (10 seeds x 3 models), we discover that sign pattern sensitivity
    causes catastrophic PPL spikes (Delta &gt; 50) on certain models (Qwen2.5-3B),
    while others (LLaMA-3.1-8B) are fully stable. This phenomenon extends SpinQuant''s
    observation of rotation variance in weight quantization to the KV cache domain,
    where the effect is qualitatively more severe. We trace the root cause to layer-wise
    norm heterogeneity and propose a gradient-free sign pattern selection (200 candidates,
    8 calibration samples, one-time) that eliminates catastrophic spikes with zero
    additional hardware cost. All source code is available at https://github.com/Axelidea/AXELRAM.'
- title: Constant Depth Threshold Circuits For Exhaustive Epistasis Detection
  date: 2026-05
  url: https://arxiv.org/abs/2605.29719v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - André Ribeiro
  - Aleksandar Ilic
  - Leonel Sousa
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The development of large-scale neuromorphic hardware has made practical
    implementations of threshold gate-based circuits a near-term possibility. The
    complexity advantages regarding traditional computing classes, as evidenced in
    the literature, have prompted us to tackle Epistasis Detection, one of the most
    computationally complex combinatorial problems in bioinformatics. We propose specially
    designed circuits that calculate the relative frequencies of all dataset combinations
    in an efficient pipelined fashion, taking advantage of co-located memory and configurable
    parallelism, obtaining complexity gains. Overall, we obtain the runtime to be
    bounded by the number of combinations to calculate, without any additional complexity
    overhead, contrary to classical approaches, using log-linear space. To accomplish
    this, we propose a data encoding and combination generation strategy using Leaky
    Integrate and Fire (LIF) neurons, that feeds a constant depth threshold gate population
    count circuit. Accounting for typical hardware characteristics, such as limited
    fan-in and variable precisions, we obtain logarithmic depth and log-cubic linear
    connections, for the population count circuit by composing developed unbounded
    fan-in constant depth threshold gate circuits to perform population count and
    binary array sum.
- title: 'Non-Parametric Dual-Manifold Mapping via 8-Bit Bounded Transformation Matrices:
    Challenging FP-centric Hardware Paradigms in Low-Energy AI'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13328v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Lars Kopp
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Modern deep learning hardware paradigms rely heavily on computationally
    expensive floating-point arithmetic (FP32, FP16, and FP8), requiring massive thermal
    and energetic overheads to maintain gradient-based optimization. This paper introduces
    a non-parametric, training-free computational framework for dual-manifold mapping
    that operates strictly within an 8-bit signed integer boundary and leverages simple
    bitwise and accumulation logic. By mapping a Spatial Manifold (N_spatial = 8192
    neurons) and a Gabor-pooled Structural Manifold (N_structural = 4096 neurons)
    through an integer-based transformation matrix (Z-matrix), we eliminate the need
    for floating-point multipliers. Inference is achieved via cache-friendly pointer
    offsets and bitwise masks, accumulating directional sign-charges using fixed thresholds
    (theta_reject = 8.0, theta_cut = 2.0). Learning is executed through a localized,
    bounded update mechanism restricted strictly within [-127, 127], modulated by
    stochastic noise injection. Both architectures demonstrate extreme holographic
    resilience, preserving near-perfect reconstruction via a global scaling factor
    under 90% truncation sparsity and 20% random node destruction. By reducing core
    AI inference to 8-bit boundaries and boolean-like execution, this framework outlines
    a paradigm shift toward neuromorphic edge-computing, directly questioning the
    long-term necessity of dense, floating-point-centric GPU accelerators.
- title: Architectural Implications of Agentic AI Workflows
  date: 2026-08
  url: https://arxiv.org/abs/2608.04458v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Jirong Yang
  - Peizhe Liu
  - Chaojie Zhang
  - Jovan Stojkovic
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Agentic AI is emerging in datacenters, but its architectural implications
    remain unexplored. We organize agentic workflows in a taxonomy and present its
    first architectural characterization with a production study at Microsoft Azure
    and a controlled study of open-source frameworks. We show that agentic execution
    is fragmented and heterogeneous. Requests expand into a workflow of LLM inferences,
    tool invocations, and orchestration decisions that repeatedly cross the CPU-GPU
    boundary. Our taxonomy explains how this fragmentation turns into resource demand.
    As orchestration and tools run on the host, the CPU sits on the critical path.
    Execution structure sets the load over time, which stays low with sudden spikes.
    Model composition sets how evenly the workflow uses the GPUs. Diversity in tasks
    and tools widens this range even further. These characteristics expose architectural
    mismatches of conventional uniform servers. Fragmented execution strands CPU and
    GPU capacity despite bursty demand. Different software roles make homogeneous
    CPU provisioning inefficient. Finally, multiplexing many agents onto shared cores
    degrades microarchitectural locality. Guided by our findings, we derive implications
    for agentic servers and examine them through Agora, our prototype for commodity
    servers. Agora dynamically harvests idle CPU cores for co-located throughput work,
    while protecting agentic tail latency against tool spikes. It oversubscribes GPU
    memory by placing more agents on each GPU, prefetching the next agent's state
    to hide swap latency. To match the machine to the heterogeneous roles, Agora pools
    cores by role and applies affinity-aware scheduling to restore locality. It automatically
    tunes mechanisms to the workload. Agora improves utilization and server throughput
    while preserving agent tail latency. Our insights also identify key directions
    for future server architectures for agentic AI.
- title: Efficient CMOS Invertible Logic Using Stochastic Computing
  date: 2026-03
  url: https://arxiv.org/abs/2603.27030v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Sean C. Smithson
  - Naoya Onizawa
  - Brett H. Meyer
  - Warren J. Gross
  - Takahiro Hanyu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Invertible logic can operate in one of two modes: 1) a forward mode,
    in which inputs are presented and a single, correct output is produced, and 2)
    a reverse mode, in which the output is fixed and the inputs take on values consistent
    with the output. It is possible to create invertible logic using various Boltzmann
    machine configurations. Such systems have been shown to solve certain challenging
    problems quickly, such as factorization and combinatorial optimization. In this
    paper, we show that invertible logic can be implemented using simple spiking neural
    networks based on stochastic computing. We present a design methodology for invertible
    stochastic gates, which can be implemented using a small amount of CMOS hardware.
    We demonstrate that our design can not only correctly implement basic gates with
    invertible capability, but can also be extended to construct invertible stochastic
    adder and multiplier circuits. Experimental results are presented which demonstrate
    correct operation of synthesizable invertible circuitry performing both multiplication
    and factorization, along with fabricated ASIC measurement results for an invertible
    multiplier circuit.'
- title: 'Beyond Peak TOPS/W: A System-Level Perspective on Hybrid Digital, Analogue
    and Neuromorphic Computing'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03514v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Eiman Kanjo
  - Varuna De Silva
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The digital revolution, which progressively replaced analogue methods
    with digital circuits, has entered a new phase as AI expands across cloud infrastructure,
    mobile networks, wearables and physical systems, including drones and robots.
    Digital computing remains the general-purpose foundation of this expansion: it
    supports heterogeneous, on-device and decentralised AI through programmable control,
    mature software and decades of accumulated engineering infrastructure. Yet as
    energy and data-movement constraints become more significant, that same foundation
    is increasingly being extended rather than replaced by selected analogue and physical
    principles that it can host, configure and verify. Photonic, in-memory and neuromorphic
    architectures offer routes to reducing data movement and accelerating matrix-intensive
    and event-driven processing, not as alternatives to digital infrastructure but
    as specialised engines operating within it. This paper argues that hybrid digital--analogue
    computing represents a credible pathway towards more energy-efficient AI systems:
    one in which physical substrates earn an expanding role only where they deliver
    a measurable system-level advantage, under digital orchestration that manages
    integration, uncertainty and fallback. It examines the architectural principles,
    workload suitability, energy accounting, software requirements, limitations and
    open challenges associated with this transition, and argues that future progress
    should be evaluated through deployed-system metrics rather than isolated peak
    tera operations per second per watt (TOPS/W) claims.'
- title: Quantum-Driven Neuromorphic Computing for Million-Qubit-Scale Workloads
  date: 2026-06
  url: https://arxiv.org/abs/2606.12968v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Adams Ivanov
  - Samer Rahmeh
  - Erick Giovani Sperandio Nascimento
  - Daniela Herrmann
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce Apollo, a 10000 node p-qubit neuromorphic processor fabricated
    in 16 nm mixed signal CMOS and operating fully at room temperature with a typical
    analog core power envelope of about 0.5 W. Its fundamental element, the p-qubit,
    is a bistable stochastic unit whose continuous time state fluctuations are driven
    by integrated quantum entropy units that inject true quantum derived randomness.
    This enables ultrafast stochastic transitions at low energy while preserving a
    classical state representation. Apollo combines these p-qubits with a high degree
    Hyperion 256 interconnect topology, allowing efficient embedding of dense Ising
    and QUBO problems with substantially reduced minor embedding overhead compared
    with sparse annealing platforms. We show that, through the Suzuki Trotter correspondence,
    the equilibrium statistics and annealing dynamics of the p-qubit network reproduce
    key properties of transverse field quantum annealing without cryogenic cooling,
    long lived coherence, or microwave control. Beyond device level validation, Apollo
    is evaluated on a three dimensional spin glass benchmark previously used to study
    quantum advantage in superconducting annealers. Across 300 disorder realizations,
    Apollo reaches substantially lower ground state energies than reported cryogenic
    quantum annealing hardware, while remaining distinct from classical simulated
    annealing and simulated quantum annealing. A 350 nm release candidate device experimentally
    validates the core p-qubit dynamics, thermodynamic sampling correctness, and continuous
    time annealing behavior. These results establish Apollo as a room temperature,
    industrially scalable platform for quantum driven energy based optimization, probabilistic
    inference, generative modeling, and hybrid classical quantum workflows.
- title: 'MCHA: A Memory-Centric Hierarchical Architecture for Parallel-Sequential
    Computing'
  date: 2026-08
  url: https://arxiv.org/abs/2608.04443v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Daijing Shi
  - Hongxiao Zhao
  - Yihan Fu
  - Zhan Chen
  - Jiayi Li
  venue: ''
  code_url: https://github.com/carabdis/MCHA
  project_url: ''
  abstract: Emerging workloads, such as Multi-Agent Reinforcement Learning (MARL),
    large-scale neuromorphic computing, and probabilistic graphical models, intrinsically
    exhibit parallel-sequential computing patterns. While these tasks demand massive
    parallelism to achieve high throughput, they are severely bottlenecked by irregular
    data access patterns centralized to main memory. Consequently, conventional architectures
    face fundamental limitations when executing these workloads, primarily manifesting
    as global buffer saturation and memory-bound bottlenecks. To address these challenges,
    we propose the Memory-Centric Hierarchical Architecture (MCHA), a reconfigurable
    hardware solution tailored for parallel-sequential execution. MCHA leverages a
    hierarchical communication strategy that facilitates distributed, inter-core data
    routing, thereby significantly reducing the bandwidth burden on the global memory.
    Complementing the hardware, MCHA introduces a novel parallel-sequential programming
    model that utilizes event-driven conditional triggers to effectively hide data
    transmission latency within the execution pipeline. We benchmark MCHA against
    a diverse suite of parallel-sequential tasks, including MARL, motor variable control,
    and Markov random fields. Validated through our open-source, cycle-accurate simulator,
    MCHA demonstrates performance speedups ranging from 153.06$\times$ to 2456.96$\times$
    over NVIDIA A100 GPUs on MARL workloads, while maintaining robust programming
    flexibility across other application domains. Furthermore, the architecture successfully
    reduces main memory access from 96% to 5.44%. When synthesized in a 28 nm process,
    the MCHA implementation occupies an area footprint of 2.92mm$^2$ and consumes
    115.36 mW of power at 200 MHz. MCHA is open-sourced at https://github.com/carabdis/MCHA.
- title: 'Non-Monotonic Latency in Apple MPS Decoding: KV Cache Interactions and Execution
    Regimes'
  date: 2026-05
  url: https://arxiv.org/abs/2605.08913v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Willy Fitra Hendria
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Autoregressive inference is typically assumed to scale predictably with
    decoding length, with latency increasing smoothly as generated sequence length
    grows. In this work, we identify unexpected non-monotonic latency behavior in
    the Apple MPS backend, where latency changes abruptly across nearby decoding configurations
    during transformer decoding. Using multiple model families (GPT-2, BLOOM, and
    OPT), we observe latency spikes of up to 21x within specific decoding-budget intervals,
    followed by recovery at neighboring configurations. Controlled experiments show
    that these anomalies originate primarily during the decode phase rather than prefill,
    are not explained by memory pressure alone, and remain absent on CPU and NVIDIA
    CUDA backends under identical conditions. We further show that key-value (KV)
    cache interacts strongly with these pathological execution regimes: KV caching
    remains beneficial overall, but its practical speedup collapses sharply within
    anomalous configurations, while cache-disabled decoding still exhibits residual
    non-monotonic behavior. These findings suggest that autoregressive decoding on
    MPS enters discrete execution regimes that are not captured by coarse-grained
    benchmarking, highlighting the importance of hardware-aware evaluation for long-context
    inference.'
- title: 'BIDENT: Heterogeneous Operator-level Mapping for Efficient Edge Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05271v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Hoseok Kim
  - Arghadip Das
  - Soumendu Ghosh
  - Arnab Raha
  - Vijay Raghunathan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Modern edge System-on-Chips (SoCs) integrate heterogeneous processing
    units (PUs) such as CPUs, GPUs, and NPUs, yet current inference stacks map entire
    models to a single PU, leaving significant performance and energy efficiency on
    the table. This is exacerbated by emerging architectures such as state-space models
    (SSMs), Kolmogorov-Arnold networks (KANs), and multi-stage vision-language-action
    (VLA) pipelines, whose diverse operator characteristics are not uniformly suited
    to any single PU. We present BIDENT, a unified operator-level orchestration framework
    for heterogeneous edge inference that maps individual operators to the most suitable
    PU based on profiled execution characteristics. BIDENT formulates operator-to-PU
    assignment as a shortest-path problem over a weighted execution graph, enabling
    efficient and optimal scheduling under the cost model for both latency- and energy-minimization
    objectives. Unlike prior work relying on model-specific heuristics or coarse-grained
    partitioning, BIDENT is model-agnostic and jointly supports sequential execution,
    intra-model parallelism across independent operators, and multi-model concurrent
    scheduling in a single formulation. We implement BIDENT on an Intel Core Ultra
    SoC and evaluate it across 10 model families spanning CNNs, Transformers, SSMs,
    KANs, spiking networks, and multi-stage pipelines. BIDENT achieves up to 1.60x
    speedup via intra-model parallelism and a 3.42x geometric mean speedup across
    190 multi-model combinations by utilizing otherwise idle compute. Sequential heterogeneous
    mapping yields more modest gains (up to 1.58x, 1.09x geometric mean), while energy-aware
    scheduling reduces energy consumption by 48.2% on average in concurrent settings.
    These results show that operator-level orchestration, not model-level mapping,
    is the key abstraction for fully exploiting heterogeneity in next-generation edge
    AI.
- title: 'KV-RM: Regularizing KV-Cache Movement for Static-Graph LLM Serving'
  date: 2026-05
  url: https://arxiv.org/abs/2605.09735v2
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Zhiqing Zhong
  - Zhijing Ye
  - Jian Zhang
  - Weijian Zheng
  - Bolun Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Static-graph LLM decoders provide predictable launches, fixed tensor
    shapes, and low submission overhead, but online decoding exposes highly irregular
    KV-cache behavior: request lengths differ, EOS events arrive asynchronously, and
    logical histories fragment over time. Dynamic runtimes recover flexibility through
    paged KV management and step-level scheduling, while static-graph executors often
    over-reserve memory and suffer burst-time latency outliers. This paper studies
    whether much of this variability can be absorbed below a fixed decode interface.
    We present KV-RM, a runtime design that regularizes KV-cache movement beneath
    a static-graph LLM decoder. KV-RM decouples logical KV histories from physical
    storage, tracks active KV state through a block pager, and materializes each decode
    step through a single committed descriptor. A merge-staged transport path coalesces
    non-contiguous KV mappings into a small number of large transfer groups before
    a fixed-shape attention kernel consumes them. Optional bounded far-history summaries
    can be enabled under the same interface, but the core design does not depend on
    them. On a 2-GPU NVIDIA A100 node, KV-RM improves mixed-length decoding throughput
    and tail latency relative to a static-graph baseline, reduces reserved KV memory
    across workload families, and removes severe burst-time latency spikes under production-trace
    replay. These results suggest that KV-cache movement, rather than kernel shape,
    can be an effective boundary for recovering runtime flexibility in static-graph
    LLM serving.'
- title: From Bit-Position Sensitivity to Unequal Error Protection for DNN Inference
    Memory
  date: 2026-07
  url: https://arxiv.org/abs/2607.19623v1
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Muhammad Husnain Mubarik
  - Karthik Mohan Kumar
  - Pedro Antonio Pena
  - Keshavan Varadarajan
  - Kunal Tyagi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We characterize per-bit-position fault sensitivity in ML inference across
    16 workloads -- spanning transformer-based models and attention-free CNNs -- and
    across three floating-point formats. Our central empirical finding is a sharp
    bit-sensitivity transition: flipping any of the least-significant fraction bits
    up to a data-type-specific threshold, Xsafe, degrades task metrics by less than
    1% under deterministic single-bit stress tests. Sensitivity rises through the
    upper fraction bits and spikes at the exponent-mantissa boundary, where a single-bit
    flip causes catastrophic collapse. Because low-order bits are largely inconsequential
    while high-order and exponent bits are critical, uniform SECDED protection --
    which guards every bit equally at 12.5% storage overhead -- is unnecessarily conservative.
    We derive per-data-type Xsafe floors (FP16: 6, BF16: 4, FP32: 15) and workload-aware
    tiers that widen the unprotected region for resilient model classes, raising ECC
    savings to 37.5-62.5% without retraining. Text-conditioned diffusion models dictate
    the conservative floor; vision encoders, NLU models, and resilient LLMs tolerate
    wider bypass regions. These floors and tiers drive an Unequal Error Protection
    (UEP) codec with per-cacheline data-type tags and a dual-partition SRAM architecture
    for ML accelerators. Validation across 870+ fault-injection runs confirms selective
    protection holds under contiguous 2- and 3-bit upsets. The codec reduces ECC area
    by 27.8% relative to uniform SECDED; dual-voltage operation of the non-critical
    partition lowers gross BF16 read energy by about 17%, with a roughly 4% dual-partition
    macro-area overhead.'
- title: Memristor-Based Pulse Width Modulation Circuit for Power Converters with
    Programmable Frequencies
  date: 2026-07
  url: https://arxiv.org/abs/2607.29399v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Fanfu Wu
  - Xiaoyi Lei
  - Yunting Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Memristors can achieve up to a 1000-times reduction in energy consumption
    in neuromorphic and in-memory computing, but their integration into power converter
    control remains incomplete. Existing implementations either convert memristor
    outputs into digital signals for DSP-based pulse-width modulation (PWM), reintroducing
    computational overhead, or use analog PWM circuits with limited programmability.
    Since PWM generation is the final essential stage of power converter control,
    a programmable memristor-based PWM circuit is needed to fully realize the energy-efficiency
    benefits of memristive computing. This paper presents a programmable memristor-based
    PWM circuit operating at approximately two hundred kilohertz for switching power
    converters. The design combines digital-controller programmability with the low
    power consumption of analog PWM generators. Experimental validation using commercially
    available memristors achieves a programmable switching frequency from 144.7 kHz
    to 204.2 kHz. Compared with a commonly used DSP implementation in power converter
    control, the proposed design achieves a 92% reduction in power consumption.
- title: Mixed potential for nonlinear RLC circuits with memristors
  date: 2026-06
  url: https://arxiv.org/abs/2606.04638v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Mauro Di Marco
  - Mauro Forti
  - Luca Pancioni
  - Giacomo Innocenti
  - Alberto Tesi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In two seminal articles published in 1964, Brayton and Moser introduced
    the concept of a mixed potential as a fundamental theoretic tool to describe and
    analyze a class RLC of nonlinear circuits containing resistors, capacitors and
    inductors. In this paper, it is shown for the first time that a mixed potential
    can be introduced for a class RLCM of RLC circuits containing also memristors.
    This is possible provided a memristor circuit is analyzed not in the traditional
    voltage-current domain but rather in the flux-charge domain. The flux-charge analysis
    method (FCAM) plays a crucial role in the extension, in particular, a key step
    is an equivalence principle established via FCAM between an RLCM circuit in the
    flux-charge domain and a nonlinear RLC circuit in the voltage-current domain.
    Several examples are discussed where the mixed potential is explicitly found.
    These include basic circuits with memristors, such as Chua's circuit with a memristor
    and also large-scale memristor arrays with a neural architecture. This paper is
    mainly devoted to the introduction of a mixed potential for memristor circuits
    and the study of its main theoretic properties, as the possibility to write the
    circuit state equations in the flux-charge domain in an effective and compact
    form via the mixed potential. In a companion paper [1], the mixed potential is
    used to obtain in a systematic way Lyapunov-like results on convergence of RLCM
    circuits. Those results will extend existing results on convergence that do not
    cover the important case where there is the simultaneous presence of capacitors
    and inductors in a memristor circuit.
- title: Monolithically Integrated VO$_2$ Mott Oscillators for Energy-Efficient Spiking
    Neurons
  date: 2026-04
  url: https://arxiv.org/abs/2604.21487v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Fabio Bersano
  - Cyrille Masserey
  - Vanessa Conti
  - Andrea Iaconeta
  - Niccolo' Martinolli
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Brain-inspired non-Boolean computing and sensing enable energy-efficient,
    error-tolerant, and highly parallel information processing, yet their deployment
    remains limited by the lack of compact, scalable spiking hardware. Mott phase-transition
    materials offer a promising route because their abrupt insulator-to-metal transitions
    enable neuron-like thresholding and oscillations. Among them, vanadium dioxide
    (VO$_2$) is particularly attractive owing to its near-room-temperature transition,
    fast switching, and scalability. However, existing VO$_2$ neuristors rely on discrete
    components, limiting integration density. Here, we report monolithic back-end-of-the-line
    (BEOL) integration of one-transistor-one-VO$_2$-memristor (1T-1MR) spiking neurons
    on a CMOS-compatible platform. VO$_2$ nanosheets are fabricated by pulsed-laser
    deposition atop dielectrically isolated silicon-on-insulator (SOI) p-type junctionless
    field-effect transistors (JLFETs) below 430 $^\circ$C. The architecture exhibits
    gate-tunable oscillations from 40 to 410 kHz in 60 nm-thin VO$_2$ devices with
    a 6 $μ$m$^2$ active area, achieving 18 pJ per spike and 8 $μ$W at room temperature,
    with potential for sub-3 $μ$W operation. We uncover a non-monotonic dependence
    of oscillation frequency on bias current and temperature and analyze bias-dependent
    stochastic firing, revealing the nonlinear physics of integrated VO$_2$ thin-film
    memristors. Finally, we demonstrate voltage-controlled oscillator functionality
    and on-chip resistive coupling between two nano-oscillators mediated by a JLFET.
    These results establish a pathway toward dense, energy-efficient, monolithically
    integrated Mott neuromorphic hardware compatible with future computing and spiking
    sensing systems.
- title: Mixed Potential Approach to Convergence of Nonlinear RLC Circuits with Memristors
  date: 2026-06
  url: https://arxiv.org/abs/2606.05851v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Mauro Di Marco
  - Mauro Forti
  - Luca Pancioni
  - Giacomo Innocenti
  - Alberto Tesi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The paper considers a large class of nonlinear circuits, termed RLCM,
    containing all four basic circuit elements, i.e., resistors, inductors, capacitors
    and memristors. A companion paper [1] has introduced a mixed potential for RLCM
    circuits generalizing that found by Brayton and Moser for circuits without memristors.
    In this paper, systematic Lyapunov-like results on convergence of RLCM circuits
    are proved by means of the mixed potential. These hold under the basic assumption
    that an RLCM circuit has a complete set of variables in the flux-charge domain
    and they require, roughly speaking, that there is a balance, which is quantitatively
    estimated, between capacitors and inductors. The convergence results are robust
    with respect to circuit parameter variations and they include cases where the
    memristor circuits possess multiple stable equilibrium points, which is of importance
    for instance to implement content addressable memories (CAMs). The results extend
    to circuits possessing all four basic circuit elements previous results that pertain
    to circuits without memristors or memristor circuits without inductors. The main
    proofs are conducted by using the flux-charge analysis method (FCAM) to analyze
    RLCM circuits in the flux-charge domain.
- title: An Asynchronous Delta Modulator for Spike Encoding in Event-Driven Brain-Machine
    Interface
  date: 2026-04
  url: https://arxiv.org/abs/2604.08758v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Kaushik Lakshmiramanan
  - Vineeta Nair
  - Ching-Yi Lin
  - Sheng-Yu Peng
  - Sahil Shah
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents the design and implementation of an asynchronous delta
    modulator as a spike encoder for event-driven neural recording in a 65nm CMOS
    process. The proposed neuromorphic front-end converts analog signals into discrete,
    asynchronous ON and OFF spikes, effectively compressing continuous biopotentials
    into spike trains compatible with spiking neural networks (SNNs). Its asynchronous
    operation enables seamless integration with neuromorphic architectures for real-time
    decoding in closed-loop brain-machine interfaces (BMIs). Measurement results from
    silicon demonstrate an energy consumption of 60.73 nJ/spike, an F1-score of 80%
    compared to a behavioral model of the asynchronous delta modulator, and a compact
    pixel area of 73.45 um $\times$ 73.64 um.
- title: Ultra-Low-Energy Open-Circuit Fault Diagnosis for Three-Phase Inverters
  date: 2026-07
  url: https://arxiv.org/abs/2607.25037v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Xiaoyi Lei
  - Fanfu Wu
  - Yunting Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Embedded fault diagnosis in three-phase inverters must satisfy the sub-watt
    power budget of converter control hardware, but conventional convolutional neural
    network (CNN)-based methods require dense multiply-accumulate operations and impose
    substantial inference energy. This work proposes an event-driven neuromorphic
    framework for energy-efficient open-circuit (OC) fault diagnosis. A CNN trained
    on current-vector trajectory matrices is converted into a spiking neural network
    (SNN) and evaluated using the NengoLoihi framework with Loihi-based neuromorphic
    energy estimation. By exploiting the sparse structure of trajectory matrices,
    the SNN activates computation only in informative regions instead of processing
    the full feature map densely. Experiments on a three-phase inverter platform show
    that the proposed method achieves 11 microjoules per diagnosis, corresponding
    to a 382 times inference-energy reduction compared with a GPU-based CNN, while
    maintaining 100% diagnostic accuracy. Robustness is further validated under unbalanced
    loading, current amplitude step changes, and injected measurement noise.
- title: 'Fuelling fusion plasmas with pellets: Can neuromorphic control outperform
    Sigma-Delta modulation?'
  date: 2026-04
  url: https://arxiv.org/abs/2604.26476v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - L. L. T. C. Jansen
  - E. Petri
  - M. van Berkel
  - W. P. M. H. Heemels
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Nuclear fusion is a promising clean energy source in which deuterium and
    tritium fuse inside a magnetically confined plasma in a tokamak, releasing energy.
    A key challenge on the route to practical nuclear fusion is the control of the
    plasma density which has to be done through adding fuel in the form of deuterium
    and tritium to the plasma. Pellet injection, firing frozen fuel into the plasma,
    is used to accomplish this. Since the injection of a pellet causes an almost instantaneous
    increase in particle density compared to the time scales of the plasma dynamics,
    the problem is of a hybrid nature in which continuous plasma dynamics are interrupted
    by discrete bursts of particles. In this paper, we propose a formal hybrid model
    for this fuelling process and we propose a new, neuron-inspired control method
    that treats pellets much like spikes as in a brain-like system. The neuromorphic
    controller offers a lightweight solution that naturally fits the hybrid character
    of pellet fuelling. For comparison, we also develop a hybrid model of sigma-delta
    modulation, which is used in current tokamaks. For both the neuromorphic controller
    and the sigma-delta modulation we present formal analysis results for this control
    problem in nuclear fusion. We derive explicit actuator and controller parameter
    constraints, key for controller tuning, that lead to practical stability guarantees.
    Numerical simulations compare the different controller variants and validate the
    theoretical results.
- title: State-space fading memory
  date: 2026-03
  url: https://arxiv.org/abs/2603.23814v2
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Gustave Bainier
  - Antoine Chaillet
  - Rodolphe Sepulchre
  - Alessio Franci
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The fading-memory (FM) property captures the progressive loss of influence
    of past inputs on a system's current output and has originally been formalized
    by Boyd and Chua in an operator-theoretic framework. Despite its importance for
    systems approximation, reservoir computing, and recurrent neural networks, its
    connection with state-space notions of nonlinear stability, especially incremental
    ones, remains understudied. This paper introduces a state-space definition of
    FM. In state-space, FM can be interpreted as an extension of incremental input-to-output
    stability ($δ$IOS) that explicitly incorporates a memory kernel upper-bounding
    the decay of past input differences. It is also closely related to Boyd and Chua's
    FM definition, with the sole difference of requiring uniform, instead of general,
    continuity of the memory functional with respect to an input-fading norm. We demonstrate
    that incremental input-to-state stability ($δ$ISS) implies FM semi-globally for
    time-invariant systems under an equibounded input assumption. Notably, Boyd and
    Chua's approximation theorems apply to $δ$ISS state-space models. As a closing
    application, we show that, under mild assumptions, the state-space model of current-driven
    memristors possess the FM property.
- title: An Ultra-Low-Power Synthesizable Asynchronous AER Encoder for Neuromorphic
    Edge Devices
  date: 2026-04
  url: https://arxiv.org/abs/2604.05313v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Yihui Wang
  - Sheng-Yu Peng
  - Sahil Shah
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a fully synthesizable, treebased Address-Event Representation
    (AER) encoder designed for scalable neuromorphic computing systems. To achieve
    high throughput while maintaining strict compatibility with commercial EDA workflows,
    the asynchronous design employs a bundled-data protocol within a semi-decoupled
    micropipeline. The architecture replaces traditional transparent latches with
    standard edge-triggered flip-flops, enabling digital synthesis and place-and-route
    (PnR) using Cadence toolkits. A cross-coupled NAND-based random-priority arbiter
    is embedded within the encoder of each tree node to resolve event collisions efficiently.
    An 8-event AER prototype is fabricated in 65 nm CMOS technology utilizing a purely
    digital standard-cell flow. Post-fabrication silicon measurements validate the
    design, demonstrating a peak throughput of 33 MEvent/s and an average event latency
    of 50 ns, equating to a propagation delay of 17 ns/(event-bit). The design consumes
    only 435 fJ per encoded event.
- title: Dynamical principles of habituation across substrates and scales
  date: 2026-07
  url: https://arxiv.org/abs/2608.00249v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - Matthew Smart
  - Stanislav Y. Shvartsman
  - Martin Mönnigmann
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Habituation is a basic form of learning in which a system''s response
    to repeated stimulation progressively diminishes but eventually recovers when
    the stimulus is withheld. Long studied in animals, it has increasingly been observed
    in unicellular organisms and non-living devices such as electronic circuits and
    neuromorphic materials, suggesting underlying dynamical principles that recur
    across domains. This review asks what those principles are: given qualitative
    constraints imposed by habituation on a system''s response, what is the minimal
    dynamical structure that satisfies them? We formalize the classical hallmarks
    of habituation as behavioral constraints on input--output behavior, show that
    linear time-invariant systems are structurally incompatible with these constraints,
    and construct nonlinear motifs---linear fading-memory dynamics composed with static
    nonlinearities---that exhibit the hallmarks across diverse settings. We relate
    these motifs to models of specific biological systems and to physical and algorithmic
    realizations, from analog circuits to transient computation in machine learning.'
- title: Efficient and robust control with spikes that constrain free energy
  date: 2026-03
  url: https://arxiv.org/abs/2603.09729v1
  category: neuromorphic-hardware
  subcategory: systems
  authors:
  - André Urbano
  - Pablo Lanillos
  - Sander Keemink
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Animal brains exhibit remarkable efficiency in perception and action,
    while being robust to both external and internal perturbations. The means by which
    brains accomplish this remains, for now, poorly understood, hindering our understanding
    of animal and human cognition, as well as our own implementation of efficient
    algorithms for control of dynamical systems.A potential candidate for a robust
    mechanism of state estimation and action computation is the free energy principle,
    but existing implementations of this principle have largely relied on conventional,
    biologically implausible approaches without spikes. We propose a novel, efficient,
    and robust spiking control framework with realistic biological characteristics.
    The resulting networks function as free energy constrainers, in which neurons
    only fire if they reduce the free energy of their internal representation. The
    networks offer efficient operation through highly sparse activity while matching
    performance with other similar spiking frameworks, and have high resilience against
    both external (e.g. sensory noise or collisions) and internal perturbations (e.g.
    synaptic noise and delays or neuron silencing) that such a network would be faced
    with when deployed by either an organism or an engineer. Overall, our work provides
    a novel mathematical account for spiking control through constraining free energy,
    providing both better insight into how brain networks might leverage their spiking
    substrate and a new route for implementing efficient control algorithms in neuromorphic
    hardware.
