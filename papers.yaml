- title: 'Research on Spiking Neural Networks: Frequency-Time Dual Coding SNN'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309727
  category: brain-inspired
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: As the third generation of artificial neural networks, Spiking Neural
    Networks (SNNs) have attracted widespread attention in brain-inspired computing
    and neuromorphic hardware due to their high biological plausibility and low-power
    characteristics. However, traditional SNNs mainly rely on a single coding mechanism
    (such as rate coding or temporal coding), which limits their information expression
    capability and computational efficiency in complex tasks. Rate coding lacks the
    capture of precise time-domain information, while temporal coding is sensitive
    to noise and difficult to maintain high-throughput information transmission over
    long periods. To address this bottleneck, this paper comprehensively investigates
    a novel "Frequency-Time Dual Coding Spiking Neural Network (Freq-Time Dual Coding
    SNN)". This architecture allows each neuron to utilize both the spiking frequency
    and the precise time difference between adjacent spikes to represent multidimensional
    features when generating spike trains, thereby constructing an efficient two-dimensional
    information coding space. This paper first expounds the theoretical foundations
    and biological evidence of the dual-coding mechanism, and then derives an improved
    dual-state leaky integrate-and-fire (DS-LIF) neuron dynamic model that supports
    dual coding. Based on this model, a spatio-temporal synergistic synaptic plasticity
    learning rule, namely the frequency-time co-dependent STDP (FTC-STDP) algorithm,
    is designed in detail. Without relying on experimental data stacking, this paper
    demonstrates the theoretical advantages of the proposed model in terms of information
    capacity, noise tolerance, and convergence speed through rigorous mathematical
    logic and structural theoretical derivations. This work provides solid theoretical
    support for the next generation of high-performance brain-inspired computing architectures.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Research on Semantic Drift Spiking Neural Networks (SD-SNN)
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309833
  category: brain-inspired
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: Spiking Neural Networks (SNNs) have emerged as a prominent paradigm for
    brain-inspired computing due to their temporal dynamics and low-power characteristics.
    However, conventional SNN architectures often treat spikes as static spatial-temporal
    binary signals, missing the continuous, fluid evolution of representation from
    concrete features to abstract concepts observed in biological brains. To bridge
    this gap, this paper proposes a novel framework named the Semantic Drift Spiking
    Neural Network (SD-SNN). The core philosophy of SD-SNN is that spike trains not
    only transmit raw information but also embody semantic coordinates within a continuous
    latent manifold that dynamically shifts across successive layers, thereby inherently
    achieving "layer-wise abstraction." Specifically, we formalize the mathematical
    framework of the semantic space and introduce an explicit inter-layer Semantic
    Drift Operator. This operator computes a predictive "semantic guiding flow" based
    on the current layer's state to modulate the membrane potential dynamics of the
    subsequent layer. Correspondingly, a Drift-Driven Leaky Integrate-and-Fire (DD-LIF)
    neuron model is designed to integrate this semantic current. To train the network
    effectively, we develop a hybrid learning algorithm that combines Spatio-Temporal
    Backpropagation with a newly formulated Semantic Consistency Loss, which guides
    the smooth compression of redundant information while preserving task-relevant
    features. Theoretical analyses based on Lyapunov stability and Information Bottleneck
    theory rigorously prove that the proposed model possesses excellent asymptotic
    stability, a clear layer-wise abstraction boundary, and high robustness against
    temporal jitters. This research provides a fresh dynamical perspective for building
    deep neuromorphic models with enhanced biological plausibility and flexible generalization
    capabilities.
