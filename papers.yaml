- title: 'Research on Spike Phase Transition Network (SPTN): A Classification Boundary
    Enhancement Method Based on the "Synchronization-Asynchrony-Chaos" Phase Transition
    of Neuron Populations'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309808
  category: brain-inspired
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: As the third generation of artificial neural networks, Spiking Neural
    Networks (SNNs) have attracted significant attention in the field of neuromorphic
    computing due to their biological plausibility and low power consumption. However,
    conventional SNNs often face bottlenecks such as insufficient feature space mapping
    capabilities and blurred classification boundaries when dealing with non-linear
    classification tasks of complex, high-dimensional data. This paper proposes a
    novel spiking neural network architecture termed the Spike Phase Transition Network
    (SPTN). The network ingeniously leverages the non-linear phase transition dynamics
    exhibited by neuron populations under varying input intensities—evolving from
    synchronization to asynchrony, and ultimately to spatiotemporal chaos—to achieve
    adaptive distortion of the input feature space and a remarkable enhancement of
    classification boundaries. By establishing a network topology model and charge
    evolution equations, this study deeply explores the mechanism of how phase transition
    dynamics contribute to information encoding and boundary separation. Furthermore,
    the effectiveness of the network in boundary enhancement and feature manifold
    separation is theoretically verified. This work provides a new theoretical cornerstone
    for building a highly energy-efficient and robust brain-inspired intelligent computing
    system.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'HAPTI-Child: a finger-tracking video and keypoint dataset of haptic picture
    exploration and identification in congenitally blind and visually impaired children'
  date: 2026-04
  url: https://doi.org/10.3389/fpsyg.2026.1759540
  category: brain-inspired
  subcategory: theory
  authors:
  - Dana Wymark
  - Raymond Roy
  - Mysa Myers
  abstract: 'The study of haptic exploration in childhood blindness offers a clear
    window into how the developing brain self-organizes when vision provides little
    or no input on learning and recognition. Early sensory deprivation is associated
    with cross-modal plasticity, with occipital regions recruited during auditory
    and tactile processing (Lewis et al., 2010;Pang et al., 2024;Rabinowitch & Bai,
    2016); such reorganization furnishes a natural testbed for self-organization in
    development, including modular coordination, local-to-global organization, resilience,
    growth, and adaptive plasticity (Dresp-Langley, 2020). The HAPTI-Child dataset
    contributes to this agenda by capturing naturalistic raised-line picture identification
    in congenitally totally blind (CTB) and severely visually impaired (SVI) children
    without corrective feedback, allowing exploratory strategies to unfold under conditions
    that closely resemble everyday tactile learning.Work in tactile graphics and haptic
    perception has long emphasized that blind and SVI individuals actively construct
    tactile representations through exploration rather than merely registering input
    passively. Mazella, Picard and colleagues developed a multi-component haptic test
    battery for children and adolescents with and without visual impairment (Mazella
    et al., 2014), comprising tasks probing shape scanning, discrimination, spatial
    understanding, tactile short-term memory, and picture comprehension. In a preliminary
    study with thirteen visually impaired and thirteen blindfolded sighted children
    aged 9-10 years, the two groups achieved comparable overall scores; however, visually
    impaired children responded more quickly and obtained higher accuracy in shape
    and texture discrimination and in raised-line picture comprehension (Mazella et
    al., 2014). Converging evidence from tactile picture processing similarly indicates
    some performance advantage for congenitally blind children relative to blindfolded
    sighted peers (D''Angiulli, Kennedy, & Heller, 1998), while also demonstrating
    how practice in guided, systematic exploration mediates picture identification
    and can partially remediate performance in the blindfolded sighted group (D''Angiulli
    & Kennedy, 2000).Developmental trajectories reinforce the idea that tactile picture
    identification reflects maturing self-organizing representational capacities shaped
    by practice, memory, and strategy choice rather than a simple consequence of sensory
    status. In a developmental study with sighted participants aged 5-25 years, blindfolded
    children aged 5-7 correctly identified about one third of raised-line drawings,
    whereas accuracy increased to 69 % in adolescents and 86 % in adults, paralleling
    improvements in haptic short-term memory (Picard, Albaret, & Mazella, 2013). Reviews
    of tactile picture recognition highlight that identification rates span 9 to 85
    % across studies and depend strongly on age, visual status, haptic practice, availability
    of semantic information, and the exploratory procedures deployed (Vinter et al.,
    2020); category cueing prior to exploration can facilitate hypothesis generation,
    yet visually impaired children often maintain an advantage by combining cueing
    with more efficient haptic strategies (Mazella et al., 2014). Related results
    from three-dimensional exploration point toward systematic differences in the
    dynamics of haptic search, with early blindness associated with distinctive patterns
    of contact and strategy switching even when recognition accuracy converges across
    groups (Leo et al., 2022); reports of superior navigation with tactile maps in
    congenitally blind adults further underscore functional plasticity that emerges
    through practice and experience (Boumenir et al., 2014).Across this literature,
    the most consistent pattern of findings is that haptic picture identification
    is demanding, developmentally graded, and sensitive to both task constraints and
    the exploratory procedures adopted (Picard & Lebaz, 2012). At the same time, empirical
    patterns remain heterogeneous, with performance advantages sometimes favoring
    visually impaired participants, sometimes blindfolded sighted participants, and
    sometimes neither group, reflecting differences in stimulus complexity, representational
    familiarity, and prior haptic experience (Vinter et al., 2020) and working memory/imagery
    ability (Holtby & D''Angiulli, 2012). Such variability highlights a methodological
    limitation in much of the existing evidence base, namely, an emphasis on holistic
    outcomes such as identification accuracy at conclusion of task without an equally
    detailed record of the hand and finger dynamics through which recognition unfolds;
    resolving that limitation requires resources that preserve the temporal structure
    of exploration itself.Unsupervised learning frameworks such as Self-Organizing
    Maps (SOM) and Adaptive Resonance Theory (ART) posit that local interactions can
    yield stable global representations, yet key empirical gaps persist in the behavioral
    record needed to evaluate such accounts. Many benchmarks remain abstract or heavily
    preprocessed, obscuring the embodied, sequential nature of real-time exploration
    (Kriegeskorte & Douglas, 2018); sequential strategy formation remains under-constrained
    because available resources rarely include time-resolved motor trajectories capturing
    how fingertips, digits, and hands coordinate over hundreds to thousands of milliseconds
    (Mueller et al., 2019). Moreover, while neural self-organization, as stipulated
    in ART, addresses the stability-plasticity problem, few developmental datasets
    support quantitative tests of how new categories of representations are integrated
    without catastrophic interference under child-level learning conditions (Grossberg,
    2013); these limitations restrict attempts to connect theoretical predictions
    about modular coordination and adaptive flexibility to perceptual behavior when
    vision is absent.To offer tools that might help addressing these research gaps,
    we built HAPTI-Child. Originated in the context of a previous study (D ''Angiulli,
    Wymark, Temi, Bahrami, & Telfer, 2024), the present resource was compiled retrospectively
    to include trial-segmented videos, labeled finger and hand keypoints produced
    with DeepLabCut, trained pose-estimation models, Colab analysis notebooks, and
    derived per-frame kinematic measures across thousands of frames for children recorded
    during raised-line picture identification. The time-resolved trajectories support
    the investigation of modular coordination within and across hands and enable analyses
    of how local exploratory movements aggregate into global recognition strategies
    over time, while the combination of naturalistic behavior and shared task constraints
    offers a tractable benchmark for supporting the development of unsupervised models.
    Researchers can explore how selforganization modeled by SOM or ART algorithms
    may capture local-to-global transitions, agedependent adaptations, and strategy
    stabilization as new exemplars accumulate, exploring possible types and levels
    of correspondence between computational claims and measurable motor structure.The
    dataset also speaks to open questions in cross-modal plasticity, where behavioral
    signatures of exploration may provide an interpretable bridge between sensory
    reorganization and functional outcomes. Such questions align with broader perspectives
    on multisensory integration and embodied interaction in technologically mediated
    contexts (Cornelio et al., 2021). If exploration strategies in blind children
    are intertwined with recruitment of brain visual areas (e.g., occipital cortices),
    as suggested by stimulus-responsive and task-dependent activations in early blindness,
    then linking detailed movement signatures to performance becomes a critical step
    toward connecting behavior with reorganization in visual cortex (Lewis et al.,
    2010;Pang et al., 2024;der Heijden et al., 2019). In parallel, our dataset can
    be combined with companion work on verbal mediation in blindness to examine how
    speech may scaffold or reshape exploratory strategy formation in development (see
    D''Angiulli et al., 2024); although HAPTI-Child does not include direct neuropsychological
    assessments of executive control, the finegrained hand-and finger-tracking data
    provide behavioural proxies for attentional allocation (e.g., dwell-time on diagnostic
    features or the frequency of strategy switches), which can be paired with standardized
    executive function measures in future studies to clarify how attentional control
    shapes haptic exploration.Beyond theory testing, HAPTI-Child has translational
    implications, since fine-grained descriptions of successful versus inefficient
    strategies can inform haptic training protocols and sensory-substitution design
    while also offering structure for bio-inspired AI systems that learn robust concepts
    from touch under minimal supervision. This paper introduces the dataset, details
    acquisition and processing methods, reports technical validation and usage notes,
    and outlines applications for modeling and developmental research, positioning
    HAPTI-Child as a resource for advancing unsupervised learning theories with developmentally
    grounded evidence and for clarifying how adaptive organization may support perception
    without vision.Sixteen children participated: nine CTB; no residual vision and
    seven SVI. To standardize sensory input across groups, SVI participants were blindfolded
    during the tasks. Blindfolding ensured that both groups relied exclusively on
    haptic information when exploring raised-line drawings, enabling meaningful comparisons
    of exploration strategies. In addition, both blind and blindfolded sighted participants
    yield generally low accuracy rates at naming raw raised-line drawings. Using a
    blindfolded group helps researchers identify the "floor-level", when a task is
    inherently too difficult when relying on tactile and haptic inputs alone, rather
    than a specific deficit in the blind group (see Heller, 2002). However, removing
    residual even minimal visual cues may have disadvantaged the SVI participants
    relative to their everyday exploratory habits; this limitation should be considered
    when interpreting group differences or should be included as variable (i.e., covariate)
    in the analysis and research questions.Inclusion criteria were no additional neurological
    or psychiatric diagnoses and ability to assent. Demographic and clinical characteristics
    recorded for each participant included sex, age (reported in "years:months"),
    visual classification (congenitally totally blind or low vision with specified
    visual acuity), and underlying cause of visual impairment. All demographic data
    are available in the following zenodo repository https://doi.org/10.5281/zenodo.18930624.
    The two groups were matched in terms of SES, age and sex, and Braille proficiency
    distributions (for further details, see Footnote in Demographic information Tables
    at https://doi.org/10.5281/zenodo.18930624), they were also within the same school
    mixed-grade cluster according to the Montessori system (for a complete description
    of the samples and their matching please refer to D'' Angiulli et al., 2024).
    Recruiting CTB and SVI children is challenging, and the present sample reflects
    both the rarity of the samples and the resource-intensive nature of acquiring
    and annotating high-resolution haptic videos. As such, the dataset should not
    be viewed as a statistical sample for population-level inference. Instead, it
    provides richly annotated examples for benchmarking unsupervised sequence-learning
    and strategy-analysis methods. Nevertheless, users should exercise caution when
    drawing group-level conclusions and treat the data primarily as a platform for
    hypothesis generation and model development. We also stress that the use of this
    database should be supplemented with other additional and external experimental
    observations and sources of information.The protocol was approved by the ethics
    research boards of the Italian National Institute for the Blind (Unione Italiana
    Ciechi), the Universita'' degli Studi di Padova (University of Padua) and Carleton
    University. All procedures adhered to ethical principles for research with minors
    as set by Canada''s Tri-Council Policy Statement: Ethical Conduct for Research
    Involving Humans. Written parental consent and child assent were a requirement
    for participation and included permissions for publishing and sharing de-identified
    derivatives. Conditions for raw-video access are specified in §3 Data Records
    and §6 Conclusion & Future Directions.2.2.1 Tactile stimuli. The raised-line drawings
    were made by tracing ink pictures with a stylus producing contact relief traces
    (~ 0.5 mm high) on transparent Mylar plastic sheets that were 21.6 cm X 27.9 cm
    in size; the objects depicted subtended an imaginary rectangular area of up to
    maximum 16.5 cm and 14.5 cm in the Y and X dimensions, respectively. Preliminary
    analysis showed that neither the single dimensions nor areas of these stimuli
    were significantly correlated with identification accuracy or response latency.
    Response latency was defined as the elapsed time between the participant''s first
    hand contact with the stimulus and the vocalization of their final verbal identification
    response (or a no-label response), such that for each trial □□: □□ □□ = □□ final-response
    □□ -□□ first-contact □□ This measure therefore includes the time required for
    tactile exploration as well as decision, response selection and verbalization
    processes. A thumbnail sheet with the ID key accompanies the dataset for consistent
    referencing.2.2.2 Recording setup. Data collection was conducted using a Toshiba
    SK-F200 VHS camcorder. The camera was set up on a fixed overhead mount which permitted
    to record the work surface and arms and hands under uniform lighting; audio captured
    open-ended responses and experimenter prompts. Camera, lens, codec, and microphone
    specifications are recorded in per-session metadata (full make/model fields documented
    in the data dictionary).The experiment consisted of five sequential phases administered
    individually to each participant.To ensure comprehension of the task and comfort
