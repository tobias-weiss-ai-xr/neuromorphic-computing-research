- title: 'NeuVNav: Neuro-Evolving Visual Navigation for Indoor Lighter-Than-Air UAVs'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20218266
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Csaba Singer
  abstract: 'Autonomous indoor navigation of lighter-than-air (LTA) unmanned aerial
    vehicles presents a distinct set of challenges absent from rotary-wing platforms:
    the low mass-to-volume ratio produces an inherent timing gap between visual boundary
    detection and effective heading change that renders reactive threshold controllers
    insufficient in isolation. This paper presents NeuVNav, an AI navigation system
    combining a two-loop Spiking Neural Network (SNN) reactive controller with an
    online Neuro-Evolution (NE) parameter optimizer for GPS-denied, indoor boundary
    patrol on the h-aero® semirigid LTA platform. The SNN encodes actuation timing
    as five evolvable thresholds operating on camera and ultrasonic sensor input.
    The NE optimizer applies an Evolution Strategy with a 9-component physics-aware
    fitness function to converge controller parameters without hardware interaction.
    Simulation results demonstrate consistent fitness convergence within 20 generations,
    and the implementation achieves full test coverage across the unit tests executable
    on standard hardware without aerial testbed access. The system is released as
    an open-source Python library under the ENFIELD programme (EU grant 101120657),
    fulfilling the Open Science requirement of the grant and providing a reproducible
    baseline for SNN-based LTA navigation research.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: A review of neuroscience-inspired deep learning and genetic algorithms
  date: 2026-03
  url: https://doi.org/10.1186/s44398-025-00019-0
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Arafat Ali Mondal
  - Ankush Kumar
  - Nabarun Bhattacharyya
  abstract: Abstract The rapid progress in artificial intelligence (AI) has been greatly
    influenced by biological principles, which have inspired techniques such as Deep
    Learning (DL) and Genetic Algorithms (GAs). Neuroscience-inspired learning focuses
    not merely on modeling biological neural systems but also on leveraging their
    mechanisms, such as hierarchical organization, dynamic adaptation, and energy-efficient
    processing, to improve computational intelligence. The DL model explores the hierarchical
    and layered architecture of the brain, enabling advances in perception, data analysis,
    decision-making, and pattern recognition. By contrast, the GAs simulate natural
    selection, crossover, and mutation to solve complex optimization problems and
    more, perform global searches across multi-dimensional search spaces. As a result,
    this review integrates DL and GAs to develop advanced intelligent computing models
    that emulate biological flexibility and complexity. We highlight the recent developments
    in bio-inspired DL and GAs, emphasizing biological plausibility, adaptability,
    and efficiency. The emerging techniques such as Neuroscience-Inspired Deep Learning
    (NIDL), Neuro-Inspired GAs, Hybrid Neuroevolutionary Workflows (GAs + DL), and
    Population-Based Reinforcement Learning (PBRL) are discussed. Traditional mechanisms
    such as Backpropagation, Attention Mechanisms, and Spike-Timing-Dependent Plasticity
    (STDP) are explored in addition to ideas such as lifelong and adaptive learning,
    metaplasticity, and memory consolidation, which provide stability and flexibility
    in dynamic environments. Furthermore, rather than directly comparing Spiking Neural
    Networks (SNNs) and Convolutional Neural Networks (CNNs), this review contrasts
    their computational and biological design philosophies. SNNs employ temporal spiking
    dynamics for event-driven, energy-efficient computation, whereas CNNs perform
    hierarchical spatial feature extraction characteristic of modern DL. We also explore
    neuroevolutionary methods, such as NeuroEvolution of Augmenting Topologies (NEAT)
    and Genetic CNNs. Neuroscience-motivated learning extends beyond biological modelling
    to harness heterogeneous neural principles across domains such as robotics, medicine,
    and signal processing. This survey delineates NIDL-GA synergy, their limits, and
    areas of future work in neuromorphic computing, explainable AI, and biologically
    inspired lifelong learning. Collectively, these paradigms hold the promise of
    next-generation AI systems to be robust, interpretable, and adaptable in real
    time.
  venue: BMC Artificial Intelligence
- title: Dot Product Engine Based Neuromorphic Hardware For Continuous-Time Biomedical
    Signal Classification
  date: 2026-06
  url: https://digitalcommons.calpoly.edu/theses/3274
  category: spiking-neural-networks
  subcategory: method
  authors:
  - Sanjeev Srinivasan
  abstract: Accurate diagnosis of pathological conditions from biomedical signals,
    such as electrocardiograms (ECGs) is often performed offline, making it time-consuming,
    costly, and inefficient, especially when abnormal patterns are rare and long-term
    monitoring generates large amounts of data. To address this, this work proposes
    a compact, scalable, and programmable neuromorphic system designed for real-time
    preliminary arrhythmia detection and classification using ECG signals, that can
    be extended to other biomedical signals. The proposed design processes ECG signals
    using a delta modulation-based spike encoder, followed by classification with
    a dot-product engine (DPE) based spiking neural network (SNN) processor and winner-take-all
    (WTA) circuit. The architecture supports online learning via spike-timing-dependent-plasticity
    (STDP) and includes a scan-chain programming circuit that allows processor parameters
    to be reconfigured during runtime. The proposed system has been implemented on
    four FPGA platforms, demonstrating promising results in terms of resource utilization,
    power consumption, and operating frequency. The optimized design uses only 2.63%
    of available LUTs and 1.04% of available FFs and features a maximum operating
    frequency of 192.8 MHz with 20 mW of dynamic power consumption at 100 MHz, which
    linearly scales, on the low cost, entry level Basys-3 board. This design was subsequently
    implemented in a 130nm CMOS process, taking up a total die area of 95,792.5 µm2
    and dynamic power consumption as low as 26.2 µW for a 1MHz clock. Finally, a software
    model was built utilizing snnTorch to train a spiking neural network with surrogate
    gradient backpropagation and evaluation on a hardware-faithful simulation of the
    proposed system. Tested on the MIT-BIH Arrhythmia Database, the system achieves
    classification across the four main AAMI heartbeat classes, with significant potential
    for improving multi-class arrhythmia sensitivity and detection. These results,
    alongside the compact hardware footprint, position this initial design – an efficient,
    scalable solution for real-time arrhythmia detection, adaptable to diverse patient
    profiles and other biomedical signals – as a foundation for future enhancements
    including increasing synapse weight bit-widths and accumulator precision, scaling
    the DPE array size, cascading multiple arrays to enable multi-layer feature extraction,
    and implementing per-neuron programmable thresholds while maintaining ultra-low-power
    operation.
  venue: DigitalCommons - CalPoly (California State Polytechnic University)
- title: 'SOMA: A Single-Material Organic Multivibrator Adaptive Neuron for Fully
    Integrated PEDOT:PSS Neuromorphic Systems'
  date: 2026-03
  url: https://arxiv.org/abs/2603.20954
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Nikita Prudnikov
  - Yeohoon Yoon
  - Hans Kleemann
  abstract: Neuromorphic electronics and spiking neural networks (SNNs) offer energy-efficient
    data processing, essential for real-time and edge-computing applications. In particular,
    interfacing and processing biological signals require devices that combine electronic
    performance with ionic sensitivity, which are capabilities uniquely provided by
    organic electrochemical transistors (OECTs). However, realizing a simple, fully
    integrated OECT-based neuron with rich dynamics and adaptability remains challenging.
    Most reported implementations rely on current-driven operation, which complicates
    large-scale integration and neuron-neuron coupling due to the need for precise
    matching of operating currents and bias voltages. Here we present a voltage-driven
    neuron circuit based on a multivibrator oscillator architecture, entirely fabricated
    from poly(3,4-ethylenedioxythiophene):polystyrene sulfonate (PEDOT:PSS). The neuron
    exhibits tunable adaptability through an additional control input, enabling switching
    between burst latency and length encoding modes. We further demonstrate a hardware-implemented
    two-neuron unit consisting of an inhibitory and a readout neuron, where readout
    activity is suppressed depending on the relative timing of the inhibitory input.
    Finally, we demonstrate that the fabrication process is compatible with polymer
    dendrite growth, enabling on-chip integration of synaptic elements on the same
    substrate. Owing to its structural simplicity and compatibility with a single,
    available material, this approach offers a scalable and accessible route toward
    integrated OECT-based SNNs.
  venue: arXiv (Cornell University)
- title: ( <i>Invited</i> ) Cryogenic Electrochemical Ion Transport and Switching
    Dynamics In Solid-State Electronic Synapses
  date: 2026-07
  url: https://doi.org/10.1149/ma2026-01341597mtgabs
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - C P Wang
  - Hsin-Te Yu
  abstract: The rapid advancement of artificial intelligence (AI) has driven significant
    progress in data processing, pattern recognition, and autonomous decision-making
    across various domains, including healthcare, smart manufacturing, and scientific
    computing. These advances increasingly rely on large-scale artificial neural networks,
    whose expanding model sizes demand substantial computational and memory resources.
    However, conventional von Neumann architectures, which physically separate processing
    and memory, suffer from intrinsic limitations including severe data-transfer bottlenecks.
    As a result, global data-center electricity consumption is projected to reach
    ~945 TWh by 2030, underscoring the urgent need for energy-efficient computing
    paradigms. Although software-level approaches such as model compression, quantization,
    and pruning can partially reduce computational cost, they cannot fundamentally
    overcome the hardware inefficiencies of von Neumann systems. This challenge has
    motivated the development of neuromorphic computing based on non–von Neumann architectures,
    which co-locate memory and computation to emulate brain-inspired information processing.
    In particular, cryogenic neuromorphic computing has emerged as a promising direction,
    especially when integrated with quantum computing (QC). Cryogenic operation offers
    reduced thermal noise and power dissipation, enabling high performance and ultra-low-power
    computation. However, such systems require electronic synapses that can be placed
    close to quantum processors, reliably store quantum-generated information, and
    operate efficiently at cryogenic temperatures. Spiking neural networks (SNNs)
    offer a biologically inspired framework well-suited for this purpose. In SNNs,
    neurons integrate inputs and emit spikes upon reaching a threshold, while synapses
    adapt their weights through spike-timing-dependent plasticity (STDP). This event-driven,
    time-domain encoding enables highly energy-efficient computation and naturally
    unifies memory and processing. In contrast, conventional memories such as static
    random access memory (SRAM), dynamic random access memory (DRAM), and NOR/NAND
    Flash are optimized for digital storage rather than analog synaptic weight modulation.
    Their discrete states, high power consumption, limited endurance, and strict logic-memory
    separation significantly hinder their suitability for neuromorphic systems, particularly
    under cryogenic operation. Emerging memory technologies capable of continuous
    conductance modulation and low-energy operation are therefore essential for electronic
    synapses. Among them, resistive RAM (RRAM), electrochemical RAM (ECRAM), and conductive-bridge
    RAM (CBRAM) have garnered significant attention due to their simple structures,
    scalability, and low switching energy. ECRAM relies on ionic drift mechanisms
    analogous to biological synapses, while CBRAM modulates resistance via the formation
    and rupture of metallic filaments, enabling analog conductance control. In this
    work, we investigate cryogenic electronic synapses based on LiCoO 2 (LCO) and
    Ag/WTe 2 CBRAM structures over a wide temperature range from cryogenic to room
    temperature. For the LCO synapse, an Al-rich LiCoO 2 (LACO) Li-ion nano-reservoir
    stabilizes Li ions, reduces interfacial electric fields, and suppresses leakage
    current. At cryogenic temperatures, suppressed ion and electron diffusion enhances
    field-driven processes, resulting in significantly improved synaptic performance,
    including an expanded memory window (~1.6 to ~423), improved linearity, and enhanced
    STDP. We further demonstrate an Ag/WTe 2 CBRAM synaptic device featuring forming-free
    switching, self-compliance, and an ultra-low operating voltage of ~0.2 V. The
    WTe 2 matrix enables stable Ag filament formation, supporting key synaptic functions
    such as short-term plasticity, long-term potentiation, and STDP. I-V measurements
    from 4 K to 300 K reveal suppressed memory behavior below 10 K due to quenched
    thermally activated Ag + migration. In contrast, memory windows and resistance
    oscillations emerge at 20–30 K, which are likely attributed to electron hopping
    during the early stages of filament nucleation. These results decouple thermal
    and field-driven effects, providing critical guidance for designing reliable cryogenic
    electronic synapses for future neuromorphic-quantum computing systems.
  venue: ECS Meeting Abstracts
- title: 'BrainIAc: A Multi-Scale Adaptive Dynamical Systems Framework for Computational
    Neuroscience (v2.2)'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20734614
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Théo Hénock André Vallois
  abstract: 'Multiscale Spiking Neural Learning System with Biological Control Substrate
    Overview This project presents a unified computational framework for learning
    in spiking neural networks (SNNs) coupled with a hierarchical biological control
    substrate. The system integrates: event-driven neural dynamics (BrainSystem) local
    and global synaptic learning rules optimizer-based parameter updates a molecular-to-organismal
    control layer (CellSystem + Organism) formally specified architectural constraints
    enforced via CI-gated invariants The framework is designed to study how learning
    emerges from structured operator interactions across multiple biological and temporal
    scales, rather than from a single monolithic optimization process. Core Design
    Principle The system is defined by a strict separation: Neural dynamics generate
    activity; learning rules observe activity and modify parameters; biological layers
    modulate the learning and dynamical regimes through bounded control signals. This
    separation enforces a layered architecture where: execution is causal and kernel-native
    learning is state-dependent but non-intrusive to execution biological modulation
    acts as a higher-order constraint system System Architecture The framework is
    composed of four coupled subsystems: 1. Neural Dynamics Layer (BrainSystem) Defines
    the fast-timescale evolution of neuronal states: spiking neuron models (LIF, Izhikevich,
    Hodgkin–Huxley) synaptic integration and propagation deterministic timestep execution
    no learning logic embedded in kernel This layer defines a contractive dynamical
    system over neural state space. 2. Learning Operator Layer Defines synaptic parameter
    evolution via structured operators: Hebbian learning (correlation-driven updates)
    Oja rule (stabilized Hebbian normalization) STDP (temporal spike-timing dependence)
    EProp (eligibility trace-based online credit assignment) BPTT (trajectory-based
    global optimization) All learning rules are implemented through a unified interface:
    initialization trace update gradient computation parameter update state validation
    reset and teardown Learning rules differ in locality, temporal scope, and state
    requirements, but share a common operator contract. 3. Optimizer Layer A decoupled
    optimization stage converts learning signals into parameter updates: Adam optimizer
    (primary implementation) first- and second-moment tracking independent of neuron
    model and learning rule class This layer ensures stable convergence across heterogeneous
    neuron families. 4. Biological Control Substrate A multiscale modulation system
    bridges molecular dynamics and neural computation. 4.1 Molecular Layer (Protein
    System) explicit Protein** representation decay, expression, and repair dynamics
    frozen structural representation (no external mutation interface) Defines the
    lowest-level dynamical substrate. 4.2 Cellular Control System (CellSystem) homeostatic
    regulation of protein abundance bounded attractor dynamics (expression / repair
    balance) scalar projection interface into higher systems guarantees stable equilibrium
    under perturbation Outputs: scalar biological signals used for modulation 4.3
    Organismal Integration Layer (Organism) Defines the coupling boundary between
    biology and neural computation: ModulationMap (Protein → Brain parameter mapping)
    multiplicative-only coupling into BrainSystem parameters strict execution ordering:
    CellSystem update modulation projection BrainSystem execution This layer enforces
    directional coupling from biology → neural dynamics, without feedback into molecular
    state. Multiscale Temporal Structure The system is explicitly organized into separated
    timescales: Scale Component Fast Neural dynamics (BrainSystem) Medium Synaptic
    learning rules Slow Cellular homeostasis (CellSystem) Slower Organismal modulation
    Slowest Adaptive parameter drift (LVL5 k/beta system) This hierarchy ensures stability
    through separation of dynamical regimes. Learning Rule Classification Learning
    mechanisms are grouped into two classes: Online Learning (kernel-native) Hebbian
    Oja STDP EProp Properties: causal local or semi-local compatible with real-time
    execution Offline Learning (trajectory-based) BPTT Properties: non-local in time
    requires stored system trajectories executed outside kernel dynamics Formal System
    Interpretation The full system is a compositional operator stack over state and
    parameters: Input→BrainSystem→State Trajectory→Learning Operator→Optimizer→Updated
    Parameters with an additional biological modulation channel: CellSystem→Organism→Brain
    Parameters This creates a two-channel system: fast neural dynamics channel slow
    biological modulation channel CI-Gated Correctness System The framework includes
    a formal verification layer enforcing: single-entry-point learning rule initialization
    strict separation between structural and semantic validation projection-level
    contract enforcement rule-state consistency validation deterministic reproducibility
    constraints CI gates enforce correctness across: EProp equivalence multilayer
    compositional invariants heterogeneous neuron family behavior BPTT kernel correctness
    cross-learning-rule dispatch consistency multiscale biological coupling constraints
    Empirical Scope Validated properties include: stability of eligibility traces
    across neuron families bounded threshold and refractory dynamics reproducible
    learning across LIF and Izhikevich models structured failure modes in Hodgkin–Huxley
    systems scalability of local learning rules separation between numerical stability
    and learnability limits Scientific Contribution The framework demonstrates: Learning
    can be formulated as a compositional operator system Biological modulation introduces
    hierarchical control over neural plasticity Stability arises from timescale separation
    and contractive dynamics Learning rule limitations are primarily structural, not
    numerical Multiscale coupling produces emergent regime constraints on learnability
    Intended Use The archive is intended for: reproducible research in spiking neural
    systems study of local learning rules under structured dynamics analysis of multiscale
    biological-neural coupling benchmarking learning rule scalability across neuron
    models Limitations The framework does not claim: biological fidelity of full neural
    tissue universality of learning rules across all regimes equivalence between computational
    and cognitive learning Reproducibility The archive provides a structured specification
    of the framework, including its learning theory, multiscale biological control
    architecture, neural dynamics, and CI-gated correctness constraints. It serves
    as a formal documentation snapshot aligned with the corresponding codebase state.
    Future Development Roadmap With Phase 1 completed, the core dynamical substrate
    has been architecturally defined, experimentally characterized, and validated
    through formal CI gates. Current work is focused on exposing the framework through
    a stable external interface while preserving the causal and reproducibility guarantees
    established during Phase 1. Planned developments include: Python Experiment Interface
    A dedicated Python control layer is planned to provide: Parameter sweeps Batch
    experiment orchestration Data collection and visualization Reproducible protocol
    execution Jupyter-based exploratory analysis The interface is being designed under
    a strict architectural contract: The C kernel remains the sole owner of state
    evolution. Python acts only as an experiment orchestration layer. All state mutations
    occur through versioned kernel APIs. Snapshots are exported as immutable records.
    Reproducibility and deterministic execution remain kernel-level guarantees. BrainIAc
    Kernel API A formal API specification has been drafted defining: Ontic core (deterministic
    state evolution) Snapshot system Policy layer External orchestration interface
    The objective is to expose the framework as a reusable scientific simulation kernel
    while preserving causal closure and experimental reproducibility. Future Scientific
    Directions Potential future research directions include: LVL 6 adaptive topology
    dynamics Non-ergodic memory kernels State-dependent delays Multi-organism interaction
    systems Higher-order molecular feedback pathways Task-level embodied learning
    experiments Comparative learning-rule studies (E-Prop, BPTT, Hebbian, Oja, STDP)
    License CC BY-NC-ND 4.0Attribution required. No derivatives. No commercial use.
    Contact Théo ValloisGitHub: EmpireStrikesBack/NeuroModelEmail: theo.vallois@hotmail.fr
    Final Note This system should be interpreted as: a hierarchical, contract-enforced,
    multiscale operator framework for studying learning dynamics in spiking neural
    systems with biologically constrained modulation.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Neuromorphic Computing
  date: 2026-08
  url: https://doi.org/10.64388/irev10i2-1722321
  category: brain-inspired
  subcategory: method
  authors:
  - Manjula Biradar
  abstract: 'The neuromorphic computing is a process that mimics the processing of
    information at biological synapses. The physical mechanism of neuromorphic computing
    is based on the ion transport at device interface to achieve efficient transfer
    and computation of information at the same location [11,12], which is different
    from logic circuit in digital systems [13,14]. Besides, neuromorphic computing
    is characterized by distributed memory and computational elements [15]. The neuromorphic
    computing can realize high-efficiency massive parallel computing that can conquer
    the limitation of Von Neumann bottleneck. Neuromorphic computing is a paradigm
    of designing hardware and algorithms inspired by the brain’s architecture and
    principles, promising major gains in energy efficiency and new computing capabilities.
    This review provides a comprehensive overview of developments in neuromorphic
    computing from 2019 through 2024. We survey hardware advances – including digital
    neuromorphic chips (e.g. Intel Loihi, IBM TrueNorth, and SpiNNaker), emerging
    device technologies like memristors, spintronic circuits, photonic processors,
    and two-dimensional (2D) material-based devices – that enable brain-like computation
    with vastly lower power than conventional electronics. We also summarize algorithmic
    advances in spiking neural networks (SNNs), covering progress in temporal coding
    strategies, the introduction of surrogate gradient methods for training SNNs like
    deep networks, and biologically plausible learning rules such as e-prop for online
    learning in spiking systems. Furthermore, we discuss key opportunities and gaps:
    the potential of neuromorphic systems to approach aspects of human cognition or
    artificial general intelligence (AGI), applications in medicine (like brain–machine
    interfaces and neural prosthetics) and science, the trade-offs between power efficiency
    and computational precision, and challenges in integrating neuromorphic accelerators
    into existing computing ecosystems. We conclude by highlighting how co-development
    of hardware and algorithms is critical to fulfill the promise of neuromorphic
    computing, and by outlining open research directions on the path toward more brain-like,
    efficient computing architectures.'
