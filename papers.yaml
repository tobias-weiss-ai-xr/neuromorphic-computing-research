- title: Research on Predictive Error Driven Spiking Neural Networks (PE-SNN)
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309753
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: Spiking Neural Networks (SNNs) have emerged as a promising paradigm for
    energy-efficient neuromorphic computing. However, conventional SNN models often
    suffer from high firing rates and redundant spike generation, which severely undermines
    their hardware efficiency. Inspired by the predictive coding theory in cognitive
    neuroscience, this paper investigates a novel architecture termed the Predictive
    Error Driven Spiking Neural Network (PE-SNN). In this framework, spike generation
    and transmission are strictly restricted to the condition where the local predictive
    error exceeds a predefined threshold. By transmitting only the unpredictable residues
    rather than absolute signal intensities, the network adaptively filters out spatial
    and temporal redundancies. We establish a comprehensive mathematical framework
    for the error-driven spiking neuron model and derive its corresponding learning
    algorithms, including an error-modulated Spike-Timing-Dependent Plasticity (STDP)
    rule and a spatio-temporal backpropagation scheme via surrogate gradients. Theoretical
    analyses demonstrate that the proposed PE-SNN achieves profound spatio-temporal
    sparsity, significantly reducing power consumption while providing inherent robustness
    against high-frequency environmental noise. This work provides deep insights and
    a solid theoretical foundation for developing next-generation ultra-low-power
    neuromorphic systems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Parallel Training Time-to-First-Spike Spiking Neural Networks
  date: 2026-03
  url: https://doi.org/10.1609/aaai.v40i3.37149
  category: spiking-neural-networks
  subcategory: theory
  authors:
  - Kaiwei Che
  - Wei Fang
  - Peng Xue
  abstract: 'Spiking Neural Networks (SNNs) offer a promising energy-efficient computing
    paradigm owing to their event-driven properties and biologically inspired dynamics.
    Among various encoding schemes, Time-to-First-Spike (TTFS) is particularly notable
    for its extreme sparsity, utilizing a single spike per neuron to maximize energy
    efficiency. However, two significant challenges persist: effectively leveraging
    TTFS sparsity to minimize training costs on Graphics Processing Units (GPUs),
    and bridging the performance gap between TTFS-based SNNs and their rate-based
    counterparts. To address these issues, we propose a parallel training algorithm
    for accelerated execution and a novel decoding strategy for enhanced performance.
    Specifically, we derive both forward and backward propagation equations for parallelized
    TTFS SNNs, enabling precise calculation of first-spike timings and gradients.
    Furthermore, we analyze the limitations of existing output decoders and introduce
    a membrane potential–based decoder, complemented by an incremental time-step training
    strategy, to improve accuracy. Our approach achieves state-of-the-art accuracy
    for TTFS SNNs on several benchmarks, including MNIST (99.51%), Fashion-MNIST (93.14%),
    CIFAR-10 (95.06%), and CIFAR-100 (74.07%).'
  venue: Proceedings of the AAAI Conference on Artificial Intelligence
