- title: Hypernetwork-Based Adaptive Plastic Time-Constant Spiking Neural Networks
    (Hyper-tau SNN)
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309676
  category: brain-inspired
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: Spiking Neural Networks (SNNs), as the third generation of artificial
    neural networks, have attracted substantial attention in brain-inspired computing
    due to their biological plausibility and low power consumption. However, the membrane
    potential time constant (tau) in traditional SNNs is typically configured as a
    globally fixed, static hyperparameter. This rigid constraint severely limits the
    network's capacity to capture dynamic, multi-scale temporal dependencies when
    processing complex spatio-temporal sequences. To overcome this limitation, this
    paper proposes a novel framework named "Hyper-Plastic Time-Constant Spiking Neural
    Network" (Hyper-tau SNN). The core mechanism involves incorporating a lightweight
    hypernetwork that dynamically generates heterogeneous, real-time time constants
    (tau) for each neuron or channel in the main SNN based on the spatio-temporal
    features of the current input stream. Consequently, the time constant is transformed
    from a rigid hyperparameter into an input-driven, highly adaptive variable, enabling
    the temporal dynamics of the SNN to evolve concurrently with the changing input
    context. Rooted in biological foundations, we formulate the mathematical model
    and network architecture of the Hyper-tau SNN, derive the end-to-end gradient
    descent formulations utilizing the Spatio-Temporal Backpropagation (STBP) algorithm,
    and thoroughly investigate its theoretical merits in terms of decoupling spatio-temporal
    features, adapting to multi-scale temporal complexity, and optimizing energy-efficiency
    ratios.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Spike Topology Rewiring Network: A Novel Spiking Neural Network Driven by
    Real-Time Spike Covariance'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21309722
  category: brain-inspired
  subcategory: theory
  authors:
  - Jincheng Zhang
  abstract: Spiking Neural Networks (SNNs), as the third generation of artificial
    neural networks, have attracted significant attention in brain-inspired computing
    due to their biological plausibility and low-power characteristics. However, traditional
    SNNs generally employ static network topologies, which limits their adaptive capacity
    when processing complex, non-stationary spatio-temporal data. This paper proposes
    a novel network architecture termed the Spike Topology Rewiring Network (STRN).
    Moving away from fixed-graph constraints, STRN introduces a real-time topology
    rewiring mechanism driven by online spike covariance. By transforming discrete
    spike trains into continuous synaptic traces, the network calculates the dynamic
    covariance between neurons to evaluate functional connectivity on the fly. This
    statistical metric guides the runtime pruning of redundant synapses and the probabilistic
    generation of new pathways, maintaining a dynamic equilibrium of sparse connectivity.
    We provide a rigorous mathematical framework for the online updates of spike covariance
    and define structural evolution rules that coordinate global and local plasticity.
    Theoretical analyses from complex network theory and information theory demonstrate
    that STRN naturally evolves toward efficient small-world topologies, maximizes
    mutual information transfer, and ensures stability through time-scale separation
    principles. Without requiring global labels or offline training for structure
    optimization, STRN exhibits outstanding structural plasticity, energy efficiency,
    and environmental adaptability, offering a promising theoretical foundation and
    methodology for low-power neuromorphic intelligence.
