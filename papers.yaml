- title: Green AI
  date: 2026-07
  url: https://doi.org/10.1201/9781003544388-2
  category: edge-computing
  subcategory: method
  authors:
  - Piyal Roy
  - Shivnath Ghosh
  - Saptarshi Kumar Sarkar
  abstract: Green artificial intelligence (AI) is an approach to AI that aims to reduce
    the environmental impact of AI technologies. It focuses on energy-efficient algorithms,
    such as model quantization, model pruning, and low-rank approximation, which can
    be deployed on edge devices with limited computational resources. Innovations
    like neuromorphic computing and Graphics Processing Units (GPUs) and Tensor Processing
    Units (TPUs) are also considered energy-efficient. The chapter also discusses
    the environmental impact of data centers, which support AI algorithms. It highlights
    the use of renewable power sources, efficient cooling, and resource management
    in data centers. AI solutions and practices, such as smart power systems, farming
    techniques, weather forecasting, and environmental tracking, can help reduce human
    impact on the environment. The chapter emphasizes the importance of policy and
    regulation in promoting environmental innovations in AI systems and the need for
    collaboration with other scholars, politicians, and business actors to realize
    Green AI’s ideas.
  venue: Auerbach Publications eBooks
- title: Neuroprocessor Noise Resilience Using HfO2-Based Synapses
  date: 2026-07
  url: https://doi.org/10.1145/3822454.3822483
  category: edge-computing
  subcategory: application
  authors:
  - Charles P. Rizzo
  - Jeelka Solanki
  - Soumya Swaraj Mondal
  abstract: 'Neuromorphic computing has emerged as a promising paradigm for ultra-low-power,
    high-density edge intelligence, where memristive synapses enable compact multi-bit
    weight storage. \(\ce {HfO2}\)-based devices offer high integration density but
    suffer from intrinsic variability, particularly in the high-resistance state (HRS),
    leading to potential weight overlap and accuracy degradation. In this work, we
    present a comprehensive evaluation of synaptic noise in neuroprocessors integrating
    memristor-based synapses with CMOS neuron circuits. Experimentally characterized
    \(\ce {HfO2}\) devices in 65 nm CMOS are analyzed using 3σ resistance distributions,
    and the extracted noise profiles are incorporated into two neuromorphic architectures:
    RISP (integrate-and-fire) and RAVENS (leaky integrate-and-fire with refractory
    behavior). We further study encoding schemes under noise across classification,
    control, and regression tasks. Results show strong resilience to synaptic variability,
    with limited performance degradation under realistic conditions. Additionally,
    measured inference power averages 3.85 μW in LRS and 0.79 μW in HRS, enabling
    nearly \(80 \,\%\) power savings with negligible performance loss, highlighting
    the potential for variability-tolerant, energy-efficient edge AI systems.'
  venue: ''
- title: Multifunctional Device Design and Applications of GaN and Transition Metal
    Dichalcogenides Heterojunctions
  date: 2026-08
  url: https://doi.org/10.1021/acsami.6c08831
  category: edge-computing
  subcategory: method
  authors:
  - Guoxin Li
  - Lipeng Luo
  - Qian Zhang
  abstract: This review comprehensively explores the cutting-edge applications of
    gallium nitride (GaN) and two-dimensional transition metal dichalcogenides (TMDs)
    heterojunctions in next-generation high-performance devices. With a strong focus
    on practical implementation, we systematically analyze the pivotal roles of GaN/TMDs
    heterostructures across electronics, optoelectronics, sensing, and energy conversion.
    Key advancements in high-frequency transistors, low-power neuromorphic computing,
    broadband photodetectors (UV to NIR), self-powered sensors, and efficient photocatalytic
    systems are highlighted. The discussion extends to innovative fabrication techniques
    enabling large-area integration and flexible electronics. Furthermore, we showcase
    their application potential in strategic fields such as 5G communication, artificial
    intelligence, imaging systems, environmental monitoring, and clean energy technologies.
    By addressing critical challenges in interface engineering, material synthesis,
    and device integration, this review provides a valuable roadmap for developing
    high-performance, commercially viable semiconductor devices.
  venue: ACS Applied Materials & Interfaces
- title: Neuronal Self-Adaptation Enhances Capacity and Robustness of Representation
    in Spiking Neural Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.20687
  category: edge-computing
  subcategory: theory
  authors:
  - Zhuobin Yang
  - Yeyao Bao
  - Liangfu Lv
  abstract: Spiking Neural Networks (SNNs) are promising for energy-efficient, real-time
    edge computing, yet their performance is often constrained by the limited adaptability
    of conventional leaky integrate-and-fire (LIF) neurons. Existing LIF models struggle
    with restricted information capacity and susceptibility to noise, leading to degraded
    accuracy and compromised robustness. Inspired by the dynamic self-regulation of
    biological potassium channels, we propose the Potassium-regulated LIF (KvLIF)
    neuron model. KvLIF introduces an auxiliary conductance state that integrates
    membrane potential and spiking history to adaptively modulate neuronal excitability
    and reset dynamics. This design extends the dynamic response range of neurons
    to varying input intensities and effectively suppresses noise-induced spikes.
    We extensively evaluate KvLIF on both static image and neuromorphic datasets,
    demonstrating consistent improvements in classification accuracy and superior
    robustness compared to existing LIF models. Our work bridges biological plausibility
    with computational efficiency, offering a neuron model that enhances SNN performance
    while maintaining suitability for low-power neuromorphic deployment.
  venue: arXiv (Cornell University)
- title: Heterogeneous 3D Integration Based on Atomic-Level Electronics
  date: 2026-04
  url: https://doi.org/10.1021/acsami.6c00756
  category: edge-computing
  subcategory: method
  authors:
  - Hyunho Seok
  - Sihoon Son
  - Hyunbin Choi
  abstract: Multimodal and edge AI systems increasingly face bandwidth bottlenecks,
    data-movement overhead, and the rigid, thermally coupled limitations of conventional
    3D integration. Here, we introduce a monolithic 3D integration (M3D) of heterogeneous
    neuromorphic platform that overcomes these constraints by vertically integrating
    atomic-scale electronics with complementary memristive devices. Ultralow-power
    van der Waals transistors provide selective access, WS 2 conductive-filament memristors
    deliver stable low-voltage synaptic storage, and Ag–MoS 2 diffusive memristors
    produce threshold-driven, biologically inspired spiking. These layers form a compact
    neuromorphic stack capable of synaptic plasticity, firing-rate modulation, temporal
    learning, analog in-memory computation, and convolutional feature extraction.
    This architecture allows layers to be manipulated enabling on-demand compute scaling.
    Demonstrations of analog vector–matrix multiplication for CNN inference and image
    filtering─achieving 93.1% CIFAR-10 accuracy under realistic nonidealities─highlight
    the platform’s capability for energy-efficient, beyond–von Neumann computation.
    The proposed 2D-material-based platform enables heterogeneous functional partitioning
    while preserving programmability across vertically integrated tiers. The unified
    3D architecture supports multimodal neuromorphic operation with layer-level specialization
    and intertier signal coupling, covalidating learning and system-level functionality
    within a single integrated stack.
  venue: ACS Applied Materials & Interfaces
- title: Design of Oscillatory Neural Networks Using Machine-Learned Templates
  date: 2026-07
  url: https://doi.org/10.3390/electronics15132897
  category: edge-computing
  subcategory: theory
  authors:
  - Mitra Moayed
  - György Csaba
  abstract: Oscillatory neural networks (ONNs) provide a neuromorphic computing framework
    that exploits the phase dynamics of coupled oscillators for parallel and energy-efficient
    pattern recognition. In this study, we design a single-layer, fully connected
    ONN to classify handwritten digits from the MNIST dataset. Input images were downsampled
    to 6 × 6 binary patterns, which were optimized using a genetic algorithm to evolve
    effective templates, as experiments with higher-resolution inputs showed only
    marginal accuracy improvements at significantly increased computational and energy
    costs. Coupling weights were determined using Hebbian learning, and the network
    dynamics were simulated using the Kuramoto model to encode information via phase
    relationships. To the best of our knowledge, this is the first work to apply genetic
    algorithm optimization to design the templates used by an ONN and to combine evolutionary
    template generation with Hebbian-based ONN training for image classification.
    The results show that the ONN achieves 75–76% accuracy in the full 10-class MNIST
    task, with outputs exhibiting stable sinusoidal behavior and resilience to moderate
    noise. These findings highlight the potential of ONNs as a practical, low-power
    alternative to conventional deep learning models, particularly for real-time edge-level
    applications where energy efficiency and robustness are critical.
  venue: Electronics
- title: 'FPF-SNNs: Floating-Point-Free Spiking Neural Networks'
  date: 2026-04
  url: https://doi.org/10.1109/tetci.2026.3675509
  category: edge-computing
  subcategory: theory
  authors:
  - Hanwen Liu
  - Chiyu Cai
  - Kexin Shi
  abstract: Quantized Spiking Neural Networks (SNNs) have attracted considerable attention
    due to the growing need for energy-efficient and edge-compatible computing. However,
    most existing quantized SNNs depend on floating-point arithmetic in dequantization
    (DQ) and batch normalization (BN) to preserve accuracy. This dependence reduces
    computational efficiency and limits their applicability in resource-limited environments.
    In this work, we propose a floating-point-free SNN (FPF-SNN), specifically designed
    to eliminate floating-point operations in DQ and BN, enabling low-power, high-performance,
    and hardware-friendly implementation. Specifically, we first propose a scaling-factor-free
    quantization scheme that is built upon power-of-two relationships among different
    scaling factors, thereby replacing floating-point arithmetic with bit-shifting.
    Then, we introduce a relocated BN (ReBN) that allows the BN operations to be folded
    into the firing threshold of a spiking neuron during inference, thereby eliminating
    floating-point computations incurred by BN. Experimental results and theoretical
    analysis demonstrate that the proposed FPF-SNN achieves competitive performance
    compared with related quantized SNNs while maintaining the lowest energy consumption.
    More importantly, FPF-SNN is inherently hardware-friendly, making it well-suited
    for deployment on neuromorphic hardware. To further validate the hardware efficiency
    of FPF-SNN, we develop a dedicated FPF-SNN accelerator and implement it on an
    XC7Z035 FPGA. Our FPGA implementation achieves a latency of 19.67 ms, a throughput
    of 253.18 GSOP/s, and an energy efficiency of 104.62 GSOP/s/W when running VGG16
    on TinyImageNet. Compared to existing FPGA accelerators, our method demonstrates
    a superior balance between efficiency and performance, highlighting the significant
    potential of FPF-SNNs for neuromorphic computation on resource-constrained hardware
    platforms.
  venue: IEEE Transactions on Emerging Topics in Computational Intelligence
- title: Mitigating High-Frequency Geometric Noise in Non-Parametric 1-Bit Sparse
  date: 2026-06
  url: https://arxiv.org/abs/2606.26137
  category: edge-computing
  subcategory: theory
  authors:
  - Lars Kopp
  abstract: 'Energy-efficient neuromorphic computing requires alternative data-encoding
    paradigms that bypass power-hungry floating-point operations. This paper evaluates
    a deterministic, non-parametric dual-manifold execution framework that maps dense
    128-element integer vectors - representing digitized multi-frequency trigonometric
    waveforms - into a 1024-dimensional overcomplete space using 8-bit bounded transformation
    matrices. By enforcing a hard activation threshold, the system yields an ultra-sparse,
    1-bit binary population code where y belongs to the set (0, 1)^1024. We identify
    and address a critical phenotypic artifact of this non-parametric mapping: the
    emergence of high-frequency geometric noise during linear reconstruction. Furthermore,
    we document an algorithmic complexity paradox where low-complexity input functions
    yield significantly higher reconstruction errors than highly complex, high-degree
    trigonometric combinations. Because the underlying basis functions operate as
    purely objective mathematical entities without statistical priors regarding signal
    smoothness, this geometric noise is proven to be strictly orthogonal to the core
    signal topology. Consequently, we demonstrate that a low-overhead, hardware-level
    digital low-pass filter completely eliminates this artifact, reducing reconstruction
    errors to near-zero bounds even under tight overcompleteness constraints. This
    architecture validates a highly stable, multiplier-free alternative to traditional
    deep learning hardware for edge-AI applications, verified through comprehensive
    empirical evaluations across varying complexity scales and classification thresholds
    (tau = 10 and tau = 100).'
  venue: arXiv (Cornell University)
- title: Adaptive Dissipative Attractor Dynamics (ADAD)
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20313737
  category: edge-computing
  subcategory: theory
  authors:
  - Vitaly Bazarov
  - Vitaly Bazarov (VIT-BAZ)
  abstract: 'Adaptive Dissipative Attractor Dynamics (ADAD)Adaptive Dissipative Attractor
    Dynamics (ADAD) is a mathematical and computational framework describing adaptive
    neural-field dynamics with dissipative homeostatic regulation, stochastic activity
    control, and energy-driven attractor stabilization. The framework models collective
    spiking activity as a coupled dynamical system in which a global adaptive scale
    parameter R(t)R(t)R(t) evolves in response to population activity fluctuations.
    The system combines threshold-based spiking dynamics, mean-field activity feedback,
    dissipative second-order attractor evolution, and stochastic perturbations into
    a unified variational structure. At the core of the model is an effective attractor
    energy functional: E(R,ρ)=12R2−(ρ2+c)log⁡R,E(R,\rho) = \frac12R^2 - (\rho^2+c)\log
    R,E(R,ρ)=21R2−(ρ2+c)logR, where: RRR is an adaptive attractor radius or gain-scale
    parameter, ρ\rhoρ is collective neural activity, c>0c>0c>0 is a regularization
    constant. The adaptive variable R(t)R(t)R(t) evolves according to a damped second-order
    gradient-flow system: R¨+γR˙+ϵ∂RE(R,ρ)=0,\ddot R + \gamma \dot R + \epsilon \partial_R
    E(R,\rho) = 0,R¨+γR˙+ϵ∂RE(R,ρ)=0, which yields stable dissipative convergence
    toward equilibrium attractor states: R∗(ρ)=ρ2+c.R_*(\rho)=\sqrt{\rho^2+c}.R∗(ρ)=ρ2+c.
    The framework admits: Lyapunov stability structure, stochastic extensions, Fokker–Planck
    formulations, McKean–Vlasov mean-field limits, fixed-point neuromorphic implementation.
    The model is designed for low-power adaptive neuromorphic systems and supports
    integer/fixed-point computation compatible with embedded hardware and spiking
    neural accelerators. ADAD does not model quantum systems, cosmology, or consciousness.
    The framework should be interpreted strictly as a class of adaptive stochastic
    dynamical systems for homeostatic neural regulation and attractor-based computation.
    Main Features Adaptive attractor stabilization Dissipative energy minimization
    Mean-field activity regulation Stochastic adaptive dynamics Homeostatic feedback
    control Fixed-point neuromorphic implementation Hardware-safe saturation regulation
    Activity fluctuation adaptation Lyapunov-stable evolution McKean–Vlasov-compatible
    formulation Mathematical Foundations The framework combines methods from: dissipative
    dynamical systems, stochastic differential equations, McKean–Vlasov mean-field
    theory, Wasserstein and variational dynamics, adaptive control theory, neuromorphic
    computation, nonlinear attractor systems. Potential Applications Neuromorphic
    Computing Adaptive spiking control for low-power neuromorphic processors and edge
    AI systems. Embedded AI Energy-efficient adaptive regulation in constrained hardware
    environments. Adaptive Control Systems Real-time feedback stabilization under
    stochastic conditions. Spiking Neural Networks Dynamic threshold adaptation and
    attractor stabilization in recurrent neural architectures. Mean-Field Neural Modeling
    Population-level adaptive dynamics and collective activity regulation. Stochastic
    Optimization Noise-regulated adaptive parameter evolution in nonlinear systems.
    Research Status The framework currently represents: a formal mathematical specification,
    a computational dynamical model, a research-stage adaptive systems architecture.
    The following components are mathematically established: dissipative stability
    structure, Lyapunov energy decay, bounded adaptive dynamics, stochastic extension
    formulation, fixed-point implementation scheme. The following remain open research
    problems: rigorous propagation-of-chaos proof, global mean-field convergence,
    ergodicity analysis, spectral stability theory, large-scale PDE limits, hardware
    convergence guarantees. Scientific Positioning ADAD should be classified as: adaptive
    stochastic dynamics, dissipative attractor theory, mean-field neural dynamics,
    neuromorphic adaptive control, variational adaptive systems. It should not be
    interpreted as: a physical theory, a cosmological framework, a quantum-information
    model, a biological brain theory. Conceptual Interpretation The framework formalizes
    the idea that: collective activity generates an adaptive energy landscape, the
    system continuously minimizes instability through dissipative feedback, adaptive
    gain geometry emerges dynamically from activity fluctuations, stable computation
    can arise from stochastic homeostatic regulation. In this interpretation, the
    attractor parameter R(t)R(t)R(t) acts as a dynamically self-organizing control
    variable regulating collective system stability.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Opto-memristive behavior in BaTiO3 thin films: Tuning resistive switching
    for advanced memory applications'
  date: 2026-03
  url: https://doi.org/10.1007/s12034-026-03573-z
  category: memristive
  subcategory: application
  authors:
  - Parveen Sheoran
  - Chandmare Vaishali Prabhakarrao
  - Kusum Kumari
